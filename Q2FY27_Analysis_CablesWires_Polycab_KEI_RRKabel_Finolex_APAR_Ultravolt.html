 [['cycle','trigger','சுழற்சி','தூண்டி'],{en:'The sector is moving from expansion to late cycle: record revenues, big new capacity, slipping margins and stocks falling on good numbers. Key positive triggers are FMEG and EHV capacity; the main negative trigger is Ultravolt\'s entry.',ta:'துறை விரிவாக்கத்திலிருந்து உச்ச கட்டத்துக்கு போகுது: உச்ச revenue, பெரிய புதிய capacity, இறங்கும் margin, நல்ல எண்கள் வந்தும் பங்கு இறக்கம். நேர்மறை தூண்டி FMEG, EHV; எதிர்மறை Ultravolt நுழைவு.'}],
 [['buy','sell','invest','வாங்க','விற்க','முதலீடு'],{en:'CB Research does not give buy or sell advice. Please use the Self-check tab to test your own conditions.',ta:'CB Research வாங்க, விற்க ஆலோசனை தருவதில்லை. உங்க நிபந்தனைகளை Self-check tabல சோதிச்சு பாருங்க.'},'sk'],
 [['apar','அபார்','conductor','transformer','oil'],{en:'APAR is different from the wire makers. Half its revenue is aluminium transmission conductors, a quarter is transformer and specialty oils, and a quarter is speciality cables. Q2 FY27 revenue was 6,931 crore, up 21 percent, and profit 447 crore, up 78 percent, partly from oil inventory gains. Exports were 27.6 percent of revenue.',ta:'APAR wire நிறுவனங்களிலிருந்து வேறு. பாதி revenue aluminium conductors, கால் பங்கு transformer & specialty oils, கால் பங்கு speciality cables. Q2 FY27 revenue 6,931 கோடி, 21 சதவீதம் உயர்வு; லாபம் 447 கோடி, 78 சதவீதம் — ஒரு பகுதி oil inventory லாபம். Export பங்கு 27.6 சதவீதம்.'}],
 [['export','ஏற்றுமதி','overseas','international'],{en:'Export share of revenue: RR Kabel about 29 percent in Q1, APAR 27.6 percent, KEI about 13 percent, Polycab 5 percent, Finolex only 2 to 3 percent, and Ultravolt zero for now.',ta:'Revenue-ல் export பங்கு: RR Kabel Q1ல சுமார் 29, APAR 27.6, KEI சுமார் 13, Polycab 5, Finolex 2 முதல் 3, Ultravolt இப்போதைக்கு பூஜ்யம்.'}],
 [['cpvc','lubrizol','pvc','லூப்ரிசால்'],{en:'The Grasim-Lubrizol Vilayat plant, phase one 50,000 tonnes, makes CPVC resin for plumbing pipes. It is not the PVC compound used to insulate cables, so its help to Ultravolt is indirect, mainly for a future pipes and wires bundle.',ta:'Grasim-Lubrizol Vilayat plant, முதல் கட்டம் 50,000 டன், plumbing pipes-க்கான CPVC resin தயாரிக்குது. Cable insulation PVC இல்ல, அதனால Ultravolt-க்கு மறைமுக உதவி தான்.'}]

function answer(q){var s=q.toLowerCase(),best=null,bs=0;KB.forEach(function(e){var sc=0;e[0].forEach(function(w){if(s.indexOf(w.toLowerCase())>=0)sc++;});if(sc>bs){bs=sc;best=e;}});if(!best)return {txt:t({en:'I can answer about copper and margins, each company\'s Q2 results, Ultravolt and the Aditya Birla Group, Birla Opus vs cables, cycle and triggers. Try one of the chips.',ta:'Copper & margin, ஒவ்வொரு நிறுவனத்தின் Q2, Ultravolt & ஆதித்ய பிர்லா குழுமம், Opus vs cables, சுழற்சி & தூண்டி பற்றி கேட்கலாம்.'})};return {txt:t(best[1]),go:best[2]};}
function say(txt){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang=LANG==='ta'?'ta-IN':'en-IN';u.rate=1;speechSynthesis.speak(u);}catch(e){}}
function ask(qq){var inp=document.getElementById('asIn'),q=qq||inp.value.trim();if(!q)return;inp.value='';var log=document.getElementById('asLog');var a=answer(q);log.innerHTML+='<div class="q">'+q.replace(/</g,'&lt;')+'</div><div class="a">'+a.txt+(a.go?' <a href="#" onclick="curTab=\''+a.go+'\';render();return false">→ Self-check</a>':'')+'</div>';log.scrollTop=log.scrollHeight;say(a.txt);}
function listen(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){ask(LANG==='ta'?'குரல் வசதி இந்த browserல இல்ல':'help');return;}var r=new R();r.lang=LANG==='ta'?'ta-IN':'en-IN';r.interimResults=false;var m=document.getElementById('mic');m.textContent='⏺';r.onresult=function(e){ask(e.results[0][0].transcript);};r.onend=function(){m.textContent='🎤';};r.onerror=function(){m.textContent='🎤';};r.start();}
