 disc:["<b>Prepared by CB Research (Cauvery Business Research)</b> for financial education only. CB Research is not a SEBI-registered research analyst or investment adviser. Nothing here is a recommendation to buy, sell or hold any security. Third-party broker views are attributed to those brokers. Figures are from company filings and releases; items marked † could not be verified and should be checked. Please do your own research or consult a registered adviser.","<b>CB Research (காவேரி பிசினஸ் ரிசர்ச்) தயாரித்தது</b> — நிதிக் கல்விக்காக மட்டும். CB Research SEBI-ல பதிவு செய்த அனலிஸ்ட்டோ அட்வைசரோ இல்ல. இதுல எதுவும் வாங்க, விற்க, வச்சிருக்க சொல்ற பரிந்துரை இல்ல. புரோக்கர் கருத்துக்கள் அந்தந்த புரோக்கர்களோடது. எண்கள் கம்பெனி ஃபைலிங்ல இருந்து; † குறி போட்டது சரிபார்க்க முடியல. நீங்களே ஆராய்ஞ்சு முடிவு பண்ணுங்க, இல்லன்னா பதிவு செய்த அட்வைசரை கேளுங்க."],

var TAKE=[
 ["<b>Volume-led rebound on a weak base.</b> Sell-in volume rose 16% against a monsoon-hit Q2 FY26 (volume −3.4%, PAT −65%), so the YoY jump flatters; still, it is the fastest volume growth in recent quarters.","<b>மழையால அடிபட்ட போன வருஷத்தோட ஒப்பிட்டா பெரிய ஜம்ப்.</b> வால்யூம் 16% ஏறியிருக்கு; போன வருஷம் Q2-ல வால்யூம் −3.4%, லாபம் −65%. அதனால YoY வளர்ச்சி கொஞ்சம் பெருசா தெரியும்; ஆனாலும் சமீபத்திய காலாண்டுகள்ல இதுதான் வேகமான வால்யூம் வளர்ச்சி."],
 ["<b>Premiumisation is the engine.</b> Premium volume +38% (Q1: +7%), Heineken Silver +67%, Kingfisher Ultra +44%. Net sales +24% vs volume +16% implies roughly +7% price/mix.","<b>பிரீமியம் தான் இன்ஜின்.</b> பிரீமியம் வால்யூம் +38% (Q1-ல +7% தான்), ஹைனகென் சில்வர் +67%, கிங்ஃபிஷர் அல்ட்ரா +44%. சேல்ஸ் +24%, வால்யூம் +16% — அப்போ விலை/மிக்ஸ் மூலமா சுமார் +7%."],
 ["<b>Margins recovered despite cost inflation.</b> Gross margin +194 bps; company-reported EBITDA margin 11.9% (+480 bps). Computed from the reported P&L, EBITDA ₹259 cr on ₹2,537 cr net revenue = 10.2%.","<b>செலவு ஏறியும் மார்ஜின் மீண்டிருக்கு.</b> கிராஸ் மார்ஜின் +194 bps; கம்பெனி சொல்ற EBITDA மார்ஜின் 11.9% (+480 bps). ரிப்போர்ட்டட் P&L-ல இருந்து கணக்கு போட்டா EBITDA ₹259 கோடி / நெட் ரெவென்யூ ₹2,537 கோடி = 10.2%."],
 ["<b>Part of the profit jump is one-off.</b> Other income ₹41.3 cr includes ₹36.89 cr interest on income-tax refunds. Excluding it, CB estimates core PAT ≈ ₹108 cr (still ~2.3x last year).","<b>லாப ஜம்ப்ல ஒரு பகுதி ஒருமுறை வருமானம்.</b> மற்ற வருமானம் ₹41.3 கோடில ₹36.89 கோடி இன்கம் டாக்ஸ் ரீஃபண்ட் வட்டி. அதை கழிச்சா கோர் PAT சுமார் ₹108 கோடி (CB மதிப்பீடு) — அப்பவும் போன வருஷத்தை விட ~2.3 மடங்கு."],
 ["<b>Watch-outs:</b> management will step up commercial spend in Q3; West Asia-linked cost shock (₹350–400 cr for FY27) is still live; P/E ~68x TTM even after a 5-year-low share price.","<b>கவனிக்க வேண்டியது:</b> Q3-ல மார்க்கெட்டிங் செலவை ஏத்தப் போறாங்க; மேற்காசியா போரால செலவு ஷாக் (FY27-க்கு ₹350–400 கோடி) இன்னும் இருக்கு; ஷேர் 5 வருஷ லோவுக்கு வந்தும் P/E இன்னும் ~68x."]
];
var PILLARS=[
 {k:"g",n:["Growth","வளர்ச்சி"],s:7.5,x:["Q2 net sales +24%, volume +16%, H1 net sales +14%; CMD ambition is double-digit net sales growth. But the 10-year sales CAGR is only ~7% and FY26 sales grew just 3.6%, so the score is held below 8 until the pace is sustained.","Q2 சேல்ஸ் +24%, வால்யூம் +16%, H1 சேல்ஸ் +14%; இரட்டை இலக்க வளர்ச்சி தான் அவங்க டார்கெட். ஆனா 10 வருஷ சேல்ஸ் CAGR ~7% தான், FY26-ல 3.6% தான் வளர்ந்தது — அதனால தொடர்ந்து வரணும், அதுவரை 8-க்கு கீழே."]},
 {k:"m",n:["Margins","மார்ஜின்"],s:5.5,x:["EBITDA margin recovered to 10–12% in Q2, but sits far below the FY19 peak of ~18%. ROE has been 8–10% for three years. The CMD ambition of mid-teens EBITDA margin is not yet visible in the numbers.","Q2-ல EBITDA மார்ஜின் 10–12%-க்கு வந்திருக்கு, ஆனா FY19-ல இருந்த ~18%-ஐ விட ரொம்ப கம்மி. ROE மூணு வருஷமா 8–10% தான். 'மிட்-டீன்ஸ் மார்ஜின்' டார்கெட் இன்னும் எண்கள்ல தெரியல."]},
 {k:"d",n:["Debt & cash","கடன் & கேஷ்"],s:6.5,x:["Borrowings ₹1,119 cr (Sep-26) vs net worth ₹4,560 cr — debt/equity ~0.25x, down from ₹1,317 cr in Mar-26. Interest cover ~7.5x. Weak spot: free cash flow was negative or near zero from FY23 to FY26 because of working-capital build and capex.","கடன் ₹1,119 கோடி (செப்-26), நெட் வொர்த் ₹4,560 கோடி — D/E ~0.25. மார்ச்-26-ல ₹1,317 கோடி இருந்தது, குறைஞ்சிருக்கு. வட்டி கவர் ~7.5x. பலவீனம்: FY23–FY26 ஃப்ரீ கேஷ் ஃப்ளோ நெகட்டிவ் அல்லது பூஜ்யம் — வொர்க்கிங் கேப்பிட்டல் & கேபெக்ஸ் காரணம்."]},
 {k:"v",n:["Valuation","மதிப்பீடு"],s:4.5,x:["At ₹1,240: P/E ~68x TTM EPS ₹18.32, P/B ~7.2x, EV/EBITDA ~37x, dividend yield ~0.8%. Cheaper than its own history but still expensive in absolute terms; the price already assumes years of strong earnings growth.","₹1,240-ல: P/E ~68x (TTM EPS ₹18.32), P/B ~7.2x, EV/EBITDA ~37x, டிவிடெண்ட் யீல்ட் ~0.8%. இதோட பழைய வரலாற்றை விட மலிவு, ஆனா நேரடியா பார்த்தா இன்னும் விலை அதிகம்; பல வருஷ வலுவான வளர்ச்சியை விலை ஏற்கனவே எதிர்பார்க்குது."]},
 {k:"t",n:["Triggers & trend","ட்ரிகர் & போக்கு"],s:7.0,x:["Positive catalysts are executing: premium portfolio, new can lines, state reforms (Karnataka, Maharashtra, Jharkhand). The stock jumped up to 15% on results day but remains in a long downtrend (Stage 4) until it holds above its 30-week average.","நல்ல ட்ரிகர்கள் நடந்துகிட்டிருக்கு: பிரீமியம், புது கேன் லைன்கள், மாநில சீர்திருத்தங்கள் (கர்நாடகா, மகாராஷ்டிரா, ஜார்கண்ட்). ரிசல்ட் நாள்ல 15% வரை ஏறிச்சு, ஆனா 30 வார சராசரிக்கு மேல நிலைக்கிற வரை இன்னும் நீண்ட இறக்கப் போக்குல தான் (ஸ்டேஜ் 4)."]},
 {k:"r",n:["Risk","ரிஸ்க்"],s:5.0,x:["Beer is taxed and priced state by state: excise changes, price controls and slow payments from state corporations can swing results. Weather (monsoon, summer) drives volumes. Input costs (glass, cans, barley, freight) are inflating. A ₹116.25 cr tax demand is pending.","பீர் விலை, வரி எல்லாம் மாநிலத்துக்கு மாநிலம் மாறும்: எக்சைஸ் மாற்றம், விலைக் கட்டுப்பாடு, மாநில கார்ப்பரேஷன்கள் தாமதமா பணம் தர்றது — இதெல்லாம் ரிசல்ட்டை ஆட்டும். வானிலை (மழை, கோடை) வால்யூமை தீர்மானிக்கும். கண்ணாடி, கேன், பார்லி, சரக்கு செலவு ஏறுது. ₹116.25 கோடி டாக்ஸ் டிமாண்ட் நிலுவையில."]}
];

var HIST=[
 {y:"1857",e:1,t:["Brewing roots in South India","தென்னிந்தியாவில் ப்ரூவிங் வேர்கள்"],x:["British-era breweries in the Nilgiris and Bangalore served colonial garrisons. Several of these later became part of United Breweries.","பிரிட்டிஷ் காலத்துல நீலகிரி, பெங்களூர்ல ராணுவ முகாம்களுக்காக பீர் தயாரிச்சாங்க. அதுல சில ப்ரூவரிகள் தான் பின்னாடி யுனைடெட் ப்ரூவரீஸ் ஆச்சு."]},
 {y:"1915",e:1,t:["United Breweries formed in Madras","மெட்ராஸ்ல யுனைடெட் ப்ரூவரீஸ் உருவாச்சு"],x:["Scottish businessman Thomas Leishman brought five South Indian breweries together under the name United Breweries — the company's name literally means 'breweries united'.","ஸ்காட்லாந்து தொழிலதிபர் தாமஸ் லீஷ்மன் அஞ்சு தென்னிந்திய ப்ரூவரிகளை ஒண்ணா சேர்த்து 'யுனைடெட் ப்ரூவரீஸ்'-னு பேர் வச்சார் — பேருக்கே அர்த்தம் 'ஒண்ணு சேர்ந்த ப்ரூவரிகள்'."]},
 {y:"1947",e:1,t:["Vittal Mallya takes control","விட்டல் மல்யா கட்டுப்பாட்டை எடுத்தார்"],x:["Around Independence, Vittal Mallya bought into UB and became its first Indian chairman, starting the 'UB Group' era of an Indian-controlled liquor and beverages group.","சுதந்திர காலகட்டத்துல விட்டல் மல்யா UB-ல பங்கு வாங்கி முதல் இந்திய சேர்மன் ஆனார். அங்க இருந்து தான் 'UB குரூப்' சகாப்தம் ஆரம்பம்."]},
 {y:"1978",e:2,t:["Kingfisher is launched","கிங்ஃபிஷர் அறிமுகம்"],x:["The Kingfisher lager brand was introduced and went on to become India's best-known beer — today the core of UBL's mainstream and premium portfolio (Kingfisher Strong, Premium, Ultra, Ultra Max).","கிங்ஃபிஷர் பிராண்ட் அறிமுகமாகி இந்தியாவோட பிரபலமான பீர் ஆச்சு — இன்னைக்கும் UBL-ஓட மெயின்ஸ்ட்ரீம், பிரீமியம் போர்ட்ஃபோலியோவோட மையம் (ஸ்ட்ராங், பிரீமியம், அல்ட்ரா, அல்ட்ரா மேக்ஸ்)."]},
 {y:"1983",e:2,t:["Vijay Mallya becomes chairman","விஜய் மல்யா சேர்மன் ஆனார்"],x:["After his father's death, Vijay Mallya took over the UB Group at 28 and expanded it aggressively across spirits, beer and, later, aviation.","அப்பா இறந்த பிறகு 28 வயசுல விஜய் மல்யா UB குரூப்பை எடுத்து, ஸ்பிரிட்ஸ், பீர், அப்புறம் ஏவியேஷன் வரை வேகமா விரிவாக்கினார்."]},
 {y:"1990s",e:2,t:["Strong beer and No. 1 position","ஸ்ட்ராங் பீர் & நம்பர் 1 இடம்"],x:["Kingfisher Strong rode India's shift towards strong beer; UB became the clear market leader with breweries across many states — a key moat because beer is heavy and costly to move between states.","இந்தியா 'ஸ்ட்ராங் பீர்' பக்கம் மாறினப்போ கிங்ஃபிஷர் ஸ்ட்ராங் பெரிசா வளர்ந்தது; பல மாநிலங்கள்ல ப்ரூவரி இருந்ததால UB நம்பர் 1 ஆச்சு — பீர் கனமானது, மாநிலம் விட்டு மாநிலம் கொண்டு போக செலவு அதிகம், அதனால இது பெரிய பாதுகாப்பு அரண்."]},
 {y:"1999–2002",e:2,t:["Beer business housed in today's listed UBL; Scottish & Newcastle partner","இன்றைய லிஸ்டட் UBL; ஸ்காட்டிஷ் & நியூகாஸில் பார்ட்னர்"],x:["The group reorganised its beer business into the present listed company (its 27th AGM was held in Aug 2026) and brought in UK brewer Scottish & Newcastle as a strategic partner.","குரூப் தன்னோட பீர் பிசினஸை இப்போ லிஸ்ட் ஆன கம்பெனிக்குள்ள கொண்டு வந்தது (27-வது AGM ஆகஸ்ட் 2026-ல நடந்தது); UK-வோட ஸ்காட்டிஷ் & நியூகாஸில் கம்பெனியை பார்ட்னரா சேர்த்தாங்க."]},
 {y:"2008",e:3,t:["Heineken arrives via the S&N takeover","S&N டேக்ஓவர் மூலமா ஹைனகென் வருகை"],x:["Heineken and Carlsberg jointly bought Scottish & Newcastle; Heineken inherited the UBL stake and became joint controller alongside the UB Group.","ஹைனகென், கார்ல்ஸ்பர்க் சேர்ந்து ஸ்காட்டிஷ் & நியூகாஸிலை வாங்கினாங்க; UBL பங்கு ஹைனகெனுக்கு வந்தது — UB குரூப்போட சேர்ந்து கூட்டுக் கட்டுப்பாடு."]},
 {y:"2012–2016",e:4,t:["UB Group crisis; Mallya leaves India","UB குரூப் நெருக்கடி; மல்யா இந்தியாவை விட்டு போனார்"],x:["Kingfisher Airlines collapsed (2012) and banks pursued the group's dues. UBL's brewing business kept running, but the promoter overhang hurt governance perception. Mallya left India in 2016.","கிங்ஃபிஷர் ஏர்லைன்ஸ் 2012-ல மூடப்பட்டது, வங்கிகள் கடன் வசூலுக்கு போனாங்க. UBL பீர் பிசினஸ் ஓடிக்கிட்டு தான் இருந்தது, ஆனா புரமோட்டர் பிரச்சனை நிர்வாக நம்பிக்கையை பாதிச்சது. 2016-ல மல்யா இந்தியாவை விட்டு போனார்."]},
 {y:"2019",e:4,t:["Attached shares move to the government side","முடக்கப்பட்ட பங்குகள் அரசு பக்கம்"],x:["Shares linked to the erstwhile promoter were attached in recovery proceedings; shareholding data show promoter holding falling from ~73% to 57.7% and a 16.15% 'Government' block appearing (Mar-19 to Mar-21).","பழைய புரமோட்டரோட பங்குகள் கடன் வசூலுக்காக முடக்கப்பட்டது; ஷேர்ஹோல்டிங் டேட்டாவுல புரமோட்டர் பங்கு ~73%-ல இருந்து 57.7%-க்கு இறங்கி, 'அரசு' பங்கு 16.15% வந்தது (மார்ச்-19 முதல் மார்ச்-21 வரை)."]},
 {y:"Jul 2021",e:3,t:["Heineken takes majority control","ஹைனகென் பெரும்பான்மை கட்டுப்பாடு"],x:["Heineken bought additional shares in June 2021, raising its stake from 46.5% to 61.5%, and UBL became a Heineken subsidiary. The government block was sold down to 1.16%; promoter holding is now 70.84%.","ஜூன் 2021-ல ஹைனகென் கூடுதல் பங்கு வாங்கி 46.5%-ல இருந்து 61.5%-க்கு ஏத்தியது — UBL ஹைனகெனோட சப்சிடியரி ஆச்சு. அரசு பங்கு 1.16%-க்கு குறைஞ்சது; இப்போ புரமோட்டர் பங்கு 70.84%."]},
 {y:"FY23",e:4,t:["Barley inflation squeezes margins","பார்லி விலை ஏற்றம் — மார்ஜின் நசுக்கம்"],x:["Raw-material inflation and state route-to-market changes cut EBITDA margin to ~8%; cash flow from operations turned negative (−₹120 cr) as receivables and inventory rose.","மூலப்பொருள் விலை ஏற்றம், மாநில விற்பனை முறை மாற்றம் — EBITDA மார்ஜின் ~8%-க்கு இறங்கியது; ரிசீவபிள்ஸ், இன்வென்டரி ஏறினதால ஆபரேட்டிங் கேஷ் ஃப்ளோ நெகட்டிவ் (−₹120 கோடி)."]},
 {y:"Sep 2023",e:3,t:["Vivek Gupta becomes MD & CEO","விவேக் குப்தா MD & CEO"],x:["An ex-P&G and Udaan executive (IIM Ahmedabad), Gupta started an 'investment-led growth' phase: more brand spend, visi-coolers, premium launches and new capacity.","P&G, Udaan-ல வேலை பார்த்தவர் (IIM அகமதாபாத்). 'முதலீடு மூலமா வளர்ச்சி' கட்டத்தை ஆரம்பிச்சார்: பிராண்ட் செலவு, விசி-கூலர்கள், பிரீமியம் லாஞ்ச், புது கேபாசிட்டி."]},
 {y:"2024–25",e:3,t:["Heineken Silver, Ultra Max, UP brewery","ஹைனகென் சில்வர், அல்ட்ரா மேக்ஸ், UP ப்ரூவரி"],x:["Premium launches scaled up; a greenfield brewery in Uttar Pradesh (~₹750 cr) was started. Borrowings rose from ₹102 cr (Mar-24) to ₹1,317 cr (Mar-26) to fund capex and working capital.","பிரீமியம் லாஞ்ச்கள் வேகமெடுத்தது; உத்தர பிரதேசத்துல ~₹750 கோடில புது ப்ரூவரி ஆரம்பம். கேபெக்ஸ், வொர்க்கிங் கேப்பிட்டலுக்காக கடன் ₹102 கோடி (மார்ச்-24) → ₹1,317 கோடி (மார்ச்-26)."]},
 {y:"Q2 FY26",e:4,t:["Monsoon shock: PAT −65%","மழை ஷாக்: PAT −65%"],x:["An unusually heavy monsoon cut volume 3.4% and PAT fell to ₹46 cr — the low base that flatters this quarter's YoY growth.","வழக்கத்துக்கு மாறான கனமழை — வால்யூம் 3.4% குறைஞ்சு, லாபம் ₹46 கோடிக்கு விழுந்தது. இந்த குறைந்த அடிப்படை தான் இந்த காலாண்டோட YoY வளர்ச்சியை பெரிசா காட்டுது."]},
 {y:"2026",e:4,t:["West Asia cost shock, tax demand, 5-year-low stock","மேற்காசியா செலவு ஷாக், டாக்ஸ் டிமாண்ட், 5 வருஷ லோ"],x:["Packaging and freight costs jumped (estimated FY27 hit ₹350–400 cr after price hikes in 22 states). A ₹116.25 cr tax demand arrived. The share hit a 5-year low around ₹1,128–1,150.","பேக்கேஜிங், சரக்கு செலவு எகிறியது (22 மாநிலங்கள்ல விலை ஏத்தின பிறகும் FY27-க்கு ₹350–400 கோடி பாதிப்பு). ₹116.25 கோடி டாக்ஸ் டிமாண்ட் வந்தது. ஷேர் 5 வருஷ லோ ₹1,128–1,150 வரை போனது."]},
 {y:"3 Sep 2026",e:3,t:["Capital Markets Day, Goa","கேப்பிட்டல் மார்க்கெட்ஸ் டே, கோவா"],x:["Ambition: double-digit net sales growth, mid-teens EBITDA margin, better ROIC and cash conversion; premium to reach 18–20% of sales by FY30; net-zero Scope 1 & 2 by 2030.","டார்கெட்: இரட்டை இலக்க சேல்ஸ் வளர்ச்சி, மிட்-டீன்ஸ் EBITDA மார்ஜின், சிறந்த ROIC, கேஷ் கன்வர்ஷன்; FY30-க்குள் பிரீமியம் சேல்ஸ்ல 18–20%; 2030-க்குள் Scope 1 & 2 நெட்-ஜீரோ."]},
 {y:"27 Oct 2026",e:3,t:["Q2 FY27: PAT ~3x, stock +15% intraday","Q2 FY27: லாபம் ~3 மடங்கு, ஷேர் +15%"],x:["Volume +16%, premium +38%, net sales +24%, PAT ₹134.81 cr (consolidated). On 28 Oct the stock touched ₹1,316 (+15%) in a falling market.","வால்யூம் +16%, பிரீமியம் +38%, சேல்ஸ் +24%, PAT ₹134.81 கோடி (கன்சாலிடேட்டட்). 28 அக் அன்னிக்கு மார்க்கெட் இறங்கியும் ஷேர் ₹1,316 (+15%) தொட்டது."]}
];

var BM={
 cust:{t:["Consumers","நுகர்வோர்"],k:["25 mn+ reach legal drinking age yearly · ~2.5 L/capita vs ~25 L global","வருஷம் 25 மில்லியன்+ புது வயசு வர்றவங்க · தலைக்கு ~2.5 லி vs உலக சராசரி ~25 லி"],x:["India drinks about 2.5 litres of beer per person a year against a global average near 25 litres. More than 25 million young adults enter the legal drinking age every year. This headroom is the long-term volume story.","இந்தியாவுல ஒருத்தர் வருஷத்துக்கு சராசரி 2.5 லிட்டர் பீர் தான்; உலக சராசரி 25 லிட்டர். வருஷம் 25 மில்லியனுக்கு மேல புதுசா சட்டப்படி குடிக்கும் வயசுக்கு வர்றாங்க. இது தான் நீண்டகால வால்யூம் கதை."]},
 chan:{t:["State-regulated channel","மாநில கட்டுப்பாட்டு சேனல்"],k:["State corporations · licensed retail · bars & on-trade","மாநில கார்ப்பரேஷன்கள் · லைசென்ஸ் கடைகள் · பார்கள்"],x:["Alcohol is a state subject. In many states UBL sells to a state beverage corporation (for example TASMAC in Tamil Nadu), which then supplies retail; in others it sells to licensed distributors. States set excise, sometimes the retail price, and pay on their own timetable — which is why receivable days are high.","மது மாநில சப்ஜெக்ட். பல மாநிலங்கள்ல UBL மாநில கார்ப்பரேஷனுக்கு (உதா: தமிழ்நாட்டுல TASMAC) விக்கும், அவங்க கடைகளுக்கு சப்ளை பண்ணுவாங்க; சில மாநிலங்கள்ல லைசென்ஸ் டிஸ்ட்ரிபியூட்டர்களுக்கு. எக்சைஸ், சில நேரம் விலையும் மாநிலம் தான் தீர்மானிக்கும், பணமும் அவங்க நேரத்துக்கு தான் — அதனால தான் ரிசீவபிள் நாட்கள் அதிகம்."]},
 ubl:{t:["United Breweries Ltd","யுனைடெட் ப்ரூவரீஸ்"],k:["~207 mn cases (FY26) · 13 brands · 50+ export markets · Heineken 70.84%","~207 மில்லியன் கேஸ் (FY26) · 13 பிராண்ட் · 50+ ஏற்றுமதி நாடுகள் · ஹைனகென் 70.84%"],x:["India's largest brewer, part of HEINEKEN. Owns and contracts breweries across states (local production avoids inter-state taxes and freight). Nearly half of India's beer volume is estimated to be UBL's.","இந்தியாவோட பெரிய ப்ரூவர், ஹைனகென் குரூப்பின் ஒரு பகுதி. பல மாநிலங்கள்ல சொந்த & கான்ட்ராக்ட் ப்ரூவரிகள் (உள்ளூர்லயே தயாரிச்சா மாநிலங்களுக்கு இடையிலான வரி, சரக்கு செலவு மிச்சம்). இந்திய பீர் வால்யூம்ல கிட்டத்தட்ட பாதி UBL-தோடது-னு மதிப்பீடு."]},
 s1:{t:["Mainstream (strong & mild)","மெயின்ஸ்ட்ரீம் (ஸ்ட்ராங் & மைல்ட்)"],k:["Kingfisher Strong, Kingfisher Premium · bulk of volume","கிங்ஃபிஷர் ஸ்ட்ராங், பிரீமியம் · பெரும்பாலான வால்யூம்"],x:["The volume base. Price is heavily influenced by state excise and, in some states, by government-fixed prices. UBL says it holds share in mainstream while growing premium.","வால்யூமோட அடித்தளம். விலை பெரும்பாலும் மாநில எக்சைஸ், சில மாநிலங்கள்ல அரசு நிர்ணய விலை மேல தான். மெயின்ஸ்ட்ரீம்ல பங்கை தக்க வச்சு, பிரீமியத்துல வளரணும்-ங்கறது அவங்க திட்டம்."]},
 s2:{t:["Premium","பிரீமியம்"],k:["Q2 volume +38% · Heineken Silver +67% · KF Ultra +44%","Q2 வால்யூம் +38% · ஹைனகென் சில்வர் +67% · KF அல்ட்ரா +44%"],x:["Kingfisher Ultra / Ultra Max, Heineken, Heineken Silver (now in 11 markets), Amstel. Premium grows ~2.8x faster than the category and management says premium margins have turned accretive. Ambition: 18–20% of sales by FY30. Exact current share of volume is not disclosed †.","கிங்ஃபிஷர் அல்ட்ரா / அல்ட்ரா மேக்ஸ், ஹைனகென், ஹைனகென் சில்வர் (இப்போ 11 மாநிலங்கள்), ஆம்ஸ்டெல். பிரீமியம் கேட்டகரியை விட ~2.8 மடங்கு வேகமா வளருது; பிரீமியம் மார்ஜின் இப்போ லாபகரம்-னு நிர்வாகம் சொல்லுது. டார்கெட்: FY30-க்குள் சேல்ஸ்ல 18–20%. இப்போதைய சரியான பங்கு வெளியிடல †."]},
 s3:{t:["Regional & value","ரீஜனல் & வேல்யூ"],k:["UB Export, London Pilsner, Bullet, Kalyani Black Label","UB எக்ஸ்போர்ட், லண்டன் பில்ஸ்னர், புல்லட், கல்யாணி பிளாக் லேபிள்"],x:["'Local jewels' used state by state to defend share at lower price points. Contract manufacturing for others also sits here and can dilute realisation when its share rises (as in Q4 FY26).","மாநிலத்துக்கு மாநிலம் குறைந்த விலையில பங்கை காப்பாத்த 'லோக்கல் ஜுவல்ஸ்'. மத்தவங்களுக்கு கான்ட்ராக்ட் தயாரிப்பும் இங்க தான் — அது அதிகமானா சராசரி விலை குறையும் (Q4 FY26-ல நடந்த மாதிரி)."]},

 h+='<h2>'+t(['Working capital and its link to cash','வொர்க்கிங் கேப்பிட்டல் & கேஷுடன் தொடர்பு'])+'</h2>';

var WCX={inv:['Inventory days (FY26: 432) — malt, packaging and finished beer stocked ahead of peak summer. Cutting inventory by 20% in Q1 FY27 released cash.','இன்வென்டரி நாட்கள் (FY26: 432) — கோடைக்கு முன்னாடியே மால்ட், பேக்கேஜிங், பீர் ஸ்டாக். Q1 FY27-ல 20% குறைச்சது கேஷ் விடுவிச்சது.'],
 rec:['Receivable days (FY26: 116) — state beverage corporations often pay late. This is the single biggest reason profit does not turn into cash quickly.','ரிசீவபிள் நாட்கள் (FY26: 116) — மாநில கார்ப்பரேஷன்கள் தாமதமா பணம் தருவாங்க. லாபம் உடனே கேஷா மாறாததுக்கு இது தான் பெரிய காரணம்.'],
 pay:['Payable days (FY26: 361) — UBL pays its suppliers slowly; payables rose from 207 days (FY24) to 361, which offsets inventory and receivables. If suppliers tighten terms, cash flow suffers.','பேயபிள் நாட்கள் (FY26: 361) — சப்ளையர்களுக்கு மெதுவா பணம் தருது; 207 (FY24) → 361. இது இன்வென்டரி, ரிசீவபிளை ஈடு செய்யுது. சப்ளையர்கள் கடுமையானா கேஷ் ஃப்ளோ பாதிக்கும்.'],
 ccc:['Cash conversion cycle = inventory + receivable − payable days (FY26: 187). Fewer days = cash comes back faster.','கேஷ் கன்வர்ஷன் சைக்கிள் = இன்வென்டரி + ரிசீவபிள் − பேயபிள் (FY26: 187). நாட்கள் குறைஞ்சா கேஷ் சீக்கிரம் திரும்பும்.'],
 cfo:['CFO ÷ EBITDA (FY26: 81%) — when the cycle shortens, more of EBITDA becomes cash. It was just 3% in FY23 when receivables and inventory swelled.','CFO ÷ EBITDA (FY26: 81%) — சைக்கிள் குறைஞ்சா EBITDA-ல அதிகம் கேஷா மாறும். FY23-ல 3% தான்.']};

 var o=scLoad(),h='<h2>'+t(['CB Investor Self-check','CB முதலீட்டாளர் சுய சோதனை'])+'</h2><p class="note">'+t(['Tick what is true for you. This only counts how many of your own conditions line up. It is not a recommendation.','உங்களுக்கு பொருந்துறதை டிக் பண்ணுங்க. உங்க சொந்த நிபந்தனைகள்ல எத்தனை பொருந்துது-னு மட்டும் எண்ணும். இது பரிந்துரை இல்ல.'])+'</p>';
 h+='<div class="card"><b>'+t(['Overall','மொத்தம்'])+'</b> <span id="scAll"></span><div class="bar"><div id="scAllB" style="width:0"></div></div></div>';
 SC.forEach(function(g,gi){h+='<div class="scg"><b>'+t(g.g)+'</b> <span class="note" id="scG'+gi+'"></span><div class="bar"><div id="scGB'+gi+'"></div></div>';
  g.i.forEach(function(it,ii){var id='g'+gi+'_'+ii;h+='<label class="sci"><input type="checkbox" data-id="'+id+'" '+(o.t[id]?'checked':'')+'><span>'+t(it[0])+(it[1].length?'<div class="dt">Data: '+t(it[1])+'</div>':'')+'</span></label>';});h+='</div>';});
 h+='<div class="scg"><b>'+t(['5 · My own conditions (up to 8)','5 · என் சொந்த நிபந்தனைகள் (8 வரை)'])+'</b> <span class="note" id="scG4"></span><div class="bar"><div id="scGB4"></div></div><div id="scOwn"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="scIn" style="flex:1;border:1px solid var(--line);border-radius:14px;padding:6px 10px;font:inherit" placeholder="'+t(['Add a condition…','நிபந்தனை சேர்க்க…'])+'"><button class="btn" id="scAdd">+</button></div><div class="chips" id="scSug">'+SCSUG.map(function(s,i){return '<button class="btn ghost" data-i="'+i+'">'+t(s)+'</button>';}).join('')+'</div></div>';
 h+='<button class="btn ghost" id="scClr">'+t(['Clear all ticks','எல்லாத்தையும் அழி'])+'</button>';
 return h;
}
function scUpd(){var o=scLoad(),tot=0,on=0;SC.forEach(function(g,gi){var n=g.i.length,k=0;g.i.forEach(function(it,ii){if(o.t['g'+gi+'_'+ii])k++;});tot+=n;on+=k;$('scG'+gi).textContent=k+' / '+n;$('scGB'+gi).style.width=(k/n*100)+'%';});
 var n4=o.own.length,k4=o.own.filter(function(x){return x.c;}).length;tot+=n4;on+=k4;$('scG4').textContent=k4+' / '+n4;$('scGB4').style.width=(n4?k4/n4*100:0)+'%';
 $('scAll').textContent=on+' / '+tot+' — '+t(['conditions line up','நிபந்தனைகள் பொருந்துது']);$('scAllB').style.width=(tot?on/tot*100:0)+'%';
 $('scOwn').innerHTML=o.own.map(function(x,i){return '<label class="sci"><input type="checkbox" data-own="'+i+'" '+(x.c?'checked':'')+'><span>'+x.s.replace(/</g,'&lt;')+'</span></label>';}).join('');
 document.querySelectorAll('[data-own]').forEach(function(cb){cb.onchange=function(){var o2=scLoad();o2.own[+cb.getAttribute('data-own')].c=cb.checked;scSave(o2);scUpd();};});}
function pSelf(){
 document.querySelectorAll('.scg input[data-id]').forEach(function(cb){cb.onchange=function(){var o=scLoad();o.t[cb.getAttribute('data-id')]=cb.checked;scSave(o);scUpd();};});
 function add(s){s=(s||'').trim();if(!s)return;var o=scLoad();if(o.own.length>=8)return;o.own.push({s:s,c:false});scSave(o);scUpd();}
 $('scAdd').onclick=function(){add($('scIn').value);$('scIn').value='';};
 document.querySelectorAll('#scSug button').forEach(function(b){b.onclick=function(){add(t(SCSUG[+b.getAttribute('data-i')]));};});
 $('scClr').onclick=function(){scSave({t:{},own:[]});render();};
 scUpd();
}

// ===== Management =====
function rMgmt(){
 var h='<h2>'+t(['Management & Board','நிர்வாகம் & போர்டு'])+'</h2><div class="grid g3">'+MG.map(function(m){return '<div class="card"><b>'+m.n+'</b><div class="pill p-o">'+t(m.r)+'</div><div style="font-size:13.5px;margin-top:4px">'+t(m.x)+'</div></div>';}).join('')+'</div>';
 h+='<p class="note">'+t(['Other Heineken nominee directors are on the board; their names were not captured for this file †.','மற்ற ஹைனகென் நாமினி டைரக்டர்களும் போர்டில் இருக்காங்க; பெயர்கள் இங்க சேர்க்கல †.'])+'</p>';
 h+='<div class="grid g2"><div class="card"><h3>'+t(['Ownership (Sep 2026)','உரிமை (செப் 2026)'])+'</h3>'+'<div style="height:260px"><canvas id="cG1"></canvas></div></div><div class="card"><h3>'+t(['Governance notes','நிர்வாக குறிப்புகள்'])+'</h3><ul class="tk">'+GOV.map(function(g){return '<li>'+t(g)+'</li>';}).join('')+'</ul></div></div>';
 return h;
}
function pMgmt(){var i=SH.pro.length-1;mk('cG1',{type:'doughnut',data:{labels:[t(['Promoter (Heineken)','புரமோட்டர் (ஹைனகென்)']),'DII','FII',t(['Public','பொது']),t(['Govt','அரசு'])],datasets:[{data:[SH.pro[i],SH.dii[i],SH.fii[i],SH.pub[i],SH.gov[i]],backgroundColor:['#e8740c','#2563eb','#7c3aed','#1f9d55','#9aa5b1']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});}

// ===== Socrates =====
function rSoc(){
 var h='<h2>'+t(['Cauvery Socrates — think it through','காவேரி சாக்ரடீஸ் — யோசிச்சு பாருங்க'])+'</h2><p class="note">'+t(['Each question gives a hint first. Try before you look.','ஒவ்வொரு கேள்விக்கும் முதல்ல ஒரு குறிப்பு. பதிலை பார்க்கும் முன் முயற்சி பண்ணுங்க.'])+'</p>';
 SOQ.forEach(function(q,i){h+='<div class="q"><b>Q'+(i+1)+'. '+t(q.q)+'</b>';
  if(q.free){h+='<textarea id="sf'+i+'"></textarea><button class="btn" data-free="'+i+'">'+t(['Check my thinking','என் யோசனையை சோதி'])+'</button>';}
  else{q.o.forEach(function(o,j){h+='<button class="opt" data-q="'+i+'" data-o="'+j+'">'+String.fromCharCode(65+j)+'. '+t(o)+'</button>';});}
  h+='<div class="fb note">💡 '+t(q.h)+'</div><div class="fb" id="sfb'+i+'"></div></div>';});
 return h;
}
function pSoc(){
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-q'),j=+b.getAttribute('data-o'),q=SOQ[i];
  document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(function(x){x.classList.remove('ok','no');});
  b.classList.add(j===q.a?'ok':'no');$('sfb'+i).innerHTML=j===q.a?'<span class="up">✔ '+t(['Right. Now ask: what would make this change next quarter?','சரி. அடுத்த காலாண்டுல இது எப்படி மாறலாம்-னு யோசிங்க.'])+'</span>':'<span class="dn">✘ '+t(['Not quite — re-read the hint and try again.','இல்ல — குறிப்பை மறுபடி படிச்சு முயற்சி பண்ணுங்க.'])+'</span>';};});
 document.querySelectorAll('[data-free]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-free'),v=($('sf'+i).value||'').toLowerCase(),q=SOQ[i],hit=q.k.filter(function(k){return v.indexOf(k)>=0;});
  $('sfb'+i).innerHTML=hit.length>=2?'<span class="up">'+t(['Good — you touched ','நல்லது — நீங்க தொட்டது: '])+hit.slice(0,4).join(', ')+'. '+t(['Now quantify one: e.g. receivable days 116, EBITDA margin ~9–10%.','இப்போ ஒண்ணை எண்ணால சொல்லுங்க: ரிசீவபிள் 116 நாள், மார்ஜின் ~9–10%.'])+'</span>':'<span class="nt">'+t(['Think about who sets the price and who pays late. What does that do to margin and to capital tied up?','விலையை யார் நிர்ணயிக்கிறாங்க, யார் தாமதமா பணம் தர்றாங்க — அது மார்ஜினையும் முடங்கும் மூலதனத்தையும் என்ன பண்ணும்?'])+'</span>';};});
}

// ===== Render engine =====
var R={ov:[rOv,pOv],hist:[rHist,pHist],bm:[rBm,pBm],fin:[rFin,pFin],cf:[rCf,pCf],val:[rVal,pVal],mkt:[rMkt,pMkt],tc:[rTc,null],swot:[rSwot,null],an:[rAn,pAn],self:[rSelf,pSelf],mgmt:[rMgmt,pMgmt],soc:[rSoc,pSoc]};
function bar(){var b=TABS.map(function(x){return '<button data-t="'+x[0]+'" class="'+(x[0]===CUR?'on':'')+'">'+t(x[1])+'</button>';}).join('')+'<button id="langbtn">'+(LANG==='en'?'தமிழ்':'English')+'</button>';
 $('tabbar').innerHTML=b;document.querySelectorAll('#tabbar button[data-t]').forEach(function(x){x.onclick=function(){go(x.getAttribute('data-t'));};});$('langbtn').onclick=function(){LANG=LANG==='en'?'ta':'en';document.body.classList.toggle('ta',LANG==='ta');document.documentElement.lang=LANG;render();asInit();};}
function go(k){CUR=k;render();window.scrollTo({top:0,behavior:'smooth'});var b=document.querySelector('#tabbar button.on');if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'});}
function render(){kill();bar();$('ttl').textContent=t(TX.title);$('subttl').textContent=t(TX.sub);$('disc').innerHTML=t(TX.disc);
 $('main').innerHTML='<section class="tab on">'+R[CUR][0]()+'</section>';if(R[CUR][1])R[CUR][1]();}

// ===== CB badge =====
$('cbBadge').onclick=function(e){e.stopPropagation();$('disc').classList.toggle('on');$('asPanel').classList.remove('on');};
document.addEventListener('click',function(e){if(!$('disc').contains(e.target)&&e.target!==$('cbBadge'))$('disc').classList.remove('on');});

// ===== CB Assist (voice Q&A) =====
var REC=null;
function asInit(){$('asTitle').textContent=t(['CB Assist — ask by voice or text','CB அசிஸ்ட் — குரல் அல்லது எழுத்தில் கேளுங்க']);$('asQ').placeholder=t(['e.g. What was the profit?','உதா: லாபம் எவ்வளவு?']);
 $('asSugg').innerHTML=ASUG.map(function(s){return '<button>'+t(s)+'</button>';}).join('');document.querySelectorAll('#asSugg button').forEach(function(b){b.onclick=function(){ask(b.textContent);};});
 if(!$('asLog').innerHTML)say(t(['Hello! Ask me about United Breweries’ Q2 FY27 results — profit, margins, premium brands, cash flow, valuation, history or triggers.','வணக்கம்! யுனைடெட் ப்ரூவரீஸ் Q2 FY27 பத்தி கேளுங்க — லாபம், மார்ஜின், பிரீமியம், கேஷ் ஃப்ளோ, மதிப்பீடு, வரலாறு, ட்ரிகர்.']),false);}
function say(txt,speak,extra){var d=document.createElement('div');d.className='mA';d.innerHTML=txt+(extra||'');$('asLog').appendChild(d);$('asLog').scrollTop=1e6;
 if(speak&&window.speechSynthesis){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(d.textContent);u.lang=LANG==='ta'?'ta-IN':'en-IN';var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.indexOf(LANG==='ta'?'ta':'en-IN')===0;});if(vs[0])u.voice=vs[0];u.rate=1;speechSynthesis.speak(u);}catch(e){}}}
function ask(q){q=(q||'').trim();if(!q)return;var u=document.createElement('div');u.className='mU';u.textContent=q;$('asLog').appendChild(u);var lq=q.toLowerCase();
 if(/\b(buy|sell|hold|invest now|should i)\b/.test(lq)||/வாங்க|விக்க|விற்க|முதலீடு பண்ண/.test(q)){say(t(NOADV),true,' <button class="btn ghost" id="toSelf" style="margin-top:6px">'+t(['Open Self-check','சுய சோதனையை திற'])+'</button>');var b=$('toSelf');b.id='';b.onclick=function(){go('self');$('asPanel').classList.remove('on');};return;}
 var best=null,bs=0;KB.forEach(function(k){var s=0;k.k.forEach(function(w){if(lq.indexOf(w)>=0)s+=w.length>4?2:1;});if(s>bs){bs=s;best=k;}});
 if(best)say(t(best.a),true);else say(t(['I can answer on: profit, revenue, margin, premium, valuation, debt, cash flow, history, triggers, analysts, CB score, risks and management.','என்னால பதில் சொல்ல முடிஞ்சது: லாபம், வருமானம், மார்ஜின், பிரீமியம், மதிப்பீடு, கடன், கேஷ் ஃப்ளோ, வரலாறு, ட்ரிகர், அனலிஸ்ட், CB ஸ்கோர், ரிஸ்க், நிர்வாகம்.']),true);}
$('asBtn').onclick=function(){$('asPanel').classList.toggle('on');$('disc').classList.remove('on');};
$('asClose').onclick=function(){$('asPanel').classList.remove('on');};
$('asSend').onclick=function(){ask($('asQ').value);$('asQ').value='';};
$('asQ').addEventListener('keydown',function(e){if(e.key==='Enter'){ask($('asQ').value);$('asQ').value='';}});
$('mic').onclick=function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){say(t(['Voice input is not supported in this browser — please type your question.','இந்த பிரவுசர்ல குரல் வசதி இல்ல — டைப் பண்ணுங்க.']),false);return;}
 if(REC){try{REC.stop();}catch(e){}return;}REC=new SR();REC.lang=LANG==='ta'?'ta-IN':'en-IN';REC.interimResults=false;REC.maxAlternatives=1;$('mic').classList.add('rec');
 REC.onresult=function(ev){ask(ev.results[0][0].transcript);};REC.onend=function(){$('mic').classList.remove('rec');REC=null;};REC.onerror=function(){$('mic').classList.remove('rec');REC=null;};REC.start();};

render();asInit();

</script>
