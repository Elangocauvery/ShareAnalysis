function schoolSVG(){
 var W=180,H=64,X=[20,240,460,680,900],RY5=[30,145,260,375,490],RY4=[60,185,310,435];
 var colN=[5,4,5,4,4];var pos={};

 var heads=["Funding & growth","Prices of money","Income & risk","Profit & capital","Returns & value"];
 var sv='<svg viewBox="0 0 1100 580" width="1100" height="580" id="schoolSvg"><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f8a4c"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c23b2a"/></marker></defs>';
 heads.forEach(function(t,i){sv+='<text x="'+(X[i]+W/2)+'" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6676" letter-spacing="1">'+t.toUpperCase()+'</text>'});
 SL.forEach(function(l,i){var a=pos[l[0]],b=pos[l[1]],d;
  if(b.x>a.x){d='M'+(a.x+W)+','+(a.y+H/2)+' C'+(a.x+W+45)+','+(a.y+H/2)+' '+(b.x-45)+','+(b.y+H/2)+' '+b.x+','+(b.y+H/2)}
  else if(b.x===a.x){d='M'+(a.x+W)+','+(a.y+H/2)+' C'+(a.x+W+35)+','+(a.y+H/2)+' '+(b.x+W+35)+','+(b.y+H/2)+' '+(b.x+W)+','+(b.y+H/2)}
  else{d='M'+a.x+','+(a.y+H/2)+' C'+(a.x-50)+','+(a.y+H/2)+' '+(b.x+W+50)+','+(b.y+H/2)+' '+(b.x+W)+','+(b.y+H/2)}
  var g=l[2]>0;sv+='<path class="lnk" data-f="'+l[0]+'" data-t="'+l[1]+'" d="'+d+'" fill="none" stroke="'+(g?"#1f8a4c":"#c23b2a")+'" stroke-width="1.4" '+(g?'':'stroke-dasharray="5 4" ')+'marker-end="url(#'+(g?"ag":"arr")+')" opacity=".55"/>'});
 SM.forEach(function(s){var p=pos[s[0]];sv+='<g class="box sbox" data-s="'+s[0]+'"><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+H+'" rx="8" fill="#ffffff" stroke="#16202e" stroke-width="1.3"/><text x="'+(p.x+10)+'" y="'+(p.y+20)+'" font-size="13" font-weight="600" fill="#16202e">'+esc(s[1])+'</text><text class="arrw" x="'+(p.x+W-10)+'" y="'+(p.y+20)+'" text-anchor="end" font-size="15" font-weight="700" fill="#16202e"></text>'+
  '<text x="'+(p.x+10)+'" y="'+(p.y+40)+'" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#1d4f9e">H '+esc(s[4][0])+'</text><text x="'+(p.x+10)+'" y="'+(p.y+55)+'" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#b13a1f">I '+esc(s[4][1])+'</text><text x="'+(p.x+100)+'" y="'+(p.y+55)+'" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="#8f1648">A '+esc(s[4][2])+'</text></g>'});
 return sv+'</svg>';
}
VIEWS.school=function(){
 var h='<h2>'+T("CB School: how bank numbers push each other","CB பள்ளி: வங்கி எண்கள் ஒன்றையொன்று எப்படி தள்ளுகின்றன")+'</h2>';
 h+='<p>'+T("Each box shows HDFC (H), ICICI (I) and Axis (A). Solid green arrows mean both move the same way; dashed red arrows mean they move opposite ways. Tap a metric to see what it pushes and what pushes it, or play a scenario.","ஒவ்வொரு பெட்டியிலும் HDFC (H), ICICI (I), Axis (A) எண்கள். பச்சை கோடு = ஒரே திசை; சிவப்பு புள்ளிக்கோடு = எதிர் திசை. ஒரு அளவீட்டைத் தட்டுங்கள் அல்லது ஒரு சூழ்நிலையை இயக்குங்கள்.")+'</p>';
 h+='<div class="scn">'+Object.keys(SCN).map(function(k){return '<button class="pill" data-scn="'+k+'" type="button">▶ '+T(SCN[k].n,SCN[k].ta)+'</button>'}).join("")+'<button class="pill" data-scn="reset" type="button">'+T("Reset","மீட்டமை")+'</button></div>';
 h+='<div class="svgf">'+schoolSVG()+'</div><div class="ex" id="schEx">'+T("Tap a metric or a scenario.","ஒரு அளவீடு அல்லது சூழ்நிலையைத் தட்டுங்கள்.")+'</div>';
 h+='<h3>'+T("Lessons from this quarter","இந்த காலாண்டின் பாடங்கள்")+'</h3><div class="grid g3">'+SLESS.map(function(l){return '<div class="card lesson"><h4>'+l[0]+'</h4><p style="margin:0">'+T(l[1],l[2])+'</p></div>'}).join("")+'</div>';
 return h;
};

function schReset(){scnTimers.forEach(clearTimeout);scnTimers=[];document.querySelectorAll("#schoolSvg .sbox").forEach(function(g){g.classList.remove("dim","sel");g.querySelector(".arrw").textContent="";g.querySelector("rect").setAttribute("fill","#ffffff")});document.querySelectorAll("#schoolSvg .lnk").forEach(function(p){p.classList.remove("dim");p.setAttribute("opacity",".55")})}
AFTER.school=function(){
 var lab={};SM.forEach(function(s){lab[s[0]]=s[1]});
 document.querySelectorAll("#schoolSvg .sbox").forEach(function(g){g.addEventListener("click",function(){schReset();var id=g.dataset.s;var rel={};rel[id]=1;var push=[],by=[];
  document.querySelectorAll("#schoolSvg .lnk").forEach(function(p){if(p.dataset.f===id||p.dataset.t===id){p.setAttribute("opacity","1");rel[p.dataset.f]=1;rel[p.dataset.t]=1;var sign=p.getAttribute("stroke")==="#1f8a4c"?"(same way)":"(opposite)";if(p.dataset.f===id)push.push(lab[p.dataset.t]+" "+sign);else by.push(lab[p.dataset.f]+" "+sign)}else p.classList.add("dim")});
  document.querySelectorAll("#schoolSvg .sbox").forEach(function(x){if(!rel[x.dataset.s])x.classList.add("dim")});g.classList.add("sel");
  document.getElementById("schEx").innerHTML="<b>"+esc(lab[id])+"</b><br>"+T("It pushes: ","இது தள்ளுவது: ")+(push.join(", ")||"—")+"<br>"+T("It is pushed by: ","இதைத் தள்ளுவது: ")+(by.join(", ")||"—")})});
 document.querySelectorAll("[data-scn]").forEach(function(btn){btn.addEventListener("click",function(){schReset();var k=btn.dataset.scn;if(k==="reset"){document.getElementById("schEx").textContent=T("Tap a metric or a scenario.","ஒரு அளவீடு அல்லது சூழ்நிலையைத் தட்டுங்கள்.");return}
  var sc=SCN[k];var ids={};sc.steps.forEach(function(s){ids[s[0]]=1});
  document.querySelectorAll("#schoolSvg .sbox").forEach(function(x){if(!ids[x.dataset.s])x.classList.add("dim")});
  document.querySelectorAll("#schoolSvg .lnk").forEach(function(p){if(!(ids[p.dataset.f]&&ids[p.dataset.t]))p.classList.add("dim");else p.setAttribute("opacity","1")});
  sc.steps.forEach(function(s,i){scnTimers.push(setTimeout(function(){var g=document.querySelector('#schoolSvg .sbox[data-s="'+s[0]+'"]');if(!g)return;g.querySelector(".arrw").textContent=s[1]>0?"▲":"▼";g.querySelector(".arrw").setAttribute("fill",s[1]>0?"#1f8a4c":"#c23b2a");g.querySelector("rect").setAttribute("fill",s[1]>0?"#eaf6ef":"#fbecea")},i*450))});
  document.getElementById("schEx").innerHTML="<b>"+esc(T(sc.n,sc.ta))+"</b><br>"+esc(T(sc.card,sc.cardTa))})});
};

VIEWS.asset=function(){
 var h='<h2>'+T("Asset quality and readiness for ECL","கடன் தரம் & ECL தயார்நிலை")+'</h2>';
 h+='<div class="card soft"><h4>'+T("What is ECL and when does it start?","ECL என்றால் என்ன? எப்போது?")+'</h4><p>'+T("RBI issued final Expected Credit Loss directions on 27 April 2026, effective 1 April 2027. Today banks provide after a loan defaults (incurred loss). Under ECL they classify every loan into Stage 1 (12-month expected loss), Stage 2 (significant rise in risk: lifetime loss) or Stage 3 (default), using probability of default, loss given default and exposure at default, with RBI floors. The extra Day-1 provision can be phased into CET1 over FY28 to FY31. On the same day RBI also issued the new standardised approach for credit risk, which lowers risk weights on some retail and MSME loans and releases capital.","RBI 27 ஏப்ரல் 2026-ல் ECL இறுதி விதிகளை வெளியிட்டது; 1 ஏப்ரல் 2027 முதல் அமல். இப்போ கடன் வாராக்கடன் ஆன பிறகு தான் provision. ECL-ல் ஒவ்வொரு கடனையும் Stage 1, 2, 3 என பிரித்து முன்கூட்டியே provision. கூடுதல் தொகையை FY28–FY31 நான்கு ஆண்டுகளில் CET1-ல் பிரிக்கலாம். அதே நாளில் வந்த புதிய risk weight விதிகள் retail, MSME கடன்களுக்கு மூலதனத்தை விடுவிக்கும்.")+'</p><p style="margin:0">'+T("Estimated impact: CRISIL sees up to 120 bps net CET1 impact for banks in general; analysts put large private banks (HDFC, ICICI, Axis) at only 5–20 bps, since their buffers equal 2–4% of net worth. PSU and mid-tier banks with unsecured or microfinance loans face more.","மதிப்பீடு: பொதுவாக 120 bps வரை CET1 தாக்கம் (CRISIL); பெரிய தனியார் வங்கிகளுக்கு வெறும் 5–20 bps.")+'</p></div>';
 h+='<h3>'+T("How prepared is each bank?","ஒவ்வொரு வங்கியும் எவ்வளவு தயார்?")+'</h3><div class="tw"><table><thead><tr><th>Bank</th><th class="n">GNPA %</th><th class="n">NNPA %</th><th class="n">PCR %</th><th class="n">Credit cost</th><th class="n">CET1 %</th><th>Buffers beyond specific provisions</th><th>CB read</th></tr></thead><tbody>';

 h+='</tbody></table></div>';

VIEWS.fcnr=function(){
 var h='<h2>'+T("FCNR, VRRR & NIM: did the dollar windfall help or hurt?","FCNR, VRRR & NIM: டாலர் வரவு உதவியதா, பாதித்ததா?")+'</h2>';

 // NIM question
 h+='<h3>'+T("1. Did FCNR hurt NIM? Yes, in two ways","1. FCNR NIM-ஐ பாதித்ததா? ஆம், இரண்டு வழிகளில்")+'</h3>';

 h+='<div class="tw" style="margin-top:10px"><table><thead><tr><th>Bank</th><th class="n">FCNR $ bn</th><th class="n">NIM Q2</th><th>NIM evidence</th><th>Funding cost</th><th>Leverage effect</th><th>Liquidity</th><th>Net read</th></tr></thead><tbody>';
 bankList().forEach(function(b){var f=FX.bank[b],o=CO[b];h+='<tr><td>'+dot(b)+o.short+'</td><td class="n">'+fmt(o.fcnr.usd,2)+'</td><td class="n">'+f.nimQ2+'%</td><td>'+(b==="axis"?"3.47% without FCNR vs 3.36% reported: −11 bps":b==="icici"?"4.36% (Q1) → 4.18%: −18 bps QoQ":"3.32%; management calls Q2 the bottom")+'</td><td>'+f.cod+'</td><td>'+f.lev+'</td><td>'+f.lcr+'</td><td><span class="chip '+f.verdict[1]+'">'+f.verdict[0]+'</span></td></tr>'});
 h+='</tbody></table></div><p class="note">Sector estimate before results: Motilal Oswal expected private-bank NIMs to fall 8–20 bps in Q2; PSU banks less, since FCNR is a smaller share of their deposits.</p>';

 // VRRR
 h+='<h3>'+T("2. VRRR: did RBI take away money banks could have lent?","2. VRRR: வங்கிகள் கடன் கொடுக்கக்கூடிய பணத்தை RBI எடுத்துக்கொண்டதா?")+'</h3>';
 h+='<div class="grid g2"><div class="card"><h4>'+T("What VRRR is","VRRR என்றால்")+'</h4><p style="margin:0">'+T("Variable Rate Reverse Repo: an auction where banks lend their spare rupees to RBI for a fixed period (overnight to 30 days here) at a rate set by bidding, close to the repo rate. It is voluntary, as you said: a bank bids only the money it has no better use for. RBI used it because the swaps flooded the system with rupees and pushed overnight rates below the repo rate, which weakens monetary policy.","Variable Rate Reverse Repo: வங்கிகள் கூடுதல் ரூபாயை RBI-யிடம் சில நாட்களுக்கு (ஒரு நாள் முதல் 30 நாள்) ஏலத்தில் வைப்பது; வட்டி repo-வுக்கு அருகில். நீங்கள் சொன்னது போல விருப்பம் சார்ந்தது. Swap-ல் ரூபாய் வெள்ளமாக வந்து ஒரு நாள் வட்டி repo-வுக்கு கீழே போனதால் RBI இதைப் பயன்படுத்தியது.")+'</p></div><div class="card"><h4>'+T("Does it stop lending? Mostly no","கடனைத் தடுக்குமா? பெரும்பாலும் இல்லை")+'</h4><p style="margin:0">'+T("Loans can't be created overnight; a bank needs borrowers, credit checks and capital. VRRR only takes money that would otherwise sit idle, and the 30-day VRRR had an early-redemption option, so banks could pull money back to lend. System credit growth was above 18% in mid-September. The real cost is the earnings gap: VRRR pays ~5.24% on money that costs ~6%.","கடனை ஒரே இரவில் கொடுக்க முடியாது; கடன் வாங்குபவர், சோதனை, மூலதனம் தேவை. VRRR சும்மா இருக்கும் பணத்தை மட்டுமே எடுக்கிறது; 30 நாள் VRRR-ல் முன்கூட்டியே திரும்பப் பெறலாம். செப்டம்பர் நடுவில் கடன் வளர்ச்சி 18%-க்கு மேல். உண்மையான செலவு: ~6% பணத்துக்கு ~5.24% வருமானம்.")+'</p></div></div>';

 var ap=(-90+2*72+30)*Math.PI/180;s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+(r-8)*Math.cos(ap))+'" y2="'+(cy+(r-8)*Math.sin(ap))+'" stroke="#e2701b" stroke-width="4" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#e2701b"/>';

function whichBank(q){if(/hdfc/.test(q))return "hdfc";if(/icici/.test(q))return "icici";if(/axis/.test(q))return "axis";return null}
function answer(q){q=q.toLowerCase();var b=whichBank(q);for(var i=0;i<KB.length;i++){if(KB[i][0].some(function(k){return q.indexOf(k)>=0})){return {t:KB[i][1](b),go:KB[i][2]}}}
 if(b){var o=CO[b];return {t:o.name+": "+o.quarter+" Profit "+fmt(o.m.pat[1])+" crore, NIM "+o.m.nim[1]+"%, gross NPA "+o.m.gnpa[1]+"%."}}
 return {t:"Try asking about profit, NIM, NPA, FCNR, ECL, FIIs, valuation, the CEO change, or which bank was best."}}
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-IN";u.rate=1;speechSynthesis.speak(u)}catch(e){}}
function ask(q){if(!q)return;var log=document.getElementById("alog");var a=answer(q);log.insertAdjacentHTML("beforeend",'<div class="q">'+esc(q)+'</div><div class="a">'+esc(a.t)+(a.go?' <button class="pill" type="button" data-go="'+a.go+'">Open Self-check</button>':'')+'</div>');log.scrollTop=log.scrollHeight;speak(a.t)}

document.getElementById("aClose").addEventListener("click",function(){document.getElementById("assist").hidden=true;try{speechSynthesis.cancel()}catch(e){}});

document.getElementById("alog").addEventListener("click",function(e){var g=e.target.closest("[data-go]");if(g){TAB=g.dataset.go;render();document.getElementById("assist").hidden=true}});
(function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var mic=document.getElementById("mic");
 mic.addEventListener("click",function(){if(!SR){ask("");document.getElementById("alog").insertAdjacentHTML("beforeend",'<div class="a muted">Voice input is not available here; please type your question.</div>');return}
  try{var r=new SR();r.lang=LANG==="ta"?"ta-IN":"en-IN";r.interimResults=false;mic.classList.add("rec");r.onresult=function(ev){ask(ev.results[0][0].transcript)};r.onerror=function(){document.getElementById("alog").insertAdjacentHTML("beforeend",'<div class="a muted">Microphone was not allowed; please type your question.</div>')};r.onend=function(){mic.classList.remove("rec")};r.start()}catch(err){mic.classList.remove("rec")}})})();
