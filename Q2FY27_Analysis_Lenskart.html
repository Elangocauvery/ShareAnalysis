</script>
<style>
:root{
  --bg:#fff4e8; --bg2:#ffefdc; --card:#fffdf9; --line:#f1d9bd; --ink:#2b2118; --mut:#7a6552;
  --or:#e8730c; --or2:#ff9a3c; --orl:#ffe2c4; --grn:#1f9d55; --amb:#d99a00; --red:#d64545;
  --blu:#2d6cdf; --tea:#0e9488; --pur:#7c4dbd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#fff2e2 0%,#fff7ee 40%,#fff4e8 100%);color:var(--ink);
  font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;font-size:15px;line-height:1.55}
body.ta{font-family:'Noto Sans Tamil',Inter,system-ui,sans-serif}
body::before{content:"CB RESEARCH";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13vw;font-weight:800;color:rgba(232,115,12,.035);transform:rotate(-24deg);pointer-events:none;z-index:0}
header.top{position:relative;z-index:2;padding:18px 22px 10px;background:linear-gradient(90deg,#fff0de,#ffe6cc);border-bottom:1px solid var(--line)}
.ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ttl h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.ttl .sub{color:var(--mut);font-size:13.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--orl);color:#8a3f00;font-size:12px;font-weight:600}
.langsw{margin-left:auto;display:flex;gap:6px}
.langsw button{border:1px solid var(--or);background:#fff;color:var(--or);border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}
.langsw button.on{background:var(--or);color:#fff}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:#fff6ec;border-bottom:2px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:none;background:transparent;padding:8px 13px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit;font-size:14px}
nav.tabs button.on{background:var(--or);color:#fff;box-shadow:0 2px 8px rgba(232,115,12,.3)}
nav.tabs button:hover:not(.on){background:var(--orl);color:#8a3f00}
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:18px 16px 120px}
.tab{display:none;animation:fade .35s}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:21px;margin:6px 0 12px}
h3{font-size:16.5px;margin:18px 0 8px;color:#6b3300}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(160,90,20,.06)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--or)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px}
.kpi .d{font-size:12.5px;font-weight:600}
.up{color:var(--grn)} .dn{color:var(--red)} .fl{color:var(--amb)}
.blk{border-left:5px solid var(--or);padding-left:12px}
.blk.std{border-left-color:var(--blu)}
table{width:100%;border-collapse:collapse;font-size:13.8px;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #f4e4d1;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{background:#ffe9d2;color:#6b3300;font-weight:700;font-size:13px}
tr.cat td{background:#fff3e4;font-weight:800;color:#8a3f00;text-align:left;letter-spacing:.2px}
td.l,th.l{text-align:left}
.tw{overflow-x:auto}
.note{font-size:12.5px;color:var(--mut);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;background:#fff;border:2px solid var(--or);margin:3px 6px 3px 0}
.chip b{font-size:16px}
.cw{position:relative;overflow-x:auto}
.cw .cin{min-width:900px;height:330px}
.cw.sm .cin{min-width:0;height:280px}
.hl{animation:hlp 1.6s}
@keyframes hlp{0%{box-shadow:0 0 0 0 rgba(232,115,12,.0)}30%{box-shadow:0 0 0 6px rgba(232,115,12,.45)}100%{box-shadow:0 0 0 0 rgba(232,115,12,0)}}
.ex{display:none;margin-top:10px;background:#fff8ef;border:1px dashed var(--or);border-radius:12px;padding:12px 14px}
.ex.on{display:block;animation:fade .3s}
svg text{font-family:Inter,'Noto Sans Tamil',sans-serif}
.bm-box{cursor:pointer;transition:transform .15s}
.bm-box:hover{filter:brightness(1.05)}
.flowdash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.sl{display:grid;grid-template-columns:200px 1fr 90px;gap:10px;align-items:center;margin:8px 0}
.sl input{width:100%;accent-color:var(--or)}
.sl output{font-weight:800;text-align:right}
.big{font-size:30px;font-weight:800;color:var(--or)}
.mcard{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;transition:.2s}
.mcard:hover{border-color:var(--or);transform:translateY(-2px)}
.mcard .v{font-size:20px;font-weight:800;color:#8a3f00}
.mcard .n{font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#eef5ff;color:var(--blu);font-weight:700}
.tag.g{background:#e8f7ee;color:var(--grn)} .tag.r{background:#fdecec;color:var(--red)} .tag.a{background:#fff6dc;color:#9a6b00}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swot>div{border-radius:12px;padding:12px 14px;background:#fff;border-top:5px solid}
.swot ul{margin:6px 0 0 18px;padding:0}
.btn{border:none;background:var(--or);color:#fff;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn.o{background:#fff;color:var(--or);border:1px solid var(--or)}
.prog{height:10px;background:#f4e4d1;border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));width:0;transition:width .5s}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px dashed #f1dcc4}
.chk input{margin-top:4px;accent-color:var(--or);width:18px;height:18px}
.chk .dt{font-size:12.5px;color:var(--mut)}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.qopt.ok{background:#e8f7ee;border-color:var(--grn)} .qopt.no{background:#fdecec;border-color:var(--red)}
/* CB badge */
#cbBadge{position:fixed;right:18px;bottom:18px;z-index:50;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb066,#e8730c 60%,#b85400);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(232,115,12,.45);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(232,115,12,.55)}50%{box-shadow:0 0 0 12px rgba(232,115,12,0)}}
#cbPop{position:fixed;right:18px;bottom:86px;z-index:51;max-width:340px;background:#fff;border:1px solid var(--or);border-radius:14px;padding:14px;font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#cbPop.on{display:block;animation:fade .25s}

#asBtn{position:fixed;right:86px;bottom:24px;z-index:50;border:none;border-radius:999px;background:#fff;color:var(--or);border:2px solid var(--or);font-weight:800;padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.1);font-family:inherit}

    T("<b>Cash machine, priced like one.</b> ₹3,855 cr cash and ROCE 22.5%, but the stock trades near 160x trailing earnings — every future quarter must keep delivering.","<b>காசு சம்பாதிக்கிற மெஷின் — விலையும் அப்படித்தான்.</b> ₹3,855 கோடி கேஷ், ROCE 22.5%; ஆனா பங்கு விலை லாபத்துக்கு ~160 மடங்கு — ஒவ்வொரு காலாண்டும் டெலிவர் பண்ணியே ஆகணும்.")];

    s+='<rect x="'+(x-6)+'" y="'+(top-8)+'" width="'+(w+12)+'" height="10" fill="#f3dcbf"/>';

function animTemple(){var el=document.querySelectorAll('.tfill');el.forEach(function(r,i){var h=+r.dataset.h,y0=+r.getAttribute('y'),st=null;
  function step(ts){if(!st)st=ts;var k=Math.min(1,(ts-st)/1100);var e=1-Math.pow(1-k,3);r.setAttribute('height',h*e);r.setAttribute('y',y0-h*e);if(k<1)requestAnimationFrame(step);else document.querySelectorAll('.tcirc').forEach(function(c){c.setAttribute('opacity',1)})}
  setTimeout(function(){requestAnimationFrame(step)},i*120)})}
function pillarGo(k){var el=$('pc-'+k);el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl')}

 {id:'h1',x:215,y:40,w:175,c:'#0e9488',a:T("India stores","இந்திய ஸ்டோர்கள்"),b:T("2,868 · 665 cities · +143","2,868 · 665 நகரம் · +143"),
  e:T("2,868 stores across 665 cities; 143 net new in Q2, of which 94 in Tier-2+ towns, and 61 new cities entered. Each store runs an eye test first — the test is the hook that leads to a sale.","665 நகரங்கள்ல 2,868 ஸ்டோர்; Q2-ல நிகரமா 143 புதுசு, அதுல 94 Tier-2+ ஊர்கள்ல, 61 புது நகரங்கள். ஒவ்வொரு ஸ்டோர்லயும் முதல்ல கண் டெஸ்ட் — அதுதான் விற்பனைக்கான தூண்டில்.")},
 {id:'h2',x:215,y:150,w:175,c:'#0e9488',a:T("Remote optometry","ரிமோட் ஆப்டோமெட்ரி"),b:T("934 stores (303 a year ago)","934 ஸ்டோர் (போன வருஷம் 303)"),
  e:T("An optometrist sitting in a central hub tests the customer's eyes over video in the store. This lets small-town stores run without a full-time optometrist — a big cost and hiring advantage.","மைய அலுவலகத்துல இருக்கிற optometrist, வீடியோ மூலமா ஸ்டோர்ல இருக்கிற வாடிக்கையாளருக்கு கண் டெஸ்ட் பண்றாரு. சின்ன ஊர் ஸ்டோர்களுக்கு முழுநேர optometrist தேவையில்ல — செலவும் குறைவு, ஆள் தேடவும் வேண்டாம்.")},
 {id:'h3',x:215,y:260,w:175,c:'#0e9488',a:T("International stores","வெளிநாட்டு ஸ்டோர்கள்"),b:T("756 · +22 in Q2","756 · Q2-ல +22"),
  e:T("756 stores abroad; 22 net new in Q2 (12 South-East Asia, 3 Middle East, 2 Japan, 5 others). Growth abroad is slower in store count but higher in revenue per store.","வெளிநாட்டுல 756 ஸ்டோர்; Q2-ல +22 (12 தென்கிழக்கு ஆசியா, 3 மத்திய கிழக்கு, 2 ஜப்பான், 5 மற்றவை). ஸ்டோர் எண்ணிக்கை மெதுவா ஏறும், ஆனா ஒரு ஸ்டோருக்கு வருவாய் அதிகம்.")},
 {id:'h4',x:215,y:370,w:175,c:'#0e9488',a:T("Website & app","வெப்சைட் & ஆப்"),b:T("3D try-on, AI support","3D ட்ரை-ஆன், AI உதவி"),
  e:T("The digital layer: virtual try-on, prescription storage, membership, AI-based customer service. Management says AI is now used in service, staff training, inventory planning and manufacturing.","டிஜிட்டல் அடுக்கு: virtual try-on, பவர் விவரம் சேமிப்பு, membership, AI வாடிக்கையாளர் சேவை. சேவை, ஊழியர் பயிற்சி, ஸ்டாக் திட்டம், உற்பத்தி எல்லாத்துலயும் AI பயன்படுத்துறாங்க.")},
 {id:'core',x:415,y:120,w:190,h:240,c:'#e8730c',a:T("LENSKART","LENSKART"),b:T("Design → Make → Sell","டிசைன் → தயாரிப்பு → விற்பனை"),
  e:T("The moat is vertical integration: Lenskart designs its own brands, makes a growing share of frames and lenses in its own plants (India, China, Thailand), runs its own stores and its own technology. Nomura estimates this gives a cost structure 35–40% below the industry average.","இதுதான் கோட்டை (moat): சொந்த பிராண்ட் டிசைன், சொந்த ஃபேக்டரில (இந்தியா, சீனா, தாய்லாந்து) ஃப்ரேம் & லென்ஸ் தயாரிப்பு, சொந்த ஸ்டோர், சொந்த டெக்னாலஜி. இதனால செலவு, மற்றவங்களை விட 35–40% குறைவுன்னு Nomura கணிப்பு.")},
 {id:'s1',x:635,y:30,w:205,c:'#7c4dbd',a:T("India ₹1,668 cr · +35.3%","இந்தியா ₹1,668 கோடி · +35.3%"),b:T("58.6% share · pre-Ind AS 16.0%","58.6% பங்கு · margin 16.0%"),
  e:T("India revenue ₹1,668 cr (+35.3%); 86 lakh eyewear units (+26.5%); 70 lakh eye tests (+44.1%). EBITDA ₹362 cr (21.7%); after rent (pre-Ind AS 116) ₹267 cr, 16.0% margin vs 13.4%.","இந்திய வருவாய் ₹1,668 கோடி (+35.3%); 86 லட்சம் கண்ணாடி (+26.5%); 70 லட்சம் கண் டெஸ்ட் (+44.1%). EBITDA ₹362 கோடி (21.7%); வாடகை கழிச்சு ₹267 கோடி, margin 13.4%-ல இருந்து 16.0%.")},
 {id:'s2',x:635,y:130,w:205,c:'#7c4dbd',a:T("International ₹1,201 cr · +29.5%","வெளிநாடு ₹1,201 கோடி · +29.5%"),b:T("cc ~23% · pre-Ind AS 10.6%","கரன்சி மாற்றம் தவிர ~23% · 10.6%"),
  e:T("International revenue ₹1,201 cr (+29.5%; ~23% in constant currency, so a weaker rupee added ~6 points). Pre-Ind AS EBITDA ₹127 cr (+86.8%), margin 10.6% vs 7.3%.","வெளிநாட்டு வருவாய் ₹1,201 கோடி (+29.5%; கரன்சி மாற்றம் தவிர ~23% — ரூபாய் வீழ்ச்சி ~6 புள்ளி சேர்த்தது). வாடகை கழிச்ச EBITDA ₹127 கோடி (+86.8%), margin 7.3%-ல இருந்து 10.6%.")},
 {id:'s3',x:635,y:230,w:205,c:'#7c4dbd',a:T("In-house manufacturing","சொந்த தயாரிப்பு"),b:T("Frames 36 L +71.7% · Lenses 20 L +52.2%","ஃப்ரேம் 36 லட்சம் · லென்ஸ் 20 லட்சம்"),
  e:T("Q2 in-house output: 36 lakh frames (+71.7%) and 20 lakh lenses (+52.2%). Roughly a third of units sold now use an in-house frame†. Every unit moved in-house protects the 70% product margin against a weak rupee.","Q2 சொந்த உற்பத்தி: 36 லட்சம் ஃப்ரேம் (+71.7%), 20 லட்சம் லென்ஸ் (+52.2%). விக்கிற கண்ணாடில சுமார் 3-ல ஒண்ணு சொந்த ஃப்ரேம்†. உள்ளேயே தயாரிக்கிற ஒவ்வொரு யூனிட்டும் ரூபாய் வீழ்ந்தாலும் 70% product margin-ஐ காப்பாத்துது.")},
 {id:'s4',x:635,y:330,w:205,c:'#7c4dbd',a:T("Eye tests · 80 L","கண் டெஸ்ட் · 80 லட்சம்"),b:T("+40.4% — the funnel opener","+40.4% — விற்பனையின் வாசல்"),
  e:T("80 lakh eye tests globally in Q2 (+40.4%), growing faster than units sold (+27.1%). Tests today become purchases tomorrow, so this is a leading indicator to watch.","Q2-ல உலகளவுல 80 லட்சம் கண் டெஸ்ட் (+40.4%) — விற்பனையை (+27.1%) விட வேகமா வளருது. இன்னைக்கு டெஸ்ட், நாளைக்கு விற்பனை — அதனால இதை முன்னோடி அளவீடா கவனிக்கணும்.")},
 {id:'s5',x:635,y:430,w:205,c:'#7c4dbd',a:T("New bets","புது முயற்சிகள்"),b:T("B smart glasses · acquisitions","B ஸ்மார்ட் கண்ணாடி · கையகப்படுத்தல்"),
  e:T("B by Lenskart AI smart glasses (prescription-ready) in 500+ stores and online. H1 M&A spend ₹82 cr: Owndays stake ₹52.5 cr, Dimension NXG (Ajna) ₹15.5 cr, Thai JV ₹7.1 cr, Le-Petit Lunetier ₹5.6 cr, Visionsure ₹1.5 cr.","B by Lenskart AI ஸ்மார்ட் கண்ணாடி (பவர் லென்ஸ் போடலாம்) 500+ ஸ்டோர் & ஆன்லைன்ல. H1-ல கையகப்படுத்தல் செலவு ₹82 கோடி: Owndays பங்கு ₹52.5, Dimension NXG (Ajna) ₹15.5, தாய் JV ₹7.1, Le-Petit Lunetier ₹5.6, Visionsure ₹1.5 கோடி.")},
 {id:'r1',x:875,y:40,w:205,c:'#1f9d55',a:T("Revenue ₹2,845 cr","வருவாய் ₹2,845 கோடி"),b:T("+32.5% · TTM ₹10,000 cr+","+32.5% · 12 மாசம் ₹10,000 கோடி+"),
  e:T("Consolidated revenue ₹2,845 cr (+32.5% pro forma, +35.7% reported). Trailing-12-month revenue has crossed ₹10,000 cr.","Consolidated வருவாய் ₹2,845 கோடி (pro forma +32.5%, ரிப்போர்ட் +35.7%). கடந்த 12 மாச வருவாய் ₹10,000 கோடியைத் தாண்டிடுச்சு.")},
 {id:'r2',x:875,y:160,w:205,c:'#d64545',a:T("Costs","செலவுகள்"),b:T("Product ~30% · staff · rent · other","பொருள் ~30% · சம்பளம் · வாடகை · இதர"),
  e:T("Product cost is only ~30% of revenue (product margin 70.0%). The big costs are people (India 18.0% of revenue), store rent (India 5.7%) and other overheads such as marketing, logistics and technology.","பொருள் செலவு வருவாயில ~30% தான் (product margin 70.0%). பெரிய செலவு — ஆட்கள் (இந்தியா 18.0%), ஸ்டோர் வாடகை (இந்தியா 5.7%), மற்றும் விளம்பரம், லாஜிஸ்டிக்ஸ், டெக்னாலஜி போன்றவை.")},
 {id:'r3',x:875,y:280,w:205,c:'#1f9d55',a:T("EBITDA ₹624 cr · 21.9%","EBITDA ₹624 கோடி · 21.9%"),b:T("After rent: ₹392 cr · 13.8%","வாடகை கழிச்சு: ₹392 கோடி · 13.8%"),
  e:T("Reported EBITDA ₹624 cr (21.9%). Under Ind AS 116 store rent is not counted in EBITDA, so CB Research also tracks pre-Ind AS 116 EBITDA ₹392 cr (13.8%) — the number closest to cash profit from operations.","ரிப்போர்ட் EBITDA ₹624 கோடி (21.9%). Ind AS 116 விதிப்படி ஸ்டோர் வாடகை EBITDA-ல கழிக்கப்படுறதில்ல; அதனால வாடகை கழிச்ச EBITDA ₹392 கோடி (13.8%) — உண்மையான பணலாபத்துக்கு நெருக்கமான எண்.")},
 {id:'r4',x:875,y:400,w:205,c:'#e8730c',a:T("PAT ₹232 cr → shareholders","லாபம் ₹232 கோடி → பங்குதாரர்"),b:T("Cash ₹3,855 cr · ROCE 22.5%","கேஷ் ₹3,855 கோடி · ROCE 22.5%"),
  e:T("Profit after tax ₹232 cr (8.2% margin). No dividend; cash of ₹3,855 cr is kept for stores, factories and acquisitions. ROCE improved to 22.5% in H1 FY27 from 14.6% in FY26.","வரிக்குப் பின் லாபம் ₹232 கோடி (8.2%). டிவிடெண்ட் இல்ல; ₹3,855 கோடி கேஷ் ஸ்டோர், ஃபேக்டரி, கையகப்படுத்தலுக்கு. ROCE FY26-ல 14.6%-ல இருந்து H1 FY27-ல 22.5%.")}
];

      var ls=[T("Own brands","சொந்த பிராண்ட்"),T("Own factories","சொந்த ஃபேக்டரி"),T("Own stores","சொந்த ஸ்டோர்"),T("Own tech & AI","சொந்த டெக் & AI")];ls.forEach(function(l,i){s+='<text x="'+(b.x+b.w/2)+'" y="'+(b.y+135+i*22)+'" text-anchor="middle" font-size="12.5" fill="#fff">✓ '+t(l)+'</text>'})}
    else{s+='<foreignObject x="'+(b.x+6)+'" y="'+(b.y+6)+'" width="'+(b.w-12)+'" height="'+(hh-12)+'"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12.5px;line-height:1.3;color:#2b2118"><b style="color:'+b.c+'">'+t(b.a)+'</b><br/>'+t(b.b)+'</div></foreignObject>'}

<script>

var MET=[
 {n:"SSSG",v:"20.8%",tg:'g',e:T("Same-Store Sales Growth: sales growth only from India stores open for over a year. 20.8% vs 14.8% a year ago — old stores are getting busier, not just more stores being added.","Same-Store Sales Growth: ஒரு வருஷத்துக்கு மேல திறந்திருக்கிற இந்திய ஸ்டோர்களோட விற்பனை வளர்ச்சி மட்டும். போன வருஷம் 14.8%, இப்ப 20.8% — பழைய ஸ்டோர்களே இன்னும் பிஸியாகுது.")},
 {n:"SPSG",v:"27.1%",tg:'g',e:T("Same-PIN-code Sales Growth: growth in an area (PIN code) including new stores opened nearby. Because SPSG (27.1%) is well above SSSG (20.8%), a new store adds demand rather than cannibalising the older one.","Same-PIN-code Sales Growth: ஒரு PIN code பகுதியில மொத்த வளர்ச்சி — பக்கத்துல திறந்த புது ஸ்டோரையும் சேர்த்து. SPSG (27.1%) SSSG-ஐ (20.8%) விட அதிகம்னா, புது ஸ்டோர் பழைய ஸ்டோர் விற்பனையைச் சாப்பிடல, புதுசா demand சேர்க்குது.")},
 {n:"ASP",v:"₹1,865",tg:'a',e:T("Average Selling Price per eyewear unit in India — last disclosed ₹1,865 in Q4 FY26 (+15.9%). Q2 FY27 revenue per unit works out to ~₹1,940† (includes non-eyewear items). Rising ASP = premiumisation.","இந்தியாவுல ஒரு கண்ணாடிக்கு சராசரி விலை — கடைசியா Q4 FY26-ல ₹1,865 (+15.9%). Q2 FY27-ல யூனிட்டுக்கு வருவாய் ~₹1,940†. ASP ஏறுதுன்னா வாடிக்கையாளர் விலை உயர்ந்த பொருள் வாங்குறாங்க.")},
 {n:"Gold",v:"1.03 cr",tg:'g',e:T("Active paid members in India, +38.6% YoY. A membership base is a new-age metric because it signals repeat buying and lower marketing cost per sale.","இந்தியாவுல கட்டண உறுப்பினர்கள், YoY +38.6%. உறுப்பினர் எண்ணிக்கை நியூ-ஏஜ் அளவீடு — திரும்ப வாங்குவாங்க, ஒரு விற்பனைக்கான விளம்பரச் செலவு குறையும்.")},
 {n:"NPS",v:"79.6",tg:'g',e:T("Net Promoter Score (India): % of customers who would recommend minus % who would not. 79.6 in Q2 FY27 (69.8 in FY23) — very high for retail.","Net Promoter Score (இந்தியா): பரிந்துரைப்பவர் % கழித்தல் பரிந்துரைக்காதவர் %. Q2 FY27-ல 79.6 (FY23-ல 69.8) — ரீட்டெய்ல்ல இது ரொம்ப அதிகம்.")},
 {n:"Rule of 40",v:"46.3",tg:'g',e:T("Revenue growth % + profit margin % (here pre-Ind AS EBITDA). 32.5 + 13.8 = 46.3†. Above 40 means growth is not being bought with losses.","வருவாய் வளர்ச்சி % + லாப margin % (இங்க வாடகை கழிச்ச EBITDA). 32.5 + 13.8 = 46.3†. 40-க்கு மேல இருந்தா நஷ்டத்துல வளர்ச்சி வாங்கல-ன்னு அர்த்தம்.")},
 {n:T("Operating leverage","Operating leverage"),v:"2.0x",tg:'g',e:T("Pre-Ind AS EBITDA growth ÷ revenue growth = 65.0 ÷ 32.5 = 2.0x†. Every 1% of extra sales produced about 2% extra operating profit.","வாடகை கழிச்ச EBITDA வளர்ச்சி ÷ வருவாய் வளர்ச்சி = 65.0 ÷ 32.5 = 2.0x†. விற்பனை 1% கூடினா operating லாபம் சுமார் 2% கூடுது.")},
 {n:T("Incremental margin","கூடுதல் margin"),v:"22.2%",tg:'g',e:T("Extra pre-Ind AS EBITDA ÷ extra revenue YoY = (392−237) ÷ (2,845−2,147) = 22.2%†, well above the 13.8% average margin — so margins should keep rising if growth holds.","கூடுதல் EBITDA ÷ கூடுதல் வருவாய் = (392−237) ÷ (2,845−2,147) = 22.2%†. சராசரி margin 13.8%-ஐ விட அதிகம் — வளர்ச்சி தொடர்ந்தா margin இன்னும் ஏறும்.")},
 {n:T("Cash conversion","கேஷ் மாற்றம்"),v:"51.5%",tg:'a',e:T("H1 operating cash flow ÷ pre-Ind AS EBITDA = 388 ÷ 753 = 51.5%†. Lower than ideal because ₹238 cr went into working capital (inventory for new stores) and ₹148 cr into tax.","H1 operating cash flow ÷ வாடகை கழிச்ச EBITDA = 388 ÷ 753 = 51.5%†. ₹238 கோடி working capital-க்கு (புது ஸ்டோர் ஸ்டாக்), ₹148 கோடி வரிக்குப் போனதால குறைவா இருக்கு.")},
 {n:"ROCE",v:"22.5%",tg:'g',e:T("Return on capital employed, H1 FY27: 22.5% vs 14.6% in FY26 and −0.5% in FY23. The capital already put into stores and plants is now earning well.","H1 FY27 ROCE 22.5% — FY26-ல 14.6%, FY23-ல −0.5%. ஸ்டோர், ஃபேக்டரில போட்ட மூலதனம் இப்ப நல்லா சம்பாதிக்குது.")},
 {n:T("Remote optometry","ரிமோட் ஆப்டோமெட்ரி"),v:"934",tg:'g',e:T("Stores using video-based eye tests: 934 vs 303 a year ago. A tech lever that makes small-town stores viable.","வீடியோ கண் டெஸ்ட் உள்ள ஸ்டோர்: போன வருஷம் 303, இப்ப 934. சின்ன ஊர் ஸ்டோர்களை லாபகரமாக்கும் டெக் கருவி.")},
 {n:T("In-house frame share","சொந்த ஃப்ரேம் பங்கு"),v:"~34%†",tg:'a',e:T("36 lakh in-house frames ÷ ~1.07 crore eyewear units (India 86 L + international 20.6 L) ≈ 34%†. Rising share = more of the margin kept inside.","36 லட்சம் சொந்த ஃப்ரேம் ÷ ~1.07 கோடி யூனிட் (இந்தியா 86 லட்சம் + வெளிநாடு 20.6 லட்சம்) ≈ 34%†. இந்தப் பங்கு ஏறினா margin உள்ளேயே தங்கும்.")}

    '<svg viewBox="0 0 420 260" style="width:100%"><line x1="40" y1="220" x2="400" y2="220" stroke="#caa"/>'+

function calcPB(){var cap=+$('pbCap').value,rev=+$('pbRev').value,m=+$('pbM').value,ramp=+$('pbRamp').value;
  $('pbCapo').textContent='₹'+cap+' L';$('pbRevo').textContent='₹'+rev.toFixed(1)+' cr';$('pbMo').textContent=m+'%';$('pbRampo').textContent=ramp+'%';
  var mat=rev*100*m/100; // ₹ lakh / yr
  var cum=-cap,yrs=[],py=null;for(var y=1;y<=5;y++){var f=y===1?ramp/100:(y===2?Math.min(1,(ramp/100+1)/2):1);var pr=mat*f;var prev=cum;cum+=pr;yrs.push(cum);if(py===null&&cum>=0)py=y-1+(-prev)/pr}
  $('pbY').textContent=py===null?'>5 '+t(T("yrs","வருஷம்")):f1(py)+' '+t(T("yrs","வருஷம்"));$('pbP').textContent='₹'+f1(mat)+' L';$('pbR').textContent=f0(mat/cap*100)+'%';
  var s='<line x1="40" y1="90" x2="880" y2="90" stroke="#999" stroke-dasharray="4"/>',mx=Math.max(cap,Math.abs(yrs[4]))||1,pts=[[60,90+cap/mx*70]];

  yrs.forEach(function(v,i){pts.push([60+(i+1)*160,90-v/mx*70])});
  s+='<polyline points="'+pts.map(function(p){return p.join(',')}).join(' ')+'" fill="none" stroke="#e8730c" stroke-width="3"/>';

function confirmClear(){scSave({t:{},own:[]});return true}
function scTick(id,v){var d=scLoad();d.t[id]=v;scSave(d);scProg()}
function scAdd(txt){var d=scLoad();txt=txt||$('scNew').value.trim();if(!txt||d.own.length>=8)return;d.own.push({x:txt,c:false});scSave(d);if($('scNew'))$('scNew').value='';scOwn();scProg()}
function scOwn(){var d=scLoad();$('scOwn').innerHTML=d.own.map(function(o,i){return '<label class="chk"><input type="checkbox" '+(o.c?'checked':'')+' onchange="scOT('+i+',this.checked)"><span>'+o.x.replace(/</g,'&lt;')+'</span><span style="margin-left:auto;cursor:pointer;color:#d64545" onclick="scDel('+i+')">✕</span></label>'}).join('')||'<div class="note">—</div>'}
function scOT(i,v){var d=scLoad();d.own[i].c=v;scSave(d);scProg()}
function scDel(i){var d=scLoad();d.own.splice(i,1);scSave(d);scOwn();scProg()}
function scProg(){var d=scLoad(),tot=0,on=0;SCG.forEach(function(g,gi){var n=g[1].length,c=0;g[1].forEach(function(x,ii){if(d.t[gi+'_'+ii])c++});tot+=n;on+=c;$('scP'+gi).style.width=(c/n*100)+'%';$('scT'+gi).textContent='('+c+'/'+n+')'});
  var on2=d.own.filter(function(o){return o.c}).length;tot+=d.own.length;on+=on2;$('scP4').style.width=(d.own.length?on2/d.own.length*100:0)+'%';$('scT4').textContent='('+on2+'/'+d.own.length+')';
  $('scAll').style.width=(tot?on/tot*100:0)+'%';$('scAllT').textContent=on+' / '+tot+' '+t(T("conditions line up","நிபந்தனைகள் பொருந்துது"))}

function kbSmart(q){
  if(/buy|sell|hold|invest|வாங்க|விக்க|முதலீடு செய்ய/.test(q))return {a:T("CB Research does not give buy, sell or hold advice. The Self-check tab lets you test your own conditions against the facts.","CB Research வாங்கு, விக்கு, வெச்சுக்கோன்னு ஆலோசனை தர்றதில்ல. Self-check tab-ல உங்க சொந்த நிபந்தனைகளை உண்மைகளோட ஒப்பிட்டுப் பாருங்க."),btn:'sc'};
  if(/compar|better|which segment|india vs|ஒப்பி|எது அதிக|பிரிவு/.test(q))return {a:T("Comparing segments: India grew faster (+35.3% vs +29.5%) and earns a higher after-rent margin (16.0% vs 10.6%), but international's margin improved more (+330 bps vs +260 bps). International revenue per unit is ~3x India's.","பிரிவு ஒப்பீடு: இந்தியா வேகமா வளர்ந்தது (+35.3% vs +29.5%), margin-உம் அதிகம் (16.0% vs 10.6%); ஆனா வெளிநாட்டு margin அதிகமா முன்னேறுச்சு (+330 vs +260 bps). வெளிநாட்டுல யூனிட்டுக்கு வருவாய் இந்தியாவை விட ~3 மடங்கு.")};
  if(/rank|strong|weak|pillar|score|தூண்|பலம்|பலவீன|மதிப்பெண்/.test(q)){var r=CO.pillars.slice().sort(function(a,b){return b.s-a.s});return {a:{en:'Pillar ranking (out of 10): '+r.map(function(x){return PIL[x.k].n.en+' '+x.s}).join(' > ')+'. CB Score '+CO.cbScore+'/100. Strongest: growth & balance sheet; weakest: valuation.',ta:'தூண் தரவரிசை (10-க்கு): '+r.map(function(x){return PIL[x.k].n.ta+' '+x.s}).join(' > ')+'. CB Score '+CO.cbScore+'/100. பலம்: வளர்ச்சி & பேலன்ஸ் ஷீட்; பலவீனம்: மதிப்பீடு.'}}}
  var best=null,bs=0;KB.forEach(function(e){var s=0;e.k.forEach(function(k){if(q.indexOf(k)>=0)s+=k.length});if(s>bs){bs=s;best=e}});
  return best?{a:best.a}:{a:T("I can answer on revenue, profit, EBITDA, SSSG, stores, Gold members, international, manufacturing, cash, working capital, valuation, analysts, risks, cycle, triggers, management and the IPO. Try one of the suggestions.","வருவாய், லாபம், EBITDA, SSSG, ஸ்டோர், Gold, வெளிநாடு, உற்பத்தி, கேஷ், working capital, மதிப்பீடு, அனலிஸ்ட், ரிஸ்க், சைக்கிள், ட்ரிகர், நிர்வாகம், IPO பற்றிக் கேளுங்க.")}}
function toggleAssist(){var b=$('asBox');b.classList.toggle('on');if(b.classList.contains('on')&&!$('asLog').innerHTML)addMsg('b',t(T("Hello! Ask me anything about Lenskart's Q2 FY27 — type or tap 🎤 and speak.","வணக்கம்! Lenskart Q2 FY27 பத்தி எதுனாலும் கேளுங்க — டைப் பண்ணுங்க இல்லன்னா 🎤 அழுத்திப் பேசுங்க.")))}
function addMsg(w,x,btn){var d=document.createElement('div');d.className='msg '+w;d.innerHTML=x+(btn?'<div><button class="btn" style="margin-top:6px;padding:5px 10px" onclick="showTab(\'sc\');toggleAssist()">'+t(T("Open Self-check","Self-check திற"))+'</button></div>':'');$('asLog').appendChild(d);$('asLog').scrollTop=1e6}
function askAssist(qq){var q=(qq||$('asQ').value).trim();if(!q)return;addMsg('u',q.replace(/</g,'&lt;'));$('asQ').value='';var r=kbSmart(q.toLowerCase());var ans=t(r.a);addMsg('b',ans,r.btn);speak(ans)}
function speak(x){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x.replace(/<[^>]+>/g,'').replace(/†/g,'').replace(/₹/g,L==='ta'?'ரூபாய் ':'rupees '));u.lang=L==='ta'?'ta-IN':'en-IN';u.rate=1;var v=speechSynthesis.getVoices().filter(function(v){return v.lang===u.lang})[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
var REC=null;
function voiceAsk(){var S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){addMsg('b',t(T("Voice input isn't supported in this browser — please type your question (Chrome works best).","இந்த browser-ல குரல் உள்ளீடு இல்ல — டைப் பண்ணுங்க (Chrome சிறந்தது).")));return}
  if(REC){REC.stop();return}REC=new S();REC.lang=L==='ta'?'ta-IN':'en-IN';REC.interimResults=false;$('asMic').classList.add('rec');
  REC.onresult=function(e){askAssist(e.results[0][0].transcript)};REC.onend=function(){$('asMic').classList.remove('rec');REC=null};REC.onerror=function(){$('asMic').classList.remove('rec');REC=null};REC.start()}
function asSug(){var s=L==='ta'?["லாபம் எவ்வளவு?","SSSG என்ன?","மதிப்பீடு அதிகமா?","எந்த பிரிவு சிறந்தது?","ரிஸ்க் என்ன?","வாங்கலாமா?"]:["What was profit?","Explain SSSG","Is it expensive?","Compare India vs international","Rank the pillars","Should I buy?"];
  $('asSug').innerHTML=s.map(function(x){return '<button onclick="askAssist(\''+x+'\')">'+x+'</button>'}).join('');$('asQ').placeholder=t(T("Ask by text or voice…","டைப் பண்ணுங்க இல்லன்னா பேசுங்க…"));$('asSub').textContent=t(T("voice Q&A","குரல் கேள்வி-பதில்"))}
