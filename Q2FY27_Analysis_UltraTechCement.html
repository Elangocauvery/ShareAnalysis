var CS = {
 title:{en:"Cement School — how cement is made, and what it costs",ta:"சிமெண்ட் பள்ளி — சிமெண்ட் எப்படி தயாராகுது, அதுக்கு என்ன செலவு"},
 flowTitle:{en:"From limestone to bag — tap each step",ta:"சுண்ணாம்புக்கல்லில் இருந்து மூட்டை வரை — ஒவ்வொரு படியையும் தொடுங்க"},
 steps:[
  {id:"q",ic:"⛏",t:{en:"Limestone quarry",ta:"சுண்ணாம்புக்கல் சுரங்கம்"},s:{en:"~1.5 t per t clinker",ta:"கிளிங்கர் டன்னுக்கு ~1.5 டன்"},
   x:{en:"Limestone (calcium carbonate) is the main raw material — roughly 1.4–1.5 tonnes per tonne of clinker. Plants sit on captive mines, so limestone itself is cheap; the cost is in mining diesel, explosives, royalty and state levies (e.g. Tamil Nadu's ₹160/t levy, already absorbed in Q2).",
      ta:"சுண்ணாம்புக்கல் (கால்சியம் கார்பனேட்) தான் முக்கிய மூலப்பொருள் — ஒரு டன் கிளிங்கருக்கு சுமார் 1.4–1.5 டன். ஆலைகள் சொந்த சுரங்கத்து மேலயே இருக்கும், அதனால கல் மலிவு; செலவு டீசல், வெடிமருந்து, ராயல்டி, மாநில வரில தான் (உதா. தமிழ்நாடு ₹160/டன், Q2-லயே சேர்த்தாச்சு)."}},
  {id:"rm",ic:"⚙",t:{en:"Crusher & raw mill",ta:"கிரஷர் & ரா மில்"},s:{en:"+ clay, laterite, iron ore",ta:"+ களிமண், லேட்டரைட், இரும்புத்தாது"},
   x:{en:"Limestone is crushed and ground with small 'correctives' — clay/laterite for silica and alumina, iron ore for iron — into a fine 'raw meal' with the right chemistry.",
      ta:"சுண்ணாம்புக்கல்லை நொறுக்கி, களிமண்/லேட்டரைட் (சிலிகா, அலுமினா), இரும்புத்தாது சேர்த்து நைசா அரைச்சு 'ரா மீல்' தயாரிப்பாங்க."}},
  {id:"k",ic:"🔥",t:{en:"Preheater & kiln",ta:"ப்ரீஹீட்டர் & சூளை"},s:{en:"~1,450°C · petcoke/coal",ta:"~1,450°C · பெட்கோக்/நிலக்கரி"},
   x:{en:"Raw meal passes a preheater tower and a rotary kiln at about 1,450°C. This is where fuel (imported petcoke, coal, alternative fuels) is burnt — the single most energy-hungry step and why fuel is ~30% of cement cost. Waste heat recovery (WHRS, 444 MW at UltraTech) turns exhaust heat into power.",
      ta:"ரா மீல் ப்ரீஹீட்டர் டவர், சுழலும் சூளை வழியா சுமார் 1,450°C-ல சூடாகும். இங்க தான் எரிபொருள் (பெட்கோக், நிலக்கரி, மாற்று எரிபொருள்) எரியும் — அதிக ஆற்றல் தேவைப்படுற படி, சிமெண்ட் செலவுல சுமார் 30% எரிபொருள் தான். கழிவு வெப்பத்துல இருந்து மின்சாரம் (WHRS, அல்ட்ராடெக்ல 444 MW)."}},
  {id:"c",ic:"⚫",t:{en:"Clinker",ta:"கிளிங்கர்"},s:{en:"The 'heart' of cement",ta:"சிமெண்டோட 'இதயம்'"},
   x:{en:"The kiln output is clinker — hard grey nodules. Clinker is the costly, carbon-heavy part. The less clinker per tonne of cement (lower 'clinker factor'), the cheaper and greener the cement. Clinker can be stored and shipped by rail to distant grinding units.",
      ta:"சூளைல இருந்து வர்றது கிளிங்கர் — கடினமான சாம்பல் நிற உருண்டைகள். செலவும் கார்பனும் அதிகமான பகுதி இது. ஒரு டன் சிமெண்ட்ல கிளிங்கர் குறைவா இருந்தா ('கிளிங்கர் ஃபேக்டர்'), செலவும் கார்பனும் குறையும். கிளிங்கரை ரயில்ல தூர இருக்கிற அரைக்கும் யூனிட்டுக்கு அனுப்பலாம்."}},
  {id:"g",ic:"🌀",t:{en:"Grinding unit",ta:"அரைக்கும் யூனிட்"},s:{en:"+ gypsum, fly ash, slag",ta:"+ ஜிப்சம், ஃப்ளை ஆஷ், ஸ்லாக்"},
   x:{en:"Clinker is ground with ~4–5% gypsum (controls setting time) plus fly ash or slag for blended cements. Grinding units can sit next to markets, thermal power plants (fly ash) or steel plants (slag) — UltraTech adds slag grinding capacity at Visakhapatnam, Patratu and Nathdwara.",
      ta:"கிளிங்கரோட சுமார் 4–5% ஜிப்சம் (கெட்டியாகுற நேரத்தை கட்டுப்படுத்தும்), பிளெண்டட் சிமெண்டுக்கு ஃப்ளை ஆஷ் அல்லது ஸ்லாக் சேர்த்து அரைப்பாங்க. அரைக்கும் யூனிட்டை சந்தை, அனல் மின் நிலையம் (ஃப்ளை ஆஷ்), எஃகு ஆலை (ஸ்லாக்) பக்கத்துல வைக்கலாம் — விசாகப்பட்டினம், பத்ராது, நாத்துவாராவுல அல்ட்ராடெக் ஸ்லாக் யூனிட் சேர்க்குது."}},
  {id:"p",ic:"🛍",t:{en:"Packing",ta:"பேக்கிங்"},s:{en:"50 kg PP bags",ta:"50 கிலோ PP பை"},
   x:{en:"Cement is packed in 50 kg polypropylene bags (20 bags = 1 tonne). Bag material is crude-oil linked — packing cost jumped 30% YoY to ₹216/t in Q2 (Q1: ₹9 → ₹12 per bag).",
      ta:"50 கிலோ பாலிப்ரொப்பிலீன் பைல பேக் பண்ணுவாங்க (20 பை = 1 டன்). பை மூலப்பொருள் கச்சா எண்ணெய் சார்ந்தது — Q2-ல பை செலவு 30% ஏறி ₹216/டன் (Q1-ல பைக்கு ₹9 → ₹12)."}},
  {id:"d",ic:"🚚",t:{en:"Dispatch",ta:"அனுப்புதல்"},s:{en:"Rail · road · sea",ta:"ரயில் · சாலை · கடல்"},
   x:{en:"Logistics is the largest cost (~33%, ₹1,136/t). Cement is heavy and cheap per kg, so plants near markets win. UltraTech cut lead distance by 8 km YoY and is adding 600+ electric trucks by Dec-26.",
      ta:"போக்குவரத்து தான் பெரிய செலவு (சுமார் 33%, ₹1,136/டன்). சிமெண்ட் கனமானது, கிலோவுக்கு மலிவு — அதனால சந்தை பக்கத்து ஆலை தான் ஜெயிக்கும். அல்ட்ராடெக் லாரி தூரத்தை 8 கி.மீ குறைச்சுது, டிச-26-க்குள் 600+ மின்சார லாரிகள்."}}
 ],
 ivg:{t:{en:"Integrated plant vs split grinding unit",ta:"ஒருங்கிணைந்த ஆலை vs தனி அரைக்கும் யூனிட்"},
  a:{t:{en:"Integrated plant",ta:"ஒருங்கிணைந்த ஆலை"},l:[{en:"Mine + kiln + grinding at one site",ta:"சுரங்கம் + சூளை + அரைத்தல் ஒரே இடத்துல"},{en:"Needs limestone deposits — often far from cities",ta:"சுண்ணாம்புக்கல் இருக்கிற இடத்துல — பெரும்பாலும் நகரத்துக்கு தூரம்"},{en:"Higher capex; long approvals (mining, environment)",ta:"அதிக முதலீடு; நீண்ட அனுமதி"},{en:"Example: Petnikota, AP — 3.6 MTPA greenfield integrated, commissioned Sep-26",ta:"உதா: பெட்னிகோட்டா, ஆந்திரா — 3.6 MTPA புது ஒருங்கிணைந்த ஆலை, செப்-26"}]},
  b:{t:{en:"Split grinding unit (GU)",ta:"தனி அரைக்கும் யூனிட்"},l:[{en:"Receives clinker by rail; grinds near the market",ta:"ரயில்ல கிளிங்கர் வரும்; சந்தை பக்கத்துல அரைப்பாங்க"},{en:"Sits next to fly-ash or slag sources → cheaper blended cement",ta:"ஃப்ளை ஆஷ்/ஸ்லாக் கிடைக்கிற இடம் → மலிவான பிளெண்டட் சிமெண்ட்"},{en:"Lower capex, faster to build; cuts freight on finished cement",ta:"குறைஞ்ச முதலீடு, சீக்கிரம் கட்டலாம்; போக்குவரத்து செலவு குறையும்"},{en:"Debottlenecking/brownfield GUs added 1 MTPA in Q2",ta:"Q2-ல 1 MTPA விரிவாக்கம் மூலம் சேர்ந்துச்சு"}]}},
 cf:{t:{en:"Clinker factor — why blended cement matters",ta:"கிளிங்கர் ஃபேக்டர் — பிளெண்டட் சிமெண்ட் ஏன் முக்கியம்"},
  x:{en:"Clinker conversion = tonnes of cement ÷ tonnes of clinker. OPC is ~1.05x; PPC ~1.4x; PSC can reach ~2x. More conversion means the same kiln makes more cement, using less fuel and emitting less CO₂ per tonne. UltraTech sold 67.3% blended cement in Q2; India Cements lifted conversion to 1.55x from 1.45x a year ago.",
     ta:"கிளிங்கர் கன்வர்ஷன் = சிமெண்ட் டன் ÷ கிளிங்கர் டன். OPC சுமார் 1.05; PPC சுமார் 1.4; PSC சுமார் 2 வரை. அதிகமானா அதே சூளைல அதிக சிமெண்ட், குறைஞ்ச எரிபொருள், குறைஞ்ச CO₂. Q2-ல அல்ட்ராடெக் விற்பனைல 67.3% பிளெண்டட்; இந்தியா சிமெண்ட்ஸ் 1.45-ல இருந்து 1.55-க்கு ஏத்துச்சு."}},
 typesTitle:{en:"Types of cement — composition and use (tap a bar)",ta:"சிமெண்ட் வகைகள் — கலவை & பயன் (ஒரு பட்டையை தொடுங்க)"},
 comp:{cl:{en:"Clinker",ta:"கிளிங்கர்",c:"#5b6675"},gy:{en:"Gypsum",ta:"ஜிப்சம்",c:"#e3c16f"},fa:{en:"Fly ash",ta:"ஃப்ளை ஆஷ்",c:"#8fb3e8"},sl:{en:"Slag",ta:"ஸ்லாக்",c:"#7fc8a9"},wl:{en:"White clinker",ta:"வெள்ளை கிளிங்கர்",c:"#e6e9ee"}},
 types:[
  {n:"OPC 43/53",mix:{cl:95,gy:5},cf:"≈1.05x",std:"IS 269",
   u:{en:"Ordinary Portland Cement. High early strength — RCC slabs, columns, precast, bridges, fast-track projects. Grades 43/53 = MPa strength at 28 days.",ta:"சாதாரண போர்ட்லேண்ட் சிமெண்ட். சீக்கிரம் வலுவாகும் — RCC தளம், தூண், ப்ரீகாஸ்ட், பாலம். 43/53 = 28 நாள்ல MPa வலிமை."}},

    var r=[tx[0],'<b class="'+(t.sign==="+"?"up":"dn")+'">'+t.sign+'</b>',t.I,t.C.toFixed(1),t.W.toFixed(1),t.P.toFixed(1),'<b>'+pts.toFixed(2)+'</b>',t.st,tx[1]]; r.lcols=[8]; return r; });
  var tl=TC.tl.map(function(e,i){ return '<div class="tl-ev" style="left:'+(8+i*(84/(TC.tl.length-1)))+'%"><div class="d">'+e.d+'</div><div class="dot"></div><div>'+L(e)+'</div></div>'; }).join("");
  return '<h2>'+T("Triggers & Cycle","ட்ரிக்கர்ஸ் & சைக்கிள்")+' <span class="chip cy">CY '+cy.cy+'</span> <span class="chip tg">TG '+CO.tg+'</span></h2>'+
   '<div class="grid g2">'+card('<b>'+L(TC.cycTitle)+'</b>'+cycleSvg())+card('<b>'+T("Sector evidence","துறை ஆதாரம்")+'</b><ul style="padding-left:18px">'+TC.sectorEv.map(function(x){return '<li style="margin:4px 0">'+L(x)+'</li>';}).join("")+'</ul><div class="explain">'+L(TC.sectorRead)+'</div>')+'</div>'+
   '<h3>'+T("Stock's own cycle","பங்கோட சொந்த சைக்கிள்")+'</h3>'+table(L(TC.stockHead),srows)+'<div class="note"><b>'+L(TC.cyLine)+'</b></div>'+
   '<h3>'+T("Trigger table (points = I × C × W × P)","ட்ரிக்கர் அட்டவணை (புள்ளி = I × C × W × P)")+'</h3>'+table(L(TC.trigHead),trows)+'<div class="note"><b>'+L(TC.tgLine)+'</b></div><div class="explain" style="background:#fff6dc;border-color:#d99a06">'+L(TC.gate)+'</div>'+
   '<h3>'+L(TC.tlTitle)+'</h3><div class="tl"><div class="tl-inner"><div class="tl-line"></div>'+tl+'</div></div>'+
   '<h3>'+L(TC.change.t)+'</h3>'+card('<ul style="margin:0;padding-left:18px">'+TC.change.l.map(function(x){return '<li style="margin:4px 0">'+L(x)+'</li>';}).join("")+'</ul>');
}

/* ---------- PILLARS (temple) ---------- */
function templeSvg(){
  var P=CO.pillars, comp=P.reduce(function(a,b){return a+b.s;},0)/P.length, out=[];
  out.push('<polygon points="30,135 380,22 730,135" fill="#e8701a"/><polygon points="70,128 380,38 690,128" fill="#f08a3c"/>');
  out.push('<text x="380" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CB Score</text><text x="380" y="122" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">'+comp.toFixed(1)+' / 10</text>');
  out.push('<rect x="40" y="135" width="680" height="40" fill="#1f3b63"/><text x="380" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">UltraTech Cement · Q2 FY27</text>');
  P.forEach(function(p,i){ var x=78+i*110, w=62, top=185, h=245, c=col(p.s);
    out.push('<g class="col" data-k="'+p.k+'"><rect x="'+x+'" y="'+top+'" width="'+w+'" height="'+h+'" fill="#f1f3f7" stroke="#d5dbe5"/>');
    out.push('<rect class="fill" data-h="'+(h*p.s/10)+'" x="'+x+'" y="'+(top+h)+'" width="'+w+'" height="0" fill="'+c+'" opacity=".9"/>');
    for(var j=1;j<5;j++) out.push('<line x1="'+(x+j*w/5)+'" y1="'+top+'" x2="'+(x+j*w/5)+'" y2="'+(top+h)+'" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>');
    out.push('<rect x="'+(x-6)+'" y="'+(top-8)+'" width="'+(w+12)+'" height="10" fill="#c9d3e0"/>');
    out.push('<circle class="sc-c" cx="'+(x+w/2)+'" cy="'+(top+h-6)+'" r="19" fill="#fff" stroke="'+c+'" stroke-width="3"/><text class="sc-t" x="'+(x+w/2)+'" y="'+(top+h-1)+'" text-anchor="middle" font-size="13" font-weight="800" fill="'+c+'">'+p.s.toFixed(1)+'</text></g>'); });
  out.push('<rect x="40" y="430" width="680" height="16" fill="#c9d3e0"/><rect x="20" y="446" width="720" height="16" fill="#b5c0cf"/>');
  P.forEach(function(p,i){ out.push('<text x="'+(109+i*110)+'" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">'+esc(L(PIL.name[p.k]))+'</text>'); });
  return '<svg id="templeSvg" viewBox="0 0 760 500">'+out.join("")+'</svg>';
}
function secPil(){
  var cards=CO.pillars.map(function(p){ return '<div class="pcard" id="pc_'+p.k+'" style="border-left-color:'+col(p.s)+'"><div style="display:flex;align-items:center"><span class="sc" style="background:'+col(p.s)+'">'+p.s.toFixed(1)+'</span><b>'+L(PIL.name[p.k])+'</b></div><div style="margin-top:6px;font-size:14px">'+L(PIL.why[p.k])+'</div></div>'; }).join("");
  return '<h2>'+L(PIL.title)+'</h2><div class="temple">'+templeSvg()+'</div><div class="note" style="text-align:center">'+T("Green 8–10 · Amber 6–8 · Red below 6","பச்சை 8–10 · மஞ்சள் 6–8 · சிவப்பு 6-க்கு கீழ")+'</div>'+
   '<div class="grid g3" style="margin-top:12px">'+cards+'</div><div class="note">'+L(PIL.compNote)+'</div>';
}
POST.pil=function(){
  var fills=document.querySelectorAll("#templeSvg .fill"), t0=null;
  fills.forEach(function(r){ r.setAttribute("height",0); r.setAttribute("y",430); });
  function step(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/900), e=1-Math.pow(1-k,3);
    fills.forEach(function(r){ var h=+r.getAttribute("data-h")*e; r.setAttribute("height",h); r.setAttribute("y",430-h);
      var g=r.parentNode; var cy=430-h+ (h>30?18:-24); g.querySelector(".sc-c").setAttribute("cy",cy); g.querySelector(".sc-t").setAttribute("y",cy+5); });
    if(k<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
  document.querySelectorAll("#templeSvg .col").forEach(function(g){ g.onclick=function(){ var el=document.getElementById("pc_"+g.getAttribute("data-k")); document.querySelectorAll(".pcard").forEach(function(x){x.classList.remove("hl");}); el.classList.add("hl"); el.scrollIntoView({behavior:"smooth",block:"center"}); }; });
};

/* ---------- SWOT ---------- */

/* ---------- ANALYSTS ---------- */
function secAn(){

    var r=[a.b,'<span class="pill '+cl+'">'+a.r+'</span>',f(a.tp),'<span class="'+cls(up)+'">'+sgn(up)+'</span>',a.d,L(a.n)]; r.lcols=[5]; return r; });

   '<div class="grid" style="margin-top:12px">'+card('<b>'+L(AN.chart)+'</b>'+chartBox("cAn",true))+'</div><div class="explain" style="background:#eef4ff;border-color:#2f6fd6">'+L(AN.caveat)+'</div>';

POST.an=function(){

  mkChart("cAn",{type:"bar",data:{labels:a.map(function(x){return x.b;}),datasets:[{label:T("Target","இலக்கு"),data:a.map(function(x){return x.tp;}),backgroundColor:a.map(function(x){return x.r==="Hold"?"#d99a06":(x.r==="n/a"?"#8a8f98":"#1f9d55");})}]},

     ctx.setLineDash([6,4]); ctx.strokeStyle="#d64545"; ctx.beginPath(); ctx.moveTo(a.left,y); ctx.lineTo(a.right,y); ctx.stroke(); ctx.strokeStyle="#1f3b63"; ctx.beginPath(); ctx.moveTo(a.left,y2); ctx.lineTo(a.right,y2); ctx.stroke(); ctx.setLineDash([]);
     ctx.font="700 11px Inter"; ctx.fillStyle="#d64545"; ctx.fillText(T("Price ≈ ₹10,680","விலை ≈ ₹10,680"),a.left+6,y-5); ctx.fillStyle="#1f3b63"; ctx.fillText(T("Consensus ≈ ₹13,730","சராசரி ≈ ₹13,730"),a.right-150,y2-5); ctx.restore(); }}]});
};

/* ---------- SELF-CHECK ---------- */
var SKEY="cb_sc_ULTRACEMCO_Q2FY27";
function scLoad(){ try{ var v=JSON.parse(localStorage.getItem(SKEY)||"null"); if(v&&v.t) return v; }catch(e){} return {t:{},own:[]}; }
function scSave(v){ try{ localStorage.setItem(SKEY,JSON.stringify(v)); }catch(e){} }
var SCV=scLoad();
function secSc(){
  var h='<h2>'+L(SC.title)+'</h2><div class="note" style="margin-bottom:10px">'+L(SC.intro)+'</div><div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>'+L(SC.overall)+': <span id="scAll">0/0</span></b><div class="bar" style="flex:1;max-width:420px"><i id="scAllBar"></i></div><button class="btn" id="scClear">'+L(SC.clear)+'</button></div><div class="note">'+L(SC.msg)+'</div></div>';
  SC.groups.forEach(function(g,gi){
    h+='<div class="scg"><h4><span>'+L(g.t)+'</span><span style="display:flex;gap:8px;align-items:center"><span id="scc'+gi+'" class="note" style="margin:0"></span><span class="bar" style="width:120px"><i id="scb'+gi+'"></i></span></span></h4><div class="items">';
    if(g.own){ SCV.own.forEach(function(o,oi){ h+='<label><input type="checkbox" data-own="'+oi+'"'+(o.c?" checked":"")+'><span>'+esc(o.t)+' <a href="#" data-del="'+oi+'" style="font-size:12px">✕</a></span></label>'; });
      h+= SCV.own.length<8? '<div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="scOwn" placeholder="'+esc(L(SC.addPh))+'"><button class="btn pri" id="scAdd">'+L(SC.add)+'</button></div><div class="sugg">'+g.sugg.map(function(s){return '<button class="btn" data-sg="'+esc(L(s))+'">+ '+L(s)+'</button>';}).join("")+'</div>' : '';
    } else g.items.forEach(function(it,ii){ var id=gi+"_"+ii; h+='<label><input type="checkbox" data-id="'+id+'"'+(SCV.t[id]?" checked":"")+'><span>'+L(it)+'<span class="data">'+T("Data: ","தகவல்: ")+L(it.d)+'</span></span></label>'; });
    h+='</div></div>'; });
  return h;
}
function scProg(){ var all=0,tot=0;
  SC.groups.forEach(function(g,gi){ var n,c; if(g.own){ n=SCV.own.length; c=SCV.own.filter(function(o){return o.c;}).length; } else { n=g.items.length; c=g.items.filter(function(x,ii){return SCV.t[gi+"_"+ii];}).length; }
    all+=c; tot+=n; var e=document.getElementById("scc"+gi); if(e) e.textContent=c+"/"+n; var b=document.getElementById("scb"+gi); if(b) b.style.width=(n?c/n*100:0)+"%"; });
  var a=document.getElementById("scAll"); if(a) a.textContent=all+"/"+tot; var ab=document.getElementById("scAllBar"); if(ab) ab.style.width=(tot?all/tot*100:0)+"%"; }
POST.sc=function(){ var s=document.getElementById("t_sc");
  s.querySelectorAll("input[data-id]").forEach(function(i){ i.onchange=function(){ SCV.t[i.getAttribute("data-id")]=i.checked; scSave(SCV); scProg(); }; });
  s.querySelectorAll("input[data-own]").forEach(function(i){ i.onchange=function(){ SCV.own[+i.getAttribute("data-own")].c=i.checked; scSave(SCV); scProg(); }; });
  s.querySelectorAll("a[data-del]").forEach(function(a){ a.onclick=function(e){ e.preventDefault(); SCV.own.splice(+a.getAttribute("data-del"),1); scSave(SCV); rerender("sc"); }; });
  function add(t){ t=(t||"").trim(); if(!t||SCV.own.length>=8) return; SCV.own.push({t:t,c:false}); scSave(SCV); rerender("sc"); }
  var ad=document.getElementById("scAdd"); if(ad) ad.onclick=function(){ add(document.getElementById("scOwn").value); };
  s.querySelectorAll("button[data-sg]").forEach(function(b){ b.onclick=function(){ add(b.getAttribute("data-sg")); }; });
  document.getElementById("scClear").onclick=function(){ SCV.t={}; SCV.own.forEach(function(o){o.c=false;}); scSave(SCV); rerender("sc"); };
  scProg(); };

/* ---------- MANAGEMENT ---------- */
function secMg(){
  return '<h2>'+L(MG.title)+'</h2><div class="grid g2">'+MG.people.map(function(p){ return card('<div class="person"><div class="avatar">'+p.i+'</div><div><b>'+p.n+'</b><div style="color:#e8701a;font-weight:700;font-size:13px">'+L(p.r)+'</div><div style="font-size:14px;margin-top:4px">'+L(p.x)+'</div></div></div>'); }).join("")+'</div>'+
   '<h3>'+L(MG.gov.t)+'</h3>'+card('<ul style="margin:0;padding-left:18px">'+MG.gov.l.map(function(x){return '<li style="margin:4px 0">'+L(x)+'</li>';}).join("")+'</ul>')+
   '<h3>'+T("Shareholding (Jun-26)","பங்குதாரர் அமைப்பு (ஜூன்-26)")+'</h3>'+table([T("Holder","பங்குதாரர்"),"%"],[[L(MKT.shL.promoter),CO.share.promoter],[L(MKT.shL.dii),CO.share.dii],[L(MKT.shL.fii),CO.share.fii],[L(MKT.shL.pub),CO.share.pub],[L(MKT.shL.other),CO.share.other]]);

/* ---------- SOCRATES ---------- */
var SOS={};
function secSoc(){
  var h='<h2>'+L(SO.title)+'</h2><div class="card" style="margin-bottom:10px"><b>'+L(SO.score)+': <span id="soScore">0</span> / '+SO.mcq.length+'</b></div>';
  SO.mcq.forEach(function(q,qi){ h+='<div class="q"><b>Q'+(qi+1)+'. '+L(q.q)+'</b><div class="opts">'+q.o.map(function(o,oi){return '<button data-q="'+qi+'" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+L(o)+'</button>';}).join("")+'</div><div class="fb" id="fb'+qi+'"></div></div>'; });
  SO.open.forEach(function(q,qi){ h+='<div class="q"><b>✍ '+L(q.q)+'</b><div class="note">'+L(SO.yourAns)+'</div><textarea rows="3" style="margin-top:6px"></textarea><button class="btn" data-rev="'+qi+'" style="margin-top:6px">'+L(SO.reveal)+'</button><div class="fb" id="ofb'+qi+'"></div></div>'; });
  return h;
}
POST.soc=function(){ SOS={}; var s=document.getElementById("t_soc");
  s.querySelectorAll("button[data-q]").forEach(function(b){ b.onclick=function(){ var qi=+b.getAttribute("data-q"), oi=+b.getAttribute("data-o"), q=SO.mcq[qi]; if(SOS[qi]!=null) return;
    SOS[qi]=oi===q.a; b.classList.add(oi===q.a?"ok":"bad"); if(oi!==q.a) s.querySelector('button[data-q="'+qi+'"][data-o="'+q.a+'"]').classList.add("ok");
    document.getElementById("fb"+qi).innerHTML='<b>'+(oi===q.a?L(SO.right):L(SO.wrong))+'</b>'+L(q.e);
    document.getElementById("soScore").textContent=Object.keys(SOS).filter(function(k){return SOS[k];}).length; }; });
  s.querySelectorAll("button[data-rev]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-rev"); document.getElementById("ofb"+i).innerHTML='<div class="explain">'+L(SO.open[i].m)+'</div>'; }; }); };

/* ---------- RENDER ---------- */
var SECS={dash:secDash,bm:secBm,cs:secCs,fin:secFin,cf:secCf,val:secVal,mkt:secMkt,tc:secTc,pil:secPil,swot:secSwot,an:secAn,sc:secSc,mg:secMg,soc:secSoc};
function rerender(id){ var s=document.getElementById("t_"+id); s.innerHTML=SECS[id](); POST[id]&&POST[id](); }
function render(){
  document.body.classList.toggle("ta",LANG==="ta"); document.documentElement.lang=LANG==="ta"?"ta":"en";
  document.getElementById("hTitle").textContent=L(TX.title); document.getElementById("hSub").textContent=L(TX.sub);
  buildTabs();
  document.getElementById("main").innerHTML=TX.tabs.map(function(t){ return '<section class="tab'+(t.id===CUR?" on":"")+'" id="t_'+t.id+'">'+SECS[t.id]()+'</section>'; }).join("");
  Object.keys(CH).forEach(function(k){ try{CH[k].destroy();}catch(e){} delete CH[k]; });
  POST.bm(); POST.cs(); POST.sc(); POST.soc(); POST[CUR]&&POST[CUR]();
  document.getElementById("discl").innerHTML=L(DISC);
  document.getElementById("asTitle").textContent=L(AS.title); document.getElementById("asText").placeholder=L(AS.ph);
  document.getElementById("asChips").innerHTML=AS.chips.map(function(c){return '<button>'+L(c)+'</button>';}).join("");
  document.querySelectorAll("#asChips button").forEach(function(b){ b.onclick=function(){ ask(b.textContent); }; });
}
document.getElementById("bEN").onclick=function(){ LANG="en"; this.classList.add("on"); document.getElementById("bTA").classList.remove("on"); render(); };
document.getElementById("bTA").onclick=function(){ LANG="ta"; this.classList.add("on"); document.getElementById("bEN").classList.remove("on"); render(); };

/* ---------- CB BADGE ---------- */
document.getElementById("cbBadge").onclick=function(e){ e.stopPropagation(); document.getElementById("discl").classList.toggle("on"); document.getElementById("asPanel").classList.remove("on"); };
document.addEventListener("click",function(e){ var d=document.getElementById("discl"); if(d.classList.contains("on")&&!d.contains(e.target)) d.classList.remove("on"); });

/* ---------- CB ASSIST (voice Q&A) ---------- */
var log=document.getElementById("asLog"), started=false;
function say(t){ try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t.replace(/₹/g, LANG==="ta"?"ரூபாய் ":"rupees ")); u.lang=LANG==="ta"?"ta-IN":"en-IN"; u.rate=1;
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(LANG==="ta"?"ta":"en-in")===0;}); if(vs[0]) u.voice=vs[0]; speechSynthesis.speak(u); }catch(e){} }
function addMsg(t,who,html){ var m=document.createElement("div"); m.className="msg "+who; if(html) m.innerHTML=t; else m.textContent=t; log.appendChild(m); log.scrollTop=log.scrollHeight; return m; }
function answer(q){ var s=" "+q.toLowerCase()+" ", best=null, bs=0;
  KB.forEach(function(k){ var sc=0; k.k.forEach(function(w){ if(s.indexOf(w.toLowerCase())>=0) sc+=w.length>4?2:1; }); if(sc>bs){bs=sc;best=k;} });
  return best; }
function ask(q){ q=(q||"").trim(); if(!q) return; addMsg(q,"u"); var a=answer(q);
  if(!a){ addMsg(L(AS.miss),"b"); say(L(AS.miss)); return; }
  var t=L(a), m=addMsg(t,"b");
  if(a.act){ var b=document.createElement("button"); b.className="btn pri"; b.style.marginTop="6px"; b.textContent=L(AS.open); b.onclick=function(){ go(a.act); document.getElementById("asPanel").classList.remove("on"); }; m.appendChild(document.createElement("br")); m.appendChild(b); }
  say(t); }
document.getElementById("asBtn").onclick=function(e){ e.stopPropagation(); var p=document.getElementById("asPanel"); p.classList.toggle("on"); document.getElementById("discl").classList.remove("on");
  if(p.classList.contains("on")&&!started){ started=true; addMsg(L(AS.hello),"b"); } };
document.getElementById("asClose").onclick=function(){ document.getElementById("asPanel").classList.remove("on"); try{speechSynthesis.cancel();}catch(e){} };
document.getElementById("asSend").onclick=function(){ var i=document.getElementById("asText"); ask(i.value); i.value=""; };
document.getElementById("asText").onkeydown=function(e){ if(e.key==="Enter"){ ask(this.value); this.value=""; } };
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null;
document.getElementById("asMic").onclick=function(){ var b=this;
  if(!SR){ addMsg(L(AS.nomic),"b"); return; }
  if(rec){ try{rec.stop();}catch(e){} return; }
  rec=new SR(); rec.lang=LANG==="ta"?"ta-IN":"en-IN"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=function(ev){ ask(ev.results[0][0].transcript); };
  rec.onend=function(){ b.classList.remove("rec"); rec=null; }; rec.onerror=function(){ b.classList.remove("rec"); rec=null; };
  b.classList.add("rec"); try{ rec.start(); }catch(e){ b.classList.remove("rec"); rec=null; } };

render();
})();
