 headline:{en:"Record quarter: PAT ₹365 cr (+199.9% YoY, +15.3% QoQ), NII ₹1,244 cr (+35%), deposits cross ₹50,000 cr and secured loans reach 52.1% of the book. Watch-points: margin squeeze after the 25 bps repo hike, leadership transition and draft insurance-commission rules.",
  ta:"சாதனை காலாண்டு: லாபம் ₹365 கோடி (ஆண்டுக்கு +199.9%, காலாண்டுக்கு +15.3%), NII ₹1,244 கோடி (+35%), வைப்பு ₹50,000 கோடியைத் தாண்டியது, secured கடன் பங்கு 52.1% ஆச்சு. கவனிக்க வேண்டியது: ரெப்போ 0.25% உயர்வால் மார்ஜின் அழுத்தம், தலைமை மாற்றம், காப்பீட்டு கமிஷன் வரைவு விதிகள்."},

  {en:"Loan book grew 32.1% to ₹45,699 cr, faster than deposits (+29.2%); the CD ratio moved up to about 90%.",ta:"கடன் புத்தகம் 32.1% வளர்ந்து ₹45,699 கோடி; வைப்பு வளர்ச்சி (29.2%)-ஐ விட வேகம். CD விகிதம் சுமார் 90% ஆச்சு."},

  {en:"Asset quality steady: GNPA 2.10%, NNPA 0.31%, PCR 85%, micro-banking collection efficiency 99.7%.",ta:"கடன் தரம் நிலையா இருக்கு: GNPA 2.10%, NNPA 0.31%, PCR 85%, மைக்ரோ கடன் வசூல் 99.7%."},

 liqNote:{en:"For a bank, 'working capital' is the match between what it borrows (deposits) and what it lends. Inventory, receivable and payable days do not apply, and a bank's operating cash flow swings with deposit and loan flows, so the cash-flow test here is funding stability and liquidity buffers.",
  ta:"வங்கிக்கு 'working capital' என்பது வாங்கும் பணம் (வைப்பு) கொடுக்கும் கடனுக்கு எவ்வளவு பொருந்துதுங்கறதுதான். Inventory, receivable, payable days இங்கே பொருந்தாது; வங்கியோட இயக்கப் பணப்புழக்கம் வைப்பு, கடன் ஓட்டத்தோட மாறும். அதனால நிதி நிலைத்தன்மை, liquidity buffer-ஐ வெச்சுதான் பார்க்கணும்."},

 {en:"NIM = (interest earned − interest paid) ÷ average earning assets. A small-finance bank's NIM is high because its borrowers pay more — and because the risk is higher.",ta:"NIM = (வட்டி வருமானம் − வட்டிச் செலவு) ÷ சராசரி வருமானச் சொத்து. SFB-க்கு NIM அதிகம் — கடன் வாங்குறவங்க அதிக வட்டி கட்டுறாங்க, ரிஸ்க்கும் அதிகம்."},
 {en:"PPOP is a bank's 'EBITDA': profit before bad-loan provisions and tax. If PPOP grows but PAT falls, look at provisions first.",ta:"PPOP தான் வங்கியோட 'EBITDA' — provisions, வரிக்கு முன் லாபம். PPOP கூடி லாபம் குறைஞ்சா முதல்ல provisions-ஐப் பாருங்க."},

  else g.items.forEach(function(it,ii){ var key=gi+'_'+ii; gt++; if(SCS.t[key]) gd++;

  tot+=gt; done+=gd;

 h+='<div class="card"><b>'+T2('Overall','மொத்தம்')+': '+done+' / '+tot+'</b><div class="bar" style="margin:6px 0"><i style="width:'+(tot?done/tot*100:0)+'%"></i></div><p>'+T2(done+' of '+tot+' of your own conditions line up.',tot+'-ல் '+done+' உங்க நிபந்தனைகள் பொருந்துது.')+' '+T2('This only counts how many of your own conditions line up. It is not a recommendation.','இது உங்க நிபந்தனைகள் எத்தனை பொருந்துதுன்னு மட்டும் எண்ணுது. இது பரிந்துரை அல்ல.')+'</p><button class="btn" onclick="SCS={t:{},own:[]};scSave();rSelf()">'+T2('Clear','அழி')+'</button></div>';

  if(QS[i]!=null) h+='<div class="expl">'+(QS[i]===q.a?'✅ ':'🤔 ')+tx(q.ex)+'</div>'; h+='</div>'; });
 var sc=Object.keys(QS).filter(function(k){return QS[k]===QUIZ[k].a;}).length;
 h+=card('<b>'+T2('Score','மதிப்பெண்')+': '+sc+' / '+QUIZ.length+'</b>');
 h+='<h3>'+T2('Your turn — free answer','உங்க முறை — சுதந்திரமான பதில்')+'</h3>'+card('<p>'+T2('If micro-banking is 48% of the book and grows 12–14% while secured loans grow ~40%, what happens to NIM and to credit cost two years out? Why might the market pay more for the lower-margin mix?','மைக்ரோ கடன் 48%, அது 12–14% வளர, secured ~40% வளர்ந்தா, ரெண்டு வருஷத்துல NIM, கடன் இழப்பு என்ன ஆகும்? குறைந்த மார்ஜின் கலவைக்கு சந்தை ஏன் அதிக மதிப்பு கொடுக்கும்?')+'</p><textarea id="socT" rows="3" style="width:100%;border:1px solid #e3e8ef;border-radius:8px;padding:8px"></textarea><button class="btn pri" onclick="socFb()">'+T2('Reflect','யோசி')+'</button><div class="expl" id="socF" style="display:none"></div>');

 T2('Ask yourself: is a 1-pp lower NIM worth it if credit cost falls 1 pp and swings less in a bad year?','கேளுங்க: NIM 1% குறைஞ்சாலும் கடன் இழப்பு 1% குறைஞ்சு, மோசமான வருஷத்திலும் குறைவா மாறினா அது மதிப்பா?'); }

 if(has(q,['au ','au sfb','au bank','au small','ஏயு'])) return {t:T2('AU SFB Q2 FY27: profit ₹858 crore, up 53%; NII ₹2,820 crore, up 32%; NIM 5.8%; GNPA 1.99%; RoA 1.7%. Yet the share fell up to 9.45% on 26 October, because the universal-bank approval was already in the price since August 2025, slippages rose quarter-on-quarter, margins have peaked, costs rose 26% and insurance income is at risk. The stock is about 24% below its 52-week high of ₹1,144. The licence helps AU over years, mainly through cheaper deposits, bigger loans, co-lending and subsidiaries, but it does not lift near-term profit and was already in the price. See Companies, AU SFB.','AU SFB Q2 FY27: லாபம் ₹858 கோடி (+53%); NII ₹2,820 கோடி; NIM 5.8%; GNPA 1.99%; RoA 1.7%. ஆனாலும் 26 அக்டோபர் பங்கு 9.45% வரை சரிந்தது — உரிம ஒப்புதல் ஆகஸ்ட் 2025 முதலே விலையில், slippages கூடியது, மார்ஜின் உச்சம், செலவு 26% கூடியது, காப்பீட்டு வருமான ஆபத்து.')};
 if(has(q,['licence','license','universal','bandhan','idfc','உரிமம்','யுனிவர்சல்'])) return {t:T2('RBI returned Ujjivan\'s universal bank application in April 2026 because its loan book is still concentrated in unsecured micro-loans; it can reapply after diversifying. Ujjivan already meets the numeric tests. Its RoA of 2.4% is well above Bandhan\'s guided 1.2–1.4% and IDFC First\'s ~1%, but that high return comes from the micro-loans RBI wants reduced. Secured share is 52.1%, aiming for 56% by March 2027. A licence would also let it co-lend with NBFCs, set up subsidiaries such as an AMC or broking arm, and roughly double its single-borrower limit, besides easing priority-sector and small-loan rules. See the Universal Bank Licence tab.','ஏப்ரல் 2026-ல் RBI உஜ்ஜீவன் விண்ணப்பத்தைத் திருப்பியது — கடன் புத்தகம் இன்னும் மைக்ரோ கடனில் குவிந்திருக்கு; பரவலாக்கிய பிறகு மீண்டும் விண்ணப்பிக்கலாம். RoA 2.4% — பந்தன் (1.2–1.4%), IDFC First (~1%)-ஐ விட அதிகம்; ஆனா அது அதே மைக்ரோ கடனிலிருந்துதான். Secured 52.1%, மார்ச் 2027 இலக்கு 56%.')};

 if(has(q,['fastest','quickest','வேகமா','வேகமாக'])){ var f=CO.seg.slice().sort(function(a,b){return b.g-a.g;}); return {t:T2('Fastest-growing segments: ','வேகமா வளரும் பிரிவுகள்: ')+f.slice(0,3).map(function(g){return tx({en:g.en,ta:g.ta})+' +'+g.g+'%';}).join(', ')+'.'}; }
 if(has(q,['largest','biggest','பெரிய','segment','பிரிவு','mix','கலவை'])){ var s=CO.seg.slice().sort(function(a,b){return b.v-a.v;}); return {t:T2('Largest segments: ','பெரிய பிரிவுகள்: ')+s.slice(0,3).map(function(g){return tx({en:g.en,ta:g.ta})+' '+cr(g.v)+' ('+(g.v/b.glb[0]*100).toFixed(1)+'%)';}).join(', ')+T2('. Secured share is 52.1%.','. Secured பங்கு 52.1%.')}; }

 if(has(q,['crar','capital','raise','409','மூலதனம்','நிதி திரட்ட'])) return {t:T2('CRAR 20.69% (Tier-1 19.49%). The board approved a ₹409 crore preferential issue to IFC, Bajaj Life, HDFC Life and Aditya Birla Sun Life, adding about 1.2 pp to CRAR.','CRAR 20.69% (Tier-1 19.49%). IFC உள்ளிட்டோருக்கு ₹409 கோடி ஒதுக்கீடு — CRAR ~1.2% கூடும்.')};
 if(has(q,['valuation','pbv','p/b','book','p/e',' pe ','price','cheap','expensive','target','analyst','broker','விலை','மதிப்பு','இலக்கு'])) return {t:T2('Price ₹63.25 (16 Oct). P/BV about 1.84x on latest reported book of ₹34.45; about 9x annualised H1 earnings. Broker targets: ICICI Securities ₹90, Axis Securities ₹86, Trendlyne consensus ₹82.','விலை ₹63.25 (16 அக்). P/BV ~1.84x, P/E ~9x. ப்ரோக்கர் இலக்கு: ICICI Securities ₹90, Axis ₹86, Trendlyne சராசரி ₹82.')};
 if(has(q,['ceo','md','management','leader','board','நிர்வாகம்','தலைமை'])) return {t:T2('MD Sanjeev Nautiyal took early retirement from 1 Sep 2026. Carol Furtado is Whole Time Director and interim CEO; the NRC expects to finalise a new MD in 3–4 months. CFO is Balakrishna Kamath.','MD சஞ்சீவ் நௌடியால் 1 செப் 2026 முதல் ஓய்வு. கரோல் ஃபர்டாடோ இடைக்கால CEO; 3–4 மாதத்தில் புதிய MD. CFO பாலகிருஷ்ண காமத்.')};
 if(has(q,['trigger','cycle','catalyst','தூண்டுதல்','சுழற்சி'])) return {t:T2('Cycle: sector in P3 Expansion, CY '+CO.cycle.cy+'. Triggers TG '+tgScore()+': top positives are the secured-mix shift and the ₹409 crore raise; top negative is the repo hike squeezing NIM.','சுழற்சி: துறை P3, CY '+CO.cycle.cy+'. TG '+tgScore()+': நேர்மறை — secured மாற்றம், ₹409 கோடி; எதிர்மறை — ரெப்போ உயர்வு.')};
 if(has(q,['risk','threat','concern','worry','ரிஸ்க்','அபாயம்'])) return {t:T2('Main risks: margin squeeze from the repo hike, leadership transition, IRDAI draft insurance-commission rules, drought in Karnataka/Maharashtra and 48% unsecured micro-banking exposure.','முக்கிய ரிஸ்க்: ரெப்போ உயர்வால மார்ஜின் அழுத்தம், தலைமை மாற்றம், IRDAI வரைவு விதிகள், வறட்சி, 48% பாதுகாப்பில்லாத கடன்.')};
 if(has(q,['secured','micro','unsecured','மைக்ரோ'])) return {t:T2('Secured loans are 52.1% of the book (₹23,803 crore, +47%); micro-banking ₹22,037 crore. Target 56% secured by March 2027.','Secured 52.1% (₹23,803 கோடி, +47%); மைக்ரோ ₹22,037 கோடி. மார்ச் 2027 இலக்கு 56%.')};
 if(has(q,['guidance','outlook','forecast','வழிகாட்டல்'])) return {t:T2('FY27 guidance: advances ~25%, micro-banking 12–14%, secured 56% by March, H2 NIM ~8.35%, credit cost 0.9–1.0% of assets, opex/assets 6.2%, RoA 1.8–2.0% with upside.','FY27: கடன் ~25%, மைக்ரோ 12–14%, secured 56%, H2 NIM ~8.35%, கடன் இழப்பு 0.9–1.0%, RoA 1.8–2.0%.')};
 if(has(q,['branch','network','கிளை'])) return {t:T2('880 branches (104 added in H1), 619 ATMs, 26 states/UTs, about 1 crore customers.','880 கிளைகள் (H1-ல் 104), 619 ATM, 26 மாநிலங்கள், ~1 கோடி வாடிக்கையாளர்.')};
 if(has(q,['subsidiar','துணை'])) return {t:tx(TXT.subs)};
 return {t:T2('Quick summary: record PAT ₹365 crore, NII +35%, NIM 8.4%, GNPA 2.10%, CRAR 20.69%. Try asking about NIM, NPA, CASA, capital, valuation, segments, triggers or risks.','சுருக்கம்: லாபம் ₹365 கோடி, NII +35%, NIM 8.4%, GNPA 2.10%, CRAR 20.69%. NIM, வாராக்கடன், CASA, மூலதனம், மதிப்பு, ரிஸ்க் பத்தி கேளுங்க.')};
