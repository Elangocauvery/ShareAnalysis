<style>
/* Layout: sticky header + two-level tab rail (section tabs, then company sub-tabs) over a single scrolling content column; every panel leads with an SVG picture */
:root{
  --bg:#FFF4E6; --card:#FFF9F1; --line:#F3CFA3; --accent:#F28C28; --accent-soft:#FFE2C2;

  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;font-weight:500;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.hrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px 8px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;flex:none}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,3.2vw,27px);margin:0;line-height:1.15;text-wrap:balance}
.slogan{font-weight:700;color:var(--ink2);font-size:14px}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.btn.on{background:var(--accent);}
.btn:focus-visible,.tab:focus-visible,.sub:focus-visible{outline:3px solid var(--nse);outline-offset:2px}
.status{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 11px;border:2px solid currentColor;background:var(--card)}
.pill.ok{color:var(--good)} .pill.wait{color:var(--warn)}
.tabs,.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tab{font:inherit;font-weight:700;white-space:nowrap;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent)}
.sub{font:inherit;font-weight:800;white-space:nowrap;border:2px solid currentColor;background:var(--card);border-radius:8px;padding:4px 14px;cursor:pointer}
.sub.on{background:var(--accent-soft);box-shadow:inset 0 -4px 0 currentColor}
.sub[data-c=mcx]{color:var(--mcx)} .sub[data-c=nse]{color:var(--nse)} .sub[data-c=bse]{color:var(--bse)} .sub[data-c=cmp]{color:var(--ink)}
main{padding-top:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:4px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:17px;margin:14px 0 8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:var(--f-data);font-weight:600;font-size:21px}
.kpi .l{font-size:13px;font-weight:700;color:var(--ink2)}
.up{color:var(--good);font-weight:800} .dn{color:var(--bad);font-weight:800}
ul.b{margin:6px 0;padding-left:20px} ul.b li{margin:3px 0}
.tbl{overflow-x:auto} table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:7px 9px;border-bottom:1.5px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{background:var(--accent-soft);font-weight:800}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:var(--f-body);font-weight:700;fill:var(--ink)}
.note{font-size:13.5px;color:var(--ink2);font-weight:600}
.banner{border:2px dashed var(--warn);background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.chip{display:inline-block;font-size:13px;font-weight:800;border-radius:8px;padding:2px 9px;margin:2px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.detail{margin-top:10px;border-left:5px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:8px;font-weight:600}
.flow g.box{cursor:pointer} .flow g.box:hover rect{stroke-width:3.5}
.q{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.q label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.q input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:3px}
.data{font-size:13.5px;color:var(--ink2);margin:2px 0 0 28px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;margin:5px 0;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--good);background:#E3F4E6} .opt.wrong{border-color:var(--bad);background:#FBE3E0}
input[type=text]{font:inherit;font-weight:600;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);min-width:0;flex:1}
input[type=range]{accent-color:var(--accent)}
.alog{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{border-radius:12px;padding:8px 12px;font-weight:600;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent-soft);border:2px solid var(--accent)}
.msg.a{align-self:flex-start;background:var(--card);border:2px solid var(--line)}
.msg details{margin-top:4px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cb{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40}
.cbb{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--ink);font-family:var(--f-display);font-weight:800;display:grid;place-items:center;border:2px solid var(--ink);cursor:pointer;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.cbb{animation:none}}
.cbtxt{display:none;position:absolute;right:0;bottom:56px;width:min(300px,80vw);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:13px;font-weight:600}
.cb:hover .cbtxt,.cb.open .cbtxt{display:block}
.va{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;font:inherit;font-weight:800;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.cmp-legend span{margin-right:12px;font-weight:800}
</style>

function bars(o){ // o:{cats,series:[{name,col,vals}],w,h,fmt}
 var w=o.w||560,h=o.h||260,pl=10,pb=44,pt=26,ch=h-pb-pt,n=o.cats.length,m=o.series.length;

 var gw=(w-pl*2)/n,bw=Math.min(54,(gw-18)/m),s='<svg viewBox="0 0 '+w+" "+h+'" role="img">';

  s+='<polyline points="'+pts.map(function(p){return p.join(",")}).join(" ")+'" fill="none" stroke="'+se.c+'" stroke-width="3.5"/>';

  rec.start();if(n)n.textContent=T("Listening… I'll answer after you pause.","கேட்டுக்கிட்டிருக்கேன்… நீங்க நிறுத்தினதும் பதில்.")}catch(e){if(n)n.textContent=T("Microphone is blocked here — type your question.","Mic block ஆகியிருக்கு — type பண்ணுங்க.")}}

 document.querySelectorAll(".flow g.box").forEach(function(g){g.addEventListener("click",function(){var k=g.getAttribute("data-k"),el=document.getElementById("bmd");if(!el)return;var txt=g.textContent.trim();if(k.indexOf("m:")===0){var key=k.slice(2);el.textContent=key+": "+T(BMD[key][0],BMD[key][1])}else el.textContent=txt})});

}
