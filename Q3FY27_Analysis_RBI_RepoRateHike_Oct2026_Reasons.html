<!DOCTYPE html>

<head>

<style>
:root{--bg:#ffffff;--soft:#f6f8fb;--ink:#1b2333;--mute:#5d6878;--line:#e3e8ef;--navy:#0f3a68;--orange:#f07c1b;--green:#1f9d55;--amber:#d69e2e;--red:#d64545;--blue:#2b6cb0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Tamil",system-ui,sans-serif;font-size:15px;line-height:1.55}
body.ta{font-family:"Noto Sans Tamil",Inter,sans-serif}
header{background:linear-gradient(135deg,#fff 0%,#fff4ea 100%);border-bottom:3px solid var(--orange);padding:18px 16px 12px}
.hwrap{max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:22px;color:var(--navy)}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.lang{display:flex;gap:6px}
.lang button{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:6px 12px;border-radius:20px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .nw{max-width:1100px;margin:auto;padding:0 8px}
nav button{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;font-size:14px}
nav button.on{color:var(--orange);border-bottom-color:var(--orange)}
main{max-width:1100px;margin:auto;padding:16px 16px 120px}
.tab{display:none}.tab.on{display:block}
h2{color:var(--navy);font-size:19px;margin:6px 0 12px}
h3{font-size:16px;margin:4px 0 8px;color:var(--navy)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(15,58,104,.05)}
.kpi .v{font-size:24px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--red)}.dn{color:var(--green)}
.banner{background:var(--soft);border-left:4px solid var(--orange);padding:12px 14px;border-radius:8px;margin:12px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.p-ok{background:var(--green)}.p-part{background:var(--amber)}.p-fix{background:var(--red)}
.reason{margin-bottom:12px}
.reason .top{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.reason .num{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.reason .body{display:none;margin-top:10px}
.reason.open .body{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
.view{background:#f1f5fb;border-radius:8px;padding:10px}
.fix{background:#fff6ee;border-radius:8px;padding:10px}
.view b,.fix b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.view b{color:var(--blue)}.fix b{color:var(--orange)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--navy)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.chartbox{position:relative;height:280px}
svg text{font-family:Inter,"Noto Sans Tamil",sans-serif}
.node{cursor:pointer}
.node rect{transition:all .2s}
.node:hover rect,.node.sel rect{stroke:var(--orange);stroke-width:3}
#mapInfo{min-height:70px}
input[type=range]{width:100%}
.calc label{font-size:13px;color:var(--mute);display:block;margin-top:8px}
.calc input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.big{font-size:26px;font-weight:800;color:var(--red)}
.quiz .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px}
.quiz .opt.r{background:#e8f7ee;border-color:var(--green)}
.quiz .opt.w{background:#fdecec;border-color:var(--red)}
.fb{margin-top:8px;font-size:14px}
.btn{background:var(--navy);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.o{background:var(--orange)}
.wm{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:800;color:rgba(15,58,104,.035);transform:rotate(-24deg);z-index:0}
/* CB badge */
#cbBadge{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(240,124,27,.45);cursor:pointer;z-index:50;animation:blink 2s infinite;border:3px solid #fff}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(240,124,27,.6)}50%{box-shadow:0 0 0 12px rgba(240,124,27,0)}}
#disc{display:none;position:fixed;right:16px;bottom:84px;max-width:320px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--mute);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:51}
#disc.on{display:block}
/* CB Assist */
#asBtn{position:fixed;right:84px;bottom:20px;height:50px;padding:0 16px;border-radius:25px;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;z-index:50;border:0;font-family:inherit;box-shadow:0 4px 12px rgba(15,58,104,.3)}
#asPanel{display:none;position:fixed;right:16px;bottom:84px;width:min(360px,calc(100vw - 32px));height:440px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:52;flex-direction:column;overflow:hidden}
#asPanel.on{display:flex}
#asHead{background:var(--navy);color:#fff;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#asLog{flex:1;overflow-y:auto;padding:10px;background:var(--soft)}
.msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:88%;font-size:14px}
.msg.u{background:var(--navy);color:#fff;margin-left:auto}
.msg.b{background:#fff;border:1px solid var(--line)}
#asIn{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#asIn input{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
#mic{width:42px;border-radius:8px;border:0;background:var(--orange);color:#fff;font-size:18px;cursor:pointer}
#mic.rec{background:var(--red);animation:blink 1s infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 8px}
.chips span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer}
.small{font-size:12.5px;color:var(--mute)}
.src a{color:var(--blue);word-break:break-all}
.hti{position:relative;cursor:help}
.hti .tip{visibility:hidden;opacity:0;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;font-size:12px;font-weight:600;line-height:1.35;padding:7px 9px;border-radius:7px;width:150px;text-align:left;z-index:30;transition:opacity .15s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hti .tip b{display:block;font-size:13px;margin-bottom:2px}
.hti .tip:before{content:"";position:absolute;bottom:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom-color:#1b2333}
.hti:hover .tip,.hti.on .tip{visibility:visible;opacity:1}
.hti:last-child .tip,.hti:nth-last-child(2) .tip{left:auto;right:0;transform:none}
.hti:last-child .tip:before,.hti:nth-last-child(2) .tip:before{left:auto;right:12px}
</style>
</head>

<div class="wm">CB RESEARCH</div>

<header><div class="hwrap">
  <div>
    <h1 data-en="Why did RBI hike the repo rate? — Reasons Decoded" data-ta="RBI ஏன் ரெப்போ ரேட்டை ஏத்துச்சு? — காரணங்கள் அலசல்"></h1>
    <div class="sub" data-en="MPC decision: 7 Oct 2026 · Q3 FY27 · Repo 5.25% → 5.50% · Stance: Calibrated Tightening" data-ta="MPC முடிவு: 7 அக் 2026 · Q3 FY27 · ரெப்போ 5.25% → 5.50% · நிலைப்பாடு: படிப்படியான இறுக்கம்"></div>
  </div>
  <div class="lang"><button id="bEn" class="on" onclick="setLang('en')">English</button><button id="bTa" onclick="setLang('ta')">தமிழ்</button></div>

<main>
<!-- TAB 1 SNAPSHOT -->
<section class="tab on" id="t1">
  <h2 data-en="Decision at a glance" data-ta="முடிவு ஒரே பார்வையில்"></h2>
  <div class="grid g4">
    <div class="card kpi"><div class="l" data-en="Repo rate" data-ta="ரெப்போ ரேட்"></div><div class="v">5.50%</div><div class="d up">▲ 25 bps</div></div>
    <div class="card kpi"><div class="l" data-en="MPC vote" data-ta="MPC வாக்கு"></div><div class="v">6–0</div><div class="d" data-en="Unanimous" data-ta="ஒருமனதாக"></div></div>
    <div class="card kpi"><div class="l" data-en="CPI Aug 2026" data-ta="CPI ஆக 2026"></div><div class="v">4.82%</div><div class="d up" data-en="▲ from 4.45% (Jul)" data-ta="▲ ஜூலை 4.45% இலிருந்து"></div></div>
    <div class="card kpi"><div class="l" data-en="FY27 CPI forecast" data-ta="FY27 CPI கணிப்பு"></div><div class="v">5.1%</div><div class="d up" data-en="▲ from 5.0%" data-ta="▲ 5.0% இலிருந்து"></div></div>
    <div class="card kpi"><div class="l" data-en="FY27 GDP forecast" data-ta="FY27 GDP கணிப்பு"></div><div class="v">7.1%</div><div class="d dn" data-en="▲ 40 bps upgrade" data-ta="▲ 40 bps உயர்வு"></div></div>
    <div class="card kpi"><div class="l" data-en="US Fed (upper)" data-ta="US Fed (மேல் வரம்பு)"></div><div class="v">4.00%</div><div class="d up" data-en="Hiked 16 Sep 2026" data-ta="16 செப் 2026 ஏற்றம்"></div></div>
    <div class="card kpi"><div class="l" data-en="Repo – Fed gap" data-ta="ரெப்போ – Fed இடைவெளி"></div><div class="v">150 bps</div><div class="d" data-en="Restored from 125" data-ta="125-லிருந்து மீட்பு"></div></div>
    <div class="card kpi"><div class="l" data-en="Crude / Rupee" data-ta="கச்சா / ரூபாய்"></div><div class="v" style="font-size:19px">$100+ / ₹95</div><div class="d up" data-en="Imported-inflation risk" data-ta="இறக்குமதி பணவீக்க அபாயம்"></div></div>
  </div>

  <div class="banner" data-en="<b>First hike since February 2023.</b> Stance shifted from <i>neutral</i> to <i>calibrated tightening</i> — the Governor said the next move can only be a hike or a pause. Rate cuts are off the table." data-ta="<b>பிப்ரவரி 2023-க்கு அப்புறம் முதல் ஏற்றம்.</b> நிலைப்பாடு <i>நடுநிலை</i>யிலிருந்து <i>படிப்படியான இறுக்கம்</i>-க்கு மாறிடுச்சு — அடுத்த முடிவு ஏற்றமோ இடைநிறுத்தமோ தான்னு கவர்னர் சொல்லிட்டார். ரேட் குறைப்பு இப்போதைக்கு இல்ல."></div>

  <h3 data-en="Your 6 reasons at a glance" data-ta="உங்க 6 காரணங்கள் ஒரே பார்வையில்"></h3>
  <div class="card tw"><table id="scoreTbl"></table></div>

  <div class="banner" data-en="<b>The one-line truth:</b> RBI hiked mainly because inflation is rising and its <i>outlook</i> is worse (crude above $100, rupee near 95/$, weak monsoon, WPI 9.92%) while growth is strong enough (Q1 GDP 7.8%) to absorb a hike. The Fed gap and liquidity are supporting reasons. Bank NIMs and RBI's own dividend are <u>consequences</u>, not reasons." data-ta="<b>ஒரே வரியில் உண்மை:</b> பணவீக்கம் ஏறுது, அதோட <i>எதிர்கால நிலை</i> இன்னும் மோசம் (கச்சா $100-க்கு மேல, ரூபாய் 95/$ பக்கம், பலவீனமான மழை, WPI 9.92%). அதே நேரம் வளர்ச்சி வலுவா இருக்கு (Q1 GDP 7.8%) — அதனால ஏற்றத்தைத் தாங்க முடியும். Fed இடைவெளி, லிக்விடிட்டி இவை துணைக் காரணங்கள். வங்கி NIM, RBI டிவிடெண்ட் இவை <u>விளைவுகள்</u> தான், காரணங்கள் இல்ல."></div>
</section>

<!-- TAB 2 REASONS -->
<section class="tab" id="t2">
  <h2 data-en="Your six reasons — what's right, what needs correcting" data-ta="உங்க ஆறு காரணங்கள் — எது சரி, எது திருத்தணும்"></h2>

  <div class="grid g2">
    <div class="card"><h3 data-en="CPI inflation vs RBI target band" data-ta="CPI பணவீக்கம் vs RBI இலக்கு வரம்பு"></h3><div class="chartbox"><canvas id="cCpi"></canvas></div><div class="small" data-en="Target 4%; tolerance band 2%–6%. September CPI releases 12 Oct 2026." data-ta="இலக்கு 4%; சகிப்பு வரம்பு 2%–6%. செப்டம்பர் CPI 12 அக் 2026 அன்று வரும்."></div></div>

    <div class="card"><h3 data-en="Policy-rate gap (repo minus Fed), bps" data-ta="கொள்கை வட்டி இடைவெளி (ரெப்போ − Fed), bps"></h3><div class="chartbox"><canvas id="cGap"></canvas></div></div>

var R=[
{n:1,v:'ok',
 en:{t:"Inflation rising above 4%; oil & costly imports; protect the fragile majority",you:"Inflation is above RBI's 4% limit; September may cross 5%. High oil prices (only partly passed on) and costly imports in an import-led economy push prices up. RBI must choose inflation control over growth because the poor are hit hardest.",fix:"<b>Mostly correct — two refinements.</b><br>① <u>4% is RBI's target, not its limit.</u> The legal tolerance band is 2%–6%. August CPI at 4.82% is above target but inside the band — so this was a <i>pre-emptive</i> hike based on the outlook, not a breach.<br>② <u>August inflation was led by food, not fuel.</u> Food inflation was 5.95% (onion +48%, garlic +44%, ginger +74%) and gold/silver jewellery also jumped. Oil works through the pipeline: WPI is already 9.92%, crude is above $100 and the rupee is near 95/$ — that is the imported inflation still to come.<br>③ The trade-off was easier than you framed it: growth is strong (Q1 GDP 7.8%; FY27 forecast raised to 7.1%), so RBI did not have to sacrifice much growth. Your 'fragile majority' point is backed by data — rural CPI 5.23% vs urban 4.31%."},
 ta:{t:"பணவீக்கம் 4%-ஐத் தாண்டுது; எண்ணெய், விலையுயர்ந்த இறக்குமதி; பலவீனமான பெரும்பான்மையைக் காக்கணும்",you:"பணவீக்கம் RBI-யோட 4% வரம்பைத் தாண்டிடுச்சு; செப்டம்பர்ல 5%-ஐத் தாண்டலாம். எண்ணெய் விலை அதிகம், இறக்குமதி செலவு அதிகம். ஏழைகள் தான் அதிகம் பாதிக்கப்படுவாங்க, அதனால வளர்ச்சியை விட பணவீக்கக் கட்டுப்பாடு முக்கியம்.",fix:"<b>பெரும்பாலும் சரி — இரண்டு திருத்தங்கள்.</b><br>① <u>4% என்பது இலக்கு, வரம்பு இல்ல.</u> சட்டப்படி சகிப்பு வரம்பு 2%–6%. ஆகஸ்ட் CPI 4.82% — இலக்குக்கு மேல, ஆனா வரம்புக்குள்ள. அதனால இது எதிர்காலத்தைப் பார்த்து <i>முன்கூட்டியே</i> எடுத்த ஏற்றம்.<br>② <u>ஆகஸ்ட் பணவீக்கத்துக்கு முக்கியக் காரணம் உணவு, எரிபொருள் இல்ல.</u> உணவுப் பணவீக்கம் 5.95% (வெங்காயம் +48%, பூண்டு +44%, இஞ்சி +74%). எண்ணெய் பாதிப்பு இனிமே தான் வரும்: WPI ஏற்கனவே 9.92%, கச்சா $100-க்கு மேல, ரூபாய் 95/$ பக்கம்.<br>③ வளர்ச்சி வலுவா இருக்கு (Q1 GDP 7.8%; FY27 கணிப்பு 7.1%) — அதனால RBI பெருசா வளர்ச்சியை இழக்கல. கிராம CPI 5.23% vs நகரம் 4.31% — உங்க கருத்துக்கு தரவு ஆதாரம் இருக்கு."}},
{n:2,v:'part',
 en:{t:"Fed–repo gap narrowed; capital flight must be stopped",you:"The gap between the Fed rate and the repo rate narrowed, yields converged, and capital flight from India accelerated. It had to be corrected.",fix:"<b>Direction right, but it's a supporting reason, not the driver.</b><br>① The facts: the Fed hiked to 3.75%–4.00% on 16 Sep 2026, cutting the repo–Fed gap from 150 to 125 bps. Today's hike restores it to 150 bps.<br>② But RBI's legal mandate is inflation (with growth). It does not target a fixed Fed spread — SBI Research even said its hike call was independent of the Fed.<br>③ Investors look at the <i>bond-yield</i> gap and the expected rupee move, not just policy rates. With the rupee near 95/$, even a wider spread doesn't help if currency losses wipe it out. So the hike helps the rupee indirectly, alongside FCNR inflows and forex intervention."},
 ta:{t:"Fed–ரெப்போ இடைவெளி குறைஞ்சது; மூலதன வெளியேற்றத்தைத் தடுக்கணும்",you:"Fed ரேட்டுக்கும் ரெப்போவுக்கும் உள்ள இடைவெளி குறைஞ்சிடுச்சு, மூலதனம் இந்தியாவிலிருந்து வேகமா வெளியேறுது. அதைச் சரி செய்யணும்.",fix:"<b>திசை சரி, ஆனா இது துணைக் காரணம் தான்.</b><br>① Fed 16 செப் 2026 அன்று 3.75%–4.00%-க்கு ஏத்துச்சு; இடைவெளி 150-லிருந்து 125 bps ஆச்சு. இன்னைக்கு ஏற்றத்தால மறுபடி 150 bps.<br>② RBI-யோட சட்டக் கடமை பணவீக்கம் தான்; Fed இடைவெளியை இலக்கா வெச்சுக்கல. SBI Research-ம் தங்கள் கணிப்பு Fed-ஐச் சாராதது-ன்னு சொன்னாங்க.<br>③ முதலீட்டாளர்கள் பாண்ட் ஈல்ட் இடைவெளியையும் ரூபாய் சரிவு எதிர்பார்ப்பையும் பார்ப்பாங்க. ரூபாய் 95/$ பக்கம் இருக்கும்போது, நாணய இழப்பு லாபத்தைச் சாப்பிட்டுடும்."}},
{n:3,v:'part',
 en:{t:"Almost all central banks hiked; China doesn't need to bother",you:"Almost all central banks have raised rates, so India as a large EM must follow. China exports more than it imports and doesn't need capital inflows, so it ignores US rates.",fix:"<b>Partly right — 'almost all' is overstated, and the China logic needs fixing.</b><br>① Several major central banks, led by the Fed, have turned hawkish — but it's not universal. RBI moves on India's own inflation, not to copy others.<br>② China's independence from US rates comes from three things: <u>capital controls</u>, a <u>managed currency</u>, and <u>low domestic inflation</u>. Its trade surplus helps, but the bigger reason is that money can't freely leave China the way FPI money leaves India.<br>③ India's real vulnerability is its <u>current-account deficit</u>: we need foreign capital to fund it, so rupee stability matters — that's the correct version of your point."},
 ta:{t:"கிட்டத்தட்ட எல்லா மத்திய வங்கிகளும் ஏத்திச்சு; சீனா கவலைப்படாது",you:"கிட்டத்தட்ட எல்லா மத்திய வங்கிகளும் ரேட்டை ஏத்திச்சு. சீனா இறக்குமதியை விட ஏற்றுமதி அதிகம், மூலதனம் தேவையில்ல, அதனால US ரேட்டைப் பத்திக் கவலைப்படாது.",fix:"<b>பாதி சரி — 'எல்லாம்' என்பது மிகைப்படுத்தல்; சீனா விளக்கம் திருத்தணும்.</b><br>① Fed உட்பட சில பெரிய மத்திய வங்கிகள் கடுமையாகியிருக்கு, ஆனா எல்லாமே இல்ல. RBI இந்தியப் பணவீக்கத்தைப் பார்த்து தான் முடிவு எடுக்குது.<br>② சீனாவுக்கு சுதந்திரம் வர்றது <u>மூலதனக் கட்டுப்பாடு</u>, <u>கட்டுப்படுத்தப்பட்ட நாணயம்</u>, <u>குறைந்த உள்நாட்டுப் பணவீக்கம்</u> இவற்றால. வர்த்தக உபரி உதவுது, ஆனா முக்கியக் காரணம் பணம் சுதந்திரமா வெளியேற முடியாது.<br>③ இந்தியாவோட உண்மையான பலவீனம் <u>நடப்புக் கணக்குப் பற்றாக்குறை</u> — அதை நிரப்ப வெளிநாட்டு மூலதனம் வேணும்."}},
{n:4,v:'part',
 en:{t:"VRRR to absorb FCNR-driven surplus; hike offsets VRRR cost",you:"RBI is using VRRR to suck out surplus money from FCNR inflows. Too much money fuels inflation. VRRR has a cost to RBI, which the hike partly addresses.",fix:"<b>Liquidity point correct; the cost-recovery angle needs correcting.</b><br>① Correct: surplus liquidity peaked around ₹10–11 lakh crore, and RBI has used VRRRs, ₹1 lakh crore of OMO bond sales and FX swaps to bring it below ₹5 lakh crore. FCNR dollars swapped with RBI add rupee liquidity, and excess money left idle can fuel inflation and weaken transmission — call rates drift below repo.<br>② <u>Correction:</u> RBI does not need to raise rates to protect its own expenses. Liquidity operations are a tool of monetary policy, and their cost is a balance-sheet matter. The hike was about making tighter money bite on inflation, not about recovering what VRRR costs RBI."},
 ta:{t:"FCNR உபரியை உறிஞ்ச VRRR; ஏற்றம் VRRR செலவை ஈடுகட்டும்",you:"FCNR வரவால வந்த உபரிப் பணத்தை RBI VRRR மூலம் உறிஞ்சுது. அதிகப் பணம் பணவீக்கத்தைத் தூண்டும். VRRR-க்கு RBI-க்கு செலவு இருக்கு, ஏற்றம் அதை ஓரளவு சரிகட்டும்.",fix:"<b>லிக்விடிட்டி கருத்து சரி; செலவை ஈடுகட்டும் கோணம் திருத்தணும்.</b><br>① சரி: உபரி லிக்விடிட்டி ₹10–11 லட்சம் கோடி வரை போச்சு; VRRR, ₹1 லட்சம் கோடி OMO பாண்ட் விற்பனை, FX ஸ்வாப் மூலம் ₹5 லட்சம் கோடிக்குக் கீழ கொண்டு வந்தாங்க. FCNR டாலர்களை RBI ஸ்வாப் செய்யும்போது ரூபாய் லிக்விடிட்டி கூடுது; சும்மா கிடக்கும் அதிகப் பணம் பணவீக்கத்தைத் தூண்டும்.<br>② <u>திருத்தம்:</u> RBI தன் சொந்தச் செலவைக் காக்க வட்டியை ஏத்த வேண்டியதில்ல. லிக்விடிட்டி நடவடிக்கைகள் பணக்கொள்கைக் கருவி; அதன் செலவு RBI இருப்புநிலைக் கணக்கு விஷயம். பணவீக்கத்தைக் கட்டுப்படுத்த தான் ஏற்றம், VRRR செலவை மீட்க இல்ல."}},
{n:5,v:'fix',
 en:{t:"Banks paid high FCNR rates; need higher lending rates to protect NII/NIM",you:"Banks offered high FCNR deposit rates and must raise lending rates (linked to repo), otherwise NII and NIM will shrink.",fix:"<b>The effect is real, but it is not why RBI hiked.</b><br>① FCNR(B) deposits are <u>dollar</u> deposits (rates ~6%–7.5% in USD). Under the 2026 scheme RBI swaps them at par — <u>RBI, not the bank, bears the hedging cost</u>. So the bank's rupee funding cost from FCNR is far lower than the headline rate suggests.<br>② Scale: FCNR(B) mobilisation reached $132.98 bn (≈ ₹12.6 lakh crore at ~₹95/$) by the 31 Aug close, within a total swap-facility inflow of $143.6 bn. That is large, but because RBI carries the hedge, it does not raise banks' cost the way a rupee deposit at 6–7% would.<br>③ <u>Correction:</u> RBI does not set the repo rate to protect bank margins — its mandate is price stability with growth. As a <i>consequence</i>, though, a hike usually lifts NIMs short-term: repo-linked (EBLR) loans reprice within a quarter while term deposits reprice only on renewal."},
 ta:{t:"வங்கிகள் அதிக FCNR வட்டி கொடுத்தாங்க; NII/NIM-ஐக் காக்க கடன் வட்டி ஏறணும்",you:"வங்கிகள் FCNR-க்கு அதிக வட்டி கொடுத்ததால கடன் வட்டியை ஏத்தணும், இல்லாட்டி NII, NIM குறையும்.",fix:"<b>விளைவு உண்மை தான், ஆனா RBI ஏத்தினதுக்கு இது காரணம் இல்ல.</b><br>① FCNR(B) <u>டாலர்</u> டெபாசிட் (USD-ல ~6%–7.5%). 2026 திட்டத்துல RBI சம மதிப்புல ஸ்வாப் செய்யுது — <u>ஹெட்ஜிங் செலவை வங்கி இல்ல, RBI தாங்குது</u>.<br>② அளவு: ஆகஸ்ட் 31 முடிவுக்குள் FCNR(B) மூலம் $132.98 bn (≈ ₹12.6 லட்சம் கோடி); மொத்த ஸ்வாப் வரவு $143.6 bn. பெரிய தொகை தான், ஆனா ஹெட்ஜிங்கை RBI தாங்குறதால வங்கிகளுக்குச் செலவு அந்த அளவுக்குக் கூடாது.<br>③ <u>திருத்தம்:</u> வங்கி லாபத்தைக் காக்க RBI ரெப்போவை மாற்றாது — அதன் கடமை விலை நிலைத்தன்மை. ஆனா <i>விளைவாக</i>, EBLR கடன்கள் உடனே மாறும், டெபாசிட் புதுப்பிக்கும்போது தான் மாறும் — அதனால குறுகிய காலத்துல NIM கூடும்."}},
{n:6,v:'fix',
 en:{t:"FCNR costs hit RBI's dividend; higher repo helps RBI raise money",you:"FCNR-related costs (absorbing surplus, forex cover for depositors) will reduce RBI's dividend to government. A higher repo helps RBI raise money for these.",fix:"<b>First half correct; second half needs correcting.</b><br>① Correct: under the zero-cost swap RBI carries the currency risk on 3–5-year deposits, plus the cost of absorbing the surplus liquidity. If the rupee falls further, RBI's payout rises and its surplus transfer (dividend) to the government could shrink.<br>② <u>Correction:</u> RBI does not need to raise rates to meet its own expenses. Its mandate is price stability with growth, not its own income — setting policy rates to fund itself would conflict with that mandate. FCNR and liquidity costs are absorbed on RBI's balance sheet and show up, if at all, as a smaller dividend.<br>③ Where you're right in spirit: a firmer rupee from tighter policy lowers the eventual cost of the FCNR swap — an indirect benefit, not a motive."},
 ta:{t:"FCNR செலவு RBI டிவிடெண்டைக் குறைக்கும்; அதிக ரெப்போ RBI-க்கு பணம் திரட்ட உதவும்",you:"FCNR செலவுகளால அரசுக்கு RBI கொடுக்கும் டிவிடெண்ட் குறையும். அதிக ரெப்போ RBI பணம் திரட்ட உதவும்.",fix:"<b>முதல் பாதி சரி; இரண்டாம் பாதி திருத்தணும்.</b><br>① சரி: பூஜ்ஜியச் செலவு ஸ்வாப்பில் 3–5 ஆண்டு நாணய அபாயத்தையும், உபரி லிக்விடிட்டியை உறிஞ்சும் செலவையும் RBI தாங்குது. ரூபாய் இன்னும் சரிஞ்சா, அரசுக்குக் கொடுக்கும் டிவிடெண்ட் குறையலாம்.<br>② <u>திருத்தம்:</u> RBI தன் சொந்தச் செலவைச் சமாளிக்க வட்டியை ஏத்த வேண்டியதில்ல. அதன் கடமை விலை நிலைத்தன்மை, சொந்த வருமானம் இல்ல. FCNR, லிக்விடிட்டி செலவுகள் RBI இருப்புநிலைக் கணக்கில் தாங்கப்படும் — விளைவு அதிகபட்சம் குறைந்த டிவிடெண்ட்.<br>③ மறைமுகமா நீங்க சொன்னது சரி: ரூபாய் வலுப்பட்டா FCNR ஸ்வாப் செலவு குறையும் — இது பலன், நோக்கம் இல்ல."}}
];

 {k:['investor','invest','share','stock','macro','why should','influenc','முதலீ','பங்கு','மேக்ரோ'],en:"Six things move a stock price: earnings, fundamentals, macros, cycle, sentiment and triggers. Each carries a different weight depending on the stock. For banks and rate-sensitive stocks, macros like today's repo hike carry heavy weight; for FMCG, fundamentals dominate. That is why investors need to understand macros.",ta:"பங்கு விலையை ஆறு விஷயங்கள் நகர்த்தும்: லாபம், அடிப்படை, மேக்ரோ, சுழற்சி, உணர்வு, தூண்டுதல். பங்கைப் பொறுத்து ஒவ்வொன்றுக்கும் எடை வேறுபடும். வங்கி, வட்டி சார்ந்த பங்குகளுக்கு இன்னைக்கு ரெப்போ ஏற்றம் போன்ற மேக்ரோவுக்கு அதிக எடை; FMCG-க்கு அடிப்படை ஆதிக்கம். அதனால தான் முதலீட்டாளர் மேக்ரோவைப் புரிஞ்சுக்கணும்."},
 {k:['why','reason','hike','raise','ஏன்','காரணம்','ஏத்த'],en:"RBI hiked by 25 basis points to 5.50% mainly because inflation is rising — 4.82% in August, up every month since May — and the outlook is worse, with crude above 100 dollars, the rupee near 95 and a weak monsoon. Growth is strong at 7.8 percent, so RBI could afford it.",ta:"RBI 25 பேசிஸ் பாயிண்ட் ஏத்தி 5.50% ஆக்குச்சு. முக்கியக் காரணம் பணவீக்கம் ஏறுது — ஆகஸ்ட்ல 4.82%. கச்சா 100 டாலருக்கு மேல, ரூபாய் 95 பக்கம், மழையும் பலவீனம். வளர்ச்சி 7.8% வலுவா இருக்கு, அதனால RBI தாங்க முடியும்."},
 {k:['target','4%','four','limit','band','இலக்கு','வரம்பு'],en:"Four percent is RBI's target, not its limit. The tolerance band is two to six percent. August CPI of 4.82 percent is above target but inside the band, so this was a pre-emptive hike.",ta:"நாலு சதவீதம் இலக்கு தான், வரம்பு இல்ல. சகிப்பு வரம்பு ரெண்டிலிருந்து ஆறு சதவீதம். ஆகஸ்ட் 4.82% வரம்புக்குள்ள தான் — இது முன்கூட்டிய ஏற்றம்."},
 {k:['fed','america','us ','gap','spread','அமெரிக்கா','இடைவெளி'],en:"The US Fed hiked to 4 percent on 16 September, cutting the repo-Fed gap to 125 basis points. Today's hike restores it to 150. It's a supporting reason; RBI's mandate is inflation, not a fixed Fed spread.",ta:"அமெரிக்க Fed செப்டம்பர் 16 அன்று 4%-க்கு ஏத்துச்சு. இடைவெளி 125 ஆச்சு, இன்னைக்கு 150 ஆச்சு. இது துணைக் காரணம் தான்."},
 {k:['fcnr','nri','deposit','swap','டெபாசிட்'],en:"RBI's swap facility drew 143.6 billion dollars, of which 132.98 billion came through FCNR deposits before the window closed on 31 August. RBI swaps those dollars at zero cost, so RBI, not banks, bears the currency risk. That's why it can reduce RBI's surplus transfer to government if the rupee weakens further.",ta:"RBI ஸ்வாப் வசதி மூலம் 143.6 பில்லியன் டாலர் வந்துச்சு; அதில FCNR மூலம் 132.98 பில்லியன், ஆகஸ்ட் 31 அன்று சாளரம் மூடும் முன். RBI பூஜ்ஜியச் செலவில் ஸ்வாப் செய்யுது, அதனால நாணய அபாயம் RBI மேல."},
 {k:['vrrr','liquidity','surplus','லிக்விடிட்டி','உபரி'],en:"Surplus liquidity peaked around 10 to 11 lakh crore rupees and RBI drained it below 5 lakh crore using VRRR, bond sales and FX swaps. That curbs inflation risk from idle money. RBI does not need to raise rates to cover what these operations cost it.",ta:"உபரி லிக்விடிட்டி 10-11 லட்சம் கோடி வரை போச்சு; VRRR, பாண்ட் விற்பனை மூலம் 5 லட்சம் கோடிக்குக் கீழ வந்துச்சு. அந்தச் செலவைச் சமாளிக்க RBI வட்டியை ஏத்த வேண்டியதில்ல."},
 {k:['nim','nii','bank','margin','வங்கி'],en:"Bank margins usually improve briefly after a hike because repo-linked loans reprice within a quarter while term deposits reprice only on renewal. But protecting bank margins is a consequence, not a reason RBI hikes.",ta:"ஏற்றத்துக்கு அப்புறம் வங்கி NIM சிறிது காலம் கூடும் — கடன்கள் வேகமா மாறும், டெபாசிட் தாமதமா மாறும். ஆனா இது விளைவு, காரணம் இல்ல."},
 {k:['dividend','surplus transfer','government','டிவிடெண்ட்','அரசு'],en:"RBI does not need to raise rates to meet its own expenses; its mandate is price stability. The FCNR swap risk could reduce its dividend, but a firmer rupee from tighter policy lowers that cost indirectly.",ta:"RBI தன் சொந்தச் செலவுக்காக வட்டியை ஏத்த வேண்டியதில்ல. FCNR ஸ்வாப் அபாயம் டிவிடெண்டைக் குறைக்கலாம், ஆனா ரூபாய் வலுப்பட்டா அந்தச் செலவு குறையும்."},
 {k:['emi','loan','home','கடன்','இஎம்ஐ'],en:"For a 50 lakh, 20-year loan at 7.5 percent, a 25 basis point rise adds roughly 770 rupees a month. Use the EMI calculator in the Who Gets Hit tab for your own numbers.",ta:"50 லட்சம், 20 ஆண்டு, 7.5% கடனுக்கு 25 பேசிஸ் பாயிண்ட் ஏற்றம் மாதம் சுமார் 770 ரூபாய் கூடும். 'யாருக்கு பாதிப்பு' பகுதியில் கணக்கி இருக்கு."},
 {k:['china','சீனா'],en:"China can ignore US rates mainly because of capital controls, a managed currency and low inflation. Its trade surplus helps, but money can't freely leave China the way foreign portfolio money leaves India.",ta:"சீனா மூலதனக் கட்டுப்பாடு, கட்டுப்படுத்தப்பட்ட நாணயம், குறைந்த பணவீக்கம் இவற்றால US ரேட்டைப் புறக்கணிக்க முடியுது."},
 {k:['next','december','future','அடுத்து','டிசம்பர்'],en:"The stance is now calibrated tightening, so the next move is a hike or a pause — no cuts. SBI Research and HSBC both expected another 25 basis points in December. The September CPI comes out on 12 October.",ta:"நிலைப்பாடு இப்போ படிப்படியான இறுக்கம் — அடுத்து ஏற்றமோ இடைநிறுத்தமோ தான். SBI, HSBC டிசம்பர்ல இன்னொரு 25 எதிர்பார்க்கிறாங்க. செப்டம்பர் CPI அக்டோபர் 12."},
 {k:['oil','crude','petrol','எண்ணெய்','கச்சா'],en:"Crude crossed 100 dollars a barrel. Oil companies are absorbing part of it, but wholesale inflation is already 9.92 percent, so the pass-through to retail prices is still coming.",ta:"கச்சா 100 டாலரைத் தாண்டிடுச்சு. மொத்தப் பணவீக்கம் ஏற்கனவே 9.92%; சில்லறை விலைக்கு இனிமே தான் வரும்."}
