 <li>${t(L('"Others lagging" applies to the four that have reported. Kaynes (Q1 revenue +40%) and Avalon (guide raised to 26–30%) are still to come.','"மத்தவங்க பின்தங்கல்" ரிசல்ட் வந்த 4 பேருக்கு தான். Kaynes (Q1 வருவாய் +40%), Avalon (கைடன்ஸ் 26–30%) இன்னும் வரணும்.'))}</li></ul></div>
 <div class="card"><h3>${t(L('What must hold for the lead to continue','முன்னிலை தொடர என்ன நடக்கணும்'))}</h3><ul>
 <li>${t(L('2-Nov call: FY27 guidance raised (H1 growth of 71% vs a 35% guide).','2-Nov கால்: FY27 கைடன்ஸ் உயர்வு (H1 71% vs 35% கைடன்ஸ்).'))}</li>
 <li>${t(L('Gross margin stabilises at or above ~21%; EBITDA margin stays within the 10.5–11% guide for the year.','கிராஸ் மார்ஜின் ~21%-ல நிலைக்கணும்; வருஷ EBITDA மார்ஜின் 10.5–11% கைடன்ஸுக்குள்ள.'))}</li>
 <li>${t(L('Net working capital stays at or below ~65 days and the company stays net cash.','நெட் வொர்க்கிங் கேப்பிடல் ~65 நாளுக்குள்ள, நெட் கேஷ் தொடரணும்.'))}</li>
 <li>${t(L('PCB trial in Dec-2026 and commercial start ~Apr-2027 on time.','PCB டிரையல் டிச-2026, வணிக தயாரிப்பு ~ஏப்-2027 நேரத்துக்கு.'))}</li>
 <li>${t(L('Q3 revenue at or above ~₹2,000 cr (holding Q2’s run-rate).','Q3 வருவாய் ~₹2,000 கோடி அல்லது அதுக்கு மேல (Q2 வேகம் தொடரணும்).'))}</li></ul></div></div>`}

 dixon:{nodes:[
  {id:'cu',x:10,y:190,w:150,h:110,c:'#6c8ebf',t:L('Indian consumers & telcos','இந்திய நுகர்வோர் & டெலிகாம்'),s:L('Phones, laptops, routers, TVs · mobile exports','போன், லேப்டாப், ரவுட்டர், TV · மொபைல் ஏற்றுமதி'),e:L('End demand is mainly Indian consumers buying mid- and low-priced smartphones, plus telecom operators and enterprises (network gear, laptops). The Indian smartphone market was estimated to have shrunk 15–20% YoY in Q2 as memory prices pushed phone prices up.','கடைசி டிமாண்ட் பெரும்பாலும் நடுத்தர, குறைந்த விலை ஸ்மார்ட்போன் வாங்கற இந்திய நுகர்வோர்; கூடவே டெலிகாம் நிறுவனங்கள், வணிகங்கள் (நெட்வொர்க் கருவி, லேப்டாப்). மெமரி விலையால போன் விலை ஏறி, Q2-ல இந்திய ஸ்மார்ட்போன் மார்க்கெட் 15–20% YoY சுருங்கினதா கணிப்பு.')},
  {id:'ch',x:180,y:180,w:150,h:130,c:'#8a7bc8',t:L('Brands (OEM/ODM)','பிராண்டுகள் (OEM/ODM)'),s:L('Cost-plus contracts · Vivo JV (51:49) from Q3','செலவு+கட்டண ஒப்பந்தம் · Vivo JV (51:49) Q3-ல இருந்து'),e:L('Dixon builds for phone, telecom and IT brands on largely cost-plus terms: component cost is passed through, and Dixon earns a conversion fee. That protects rupee profit but gives thin margins, and rising component prices shrink the margin %. The Vivo JV (51:49, approved July 2026) starts in Q3 FY27.','போன், டெலிகாம், IT பிராண்டுகளுக்கு பெரும்பாலும் செலவு+கட்டண முறையில தயாரிப்பு — பார்ட்ஸ் செலவு கடத்தப்படும், டிக்சனுக்கு கன்வெர்ஷன் கட்டணம். ரூபாய் லாபம் பாதுகாப்பு, ஆனா மார்ஜின் மெல்லியது; பார்ட்ஸ் விலை ஏறினா % சுருங்கும். Vivo JV (51:49, ஜூலை 2026 அனுமதி) Q3 FY27-ல ஆரம்பம்.')},
  {id:'co',x:350,y:150,w:170,h:190,c:'#e8730c',t:L('Dixon Technologies','டிக்சன் டெக்னாலஜிஸ்'),s:L('Noida · Chennai · Tirupati · camera & display modules','நொய்டா · சென்னை · திருப்பதி · கேமரா & டிஸ்ப்ளே மாட்யூல்'),e:L('Large assembly campuses plus a push into components — camera modules (capacity tripling to 180–190 mn), display modules, and the HKC display JV. Components are the main lever to lift margins from Q4 FY27.','பெரிய அசெம்ப்ளி வளாகங்கள் + பார்ட்ஸ் தயாரிப்பு — கேமரா மாட்யூல் (கேப்பாசிட்டி மூணு மடங்கா 180–190 மில்லியன்), டிஸ்ப்ளே மாட்யூல், HKC டிஸ்ப்ளே JV. Q4 FY27-ல இருந்து மார்ஜின் ஏற இதுதான் முக்கிய கருவி.')},
  {id:'s1',x:545,y:20,w:165,h:58,c:'#2f6fb0',t:L('Mobiles ~₹10,700 cr†','மொபைல் ~₹10,700 கோடி†'),s:L('~69% (Q1 FY27 split)','~69% (Q1 FY27 பிரிவு)'),e:L('Smartphones (and some wearables) are the core. FY27 guidance is 32–33 mn units excluding Vivo — flat despite a shrinking market, which implies share gains. Q2 volume was guided at ~9–9.2 mn units.','ஸ்மார்ட்போன் தான் முதுகெலும்பு. FY27 கைடன்ஸ் Vivo இல்லாம 32–33 மில்லியன் யூனிட் — சுருங்கும் மார்க்கெட்லயும் தட்டையா; அதாவது பங்கு ஏற்றம். Q2 வால்யூம் கைடன்ஸ் ~9–9.2 மில்லியன்.')},

 syrma:{nodes:[
  {id:'cu',x:10,y:190,w:150,h:110,c:'#6c8ebf',t:L('Indian & global OEMs','இந்திய & குளோபல் OEM'),s:L('74% India · 26% exports (▲91%)','74% இந்தியா · 26% ஏற்றுமதி (▲91%)'),e:L('Customers are OEMs across five industries in India and abroad. Exports were ₹513.8 cr (+91%), 26% of revenue. Higher-margin export programmes are a deliberate focus, but India is still three-quarters of the business, so no single market dominates.','5 துறைகள்ல இந்திய, வெளிநாட்டு OEM-கள் கஸ்டமர்கள். ஏற்றுமதி ₹513.8 கோடி (+91%), வருவாய்ல 26%. அதிக மார்ஜின் ஏற்றுமதி மேல கவனம்; ஆனா இந்தியா முக்கால் பங்கு — ஒரே மார்க்கெட்டை நம்பல.')},
  {id:'ch',x:180,y:180,w:150,h:130,c:'#8a7bc8',t:L('EMS + ODM contracts','EMS + ODM ஒப்பந்தம்'),s:L('ODM ~17% of sales · order book ₹6,770 cr','ODM ~17% · ஆர்டர் புக் ₹6,770 கோடி'),e:L('Most work is build-to-print EMS, but about 17% is ODM, where Syrma owns the design and earns better margins (target ~25% of revenue). The order book was ₹6,770 cr in June 2026, ~₹5,400 cr of it executable within 12 months.','பெரும்பாலும் பில்ட்-டு-பிரின்ட் EMS; ஆனா ~17% ODM — டிசைன் சிர்மாவோடது, மார்ஜின் அதிகம் (இலக்கு ~25%). ஜூன் 2026 ஆர்டர் புக் ₹6,770 கோடி; ~₹5,400 கோடி 12 மாசத்துக்குள்ள.')},
  {id:'co',x:350,y:150,w:170,h:190,c:'#e8730c',t:L('Syrma SGS','சிர்மா SGS'),s:L('PCBA · box build · RFID · magnetics · PCB campus (AP)','PCBA · பாக்ஸ் பில்ட் · RFID · மேக்னடிக்ஸ் · PCB வளாகம் (AP)'),e:L('The factory network builds PCB assemblies, box builds, RFID tags and magnetics. It is moving upstream: a bare-PCB campus at Naidupeta (Andhra Pradesh) with ECMS support, defence electronics through Elcome (60%), and JVs with Elemaster (Italy) and Kaga (Japan).','PCB அசெம்ப்ளி, பாக்ஸ் பில்ட், RFID, மேக்னடிக்ஸ் தயாரிப்பு. மேல் நோக்கி போகுது: நாயுடுபேட்டா (ஆந்திரா) PCB வளாகம் (ECMS ஆதரவு), Elcome (60%) மூலம் டிஃபென்ஸ், Elemaster (இத்தாலி), Kaga (ஜப்பான்) JV.')},
  {id:'s1',x:545,y:20,w:165,h:58,c:'#7b4fb3',t:L('Consumer ₹573 cr','கன்ஸ்யூமர் ₹573 கோடி'),s:L('29% · ▲ 57%','29% · ▲ 57%'),e:L('The largest but lowest-margin vertical (29%, +57%). Its share is falling (32% a year ago, 34% in Q1), which helps the mix.','பெரிய, ஆனா குறைஞ்ச மார்ஜின் பிரிவு (29%, +57%). இதோட பங்கு குறையுது (போன வருஷம் 32%, Q1-ல 34%) — மிக்ஸுக்கு நல்லது.')},
  {id:'s2',x:545,y:88,w:165,h:58,c:'#2f6fb0',t:L('Automotive ₹517 cr','ஆட்டோமோட்டிவ் ₹517 கோடி'),s:L('26% · ▲ 91%','26% · ▲ 91%'),e:L('Fastest-growing vertical (+91% YoY, +31% QoQ), driven by EV and auto-electronics content and export programmes.','வேகமா வளர்ற பிரிவு (+91% YoY, +31% QoQ) — EV, ஆட்டோ எலக்ட்ரானிக்ஸ், ஏற்றுமதி புரோகிராம்கள்.')},
  {id:'s3',x:545,y:156,w:165,h:58,c:'#1f9d55',t:L('Industrials ₹494 cr','இண்டஸ்ட்ரியல் ₹494 கோடி'),s:L('25% · ▲ 86%','25% · ▲ 86%'),e:L('Industrial controls, power and smart-energy electronics (+86%), plus Elcome’s defence and maritime systems. Typically higher-margin, shorter-duration orders.','இண்டஸ்ட்ரியல் கன்ட்ரோல், பவர், ஸ்மார்ட் எனர்ஜி எலக்ட்ரானிக்ஸ் (+86%) + Elcome டிஃபென்ஸ்/மரைன். பொதுவா அதிக மார்ஜின், குறுகிய ஆர்டர்.')},
  {id:'s4',x:545,y:224,w:165,h:58,c:'#d99a00',t:L('IT & Railways ₹273 cr','IT & ரயில்வே ₹273 கோடி'),s:L('14% · ▲ 69%','14% · ▲ 69%'),e:L('IT hardware and railway electronics (+69% YoY, +82% QoQ); share rose to 14% from 9% in Q1.','IT ஹார்ட்வேர், ரயில்வே எலக்ட்ரானிக்ஸ் (+69% YoY, +82% QoQ); பங்கு Q1-ல 9%-ல இருந்து 14%.')},
  {id:'s5',x:545,y:292,w:165,h:72,c:'#14837b',t:L('Healthcare ₹134 cr','ஹெல்த்கேர் ₹134 கோடி'),s:L('7% · ▲ 61%','7% · ▲ 61%'),e:L('Medical-device electronics (+61%). Small, but high-margin and sticky, and a focus area for ODM.','மருத்துவ கருவி எலக்ட்ரானிக்ஸ் (+61%) — சின்னது, ஆனா அதிக மார்ஜின், நிலையானது; ODM-க்கு முக்கிய பகுதி.')},
  {id:'rv',x:735,y:40,w:155,h:90,c:'#e8a10c',t:L('Revenue ₹1,990 cr','வருவாய் ₹1,990 கோடி'),s:L('▲ 73.6% · ▲ 25% QoQ','▲ 73.6% · ▲ 25% QoQ'),e:L('Revenue from operations ₹1,989.7 cr, +73.6% YoY and +25% QoQ — the highest quarter in Syrma’s history. All five industries grew.','ஆப்பரேஷன்ஸ் வருவாய் ₹1,989.7 கோடி, +73.6% YoY, +25% QoQ — சிர்மா வரலாற்றுலயே அதிகம்; 5 துறையும் வளர்ந்துச்சு.')},
  {id:'cs',x:735,y:150,w:155,h:100,c:'#a0522d',t:L('Costs','செலவுகள்'),s:L('Materials ~79% · opex flat QoQ','மெட்டீரியல் ~79% · opex QoQ அப்படியே'),e:L('Gross margin fell to 21.1% (23.8%) as component costs rose and the mix shifted. Operating expenses stayed flat QoQ (₹227.8 cr → ₹226.1 cr) while revenue rose 25%. That operating leverage is why profit grew faster than revenue.','பார்ட்ஸ் விலை, மிக்ஸ் மாற்றத்தால கிராஸ் மார்ஜின் 23.8%-ல இருந்து 21.1%. ஆனா வருவாய் 25% ஏறியும் ஆப்பரேட்டிங் செலவு QoQ அப்படியே (₹227.8 → ₹226.1 கோடி) — இந்த லெவரேஜ் தான் லாபம் வருவாயை விட வேகமா வளர காரணம்.')},
  {id:'pr',x:735,y:270,w:155,h:95,c:'#1f9d55',t:L('EBITDA ₹203 cr','EBITDA ₹203 கோடி'),s:L('10.2% · PAT ₹124 cr (6.2%)','10.2% · PAT ₹124 கோடி (6.2%)'),e:L('EBITDA ₹203.1 cr (10.2%), PBT ₹165.2 cr (8.3%), PAT ₹124.2 cr (6.2%, up from 5.7%). RoCE rose to 17.9% (21.4% excluding goodwill).','EBITDA ₹203.1 கோடி (10.2%), PBT ₹165.2 கோடி (8.3%), PAT ₹124.2 கோடி (6.2%; முன்பு 5.7%). RoCE 17.9% (குட்வில் நீக்கினா 21.4%).')}

 formula:L('Revenue ≈ order-book conversion (₹6,770 cr book, ~₹5,400 cr executable in 12 months) spread across five industries; margin levers = ODM share (17% → 25% target) + export share (26%) + operating leverage','வருவாய் ≈ ஆர்டர் புக் மாற்றம் (₹6,770 கோடி, 12 மாசத்துல ~₹5,400 கோடி) × 5 துறைகள்; மார்ஜின் கருவிகள் = ODM பங்கு (17% → 25% இலக்கு) + ஏற்றுமதி (26%) + ஆப்பரேட்டிங் லெவரேஜ்'),
 engine:[[L('Order book','ஆர்டர் புக்'),L('₹6,770 cr (Jun-26, +23%)','₹6,770 கோடி (ஜூன்-26, +23%)'),'▲',L('~₹5,400 cr executable in 12 months','12 மாசத்துல ~₹5,400 கோடி')],[L('Exports','ஏற்றுமதி'),'₹514 cr (▲91%)','▲',L('FY27 target ₹1,500–1,600 cr; better margins','FY27 இலக்கு ₹1,500–1,600 கோடி; அதிக மார்ஜின்')],[L('ODM share','ODM பங்கு'),'~17%','▲',L('Target ~25%; FY27 ODM ₹1,100–1,200 cr','இலக்கு ~25%; FY27 ODM ₹1,100–1,200 கோடி')],[L('Net working capital','நெட் வொர்க்கிங் கேப்பிடல்'),L('63 days','63 நாள்'),'▲',L('Down from 73 a year ago — growth without cash strain','போன வருஷம் 73 — கேஷ் சிரமமில்லாம வளர்ச்சி')],[L('Gross margin','கிராஸ் மார்ஜின்'),'21.1%','▼',L('Down from 23.8%: component costs and mix','23.8%-ல இருந்து குறைவு: பார்ட்ஸ் விலை, மிக்ஸ்')],[L('PCB plant (Naidupeta)','PCB பிளான்ட் (நாயுடுபேட்டா)'),L('Commercial ~Apr-2027','வணிக தயாரிப்பு ~ஏப்-2027'),'▲',L('ECMS incentive 4–10% of revenue for 6 years','6 வருஷம் வருவாய்ல 4–10% ECMS ஊக்கத்தொகை')]],
 mix:{labels:['Consumer','Automotive','Industrials','IT & Railways','Healthcare'],labelsTa:['கன்ஸ்யூமர்','ஆட்டோமோட்டிவ்','இண்டஸ்ட்ரியல்','IT & ரயில்வே','ஹெல்த்கேர்'],data:[572.7,516.9,493.5,272.7,134.0],title:L('Q2 FY27 revenue by industry (₹ crore)','Q2 FY27 துறை வாரியான வருவாய் (₹ கோடி)')}},
 cdlm:{nodes:[
  {id:'cu',x:10,y:190,w:150,h:110,c:'#6c8ebf',t:L('Global OEMs','குளோபல் OEM-கள்'),s:L('93% overseas · 7% India','93% வெளிநாடு · 7% இந்தியா'),e:L('Customers are global aerospace, industrial, medical and defence OEMs. 93% of revenue comes from overseas customers, so US/EU demand, tariffs and the dollar matter more than Indian demand.','கஸ்டமர்கள் குளோபல் ஏரோஸ்பேஸ், இண்டஸ்ட்ரியல், மெடிக்கல், டிஃபென்ஸ் OEM-கள். வருவாய்ல 93% வெளிநாட்டுல இருந்து — அதனால இந்திய டிமாண்டை விட US/EU டிமாண்ட், டாரிஃப், டாலர் மதிப்பு தான் முக்கியம்.')},
  {id:'ch',x:180,y:180,w:150,h:130,c:'#8a7bc8',t:L('Contracts','கான்ட்ராக்ட்ஸ்'),s:L('Build-to-print & build-to-spec · 18–24 m execution','பில்ட்-டு-பிரின்ட் & பில்ட்-டு-ஸ்பெக் · 18–24 மாசம்'),e:L('Work arrives as multi-year contracts. Build-to-print means making the customer’s design; build-to-spec means co-designing it, which earns better margins. Four build-to-spec programmes worth about $1 billion are signed but not yet in the order book (production from FY29).','வேலை பல வருஷ கான்ட்ராக்டா வருது. பில்ட்-டு-பிரின்ட் = கஸ்டமர் டிசைன் படி செய்யறது; பில்ட்-டு-ஸ்பெக் = சேர்ந்து டிசைன் பண்றது, அதுல மார்ஜின் அதிகம். சுமார் $1 பில்லியன் மதிப்புள்ள 4 பில்ட்-டு-ஸ்பெக் புரோகிராம் கையெழுத்தாகியிருக்கு, ஆனா இன்னும் ஆர்டர் புக்ல சேரல (FY29-ல இருந்து தயாரிப்பு).')},
  {id:'co',x:350,y:150,w:170,h:190,c:'#e8730c',t:L('Cyient DLM','சையன்ட் DLM'),s:L('Order book ₹2,814 cr · PCBA 48% · Box build 27%','ஆர்டர் புக் ₹2,814 கோடி · PCBA 48% · பாக்ஸ் பில்ட் 27%'),e:L('The factory turns orders into PCB assemblies (48% of revenue), complete box builds (27%, growing 85%) and cable harnesses. Box build is the higher-value step because more of the product is made in-house.','ஃபேக்டரி ஆர்டர்களை PCB அசெம்ப்ளி (48%), முழு பாக்ஸ் பில்ட் (27%, 85% வளர்ச்சி), கேபிள் ஹார்னஸா மாத்துது. பாக்ஸ் பில்ட்ல அதிக வேலை உள்ளேயே நடக்கறதால அது அதிக மதிப்புள்ள படி.')},
  {id:'s1',x:545,y:40,w:165,h:70,c:'#2f6fb0',t:L('Aerospace 47%','ஏரோஸ்பேஸ் 47%'),s:L('▲ 62% YoY','▲ 62% YoY'),e:L('Largest and fastest-growing vertical (+62%). It needs long qualifications (AS9100), which keeps competitors out once a supplier is approved.','பெரிய, வேகமா வளர்ற பிரிவு (+62%). AS9100 மாதிரி நீண்ட தகுதி சோதனை வேணும்; ஒரு தடவை அப்ரூவ் ஆனா போட்டியாளர் உள்ள வர்றது கஷ்டம்.')},
  {id:'s2',x:545,y:125,w:165,h:70,c:'#1f9d55',t:L('Industrial 31%','இண்டஸ்ட்ரியல் 31%'),s:L('▲ 29% YoY','▲ 29% YoY'),e:L('Industrial equipment, energy and semiconductor-equipment electronics. Up 29%.','இண்டஸ்ட்ரியல் கருவி, எனர்ஜி, செமிகண்டக்டர் கருவி எலக்ட்ரானிக்ஸ் — 29% வளர்ச்சி.')},
  {id:'s3',x:545,y:210,w:165,h:70,c:'#7b4fb3',t:L('MedTech 14%','மெட்டெக் 14%'),s:L('▲ 14% YoY','▲ 14% YoY'),e:L('Medical devices. Steady, regulated, with long product lives.','மருத்துவ கருவிகள் — நிலையான, கட்டுப்பாடு உள்ள, நீண்ட காலம் ஓடும் பொருட்கள்.')},
  {id:'s4',x:545,y:295,w:165,h:70,c:'#d64545',t:L('Defence 7%','டிஃபென்ஸ் 7%'),s:L('▲ 13% YoY','▲ 13% YoY'),e:L('Defence electronics. Small today; lumpy orders.','டிஃபென்ஸ் எலக்ட்ரானிக்ஸ் — இப்போ சின்னது; ஆர்டர் விட்டு விட்டு வரும்.')},
  {id:'rv',x:735,y:40,w:155,h:90,c:'#e8a10c',t:L('Revenue ₹393 cr','வருவாய் ₹393 கோடி'),s:L('▲ 26.5% · H1 ▲ 30%','▲ 26.5% · H1 ▲ 30%'),e:L('Q2 revenue ₹393.1 cr, +26.5% YoY and +5.2% QoQ. Material shortages and customer-side delays slowed growth from 35% in Q1.','Q2 வருவாய் ₹393.1 கோடி, +26.5% YoY, +5.2% QoQ. பார்ட்ஸ் பற்றாக்குறை, கஸ்டமர் தாமதத்தால Q1-ல இருந்த 35% வளர்ச்சி குறைஞ்சது.')},
  {id:'cs',x:735,y:150,w:155,h:100,c:'#a0522d',t:L('Costs','செலவுகள்'),s:L('Materials · people · product development','மெட்டீரியல் · ஆட்கள் · புராடக்ட் டெவலப்மென்ட்'),e:L('Materials are the biggest cost and rose faster than revenue. Sales-team and product-development spending is fully expensed, not capitalised, which costs 100–150 bps of margin.','மெட்டீரியல் தான் பெரிய செலவு — வருவாயை விட வேகமா ஏறுச்சு. சேல்ஸ் டீம், புராடக்ட் டெவலப்மென்ட் செலவு முழுசா செலவுக்கணக்குல போடறாங்க (கேப்பிடலைஸ் பண்ணல) — 100–150 bps மார்ஜின் போகுது.')},
  {id:'pr',x:735,y:270,w:155,h:95,c:'#1f9d55',t:L('EBITDA ₹34 cr','EBITDA ₹34 கோடி'),s:L('8.7% · norm. PAT ₹15.8 cr','8.7% · நார்ம். PAT ₹15.8 கோடி'),e:L('EBITDA ₹34.2 cr (8.7%); normalised PAT ₹15.8 cr. Reported PAT of ₹34.0 cr includes a one-time ₹18.2 cr gain.','EBITDA ₹34.2 கோடி (8.7%); நார்மலைஸ்டு PAT ₹15.8 கோடி. அறிவித்த PAT ₹34.0 கோடில ₹18.2 கோடி ஒருமுறை லாபம் சேர்ந்திருக்கு.')}

  {id:'cu',x:10,y:190,w:150,h:110,c:'#6c8ebf',t:L('Indian households','இந்திய வீடுகள்'),s:L('Buy ACs, washers, coolers, TVs','AC, வாஷர், கூலர், TV வாங்குறவங்க'),e:L('End demand comes from Indian homes, so summer heat, urban incomes and GST decide volumes. Q1 (Apr–Jun) is the AC peak; Q2 is seasonally weak.','கடைசி டிமாண்ட் இந்திய வீடுகள்ல இருந்து — வெயில், நகர வருமானம், GST தான் வால்யூமை தீர்மானிக்குது. Q1 (ஏப்–ஜூன்) AC உச்சம்; Q2 வழக்கமா குறைவு.')},

function bmSVG(id){
 const d=BM[id],N={};d.nodes.forEach(n=>N[n.id]=n);
 let s=`<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar${id}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b07a4a"/></marker></defs>`;
 d.links.forEach(([a,b])=>{const A=N[a],B=N[b];let x1,y1,x2,y2;
  if(Math.abs(A.x-B.x)<5){x1=A.x+A.w/2;y1=A.y+A.h;x2=B.x+B.w/2;y2=B.y}else{x1=A.x+A.w;y1=A.y+A.h/2;x2=B.x;y2=B.y+B.h/2}
  s+=`<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" stroke="#d2a77d" stroke-width="2" fill="none" marker-end="url(#ar${id})"/>`});
 d.nodes.forEach(n=>{s+=`<g class="node" id="nd_${id}_${n.id}" onclick="bmTap('${id}','${n.id}')"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="${n.c}" opacity=".93"/>
 <foreignObject x="${n.x+4}" y="${n.y+4}" width="${n.w-8}" height="${n.h-8}"><div xmlns="http://www.w3.org/1999/xhtml" style="color:#fff;font-size:13px;line-height:1.25;height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center"><b style="font-size:14px">${t(n.t)}</b><span style="font-size:11.5px;opacity:.95">${t(n.s)}</span></div></foreignObject></g>`});
 return s+`</svg>`;
}
function bmTap(id,nid){document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel'));const el=document.getElementById(`nd_${id}_${nid}`);if(el)el.classList.add('sel');
 const n=BM[id].nodes.find(x=>x.id===nid);document.getElementById('bmEx').innerHTML=`<b>${t(n.t)}</b> — ${t(n.e)}`}

const DXWC={
  a:L('Dixon’s half-year balance sheet and working-capital days were not in the material available; they will come with the investor presentation. Historically Dixon runs a very lean cycle: as a cost-plus assembler, much of the component risk sits with brands, and suppliers are paid roughly in step with customer collections.','டிக்சனோட H1 பேலன்ஸ் ஷீட், வொர்க்கிங் கேப்பிடல் நாட்கள் கிடைச்ச தகவல்ல இல்ல; இன்வெஸ்டர் பிரசன்டேஷன்ல வரும். பழைய போக்கு: டிக்சன் ரொம்ப குறைஞ்ச சைக்கிள்ல ஓடும் — செலவு+கட்டண அசெம்ப்ளரா, பார்ட்ஸ் ரிஸ்க் பெரும்பாலும் பிராண்டுகிட்ட; சப்ளையருக்கு கஸ்டமர் பணம் வர்ற அதே வேகத்துல செலுத்துவாங்க.'),
  b:L('<b>The one disclosed pressure point:</b> a subsidiary carries <b>₹1,110 cr of PLI receivables</b> awaiting formal determination and disbursement by the scheme’s project-management agency, against a related customer liability of ₹577 cr. The auditors highlighted this (without modifying their review). Until that cash arrives, roughly ₹533 cr† net is tied up — about 1.5 quarters of operating EBITDA.','<b>வெளியிட்ட ஒரே அழுத்தம்:</b> ஒரு சப்சிடியரிக்கு <b>₹1,110 கோடி PLI வரவேண்டியது</b> — திட்ட நிர்வாக ஏஜென்சி தீர்மானிச்சு வழங்கணும்; தொடர்புடைய கஸ்டமர் பொறுப்பு ₹577 கோடி. ஆடிட்டர்கள் இதை சுட்டிக்காட்டியிருக்காங்க (ரிவ்யூ முடிவை மாற்றல). இந்த பணம் வர்ற வரைக்கும் சுமார் ₹533 கோடி† நெட் மாட்டியிருக்கு — சுமார் 1.5 காலாண்டு ஆப்பரேட்டிங் EBITDA.'),
  c:L('<b>Link to CFO and cash conversion:</b> with a 2.7% margin, even a few extra days of inventory (memory chips bought at higher prices) can absorb a quarter’s profit. Check H1 CFO against adjusted PAT (₹633 cr before minority interest) when the presentation is out; CFO/PAT below ~0.7x would be a warning sign.','<b>CFO, கேஷ் கன்வெர்ஷன் தொடர்பு:</b> 2.7% மார்ஜின்ல, சில நாள் கூடுதல் இன்வென்டரி (அதிக விலை மெமரி சிப்) கூட ஒரு காலாண்டு லாபத்தை விழுங்கிடும். பிரசன்டேஷன் வந்ததும் H1 CFO-வை அட்ஜஸ்டட் PAT-ஓட (மைனாரிட்டிக்கு முன் ₹633 கோடி) ஒப்பிடுங்க; CFO/PAT ~0.7x-க்கு கீழனா எச்சரிக்கை.')};
function rWC(){const id=SUB.wc,c=CO[id],w=c.wc;
 const txt=id==='dixon'?DXWC:id==='syrma'?SYWC:id==='cdlm'?{
  a:L('Cyient DLM carries about <b>162 days of inventory</b>. Aerospace and industrial programmes use thousands of part numbers with long lead times, and material shortages make the company stock up early. Customers pay in ~73 days and suppliers are paid in ~68 days, so the business funds roughly <b>153 days of operations</b> itself. That improved from 161 days in Q1.','சையன்ட் DLM-கிட்ட சுமார் <b>162 நாள் இன்வென்டரி</b> இருக்கு — ஏரோஸ்பேஸ், இண்டஸ்ட்ரியல் புரோகிராம்களுக்கு ஆயிரக்கணக்கான பார்ட்ஸ், நீண்ட டெலிவரி காலம், தட்டுப்பாடு — அதனால முன்னாடியே வாங்கி வைக்கிறாங்க. கஸ்டமர் ~73 நாள்ல பணம் தர்றாங்க, சப்ளையருக்கு ~68 நாள்ல குடுக்கறாங்க — அதனால சுமார் <b>153 நாள்</b> வேலையை சொந்த பணத்துல ஓட்டணும் (Q1-ல 161 நாள், கொஞ்சம் முன்னேற்றம்).'),
  b:L('<b>Link to CFO:</b> H1 operating cash flow was only ₹14.8 cr, against reported PAT of ₹50.3 cr (CFO/PAT 0.29x). A year ago it was ₹139.7 cr. Profit is being reinvested in inventory and receivables as revenue grows 30%. Q2 operating FCF of ₹17.2 cr is the first sign of improvement.','<b>CFO-கூட தொடர்பு:</b> H1 ஆப்பரேட்டிங் கேஷ் ஃப்ளோ வெறும் ₹14.8 கோடி; அறிவித்த PAT ₹50.3 கோடி (CFO/PAT 0.29x). போன வருஷம் ₹139.7 கோடி. வருவாய் 30% வளரும்போது லாபம் இன்வென்டரி, வரவேண்டிய பணத்துல மாட்டிக்குது. Q2 ஆப்பரேட்டிங் FCF ₹17.2 கோடி — முன்னேற்றத்தோட முதல் அறிகுறி.'),
  c:L('<b>Cash conversion verdict:</b> weak. Every ₹100 of extra revenue needs about ₹42 of extra working capital (153/365). Watch for CCC below 140 days and CFO/PAT above 0.7x in H2.','<b>கேஷ் கன்வெர்ஷன் தீர்ப்பு:</b> பலவீனம். கூடுதலா ₹100 வருவாய்க்கு சுமார் ₹42 கூடுதல் வொர்க்கிங் கேப்பிடல் தேவை (153/365). H2-ல CCC 140 நாளுக்கு கீழயும் CFO/PAT 0.7x-க்கு மேலயும் வருதான்னு பாருங்க.')}
 :{
  a:L('PGEL’s inventory rose to <b>97 days</b> (87 a year ago) because commodity prices are higher and it stocked up for a strong order book. Payable days stretched to 72 (50), which funded part of that. Receivable days, derived from the reported cycle, rose to about 42 (27). The <b>cash conversion cycle is 68 days</b> (64).','மூலப்பொருள் விலை ஏற்றமும் நல்ல ஆர்டர் புக்கும் — அதனால PGEL இன்வென்டரி <b>97 நாள்</b> (போன வருஷம் 87). சப்ளையருக்கு செலுத்த 72 நாள் (50) ஆயிடுச்சு — அது கொஞ்சம் பணம் குடுத்துச்சு. வரவேண்டிய நாட்கள் (கணக்கிட்டது) ~42 (27). <b>கேஷ் கன்வெர்ஷன் சைக்கிள் 68 நாள்</b> (64).'),
  b:L('<b>Link to CFO:</b> CFO for H1 was not disclosed. The balance sheet shows the effect: a ₹146 cr net cash position became ₹291 cr net debt in 12 months (a ~₹437 cr swing, about ₹400 cr of it FY27 capex). Management says all capex advances are paid and H2 working capital is tied up, and that interest should not rise much from H1.','<b>CFO-கூட தொடர்பு:</b> H1 CFO வெளியிடல; ஆனா பேலன்ஸ் ஷீட் காட்டுது — 12 மாசத்துல ₹146 கோடி நெட் கேஷ், ₹291 கோடி நெட் கடனா மாறிச்சு (~₹437 கோடி மாற்றம்; இதுல ~₹400 கோடி FY27 கேபெக்ஸ்). கேபெக்ஸ் அட்வான்ஸ் எல்லாம் கட்டியாச்சு, H2 வொர்க்கிங் கேப்பிடல் ஏற்பாடு ஆயாச்சு, H1-ஐ விட வட்டி பெருசா ஏறாதுன்னு நிர்வாகம் சொல்லுது.'),
  c:L('<b>Cash conversion verdict:</b> acceptable but tightening. Seasonality means Q4 and Q1 (AC season) release cash, so judge PGEL on full-year CFO. A ₹70 cr+ PLI receipt and FY28 capex falling to ₹150–200 cr should turn free cash flow positive.','<b>கேஷ் கன்வெர்ஷன் தீர்ப்பு:</b> பரவாயில்ல, ஆனா இறுக்கமாகுது. சீசன் காரணமா Q4, Q1 (AC சீசன்) பணம் வெளியே வரும் — முழு வருஷ CFO-வை வெச்சு தான் தீர்ப்பு சொல்லணும். ₹70 கோடி+ PLI, FY28 கேபெக்ஸ் ₹150–200 கோடிக்கு குறையறது — ஃப்ரீ கேஷ் ஃப்ளோ பாசிட்டிவ் ஆக உதவும்.')};
 return subTabs('wc')+`<div class="card"><h2>${t(c.name)} — ${t(L('working capital & cash conversion','வொர்க்கிங் கேப்பிடல் & கேஷ் கன்வெர்ஷன்'))}</h2>
 <div class="grid g4">${kpi(t(L('Inventory days','இன்வென்டரி நாள்')),w.inv??'n/a','')}${kpi(t(L('Receivable days','வரவேண்டிய நாள்')),w.rec!=null?w.rec+(id==='pgel'?'†':''):'n/a','')}${kpi(t(L('Payable days','செலுத்த நாள்')),w.pay??'n/a','')}${kpi(id==='syrma'?t(L('Net working capital','நெட் வொர்க்கிங் கேப்பிடல்')):t(L('Cash conversion cycle','கேஷ் கன்வெர்ஷன் சைக்கிள்')),w.ccc!=null?w.ccc+' '+t(L('days','நாள்')):'n/a','',w.ccc>100?'dn':'fl')}</div>
 <p style="margin-top:12px">${t(txt.a)}</p><p>${t(txt.b)}</p><p>${t(txt.c)}</p>
 <p class="note">CCC = ${t(L('Inventory days + Receivable days − Payable days','இன்வென்டரி நாள் + வரவேண்டிய நாள் − செலுத்த நாள்'))}${id==='cdlm'?t(L(' − customer advances (13 days)',' − கஸ்டமர் அட்வான்ஸ் (13 நாள்)')):''}</p></div>
 <div class="card"><h2>${t(L('Working-capital days — the two companies side by side','வொர்க்கிங் கேப்பிடல் நாட்கள் — ரெண்டு கம்பெனி ஒப்பீடு'))}</h2><div class="cw"><div><canvas id="wcC"></canvas></div></div>
 <p class="note">${t(L('A high-mix export EMS (Cyient DLM) structurally needs more inventory than a high-volume domestic ODM (PGEL). Compare each against its own history. Syrma discloses only net working capital days (shown in the last group).','ஹை-மிக்ஸ் ஏற்றுமதி EMS (சையன்ட் DLM)-க்கு, ஹை-வால்யூம் உள்நாட்டு ODM (PGEL)-ஐ விட இயல்பாவே அதிக இன்வென்டரி தேவை — ஒவ்வொன்றையும் அதோட பழைய எண்களோட ஒப்பிடுங்க. சிர்மா நெட் வொர்க்கிங் கேப்பிடல் நாள் மட்டும் தர்றாங்க (கடைசி குழு).'))}</p></div>`}
function aWC(){charts.wc=new Chart(document.getElementById('wcC'),{type:'bar',plugins:[valLbl],data:{labels:[t(L('Inventory','இன்வென்டரி')),t(L('Receivables','வரவேண்டியது')),t(L('Payables','செலுத்த வேண்டியது')),t(L('CCC / NWC','CCC / NWC'))],datasets:IDS.map(id=>{const w=CO[id].wc;return {label:t(CO[id].name),data:[w.inv??null,w.rec??null,w.pay??null,w.ccc],backgroundColor:CO[id].color,dec:0}})},options:{maintainAspectRatio:false,scales:{y:{title:{display:true,text:t(L('days','நாள்'))}}}}})}

/* ---------- VALUATION & MARKET ---------- */
const MKT={
 dixon:[L('FY26: a weak second half (Q3/Q4 revenue growth only ~2–4%), lower smartphone guidance and the end of the old mobile PLI pulled the stock down to a 52-week low near ₹9,600.','FY26: பலவீனமான 2-வது பாதி (Q3/Q4 வருவாய் வளர்ச்சி ~2–4% தான்), குறைஞ்ச ஸ்மார்ட்போன் கைடன்ஸ், பழைய மொபைல் PLI முடிவு — பங்கு ~₹9,600 52 வார தாழ்வுக்கு.'),L('6-Jul-2026: +6.1% to ₹13,215 when a foreign brokerage raised its target to ₹16,200 on the speciality-EMS entry; 10-Jul: the Vivo JV got its PN3 approval.','6-Jul-2026: வெளிநாட்டு ப்ரோக்கரேஜ் இலக்கை ₹16,200-க்கு உயர்த்தினதால +6.1%, ₹13,215; 10-Jul: Vivo JV-க்கு PN3 அனுமதி.'),L('Sep–Oct 2026: drifted from ~₹13,400 to ~₹11,400 as the smartphone market weakened (Q2 market estimated −15–20% YoY).','செப்–அக் 2026: ஸ்மார்ட்போன் மார்க்கெட் பலவீனமானதால (Q2 −15–20% YoY கணிப்பு) ~₹13,400-ல இருந்து ~₹11,400.'),L('30-Oct-2026: −4.3% to ₹11,000 on results day. Revenue beat, but the margin (2.7%) missed the ~2.9% expected and headline profit fell 45%.','30-Oct-2026: ரிசல்ட் நாள் −4.3%, ₹11,000 — வருவாய் மிஞ்சிச்சு, ஆனா மார்ஜின் (2.7%) எதிர்பார்ப்பு ~2.9%-ஐ விட குறைவு, தலைப்பு லாபம் −45%.')],

function cycleSVG(id){const c=CO[id].cyc,n=c.stages.length,cx=150,cy=150,r=110;let s=`<svg viewBox="0 0 300 300" style="max-width:300px;width:100%">`;
 const cols=['#7aa6d6','#1f9d55','#8fc66b','#d99a00','#d64545'];
 for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  s+=`<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0,1 ${x1},${y1} z" fill="${cols[i%5]}" opacity=".35" stroke="#fff" stroke-width="2"/>`;
  const am=(a0+a1)/2;s+=`<text x="${cx+(r+0)*.62*Math.cos(am)}" y="${cy+(r)*.62*Math.sin(am)}" font-size="10.5" text-anchor="middle" fill="#3a2a1c" font-weight="700">${(LANG==='ta'?c.stagesTa:c.stages)[i]}</text>`}
 const ap=-Math.PI/2+(c.ptr)*2*Math.PI/n;s+=`<line x1="${cx}" y1="${cy}" x2="${cx+(r-8)*Math.cos(ap)}" y2="${cy+(r-8)*Math.sin(ap)}" stroke="#8a3d00" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="#8a3d00"/>`;
 return s+`<text x="150" y="292" text-anchor="middle" font-size="11" fill="#6b4a2f">${t(L('Pointer = sector phase','முள் = துறை நிலை'))}</text></svg>`}

்; 3 JV.'),risk:L('Diversified customers (top 5 = 38%) but rising; integration of several deals at once.','பரவலான கஸ்டமர்கள் (முதல் 5 = 38%) ஆனா ஏறுது; ஒரே நேரத்துல பல டீல் ஒருங்கிணைப்பு.')},cdlm:{growth:L('+26.5% revenue, +30% H1, H2 guided above 30%.','வருவாய் +26.5%, H1 +30%, H2 30%+ கைடன்ஸ்.'),profit:L('Margin 8.7% and falling; guidance cut; normalised PAT margin only 4%.','மார்ஜின் 8.7%, குறையுது; கைடன்ஸ் குறைப்பு; நார்மலைஸ்டு PAT மார்ஜின் 4% தான்.'),bs:L('Finance cost falling, but H1 CFO only ₹14.8 cr; 153-day cycle.','நிதிச் செலவு குறையுது, ஆனா H1 CFO ₹14.8 கோடி தான்; 153 நாள் சைக்கிள்.'),val:L('~83x trailing earnings even after a 19% fall; brokers range ₹530–₹1,320.','19% சரிவுக்கு அப்புறமும் ~83x; ப்ரோக்கர் இலக்கு ₹530–₹1,320.'),vis:L('Record ₹2,814 cr book, 1.6x book-to-bill, ~$1 bn build-to-spec signed.','ரெக்கார்ட் ₹2,814 கோடி புக், 1.6x, ~$1 பில்லியன் பில்ட்-டு-ஸ்பெக்.'),risk:L('Strong parent (Cyient); a one-off gain in reported PAT and 93% export dependence.','வலுவான தாய் நிறுவனம் (Cyient); அறிவித்த PAT-ல ஒருமுறை லாபம், 93% ஏற்றுமதி சார்பு.')},
 pgel:{growth:L('+42.5% revenue, record H1, new categories (fridges, compressors).','வருவாய் +42.5%, சாதனை H1, புது பிரிவுகள் (ஃப்ரிட்ஜ், கம்ப்ரசர்).'),profit:L('EBITDA margin up YoY to 7.4%, but RM 82%; Q2 PAT margin 1.5%.','EBITDA மார்ஜின் 7.4% (YoY ஏற்றம்), ஆனா RM 82%; Q2 PAT மார்ஜின் 1.5%.'),bs:L('Net debt ₹291 cr but net D/E only 0.09x; ₹422 cr cash; RoE 7%.','நெட் கடன் ₹291 கோடி, ஆனா நெட் D/E 0.09x தான்; ₹422 கோடி கேஷ்; RoE 7%.'),val:L('71x trailing, 4.9x book; brokers ₹670–₹780.','கடந்த லாபத்துக்கு 71x, புத்தக மதிப்புக்கு 4.9x; ப்ரோக்கர் ₹670–₹780.'),vis:L('Clear FY27 guide by product; PLI ₹70 cr+ in Q4; capacity in place.','பொருள் வாரியா தெளிவான FY27 கைடன்ஸ்; Q4-ல PLI ₹70 கோடி+; கேப்பாசிட்டி ரெடி.'),risk:L('Weather-dependent demand and commodity swings; a statutory-auditor change from Q3.','வெயிலை நம்பியிருக்கும் டிமாண்ட், மூலப்பொருள் விலை ஆட்டம்; Q3-ல இருந்து ஆடிட்டர் மாற்றம்.')}};
const pc=v=>v>=8?'#1f9d55':v>=6?'#d99a00':'#d64545';
function templeSVG(id){const S=CO[id].scores,score=Math.round(PIL.reduce((a,[k])=>a+S[k],0)/6*10);
 let s=`<svg viewBox="0 0 640 430" style="width:100%;max-width:720px;display:block;margin:auto" xmlns="http://www.w3.org/2000/svg">
 <polygon points="320,10 30,110 610,110" fill="#e8730c"/><text x="320" y="72" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">CB SCORE</text><text x="320" y="100" text-anchor="middle" fill="#fff" font-size="26" font-weight="900">${score}/100</text>
 <rect x="40" y="112" width="560" height="34" fill="#ffd2a6" stroke="#e8730c"/><text x="320" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#6b3300">${t(CO[id].name)} · Q2 FY27</text>`;
 PIL.forEach(([k,n],i)=>{const x=62+i*90,v=S[k],hgt=200,fh=hgt*v/10;
  s+=`<g class="temple-col" onclick="pilTap('${k}')"><rect x="${x}" y="152" width="56" height="${hgt}" fill="#fff6ec" stroke="#d9b48f"/>
  ${[1,2,3].map(j=>`<line x1="${x+j*14}" y1="152" x2="${x+j*14}" y2="${152+hgt}" stroke="#ead2b8"/>`).join('')}
  <rect class="fillc" x="${x}" y="${152+hgt}" width="56" height="0" data-y="${152+hgt-fh}" data-h="${fh}" fill="${pc(v)}" opacity=".85"/>
  <circle cx="${x+28}" cy="175" r="18" fill="#fff" stroke="${pc(v)}" stroke-width="3"/><text x="${x+28}" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="${pc(v)}">${v}</text></g>`});
 s+=`<rect x="40" y="352" width="560" height="14" fill="#e8c9a8"/><rect x="25" y="366" width="590" height="14" fill="#dcb895"/>`;
 PIL.forEach(([k,n],i)=>{s+=`<text x="${90+i*90}" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b3300">${t(n).split(' ')[0]}</text><text x="${90+i*90}" y="413" text-anchor="middle" font-size="10.5" fill="#6b3300">${t(n).split(' ').slice(1).join(' ')}</text>`});
 return s+`</svg>`}
function pilTap(k){document.querySelectorAll('.pcard').forEach(e=>e.classList.remove('hl'));const el=document.getElementById('pc_'+k);if(el){el.classList.add('hl');el.scrollIntoView({behavior:'smooth',block:'center'})}}
function rCB(){const id=SUB.cb,S=CO[id].scores;
 return subTabs('cb')+`<div class="card"><h2>${t(L('Six-pillar CB Score','ஆறு தூண் CB ஸ்கோர்'))}</h2><div class="svgw" style="overflow-x:auto">${templeSVG(id)}</div>
 <p class="note">${t(L('Green 8–10 · Amber 6–8 · Red below 6. Tap a column to jump to its explanation. CY and TG lenses: ','பச்சை 8–10 · மஞ்சள் 6–8 · சிவப்பு 6-க்கு கீழ. தூணை தொட்டா விளக்கம். CY, TG: '))}<span class="chip">CY ${CO[id].cyc.cy}</span><span class="chip">TG ${CO[id].cyc.tg}</span></p></div>
 <div class="card">${PIL.map(([k,n])=>`<div class="pcard" id="pc_${k}" style="border-left-color:${pc(S[k])}"><b>${t(n)} — ${S[k]}/10</b><div>${t(PEX[id][k])}</div></div>`).join('')}</div>`}
function aCB(){setTimeout(()=>document.querySelectorAll('.fillc').forEach(r=>{let st=null;const y0=+r.getAttribute('y'),y1=+r.dataset.y,h1=+r.dataset.h;function step(ts){if(!st)st=ts;const p=Math.min(1,(ts-st)/1100);r.setAttribute('y',y0-(y0-y1)*p);r.setAttribute('height',h1*p);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}),150)}

 return subTabs('sw')+`<div class="card"><h2>${t(CO[id].name)} — SWOT</h2><div class="swot">${['S','W','O','T'].map(k=>`<div class="s${k}"><b>${t(H[k])}</b><ul>${s[k].map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`).join('')}</div></div>`}

 let h=subTabs('sc')+`<div class="card"><h2>${t(CO[id].name)} — ${t(L('CB Investor Self-check','CB முதலீட்டாளர் சுய சோதனை'))}</h2><p class="note">${t(L('This only counts how many of your own conditions line up. It is not a recommendation.','இது உங்க சொந்த நிபந்தனைகள்ல எத்தனை பொருந்துதுன்னு மட்டும் எண்ணுது. இது பரிந்துரை இல்ல.'))}</p><div id="scOverall"></div></div>`;
 G.forEach((grp,gi)=>{h+=`<div class="card"><h3>${t(SC.g[gi])}</h3>${grp.map((it,ii)=>{const k=gi+'_'+ii;return `<div class="chk"><input type="checkbox" ${S.t[k]?'checked':''} onchange="scTick('${id}','${k}',this.checked)"><div><div>${t(it[0])}</div><div class="dt">Data: ${t(it[1])}</div></div></div>`}).join('')}<div class="bar" style="margin-top:8px"><i id="gb${gi}"></i></div><div class="note" id="gm${gi}"></div></div>`});
 h+=`<div class="card"><h3>${t(SC.g[4])}</h3><div id="ownList"></div>
 <div style="display:flex;gap:6px;margin-top:8px"><input id="ownIn" style="flex:1;padding:7px;border:1px solid var(--line);border-radius:8px" placeholder="${t(L('Add your own condition (max 8)','உங்க நிபந்தனையை சேருங்க (அதிகபட்சம் 8)'))}"><button class="btn" onclick="ownAdd('${id}')">+</button></div>
 <div style="margin-top:6px">${SC.sugg.map((s,i)=>`<button class="btn ghost" style="margin:3px;padding:4px 10px;font-size:12px" onclick="ownAdd('${id}',${i})">${t(s)}</button>`).join('')}</div>
 <div class="bar" style="margin-top:8px"><i id="gb4"></i></div><div class="note" id="gm4"></div>
 <p style="margin-top:10px"><button class="btn ghost" onclick="scClear('${id}')">${t(L('Clear','அழி'))}</button></p></div>`;
 return h}
function aSC(){scUpd(SUB.sc)}
function scTick(id,k,v){const S=scState(id);S.t[k]=v;lsSet('cbsc_ems_'+id,S);scUpd(id)}
function ownAdd(id,si){const S=scState(id);if(S.own.length>=8)return;let v=si!=null?t(SC.sugg[si]):document.getElementById('ownIn').value.trim();if(!v)return;S.own.push({v,c:false});lsSet('cbsc_ems_'+id,S);render()}
function ownTick(id,i,v){const S=scState(id);S.own[i].c=v;lsSet('cbsc_ems_'+id,S);scUpd(id)}
function scClear(id){SCMEM[id]={t:{},own:[]};lsSet('cbsc_ems_'+id,SCMEM[id]);render()}
function scUpd(id){const S=scState(id),G=SC.items[id];let tot=0,yes=0;
 G.forEach((grp,gi)=>{let y=0;grp.forEach((_,ii)=>{if(S.t[gi+'_'+ii])y++});tot+=grp.length;yes+=y;const b=document.getElementById('gb'+gi);if(b){b.style.width=(y/grp.length*100)+'%';document.getElementById('gm'+gi).textContent=`${y} / ${grp.length}`}});
 const ol=document.getElementById('ownList');if(ol)ol.innerHTML=S.own.map((o,i)=>`<div class="chk"><input type="checkbox" ${o.c?'checked':''} onchange="ownTick('${id}',${i},this.checked)"><div>${o.v}</div></div>`).join('')||`<p class="note">${t(L('No conditions added yet.','இன்னும் நிபந்தனை சேர்க்கல.'))}</p>`;
 const oy=S.own.filter(o=>o.c).length;tot+=S.own.length;yes+=oy;const b4=document.getElementById('gb4');if(b4){b4.style.width=(S.own.length?oy/S.own.length*100:0)+'%';document.getElementById('gm4').textContent=`${oy} / ${S.own.length}`}
 const ov=document.getElementById('scOverall');if(ov)ov.innerHTML=`<div class="bar"><i style="width:${tot?yes/tot*100:0}%"></i></div><div class="note">${t(L('Overall','மொத்தம்'))}: ${yes} / ${tot}</div>`}

 if(/should i|buy|sell|invest|வாங்க|விக்க|முதலீடு/.test(s)){setTimeout(()=>go('sc'),900);return t(NOADV)}

 return best?t(best[1]):t(L('Try asking about growth, margins, order book, cash flow, analysts, triggers, valuation, the business model or pending results.','வளர்ச்சி, மார்ஜின், ஆர்டர் புக், கேஷ் ஃப்ளோ, அனலிஸ்ட், ட்ரிகர், மதிப்பீடு, பிசினஸ் மாடல், நிலுவை ரிசல்ட் பத்தி கேளுங்க.'))}
function addMsg(txt,who){const d=document.createElement('div');d.className='m '+who;d.textContent=txt;const lg=document.getElementById('asLog');lg.appendChild(d);lg.scrollTop=lg.scrollHeight}
function speak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang=LANG==='ta'?'ta-IN':'en-IN';const v=speechSynthesis.getVoices().find(x=>x.lang===(LANG==='ta'?'ta-IN':'en-IN'));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function ask(qq){const inp=document.getElementById('asIn');const q=qq||inp.value.trim();if(!q)return;inp.value='';addMsg(q,'u');const a=answer(q);setTimeout(()=>{addMsg(a,'b');speak(a)},250)}
let REC=null;
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const b=document.getElementById('micBtn');
 if(!SR){addMsg(t(L('Voice input is not supported in this browser — please type your question.','இந்த பிரவுசர்ல குரல் உள்ளீடு இல்ல — டைப் பண்ணுங்க.')),'b');return}
 if(REC){REC.stop();return}REC=new SR();REC.lang=LANG==='ta'?'ta-IN':'en-IN';REC.interimResults=false;b.classList.add('rec');
 REC.onresult=e=>{ask(e.results[0][0].transcript)};REC.onend=()=>{b.classList.remove('rec');REC=null};REC.onerror=()=>{b.classList.remove('rec');REC=null};REC.start()}
function togAssist(){const b=document.getElementById('asBox');const on=b.style.display!=='flex';b.style.display=on?'flex':'none';document.getElementById('disc').style.display='none';if(on&&!document.getElementById('asLog').children.length)addMsg(t(L('Hello! Ask me about the Q2 FY27 EMS results — by voice (🎤) or by typing.','வணக்கம்! Q2 FY27 EMS ரிசல்ட் பத்தி கேளுங்க — குரல்ல (🎤) அல்லது டைப் பண்ணி.')),'b')}
function renderSugg(){const S=[L('Why is Syrma ahead?','சிர்மா ஏன் முன்னிலை?'),L('Why did Syrma’s share price rise?','சிர்மா பங்கு ஏன் ஏறிச்சு?'),L('Which grew faster?','எது வேகமா வளர்ந்துச்சு?'),L('Why did Cyient DLM fall?','சையன்ட் DLM ஏன் சரிஞ்சது?'),L('Cash flow?','கேஷ் ஃப்ளோ?'),L('Pending results?','நிலுவை ரிசல்ட்?'),L('Should I buy?','வாங்கலாமா?')];document.getElementById('asSugg').innerHTML=S.map(s=>`<button onclick="ask('${t(s).replace(/'/g,"\\'")}')">${t(s)}</button>`).join('')}
function togDisc(){const d=document.getElementById('disc');d.style.display=d.style.display==='block'?'none':'block';document.getElementById('asBox').style.display='none'}
function showDisc(){const d=document.getElementById('disc');d.style.display='block';clearTimeout(window._dt);window._dt=setTimeout(()=>{d.style.display='none'},6000)}

render();
