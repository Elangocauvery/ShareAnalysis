<style>
/* Layout: sticky header + tab rail, one white sheet per tab; balance-scale graphic anchors the puzzle */
:root{

  --down:#b23a2e; --down-soft:#fdeceA; --up:#1f7a4d; --up-soft:#e6f4ec;
  --f-display:"Bricolage Grotesque","Mukta Malar",system-ui,sans-serif;
  --f-body:"Mukta Malar",system-ui,"Noto Sans Tamil",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.2vw,28px);margin:0;line-height:1.15;text-wrap:balance}
.brand small{color:var(--accent-deep);font-weight:800;letter-spacing:.02em}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.pill{border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 14px;font-weight:800}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill.acc{border-color:var(--accent-deep);color:var(--accent-deep)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
nav.tabs button{white-space:nowrap;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:800;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
main{padding-block:22px 120px}
section.tab{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0}
.lead{font-size:18px;max-width:68ch;margin:0}
ul.b{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid>*,.grid2>*{min-width:0}
.stat{border:2px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.stat .v{font-family:var(--f-num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .n{font-size:14px;color:var(--muted)}
.stat.up{border-color:#bfe2cd;background:var(--up-soft)} .stat.up .v{color:var(--up)}
.stat.dn{border-color:#f0c6c0;background:var(--down-soft)} .stat.dn .v{color:var(--down)}
.stat.au{border-color:#ecd9a2;background:var(--gold-soft)} .stat.au .v{color:#8a6610}
.panel{border:2px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.callout{background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:8px;padding:14px 16px;font-weight:700}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent-soft);font-weight:800}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
details.rsn{border:2px solid var(--line);border-radius:10px;padding:0}
details.rsn[open]{border-color:var(--accent)}
details.rsn summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
details.rsn summary::-webkit-details-marker{display:none}
.rk{font-family:var(--f-num);font-weight:600;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:14px}
.rt{flex:1;font-weight:800;font-size:17px;min-width:0}
.meter{display:flex;gap:3px}
.meter i{width:10px;height:14px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--gold)}
.rb{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:8px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--gold-soft);color:#8a6610;border:1px solid #ecd9a2}
.chip{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;display:inline-block}
.chip.g{background:var(--up-soft);color:var(--up)} .chip.r{background:var(--down-soft);color:var(--down)} .chip.a{background:var(--accent-soft);color:var(--accent-deep)}
svg text{font-family:var(--f-body)}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;max-width:100%;height:auto}
.slogan{font-family:var(--f-display);font-weight:800;color:var(--accent-deep)}
/* quiz */
.q{border:2px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.q .opts button{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:700;color:var(--ink)}
.q .opts button.ok{border-color:var(--up);background:var(--up-soft)}
.q .opts button.no{border-color:var(--down);background:var(--down-soft)}
.q .ex{font-size:15px;color:var(--muted)}
/* checklist */
.ck label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.ck input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent-deep);flex:none}
.ck .d{display:block;font-size:14px;color:var(--muted);font-weight:600}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);width:0}
/* CB badge + voice */
.cb{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.cb-logo{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.18);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.cb-logo{animation:none}}
.cb-tip{position:absolute;right:0;bottom:62px;width:min(300px,80vw);background:#fff;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink);display:none}
.cb:hover .cb-tip,.cb.open .cb-tip{display:block}
.va-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.va{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:21;width:min(380px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.va .qs{display:flex;flex-wrap:wrap;gap:6px}
.va .qs button{border:2px solid var(--line);background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink);text-align:left}
.va .ans{background:var(--gold-soft);border-radius:8px;padding:10px;font-weight:700;min-height:44px}
.va input[type=text]{width:100%;border:2px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot{border-top:2px solid var(--line);padding-block:16px;color:var(--muted);font-size:14px}
</style>

C.puzzle = {
en:()=>`<h2>The puzzle: why buy when everything says "sell"?</h2>
<ul class="b">
<li>Gold pays no interest. When bonds pay 5%+, holding gold "costs" you that 5%. That is the opportunity cost.</li>
<li>Gold is priced in dollars. A strong dollar makes it costlier for the rest of the world.</li>
<li>So by the textbook, high yields + strong dollar = gold falls. That part <b>did</b> happen — price fell 8.5% in Sept.</li>
<li>But ETF buyers are not trading the textbook. They are buying <b>insurance</b>.</li>
</ul>
<div class="panel"><h3>Picture it: one seesaw, two different crowds</h3><div class="svgbox">${scale('en')}</div></div>
<div class="panel"><h3>Money kept coming in, month after month</h3><div class="svgbox">${flowsChart('en')}</div>
<ul class="b"><li>July reversed two months of outflows. August was the 2nd-largest month on record.</li><li>India: Jan–Sep ₹45,925 cr — already more than all of 2025 (₹42,961 cr).</li></ul></div>
<div class="callout">Key idea: price is set by the fast money at the margin. Flows show what slow money is doing. In 2026 they disagree.</div>`,
ta:()=>`<h2>புதிர்: எல்லாமே "sell"-னு சொல்லும்போது ஏன் வாங்குறாங்க?</h2>
<ul class="b">
<li>Gold-க்கு interest கிடையாது. Bonds 5%+ குடுக்கும்போது, gold வைச்சிருந்தா அந்த 5%-ஐ miss பண்றீங்க. இதுதான் opportunity cost.</li>
<li>Gold dollar-ல price ஆகுது. Dollar strong-ஆ இருந்தா மத்த நாடுகளுக்கு விலை அதிகம்.</li>
<li>Textbook-படி: high yield + strong dollar = gold விழும். அது <b>நடந்துச்சு</b> — Sept-ல 8.5% fall.</li>
<li>ஆனா ETF buyers textbook-ஐ trade பண்ணல. அவங்க <b>insurance</b> வாங்குறாங்க.</li>
</ul>
<div class="panel"><h3>இப்படி யோசிங்க: ஒரே seesaw, ரெண்டு வேற கூட்டம்</h3><div class="svgbox">${scale('ta')}</div></div>
<div class="panel"><h3>மாசா மாசம் பணம் வந்துகிட்டே இருந்துச்சு</h3><div class="svgbox">${flowsChart('ta')}</div>
<ul class="b"><li>July-ல ரெண்டு மாச outflows திரும்புச்சு. August record-ல 2-வது பெரிய மாசம்.</li><li>இந்தியா: Jan–Sep ₹45,925 cr — 2025 முழுசையும் (₹42,961 cr) ஏற்கனவே தாண்டிடுச்சு.</li></ul></div>
<div class="callout">Key idea: price-ஐ fast money தீர்மானிக்குது. Flows slow money என்ன பண்ணுதுன்னு காட்டுது. 2026-ல ரெண்டும் வேற வேற திசை.</div>`};

 Object.keys(qs).forEach(i=>{const o=document.querySelectorAll(`[data-q="${i}"]`)[QZ[i].en[2]];o&&o.classList.add('ok');$('#ex'+i).hidden=false;});
 sc();
}

/* speech */
const synth=window.speechSynthesis;
function voiceFor(l){try{const vs=synth.getVoices();return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(l==='ta'?'ta':'en-in'))||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(l==='ta'?'ta':'en'));}catch(e){return null}}
function speak(txt){ if(!synth) return; stopSpeak(); const u=new SpeechSynthesisUtterance(txt); u.lang=lang==='ta'?'ta-IN':'en-IN'; const v=voiceFor(lang); if(v)u.voice=v; u.rate=+$('#rate').value; synth.speak(u);}
function stopSpeak(){try{synth&&synth.cancel()}catch(e){}}
$('#rate').oninput=()=>{$('#rateV').textContent=(+$('#rate').value).toFixed(2)+'×';};
$('#readTab').onclick=()=>{ if(synth&&synth.speaking){stopSpeak();return;} const t=$('#main').innerText.replace(/\s+/g,' ').slice(0,3500); speak(t);};
$('#vaBtn').onclick=()=>{$('#va').hidden=!$('#va').hidden;};
function closeVA(){$('#va').hidden=true;stopSpeak();}
$('#vaClose').onclick=(e)=>{e.stopPropagation();closeVA();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVA();});
document.addEventListener('click',e=>{const p=$('#va');if(!p.hidden&&!p.contains(e.target)&&!e.target.closest('#vaBtn'))closeVA();});
function answer(a){$('#vaAns').textContent=a;speak(a);}
$('#vaQs').addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(b)answer(QA[+b.dataset.qa][lang][1]);});
$('#vaAsk').onclick=()=>{const q=$('#vaInput').value.toLowerCase().trim();if(!q)return;
 let best=null,bs=0;QA.forEach(x=>{const s=x.k.filter(k=>q.includes(k.toLowerCase())).length;if(s>bs){bs=s;best=x;}});
 if(/should|வாங்கலாமா|advice|buy now/.test(q)) best=QA[6];
 answer(best?best[lang][1]:(lang==='en'?"Try one of the suggested questions above.":"மேல இருக்குற கேள்விகள்ல ஒன்றை try பண்ணுங்க."));};
$('#vaInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#vaAsk').click();}});
$('#cb').addEventListener('click',()=>$('#cb').classList.toggle('open'));

render();
</script>
