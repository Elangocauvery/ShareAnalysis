   plugins:[BAR,{id:"ref",afterDraw:function(c){ var y=c.scales.y.getPixelForValue(CO.refPrice), ctx=c.ctx, ar=c.chartArea; ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle="#d64545"; ctx.beginPath(); ctx.moveTo(ar.left,y); ctx.lineTo(ar.right,y); ctx.stroke(); ctx.setLineDash([]); ctx.font="700 11px Inter"; ctx.fillStyle="#d64545"; ctx.fillText(T("Price ≈ ₹22,801","விலை ≈ ₹22,801"),ar.left+6,y-5); ctx.restore(); }}]});
};

/* ---------- SELF-CHECK ---------- */
var SKEY="cb_sc_SHREECEM_Q2FY27";
function scLoad(){ try{ var v=JSON.parse(localStorage.getItem(SKEY)||"null"); if(v&&v.t) return v; }catch(e){} return {t:{},own:[]}; }
function scSave(v){ try{ localStorage.setItem(SKEY,JSON.stringify(v)); }catch(e){} }
var SCV=scLoad();
function secSc(){
  var h='<h2>'+L(SC.title)+'</h2><div class="note" style="margin-bottom:10px">'+L(SC.intro)+'</div><div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>'+L(SC.overall)+': <span id="scAll">0/0</span></b><div class="bar" style="flex:1;max-width:420px"><i id="scAllBar"></i></div><button class="btn" id="scClear">'+L(SC.clear)+'</button></div><div class="note">'+L(SC.msg)+'</div></div>';
  SC.groups.forEach(function(g,gi){ h+='<div class="scg"><h4><span>'+L(g.t)+'</span><span style="display:flex;gap:8px;align-items:center"><span id="scc'+gi+'" class="note" style="margin:0"></span><span class="bar" style="width:120px"><i id="scb'+gi+'"></i></span></span></h4><div class="items">';
    if(g.own){ SCV.own.forEach(function(o,oi){ h+='<label><input type="checkbox" data-own="'+oi+'"'+(o.c?" checked":"")+'><span>'+esc(o.t)+' <a href="#" data-del="'+oi+'" style="font-size:12px">✕</a></span></label>'; });
      h+= SCV.own.length<8? '<div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="scOwn" placeholder="'+esc(L(SC.addPh))+'"><button class="btn pri" id="scAdd">'+L(SC.add)+'</button></div><div class="sugg">'+g.sugg.map(function(s){return '<button class="btn" data-sg="'+esc(L(s))+'">+ '+L(s)+'</button>';}).join("")+'</div>':'';
    } else g.items.forEach(function(it,ii){ var id=gi+"_"+ii; h+='<label><input type="checkbox" data-id="'+id+'"'+(SCV.t[id]?" checked":"")+'><span>'+L(it)+'<span class="data">'+T("Data: ","தகவல்: ")+L(it.d)+'</span></span></label>'; });
    h+='</div></div>'; }); return h; }
function scProg(){ var all=0,tot=0; SC.groups.forEach(function(g,gi){ var n,c; if(g.own){ n=SCV.own.length; c=SCV.own.filter(function(o){return o.c;}).length; } else { n=g.items.length; c=g.items.filter(function(x,ii){return SCV.t[gi+"_"+ii];}).length; }
    all+=c; tot+=n; var e=document.getElementById("scc"+gi); if(e) e.textContent=c+"/"+n; var b=document.getElementById("scb"+gi); if(b) b.style.width=(n?c/n*100:0)+"%"; });
  var a=document.getElementById("scAll"); if(a) a.textContent=all+"/"+tot; var ab=document.getElementById("scAllBar"); if(ab) ab.style.width=(tot?all/tot*100:0)+"%"; }
POST.sc=function(){ var s=document.getElementById("t_sc");
  s.querySelectorAll("input[data-id]").forEach(function(i){ i.onchange=function(){ SCV.t[i.getAttribute("data-id")]=i.checked; scSave(SCV); scProg(); }; });
  s.querySelectorAll("input[data-own]").forEach(function(i){ i.onchange=function(){ SCV.own[+i.getAttribute("data-own")].c=i.checked; scSave(SCV); scProg(); }; });
  s.querySelectorAll("a[data-del]").forEach(function(a){ a.onclick=function(e){ e.preventDefault(); SCV.own.splice(+a.getAttribute("data-del"),1); scSave(SCV); rerender("sc"); }; });
  function add(t){ t=(t||"").trim(); if(!t||SCV.own.length>=8) return; SCV.own.push({t:t,c:false}); scSave(SCV); rerender("sc"); }
  var ad=document.getElementById("scAdd"); if(ad) ad.onclick=function(){ add(document.getElementById("scOwn").value); };
  s.querySelectorAll("button[data-sg]").forEach(function(b){ b.onclick=function(){ add(b.getAttribute("data-sg")); }; });
  document.getElementById("scClear").onclick=function(){ SCV.t={}; SCV.own.forEach(function(o){o.c=false;}); scSave(SCV); rerender("sc"); }; scProg(); };

/* ---------- VERDICT ---------- */

POST.ver=function(){ var tl=tally();
  mkChart("cTally",{type:"bar",data:{labels:SCORE.map(function(c){return L(c.c);}),datasets:[{label:"UltraTech",data:tl.c.map(function(x){return x.u;}),backgroundColor:CU},{label:"Shree",data:tl.c.map(function(x){return x.s;}),backgroundColor:CS_},{label:T("Tie","சமம்"),data:tl.c.map(function(x){return x.t;}),backgroundColor:"#c9d3e0"}]},
   options:{indexAxis:"y",scales:{x:{stacked:true,ticks:{stepSize:1}},y:{stacked:true,ticks:{font:{size:11}}}},plugins:{legend:{position:"bottom"}}},
   plugins:[{id:"st",afterDatasetsDraw:function(c){ var ctx=c.ctx; c.data.datasets.forEach(function(ds,i){ c.getDatasetMeta(i).data.forEach(function(b,j){ var v=ds.data[j]; if(!v) return; ctx.save(); ctx.font="700 11px Inter"; ctx.fillStyle=i===2?"#1b2430":"#fff"; ctx.textAlign="center"; ctx.fillText(v,(b.x+b.base)/2,b.y+4); ctx.restore(); }); }); }}]});
};

/* ---------- SOCRATES ---------- */
var SOS={};
function secSoc(){ var h='<h2>'+L(SO.title)+'</h2><div class="card" style="margin-bottom:10px"><b>'+L(SO.score)+': <span id="soScore">0</span> / '+SO.mcq.length+'</b></div>';
  SO.mcq.forEach(function(q,qi){ h+='<div class="q"><b>Q'+(qi+1)+'. '+L(q.q)+'</b><div class="opts">'+q.o.map(function(o,oi){return '<button data-q="'+qi+'" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+L(o)+'</button>';}).join("")+'</div><div class="fb" id="fb'+qi+'"></div></div>'; });
  SO.open.forEach(function(q,qi){ h+='<div class="q"><b>✍ '+L(q.q)+'</b><div class="note">'+L(SO.yourAns)+'</div><textarea rows="3" style="margin-top:6px"></textarea><button class="btn" data-rev="'+qi+'" style="margin-top:6px">'+L(SO.reveal)+'</button><div class="fb" id="ofb'+qi+'"></div></div>'; });
  return h; }
POST.soc=function(){ SOS={}; var s=document.getElementById("t_soc");
  s.querySelectorAll("button[data-q]").forEach(function(b){ b.onclick=function(){ var qi=+b.getAttribute("data-q"),oi=+b.getAttribute("data-o"),q=SO.mcq[qi]; if(SOS[qi]!=null) return; SOS[qi]=oi===q.a;
    b.classList.add(oi===q.a?"ok":"bad"); if(oi!==q.a) s.querySelector('button[data-q="'+qi+'"][data-o="'+q.a+'"]').classList.add("ok");
    document.getElementById("fb"+qi).innerHTML='<b>'+(oi===q.a?L(SO.right):L(SO.wrong))+'</b>'+L(q.e); document.getElementById("soScore").textContent=Object.keys(SOS).filter(function(k){return SOS[k];}).length; }; });
  s.querySelectorAll("button[data-rev]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-rev"); document.getElementById("ofb"+i).innerHTML='<div class="explain">'+L(SO.open[i].m)+'</div>'; }; }); };

/* ---------- RENDER ---------- */
var SECS={dash:secDash,bm:secBm,h2h:secH2h,ops:secOps,geo:secGeo,mix:secMix,fin:secFin,cf:secCf,val:secVal,tc:secTc,pil:secPil,swot:secSwot,an:secAn,sc:secSc,mg:secMg,ver:secVer,soc:secSoc};
function rerender(id){ var s=document.getElementById("t_"+id); s.innerHTML=SECS[id](); POST[id]&&POST[id](); }
function render(){
  document.body.classList.toggle("ta",LANG==="ta"); document.documentElement.lang=LANG==="ta"?"ta":"en";
  document.getElementById("hTitle").textContent=L(TX.title); document.getElementById("hSub").textContent=L(TX.sub);
  buildTabs();
  document.getElementById("main").innerHTML=TX.tabs.map(function(t){ return '<section class="tab'+(t.id===CUR?" on":"")+'" id="t_'+t.id+'">'+SECS[t.id]()+'</section>'; }).join("");
  Object.keys(CH).forEach(function(k){ try{CH[k].destroy();}catch(e){} delete CH[k]; });
  POST.bm(); POST.geo(); POST.sc(); POST.soc(); POST[CUR]&&POST[CUR]();
  document.getElementById("discl").innerHTML=L(DISC);
  document.getElementById("asTitle").textContent=L(AS.title); document.getElementById("asText").placeholder=L(AS.ph);
  document.getElementById("asChips").innerHTML=AS.chips.map(function(c){return '<button>'+L(c)+'</button>';}).join("");
  document.querySelectorAll("#asChips button").forEach(function(b){ b.onclick=function(){ ask(b.textContent); }; });
}
document.getElementById("bEN").onclick=function(){ LANG="en"; this.classList.add("on"); document.getElementById("bTA").classList.remove("on"); render(); };
document.getElementById("bTA").onclick=function(){ LANG="ta"; this.classList.add("on"); document.getElementById("bEN").classList.remove("on"); render(); };
document.getElementById("cbBadge").onclick=function(e){ e.stopPropagation(); document.getElementById("discl").classList.toggle("on"); document.getElementById("asPanel").classList.remove("on"); };
document.addEventListener("click",function(e){ var d=document.getElementById("discl"); if(d.classList.contains("on")&&!d.contains(e.target)) d.classList.remove("on"); });

/* ---------- CB ASSIST ---------- */
var log=document.getElementById("asLog"), started=false;
function say(t){ try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t.replace(/₹/g, LANG==="ta"?"ரூபாய் ":"rupees ")); u.lang=LANG==="ta"?"ta-IN":"en-IN";
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(LANG==="ta"?"ta":"en-in")===0;}); if(vs[0]) u.voice=vs[0]; speechSynthesis.speak(u); }catch(e){} }
function addMsg(t,who){ var m=document.createElement("div"); m.className="msg "+who; m.textContent=t; log.appendChild(m); log.scrollTop=log.scrollHeight; return m; }
function answer(q){ var s=" "+q.toLowerCase()+" ", best=null, bs=0; KB.forEach(function(k){ var sc=0; k.k.forEach(function(w){ if(s.indexOf(w.toLowerCase())>=0) sc+=w.length>4?2:1; }); if(sc>bs){bs=sc;best=k;} }); return best; }
function ask(q){ q=(q||"").trim(); if(!q) return; addMsg(q,"u"); var a=answer(q); if(!a){ addMsg(L(AS.miss),"b"); say(L(AS.miss)); return; }
  var t=L(a), m=addMsg(t,"b"); if(a.act){ var b=document.createElement("button"); b.className="btn pri"; b.style.marginTop="6px"; b.textContent=L(AS.open); b.onclick=function(){ go(a.act); document.getElementById("asPanel").classList.remove("on"); }; m.appendChild(document.createElement("br")); m.appendChild(b); } say(t); }
document.getElementById("asBtn").onclick=function(e){ e.stopPropagation(); var p=document.getElementById("asPanel"); p.classList.toggle("on"); document.getElementById("discl").classList.remove("on"); if(p.classList.contains("on")&&!started){ started=true; addMsg(L(AS.hello),"b"); } };
document.getElementById("asClose").onclick=function(){ document.getElementById("asPanel").classList.remove("on"); try{speechSynthesis.cancel();}catch(e){} };
document.getElementById("asSend").onclick=function(){ var i=document.getElementById("asText"); ask(i.value); i.value=""; };
document.getElementById("asText").onkeydown=function(e){ if(e.key==="Enter"){ ask(this.value); this.value=""; } };
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null;
document.getElementById("asMic").onclick=function(){ var b=this; if(!SR){ addMsg(L(AS.nomic),"b"); return; } if(rec){ try{rec.stop();}catch(e){} return; }
  rec=new SR(); rec.lang=LANG==="ta"?"ta-IN":"en-IN"; rec.interimResults=false; rec.onresult=function(ev){ ask(ev.results[0][0].transcript); };
  rec.onend=function(){ b.classList.remove("rec"); rec=null; }; rec.onerror=function(){ b.classList.remove("rec"); rec=null; }; b.classList.add("rec"); try{ rec.start(); }catch(e){ b.classList.remove("rec"); rec=null; } };

render();
})();
