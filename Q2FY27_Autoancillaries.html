@keyframes blink{50%{box-shadow:0 0 0 6px rgba(242,140,40,.35);background:#FFC889}}

#cbBadge .pop{position:absolute;right:0;bottom:56px;width:min(320px,80vw);background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;display:none}
#cbBadge:hover .pop,#cbBadge.open .pop{display:block}
#vaBubble{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:20;font:inherit;font-weight:800;font-size:13px;background:var(--tint);color:var(--ink);border:2px solid var(--accent-2);border-radius:999px;padding:8px 12px;cursor:pointer}

.inp input[type=text]{flex:1 1 220px;min-width:0;font:inherit;font-weight:600;padding:9px 10px;border:2px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--ink)}

/* derived numbers */
CO.forEach(function(c){
  c.revY=(c.rev[0]/c.rev[2]-1)*100; c.revQ=(c.rev[0]/c.rev[1]-1)*100;
  c.ebY=(c.ebitda[0]/c.ebitda[2]-1)*100; c.ebQ=(c.ebitda[0]/c.ebitda[1]-1)*100;
  c.patY=(c.pat[0]/c.pat[2]-1)*100; c.patQ=(c.pat[0]/c.pat[1]-1)*100;
  c.m=c.ebitda.map(function(e,i){return e/c.rev[i]*100;});
  if(c.id==="end"){c.m=[12.1,13.1,13.8];}
  c.mChg=(c.m[0]-c.m[2])*100; /* bps */
  c.pm=c.pat.map(function(p,i){return p/c.rev[i]*100;});
  c.mcap=c.price*c.shares; c.pe=c.mcap/(c.h1pat*2);
  c.outp=c.revY-IND.all;
  c.p60=c.pillars.reduce(function(a,b){return a+b;},0);
  var pos=c.triggers.filter(function(t){return t.s>0;}).map(function(t){t.pts=t.I*t.C*t.W*t.P;return t;}).sort(function(a,b){return b.pts-a.pts;}).slice(0,3);
  var neg=c.triggers.filter(function(t){return t.s<0;}).map(function(t){t.pts=t.I*t.C*t.W*t.P;return t;});
  c.triggers.forEach(function(t){t.pts=t.I*t.C*t.W*t.P;});
  var sp=pos.reduce(function(a,t){return a+t.pts;},0), sn=neg.reduce(function(a,t){return a+t.pts;},0);
  c.tg=Math.max(0,Math.min(100,Math.round(50+8*sp-8*sn)));
  var stock=(c.cy.life+c.cy.earn+c.cy.val+c.cy.stage)/4;
  c.cyS=Math.round(0.5*c.cy.sector+0.5*stock);
  /* Partial CB Conviction: E 25, F 20, CY 10, TG 15 renormalised to 70 (M and T not scored) */
  c.conv=Math.round((c.deliver*25+(c.p60/60*100)*20+c.cyS*10+c.tg*15)/70);
});

/* Horizontal bars with optional reference line; handles negatives */
function hbars(items,o){
  o=o||{};var rowH=o.rowH||30,lw=o.lw||150,w=o.w||640,top=o.ref!=null?26:8,h=top+items.length*rowH+12;
  var vals=items.map(function(i){return i.v;});if(o.ref!=null)vals.push(o.ref);
  var mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0]));
  var span=(mx-mn)||1,x0=lw,x1=w-(mn<0&&mx<=0?80:64),sc=function(v){return x0+(v-mn)/span*(x1-x0);};
  var s='';
  if(o.ref!=null){var rx=sc(o.ref);s+='<line x1="'+rx+'" y1="16" x2="'+rx+'" y2="'+(h-6)+'" stroke="#1B1205" stroke-dasharray="5 4" stroke-width="2"/>'+tx(rx,12,o.refLabel||"",{fs:11,a:"middle",c:"#1B1205"});}
  if(mn<0){s+='<line x1="'+sc(0)+'" y1="'+top+'" x2="'+sc(0)+'" y2="'+(h-6)+'" stroke="#4A3A26" stroke-width="1.5"/>';}
  items.forEach(function(it,i){
    var y=top+i*rowH,a=sc(Math.min(0,it.v)),b=sc(Math.max(0,it.v));
    s+=tx(lw-8,y+rowH/2+4,it.l,{a:"end",fs:12.5});
    s+='<rect x="'+a+'" y="'+(y+5)+'" width="'+Math.max(2,b-a)+'" height="'+(rowH-10)+'" rx="3" fill="'+(it.c||"#F28C28")+'"/>';
    var lab=(o.fmt?o.fmt(it.v):f1(it.v))+(o.unit||"");
    s+=tx(b+6,y+rowH/2+4,lab,{a:"start",fs:12.5,fw:800,c:it.v<0?"#B3261E":"#1B1205"});
  });
  return svg(w,h,s);
}

 document.getElementById("lEn").className="btn"+(LANG==="en"?" on":"");document.getElementById("lTa").className="btn"+(LANG==="ta"?" on":"");
 var tb=TABS.filter(function(t){return t.id===state.tab;})[0]||TABS[0];state.tab=tb.id;
 document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(t.id===state.tab?" on":"")+'" type="button" data-tab="'+t.id+'">'+esc(T(t.n))+'</button>';}).join("");
 var ch=document.getElementById("chips");
 if(tb.per){if(state.sub!=="cmp"&&!C(state.sub))state.sub="cmp";
  ch.innerHTML='<button class="chip'+(state.sub==="cmp"?" on":"")+'" type="button" data-sub="cmp"><i style="background:#F28C28"></i>'+T(L.cmp)+'</button>'+CO.map(function(c){return '<button class="chip'+(state.sub===c.id?" on":"")+'" type="button" data-sub="'+c.id+'"><i style="background:'+c.color+'"></i>'+esc(c.name.split(" (")[0])+'</button>';}).join("");ch.hidden=false;}
 else {ch.innerHTML="";ch.hidden=true;}
 var html;try{html=VIEWS[tb.id](tb.per?state.sub:null);}catch(e){html=card('<p class="dn">Render error: '+esc(e.message)+'</p>');if(window.console)console.error(e);}
 document.getElementById("panel").innerHTML='<h2>'+esc(T(tb.n))+(tb.per&&state.sub!=="cmp"?' · '+esc(C(state.sub).name):'')+'</h2>'+html;
 var wi=document.getElementById("waitIn");if(wi)wi.value=String(AS.wait);
 save();
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-tab],[data-sub],[data-bm],[data-sug],[data-open],[data-rate],[data-q],[data-curm],#lEn,#lTa,#readTab,#vaBubble,#askGo,#micGo,#micDone,#spPause,#spStop,#qzReset,#cuAdd,#cbBadge");
 if(!t)return;
 if(t.dataset.tab){state.tab=t.dataset.tab;if(!TABS.filter(function(x){return x.id===state.tab;})[0].per)state.sub="cmp";render();window.scrollTo(0,0);return;}
 if(t.dataset.sub){state.sub=t.dataset.sub;render();return;}
 if(t.dataset.bm&&BMSEL&&BMSEL[t.dataset.bm]){var d=document.getElementById("bmDetail");if(d)d.textContent=T(BMSEL[t.dataset.bm]);return;}
 if(t.dataset.sug!=null){ask(T([A("Why did margins fall when OEMs did well?","OEM நல்லா இருந்தும் margin ஏன் இறங்குச்சு?"),A("Which company has the highest margin?","எந்த company-க்கு margin அதிகம்?"),A("Uno Minda vs Sona profit growth","Uno Minda vs Sona profit growth"),A("What about its P/E?","அதோட P/E?"),A("Did Amara Raja do well?","Amara Raja நல்லா பண்ணாங்களா?"),A("Should I buy Lumax?","Lumax வாங்கலாமா?")][+t.dataset.sug]));return;}
 if(t.dataset.open){state.tab=t.dataset.open;state.sub="cmp";render();window.scrollTo(0,0);return;}
 if(t.dataset.rate){AS.rate=+t.dataset.rate;try{localStorage.setItem("cba_q2fy27auto_rate",AS.rate);}catch(x){}var rv=document.getElementById("rateV"),ri=document.getElementById("rateIn");if(rv)rv.textContent=AS.rate.toFixed(1)+"×";if(ri)ri.value=AS.rate;return;}
 if(t.dataset.q!=null){QS.ans[+t.dataset.q]=+t.dataset.o;render();return;}
 if(t.dataset.curm!=null){e.preventDefault();var st=getChk(),k=st[CHK.c]||{};(k.custom||[]).splice(+t.dataset.curm,1);st[CHK.c]=k;setChk(st);render();return;}
 switch(t.id){
  case "lEn":LANG="en";render();break;
  case "lTa":LANG="ta";render();break;
  case "readTab":speak(document.getElementById("panel").innerText.slice(0,2500));break;
  case "vaBubble":state.tab="assist";state.sub="cmp";render();window.scrollTo(0,0);break;
  case "askGo":var i=document.getElementById("askIn");ask(i.value);i.value="";break;
  case "micGo":startMic();break;
  case "micDone":finishMic();break;
  case "spPause":if(window.speechSynthesis){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause();}break;
  case "spStop":if(window.speechSynthesis)speechSynthesis.cancel();break;
  case "qzReset":QS.ans={};render();break;
  case "cuAdd":var n=document.getElementById("cuNew");if(n&&n.value.trim()){var st2=getChk(),k2=st2[CHK.c]||{};k2.custom=(k2.custom||[]).concat([{t:n.value.trim(),d:false}]);st2[CHK.c]=k2;setChk(st2);render();}break;
  case "cbBadge":t.classList.toggle("open");break;
 }
});
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.dataset&&t.dataset.ck){var st=getChk(),k=st[CHK.c]||{};k[t.dataset.ck]=t.checked;st[CHK.c]=k;setChk(st);render();}
 if(t.dataset&&t.dataset.cu!=null){var st2=getChk(),k2=st2[CHK.c]||{};k2.custom[+t.dataset.cu].d=t.checked;st2[CHK.c]=k2;setChk(st2);render();}
 if(t.id==="rateIn"){AS.rate=+t.value;try{localStorage.setItem("cba_q2fy27auto_rate",AS.rate);}catch(x){}document.getElementById("rateV").textContent=AS.rate.toFixed(1)+"×";}
 if(t.id==="waitIn"){AS.wait=+t.value;try{localStorage.setItem("cba_q2fy27auto_wait",AS.wait);}catch(x){}}
});
document.addEventListener("keydown",function(e){
 if(e.key==="Enter"&&e.target.id==="askIn"){ask(e.target.value);e.target.value="";}
 if(e.key==="Enter"&&e.target.id==="cuNew"){document.getElementById("cuAdd").click();}
 if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.bm){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}
});
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){};
render();
</script>
