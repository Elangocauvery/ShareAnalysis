<title>L&amp;T Q2 FY27 Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&display=swap">
<style>
/* Layout: sticky brand bar + scrollable tab rail, one tab panel at a time; CB house style (very light orange ground, orange accent, bold dark text) */
:root{
  --bg:#FFF5EA; --card:#FFFBF6; --line:#F3D3B0; --accent:#F28C28; --accent-soft:#FDE3C6;
  --ink:#1B1006; --ink2:#4A3420; --lt:#0B4F8A; --lt-soft:#DCEAF7;
  --good:#1E7B3A; --good-soft:#DDF2E2; --warn:#A35A00; --warn-soft:#FFEBC8; --bad:#B3261E; --bad-soft:#FBE0DD;
  --f-disp:"Playfair Display",Georgia,serif; --f-body:"Inter","Noto Sans Tamil",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand h1{font-family:var(--f-disp);font-size:clamp(20px,3.4vw,30px);margin:0;line-height:1.1;text-wrap:balance}
.brand .sub{font-size:12.5px;color:var(--ink2);font-weight:700}
.slogan{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink);background:var(--accent-soft);border:1.5px solid var(--accent);padding:3px 8px;border-radius:4px}
.brand .sp{flex:1}
.langbtn{display:flex;border:2px solid var(--accent);border-radius:6px;overflow:hidden}
.langbtn button{border:0;background:var(--card);font:800 13px var(--f-body);padding:6px 12px;cursor:pointer;color:var(--ink)}
.langbtn button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13px var(--f-body);padding:6px 11px;border-radius:5px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible{outline:3px solid var(--lt);outline-offset:2px}
main{padding-block:18px 120px}
h2{font-family:var(--f-disp);font-size:clamp(22px,3vw,30px);margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0 0 8px;font-weight:800}
.lead{color:var(--ink2);margin:0 0 14px;font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid>*,.grid2>*{min-width:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:800}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--warn)}
ul.b{margin:0;padding-left:18px} ul.b li{margin:3px 0}
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--accent-soft);font-weight:800}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:20px;border:1.5px solid currentColor}
.pg{color:var(--good);background:var(--good-soft)} .pw{color:var(--warn);background:var(--warn-soft)} .pb{color:var(--bad);background:var(--bad-soft)} .pl{color:var(--lt);background:var(--lt-soft)}
svg text{font-family:var(--f-body);fill:var(--ink);font-weight:700}
svg .mono{font-family:var(--f-mono)}
.note{font-size:12.5px;color:var(--ink2);font-weight:600}
.svgbox{overflow-x:auto}
.svgbox svg{width:100%;height:auto;min-width:300px;display:block}
/* Business model flow map */
.flow{display:grid;gap:10px;grid-template-columns:1fr 1.3fr 1fr;align-items:stretch}
.flow .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.node{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.node:hover{border-color:var(--accent)}
.node.hub{border-color:var(--lt);background:var(--lt-soft)}
.node b{display:block;font-size:14px}
.node span{font-size:12.5px;color:var(--ink2)}
.node .n{font-family:var(--f-mono);color:var(--ink);font-weight:700}
.arrow{font-family:var(--f-mono);text-align:center;color:var(--accent);font-weight:800}
.detail{margin-top:12px;border:2px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px}
.formula{margin-top:12px;font-family:var(--f-mono);font-weight:700;background:var(--card);border:1.5px dashed var(--accent);padding:10px;border-radius:8px;text-align:center}
@media (max-width:760px){.flow{grid-template-columns:1fr}.arrow.h{transform:rotate(90deg)}}
/* quiz/self-check */
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font:700 14px var(--f-body);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;margin-top:2px}
.chk .data{font-size:12.5px;color:var(--lt);font-weight:700}
.bar{height:10px;background:var(--accent-soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.btn{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);font:800 13px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn.solid{background:var(--accent)}
/* CB badge + voice bubble */
#cbBadge{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
#cbBadge .logo{width:46px;height:46px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:grid;place-items:center;font:800 16px var(--f-disp);color:var(--ink);cursor:pointer;animation:blink 1.6s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(242,140,40,.35)}}
#cbBadge .tip{display:none;position:absolute;right:0;bottom:56px;width:min(300px,80vw);background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:10px;font-size:12.5px}
#cbBadge:hover .tip,#cbBadge.open .tip{display:block}
#voiceBubble{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;border:2px solid var(--ink);background:var(--accent-soft);color:var(--ink);font:800 12.5px var(--f-body);padding:8px 12px;border-radius:22px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#cbBadge .logo{animation:none}}
/* assist */
.chat{height:360px;overflow-y:auto;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 11px;border-radius:8px;font-size:14px}
.msg.u{align-self:flex-end;background:var(--lt-soft);border:1.5px solid var(--lt)}
.msg.a{align-self:flex-start;background:var(--accent-soft);border:1.5px solid var(--accent)}
.msg details{margin-top:4px;font-size:13px}
.askrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.askrow input{flex:1;min-width:180px;padding:9px;border:2px solid var(--line);border-radius:6px;font:700 14px var(--f-body);background:var(--card);color:var(--ink)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font:700 12.5px var(--f-body);cursor:pointer;color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.ctrl input[type=range]{accent-color:var(--accent)}
.readbtn{float:right}
.pic h3{color:var(--ink)}
.pics{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}.pics>*{min-width:0}.pic.wide{grid-column:1/-1}.pic.wide .svgbox svg{max-width:960px;margin:0 auto}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>Larsen &amp; Toubro · Q2 FY27</h1>
        <div class="sub" id="subline"></div>

      <span class="slogan" id="slogan"></span>

<main class="wrap" id="main"></main>

<script>
/* ============ Language helpers ============ */
var LANG="en";
try{var s=localStorage.getItem("cb_lt_lang");if(s)LANG=s;}catch(e){}
function A(en,ta){return {en:en,ta:ta};}
function L(en,ta){return LANG==="ta"?ta:en;}
function t(o){return o?(LANG==="ta"?o.ta:o.en):"";}
function f0(n){return Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});}
function f1(n){return Number(n).toLocaleString("en-IN",{maximumFractionDigits:1,minimumFractionDigits:1});}
function chg(a,b){if(a==null||b==null)return "—";var c=(a/b-1)*100;return '<span class="'+(c>=0?"up":"dn")+'">'+(c>=0?"+":"")+f1(c)+"%</span>";}
function bps(a,b){if(a==null||b==null)return "—";var c=Math.round((a-b)*100);return '<span class="'+(c>=0?"up":"dn")+'">'+(c>=0?"+":"")+c+" bps</span>";}

/* ============ Data (₹ crore unless stated) ============ */
var Q={ // consolidated
  rev:[78750,67942,67984], ebitda:[6845,6116,6806], margin:[8.7,9.0,10.0], pat:[5202,4123,3926],
  oi:[147665,108014,115784], ob:[853514,778954,667047], intlRevShare:[58,51,56], intlOI:[92375,60702,75561],
  intlOIShare:[63,56,65], nwc:[1.7,4.9,10.2], fin:[473,null,763], oth:[2310,null,1384]
};
var SEG=[ // Q2FY27, Q1FY27, Q2FY26 (Q2FY26 derived from reported YoY growth, approx.)
 {id:"iu",n:A("Infrastructure & Utilities","Infrastructure & Utilities"),rev:[25133,21858,23710],m:[5.7,5.1,6.2],oi:[35509,44357,40815],obShare:42,g:6,col:"#0B4F8A",
  what:A("Metros, airports, buildings & factories, water, power T&D, minerals & metals","Metro, airport, buildings, factory, water, power line, metals plants")},
 {id:"ec",n:A("Energy – Conventional","Energy – Conventional"),rev:[17285,14239,13400],m:[7.4,7.6,8.2],oi:[78413,3053,38900],obShare:34,g:29,col:"#C2410C",
  what:A("Hydrocarbon (offshore & onshore oil-gas plants) + CarbonLite (thermal/clean power)","Oil & gas offshore platform, onshore plant + CarbonLite power")},
 {id:"eg",n:A("Energy – Green","Energy – Green"),rev:[11493,5607,8037],m:[6.0,6.0,6.2],oi:[6558,33042,11924],obShare:17,g:43,col:"#2F7D32",
  what:A("Solar EPC, offshore wind transmission, battery storage, green hydrogen","Solar EPC, offshore wind, battery storage, green hydrogen")},
 {id:"mp",n:A("Manufacturing & Products","Manufacturing & Products"),rev:[4480,null,3343],m:[15.7,15.2,13.5],oi:[5778,null,4312],obShare:5,g:34,col:"#7A3E9D",
  what:A("Heavy engineering, precision engineering & defence systems, valves","Heavy engineering, defence systems, precision engineering")},
 {id:"tp",n:A("Technology, Platforms & Services","Technology, Platforms & Services"),rev:[14826,14627,13357],m:[19.5,19.2,20.0],oi:[null,null,null],obShare:null,g:11,col:"#00838F",
  what:A("LTIMindtree, LTTS, digital platforms, data centres, semiconductor design","LTIMindtree, LTTS, digital platforms, data centre, chip design")},
 {id:"fs",n:A("Financial Services","Financial Services"),rev:[5307,null,4179],m:[null,null,null],oi:[null,null,null],obShare:null,g:27,col:"#8D6E00",
  what:A("L&T Finance — retail loans (rural, 2W, personal, home, gold)","L&T Finance — rural, two-wheeler, personal, home, gold loans")},
 {id:"re",n:A("Realty","Realty"),rev:[225,null,395],m:[54.3,36.9,67.6],oi:[1292,null,1468],obShare:null,g:-43,col:"#6D4C41",
  what:A("L&T Realty — residential & commercial projects","L&T Realty — வீடு & office projects")}
];

/* ============ Chart helpers (SVG) ============ */
function hbars(items,opt){ // items:[{l,v,c,s}] horizontal bars
  opt=opt||{};var W=640,rowH=34,lw=opt.lw||210,H=items.length*rowH+12;
  var max=opt.max||Math.max.apply(null,items.map(function(i){return Math.abs(i.v)}));
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  items.forEach(function(it,i){var y=6+i*rowH,w=Math.max(2,(Math.abs(it.v)/max)*(W-lw-125));
    s+='<text x="0" y="'+(y+20)+'" font-size="13">'+it.l+'</text>';
    s+='<rect x="'+lw+'" y="'+(y+6)+'" width="'+w+'" height="18" rx="3" fill="'+(it.c||"#F28C28")+'"/>';
    s+='<text class="mono" x="'+(lw+w+6)+'" y="'+(y+20)+'" font-size="13">'+(it.s||f0(it.v))+'</text>';});
  return s+'</svg>';}
function vgroup(cats,series,opt){ // grouped vertical bars
  opt=opt||{};var W=640,H=260,pl=10,pb=40,pt=20,cw=(W-pl*2)/cats.length,n=series.length,bw=Math.min(36,(cw-20)/n);
  var max=opt.max||Math.max.apply(null,[].concat.apply([],series.map(function(s){return s.v.filter(function(x){return x!=null})})));
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="#E2B98C" stroke-width="1.5"/>';
  cats.forEach(function(c,ci){var x0=pl+ci*cw+(cw-n*bw)/2;
    series.forEach(function(se,si){var v=se.v[ci];if(v==null)return;var h=(v/max)*(H-pb-pt);
      s+='<rect x="'+(x0+si*bw)+'" y="'+(H-pb-h)+'" width="'+(bw-4)+'" height="'+h+'" rx="2" fill="'+se.c+'"/>';
      if(opt.labels!==false)s+='<text class="mono" x="'+(x0+si*bw+(bw-4)/2)+'" y="'+(H-pb-h-4)+'" font-size="10.5" text-anchor="middle">'+(opt.fmt?opt.fmt(v):f0(v))+'</text>';});
    s+='<text x="'+(pl+ci*cw+cw/2)+'" y="'+(H-pb+18)+'" font-size="12" text-anchor="middle">'+c+'</text>';});
  var lx=0;series.forEach(function(se){s+='<rect x="'+lx+'" y="'+(H-14)+'" width="12" height="12" fill="'+se.c+'"/><text x="'+(lx+16)+'" y="'+(H-3)+'" font-size="12">'+se.n+'</text>';lx+=150;});
  return s+'</svg>';}
function donut(parts,center){var R=80,r=50,cx=110,cy=110,tot=parts.reduce(function(a,p){return a+p.v},0),a0=-Math.PI/2;
  var s='<svg viewBox="0 0 540 220" role="img">';
  parts.forEach(function(p,i){var a1=a0+2*Math.PI*p.v/tot,lg=(a1-a0)>Math.PI?1:0;
    s+='<path d="M'+(cx+R*Math.cos(a0))+' '+(cy+R*Math.sin(a0))+' A'+R+' '+R+' 0 '+lg+' 1 '+(cx+R*Math.cos(a1))+' '+(cy+R*Math.sin(a1))+' L'+(cx+r*Math.cos(a1))+' '+(cy+r*Math.sin(a1))+' A'+r+' '+r+' 0 '+lg+' 0 '+(cx+r*Math.cos(a0))+' '+(cy+r*Math.sin(a0))+'Z" fill="'+p.c+'" stroke="#FFFBF6" stroke-width="2"/>';
    s+='<rect x="240" y="'+(30+i*30)+'" width="14" height="14" fill="'+p.c+'"/><text x="262" y="'+(42+i*30)+'" font-size="13">'+p.l+' — '+(p.s||Math.round(p.v/tot*100)+"%")+'</text>';a0=a1;});
  s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="14">'+(center||"")+'</text>';
  return s+'</svg>';}
function line(pts,opt){opt=opt||{};var W=640,H=230,p=40,max=opt.max||Math.max.apply(null,pts.map(function(x){return x.v})),min=opt.min||0;
  var step=(W-2*p)/(pts.length-1),s='<svg viewBox="0 0 '+W+' '+H+'" role="img">',d="",dots="";
  for(var g=0;g<=4;g++){var gy=H-p-(H-2*p)*g/4;s+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+gy+'" y2="'+gy+'" stroke="#F3D3B0"/>';}
  pts.forEach(function(q,i){var x=p+i*step,y=H-p-(q.v-min)/(max-min)*(H-2*p);d+=(i?"L":"M")+x+" "+y;
    dots+='<circle cx="'+x+'" cy="'+y+'" r="'+(i==pts.length-1?7:5)+'" fill="'+(opt.c||"#F28C28")+'" stroke="#1B1006" stroke-width="1.5"/>';
    dots+='<text class="mono" x="'+x+'" y="'+(y-12)+'" text-anchor="middle" font-size="13">'+(opt.fmt?opt.fmt(q.v):q.v)+'</text>';
    dots+='<text x="'+x+'" y="'+(H-12)+'" text-anchor="middle" font-size="12">'+q.l+'</text>';});
  return s+'<path d="'+d+'" fill="none" stroke="'+(opt.c||"#F28C28")+'" stroke-width="3"/>'+dots+'</svg>';}
function gauge(val,min,max,label,bands){ // semicircle gauge
  var cx=160,cy=150,R=110,s='<svg viewBox="0 0 320 190" role="img">';
  bands.forEach(function(b){var a0=Math.PI*(1-(b[0]-min)/(max-min)),a1=Math.PI*(1-(b[1]-min)/(max-min));
    s+='<path d="M'+(cx+R*Math.cos(a0))+' '+(cy-R*Math.sin(a0))+' A'+R+' '+R+' 0 0 1 '+(cx+R*Math.cos(a1))+' '+(cy-R*Math.sin(a1))+'" stroke="'+b[2]+'" stroke-width="22" fill="none"/>';});
  var a=Math.PI*(1-(Math.min(max,Math.max(min,val))-min)/(max-min));
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+(R-20)*Math.cos(a))+'" y2="'+(cy-(R-20)*Math.sin(a))+'" stroke="#1B1006" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#1B1006"/>';
  s+='<text class="mono" x="'+cx+'" y="'+(cy+32)+'" text-anchor="middle" font-size="20">'+label+'</text>';
  s+='<text x="'+(cx-R)+'" y="'+(cy+20)+'" text-anchor="middle" font-size="11">'+min+'</text><text x="'+(cx+R)+'" y="'+(cy+20)+'" text-anchor="middle" font-size="11">'+max+'</text>';
  return s+'</svg>';}
function box(h){return '<div class="svgbox">'+h+'</div>';}
function bl(arr){return '<ul class="b">'+arr.map(function(x){return "<li>"+t(x)+"</li>"}).join("")+"</ul>";}

/* ============ Tabs ============ */
var TABS=[
 ["dash",A("Dashboard","Dashboard")],["bm",A("Business Model","Business Model")],["seg",A("Segments","Segments")],
 ["geo",A("India vs Global","India vs Global")],["subs",A("Subsidiaries","Subsidiaries")],["why",A("Why L&T Leads","L&T ஏன் முன்னாடி?")],
 ["bet",A("Big Bet: Lakshya 31","Big Bet: Lakshya 31")],["chain",A("Sector Need & Value Chain","Sector & Value Chain")],
