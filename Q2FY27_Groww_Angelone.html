function A(en,ta){return {en:en,ta:ta};}

 g:{name:"Groww",full:"Billionbrains Garage Ventures (Groww)",price:198,mcap:124185,shares:627,pat:724.7,patQ1:735.0,patLY:471.3,ti:1540.5,rev:1501.5,revLY:1018.7,

var TABS=[
 ["dash",A("Dashboard","டாஷ்போர்டு")],["bm",A("Business Model","Business Model")],["seg",A("Segments","Segments")],

];

/* ===================== HELPERS ===================== */
function fmt(n,d){return Number(n).toLocaleString("en-IN",{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function ul(arr){return "<ul class='b'>"+arr.map(function(x){return "<li>"+L(x)+"</li>";}).join("")+"</ul>";}
function panel(cls,title,body){return "<div class='panel "+(cls||"")+"'>"+(title?"<h3>"+L(title)+"</h3>":"")+body+"</div>";}
function head(eb,title,sub){return "<div><div class='eyebrow'>"+L(eb)+"</div><h2>"+L(title)+"</h2>"+(sub?"<p class='note' style='margin:4px 0 0'>"+L(sub)+"</p>":"")+"</div>";}
function kpi(l,v,d,cls){return "<div class='kpi'><div class='l'>"+L(l)+"</div><div class='v'>"+v+"</div><div class='d "+(cls||"")+"'>"+L(d||"")+"</div></div>";}
function table(h,rows){return "<div class='tbl'><table><thead><tr>"+h.map(function(x){return "<th>"+L(x)+"</th>";}).join("")+"</tr></thead><tbody>"+rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+L(c)+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div>";}

/* grouped bar chart: cats[], series[{name,color,vals[]}] */
function bars(cats,series,unit,h){
  h=h||240;var W=640,pl=46,pr=10,pt=24,pb=44,ih=h-pt-pb,iw=W-pl-pr;
  var mx=0;series.forEach(function(s){s.vals.forEach(function(v){if(v>mx)mx=v;});});
  var step=Math.pow(10,Math.floor(Math.log10(mx)));var top=Math.ceil(mx/step)*step;if(top/step<4){step=step/2;}
  var gw=iw/cats.length,bw=Math.min(54,(gw-18)/series.length);
  var s="<svg viewBox='0 0 "+W+" "+h+"' width='100%' role='img' style='min-width:420px'>";
  for(var t=0;t<=top+0.001;t+=step){var y=pt+ih-(t/top)*ih;s+="<line x1='"+pl+"' x2='"+(W-pr)+"' y1='"+y+"' y2='"+y+"' stroke='#ece6df'/><text x='"+(pl-6)+"' y='"+(y+4)+"' font-size='11' text-anchor='end' fill='#38414b'>"+fmt(t)+"</text>";}
  cats.forEach(function(c,i){var x0=pl+i*gw+(gw-bw*series.length)/2;
    series.forEach(function(se,j){var v=se.vals[i];if(v==null)return;var bh=(v/top)*ih,x=x0+j*bw,y=pt+ih-bh;
      s+="<rect x='"+(x+2)+"' y='"+y+"' width='"+(bw-4)+"' height='"+bh+"' rx='4' fill='"+se.color+"'/>";
      s+="<text x='"+(x+bw/2)+"' y='"+(y-5)+"' font-size='11' text-anchor='middle' fill='#101418'>"+fmt(v,v<100?1:0)+(unit||"")+"</text>";});
    s+="<text x='"+(pl+i*gw+gw/2)+"' y='"+(h-pb+18)+"' font-size='12' text-anchor='middle' fill='#101418'>"+L(c)+"</text>";});
  s+="<line x1='"+pl+"' x2='"+(W-pr)+"' y1='"+(pt+ih)+"' y2='"+(pt+ih)+"' stroke='#101418'/>";
  return "<div class='svgbox'>"+s+"</svg></div>";
}
function legend(items){return "<div class='legend'>"+items.map(function(x){return "<span><i style='background:"+x[1]+"'></i>"+L(x[0])+"</span>";}).join("")+"</div>";}

/* waffle of ₹100 */
function waffle(parts){var cells="";parts.forEach(function(p){for(var i=0;i<p[1];i++)cells+="<i style='background:"+p[2]+"' title='"+L(p[0])+"'></i>";});
  return "<div style='display:flex;gap:16px;flex-wrap:wrap;align-items:center'><div class='waffle' style='flex:1 1 200px'>"+cells+"</div><div style='flex:1 1 180px;min-width:0'>"+parts.map(function(p){return "<div><i style='display:inline-block;width:12px;height:12px;border-radius:3px;background:"+p[2]+";margin-right:6px'></i>₹"+p[1]+" · "+L(p[0])+"</div>";}).join("")+"</div></div>";}

/* business model flow */
function flow(color,soft,co,items){
  var W=640,rowH=46,H=Math.max(260,items.length*rowH+40),s="<svg viewBox='0 0 "+W+" "+H+"' width='100%' style='min-width:520px' role='img'>";
  s+="<defs><marker id='ar"+co+"' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0L10,5L0,10z' fill='"+color+"'/></marker></defs>";
  var cy=H/2;
  s+="<circle cx='52' cy='"+cy+"' r='40' fill='#fff4e8' stroke='#f28c28' stroke-width='2.5'/><text x='52' y='"+(cy-4)+"' text-anchor='middle' font-size='13' fill='#101418'>"+L(A("You","நீங்க"))+"</text><text x='52' y='"+(cy+13)+"' text-anchor='middle' font-size='11' fill='#38414b'>"+L(A("investor","investor"))+"</text>";
  s+="<line x1='94' y1='"+cy+"' x2='140' y2='"+cy+"' stroke='"+color+"' stroke-width='2.5' marker-end='url(#ar"+co+")'/>";
  s+="<rect x='142' y='"+(cy-34)+"' width='118' height='68' rx='12' fill='"+soft+"' stroke='"+color+"' stroke-width='2.5'/><text x='201' y='"+(cy-4)+"' text-anchor='middle' font-size='14' fill='"+color+"'>"+co+"</text><text x='201' y='"+(cy+14)+"' text-anchor='middle' font-size='11' fill='#38414b'>"+L(A("one app","ஒரே app"))+"</text>";
  items.forEach(function(it,i){var y=20+i*rowH+rowH/2-((items.length*rowH+40-H)/2);
    s+="<path d='M262,"+cy+" C300,"+cy+" 300,"+y+" 330,"+y+"' fill='none' stroke='"+color+"' stroke-width='1.8' marker-end='url(#ar"+co+")'/>";
    s+="<rect x='332' y='"+(y-17)+"' width='150' height='34' rx='8' fill='#fff' stroke='#d9d2c9' stroke-width='1.5'/><text x='407' y='"+(y+5)+"' text-anchor='middle' font-size='12' fill='#101418'>"+L(it[0])+"</text>";
    s+="<text x='492' y='"+(y-1)+"' font-size='11' fill='"+color+"'>"+L(it[1])+"</text><text x='492' y='"+(y+13)+"' font-size='11' fill='#38414b'>"+L(it[2])+"</text>";});
  return "<div class='svgbox'>"+s+"</svg></div>";
}

/* temple of 6 pillars */
function temple(color,scores,labels,total){
  var W=640,H=330,s="<svg viewBox='0 0 "+W+" "+H+"' width='100%' style='min-width:480px' role='img'>";
  s+="<polygon points='60,92 320,18 580,92' fill='"+color+"' opacity='.92'/><text x='320' y='74' text-anchor='middle' font-size='22' fill='#fff' font-family='Baloo Thambi 2'>"+total+" / 60</text>";
  s+="<rect x='50' y='92' width='540' height='16' fill='"+color+"'/>";
  var base=270;scores.forEach(function(v,i){var x=78+i*84,full=base-108,hh=(v/10)*full;
    s+="<rect x='"+x+"' y='108' width='46' height='"+full+"' fill='#f4efe9' stroke='#e2d9cf'/>";
    s+="<rect x='"+x+"' y='"+(base-hh)+"' width='46' height='"+hh+"' fill='"+color+"' opacity='.75'/>";
    s+="<text x='"+(x+23)+"' y='"+(base-hh-6>120?base-hh-6:130)+"' text-anchor='middle' font-size='15' fill='#101418'>"+v+"</text>";
    var lb=L(labels[i]).split("|");lb.forEach(function(w,k){s+="<text x='"+(x+23)+"' y='"+(296+k*13)+"' text-anchor='middle' font-size='10.5' fill='#101418'>"+w+"</text>";});});
  s+="<rect x='40' y='270' width='560' height='14' fill='#c9bfb3'/>";
  return "<div class='svgbox'>"+s+"</svg></div>";
}

/* cycle clock */
function clock(phaseIdx,stockLbl){
  var W=320,H=300,cx=160,cy=150,r=110,s="<svg viewBox='0 0 "+W+" "+H+"' width='100%' style='max-width:340px' role='img'>";
  var ph=[A("P1 Trough","P1 அடிமட்டம்"),A("P2 Early recovery","P2 ஆரம்ப மீட்சி"),A("P3 Expansion","P3 விரிவு"),A("P4 Late / peak","P4 உச்சம்"),A("P5 Downturn","P5 இறக்கம்")];
  var col=["#f6c08a","#7cc79a","#13853f","#e0a33a","#c0392b"];
  for(var i=0;i<5;i++){var a0=(-90+i*72)*Math.PI/180,a1=(-90+(i+1)*72)*Math.PI/180;
    var x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+="<path d='M"+cx+","+cy+" L"+x0+","+y0+" A"+r+","+r+" 0 0 1 "+x1+","+y1+" z' fill='"+col[i]+"' opacity='"+(i===phaseIdx?1:.35)+"' stroke='#fff' stroke-width='3'/>";
    var am=(-90+i*72+36)*Math.PI/180;s+="<text x='"+(cx+(r*0.66)*Math.cos(am))+"' y='"+(cy+(r*0.66)*Math.sin(am)+4)+"' text-anchor='middle' font-size='10.5' fill='#101418'>"+L(ph[i]).split(" ")[0]+"</text>";}
  var ap=(-90+phaseIdx*72+36)*Math.PI/180;s+="<line x1='"+cx+"' y1='"+cy+"' x2='"+(cx+(r+14)*Math.cos(ap))+"' y2='"+(cy+(r+14)*Math.sin(ap))+"' stroke='#101418' stroke-width='4' stroke-linecap='round'/><circle cx='"+cx+"' cy='"+cy+"' r='9' fill='#101418'/>";
  s+="<text x='"+cx+"' y='"+(H-8)+"' text-anchor='middle' font-size='12' fill='#101418'>"+L(ph[phaseIdx])+" · "+L(stockLbl)+"</text>";

function pickVoice(){var vs=voices();if(AS.voice){var f=vs.find(function(v){return v.name===AS.voice;});if(f)return f;}
 var want=lang==="ta"?"ta":"en-IN";return vs.find(function(v){return v.lang&&v.lang.indexOf(want)===0;})||vs.find(function(v){return /IN/.test(v.lang||"");})||null;}
function speak(text){if(!synth)return;stopSpeak();spQ=String(text).replace(/<[^>]+>/g," ").split(/(?<=[.!?।])\s+/).filter(function(x){return x.trim();});speaking=true;next();}
function next(){if(!spQ.length){speaking=false;return;}var u=new SpeechSynthesisUtterance(spQ.shift());u.rate=AS.speed;u.lang=lang==="ta"?"ta-IN":"en-IN";var v=pickVoice();if(v)u.voice=v;u.onend=function(){setTimeout(next,280);};u.onerror=function(){speaking=false;};try{synth.speak(u);}catch(e){}}
function stopSpeak(){spQ=[];try{synth&&synth.cancel();}catch(e){}speaking=false;}
/* mic */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,listening=false,heard="",silT=null;
function startMic(){
 if(!SR){note(A("Voice input is not available here. Open this file in Chrome or Edge from GitHub Pages; read-aloud still works.","இங்க voice input இல்ல. GitHub Pages-ல Chrome / Edge-ல திறங்க; read-aloud வேலை செய்யும்."));return;}
 try{rec=new SR();}catch(e){note(A("Microphone is blocked in this view.","இந்த view-ல mic block ஆகியிருக்கு."));return;}
 rec.lang=lang==="ta"?"ta-IN":"en-IN";rec.continuous=true;rec.interimResults=true;heard="";listening=true;stopSpeak();
 rec.onresult=function(ev){var t="";for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;heard=t;var inp=document.getElementById("aIn");if(inp)inp.value=t;
   clearTimeout(silT);if(AS.wait>0)silT=setTimeout(doneMic,AS.wait*1000);};
 rec.onend=function(){if(listening){try{rec.start();}catch(e){}}};
 rec.onerror=function(e){if(e.error==="not-allowed"||e.error==="service-not-allowed"){listening=false;note(A("Microphone permission is blocked here. Use the file on GitHub Pages in Chrome or Edge.","இங்க mic அனுமதி இல்ல. GitHub Pages-ல Chrome / Edge use பண்ணுங்க."));renderAssistState();}};
 try{rec.start();}catch(e){}renderAssistState();
}
function doneMic(){listening=false;clearTimeout(silT);try{rec&&rec.stop();}catch(e){}renderAssistState();if(heard.trim()&&!AS.review)ask(heard.trim());}
function note(m){chat.push({b:true,a:m});render();}
function ask(q){if(!q)return;var r=ans(q);chat.push({u:q});chat.push({b:true,a:r.a,tab:r.tab});render();speak(L(r.a));}
function renderAssistState(){var b=document.getElementById("aMic");if(b){b.textContent=listening?L(A("Done","முடிஞ்சது")):L(A("🎤 Speak","🎤 பேசுங்க"));b.className=listening?"on":"";}}
var SUG=[A("Why is Groww's price low but Angel's high?","Groww விலை குறைவு, Angel அதிகம் ஏன்?"),A("Which company has the higher margin?","எந்த company-க்கு margin அதிகம்?"),A("Groww profit","Groww profit"),A("What about its P/E?","அதோட P/E?"),A("What is CAS?","CAS என்ன?"),A("What are they doing to grow?","வளர என்ன பண்றாங்க?"),A("Does Angel One pay a dividend?","Angel One dividend தருதா?"),A("Should I buy Groww?","Groww வாங்கலாமா?")];
R.assist=function(){
 var msgs=chat.length?chat.map(function(m){if(m.u)return "<div class='msg u'>"+m.u+"</div>";return "<div class='msg b'>"+L(m.a)+(m.tab?"<div><button type='button' data-open='"+m.tab+"' style='margin-top:6px;font-size:.78rem;padding:2px 10px'>"+L(A("Open related tab","தொடர்புடைய tab திற"))+"</button></div>":"")+"</div>";}).join("")
  :"<div class='msg b'>"+L(A("Vanakam! Ask me about Groww and Angel One's Q2 FY27 results. I answer in one line.","வணக்கம்! Groww, Angel One Q2 FY27 results பற்றி கேளுங்க. ஒரே வரியில பதில் சொல்றேன்."))+"</div>";
 return head(A("Ask in English or Tamil","English அல்லது தமிழ்ல கேளுங்க"),A("Cauvery Assist","Cauvery Assist"),A("Direct one-line answers, read aloud. Voice input works on GitHub Pages in Chrome or Edge.","நேரடி ஒரு வரி பதில், சத்தமா வாசிக்கும். Voice input GitHub Pages-ல Chrome / Edge-ல வேலை செய்யும்."))
 +panel("","","<div class='qa' id='aLog'>"+msgs+"</div>"
  +"<div class='assistbar' style='margin-top:12px'><input type='text' id='aIn' style='flex:1 1 240px' placeholder='"+L(A("Ask: Which company has the higher margin?","கேளுங்க: எந்த company-க்கு margin அதிகம்?"))+"'><button type='button' class='acc' id='aSend'>"+L(A("Ask","கேள்"))+"</button><button type='button' id='aMic'></button></div>"
  +"<div class='sugs' style='margin-top:10px'>"+SUG.map(function(s,i){return "<button type='button' data-sug='"+i+"'>"+L(s)+"</button>";}).join("")+"</div>")
 +panel("soft",A("Voice settings","Voice settings"),"<div class='assistbar'>"
  +["0.6","0.8","1.0","1.2"].map(function(v,i){return "<button type='button' data-sp='"+v+"' class='"+(Math.abs(AS.speed-v)<.01?"on":"")+"'>"+L([A("Slow","மெதுவா"),A("Relaxed","நிதானமா"),A("Normal","சாதாரணம்"),A("Fast","வேகமா")][i])+"</button>";}).join("")
  +"<label for='aSpd'>"+L(A("Speed","வேகம்"))+" <b id='spV'>"+AS.speed.toFixed(1)+"×</b></label><input type='range' id='aSpd' min='0.5' max='1.5' step='0.1' value='"+AS.speed+"'>"
  +"<button type='button' id='aPause'>"+L(A("Pause / Resume","நிறுத்து / தொடர்"))+"</button><button type='button' id='aStop'>"+L(A("Stop","நிறுத்து"))+"</button></div>"
  +"<div class='assistbar' style='margin-top:10px'><label for='aWait'>"+L(A("Wait after I stop speaking","நான் பேசி முடிச்சதும் காத்திரு"))+"</label><select id='aWait'>"+[[2,"2s"],[3,"3s"],[5,"5s"],[0,L(A("Only when I tap Done","Done தட்டும்போது மட்டும்"))]].map(function(o){return "<option value='"+o[0]+"' "+(AS.wait==o[0]?"selected":"")+">"+o[1]+"</option>";}).join("")+"</select>"
  +"<label><input type='checkbox' id='aRev' "+(AS.review?"checked":"")+"> "+L(A("Check text before sending","அனுப்பும் முன் text பார்க்கணும்"))+"</label></div>"
  +"<p class='note' id='tvNote'></p>");
};

/* ===================== RENDER ===================== */
var cur="dash";try{var h=(location.hash||"").replace("#","");if(h&&R[h])cur=h;else{var st=localStorage.getItem("cb_ga_tab");if(st&&R[st])cur=st;}}catch(e){}
function render(){
 document.documentElement.lang=lang==="ta"?"ta":"en";
 document.getElementById("ttl").textContent=L(A("Groww vs Angel One · Q2 FY27","Groww vs Angel One · Q2 FY27"));
 document.getElementById("slog").textContent=lang==="ta"?"CB Research · புரிஞ்சு வாங்குங்க!":"CB Research · Know before you own";
 document.getElementById("readTab").textContent=L(A("🔊 Read this tab","🔊 இந்த tab வாசி"));
 document.getElementById("voiceBub").textContent=L(A("🎙 Voice Assist","🎙 Voice Assist"));
 document.getElementById("cbTip").innerHTML="<b>CB Research</b> — "+L(A("Education only. Not SEBI-registered. No buy, sell or hold recommendations. Data from company filings and market prices as of 15 Oct 2026; CB estimates marked '~'. Verify before acting.","Education மட்டும். SEBI-registered இல்ல. Buy, sell, hold பரிந்துரை இல்ல. Company filings, 15 Oct 2026 market விலை அடிப்படையில்; '~' = CB மதிப்பீடு. முடிவு எடுக்கும் முன் சரிபாருங்க."));
 document.getElementById("bEN").className=lang==="en"?"on":"";document.getElementById("bTA").className=lang==="ta"?"on":"";
 document.getElementById("tabs").innerHTML=TABS.map(function(t){return "<button type='button' data-tab='"+t[0]+"' class='"+(t[0]===cur?"on":"")+"'>"+L(t[1])+"</button>";}).join("");
 var st=document.getElementById("subtabs");st.hidden=!!NOSUB[cur];
 st.innerHTML="<span class='lbl'>"+L(A("View","பார்வை"))+"</span>"+[["g","sg","Groww"],["a","sa","Angel One"],["c","sc",L(A("Compare","ஒப்பீடு"))]].map(function(x){return "<button type='button' data-sub='"+x[0]+"' class='"+x[1]+(SUB===x[0]?" on":"")+"'>"+x[2]+"</button>";}).join("");
 document.getElementById("main").innerHTML="<section class='tab' id='sec'>"+R[cur]()+"</section>";
 if(cur==="assist"){renderAssistState();var lg=document.getElementById("aLog");if(lg)lg.scrollTop=lg.scrollHeight;
   var tv=document.getElementById("tvNote");if(tv&&lang==="ta"&&!voices().some(function(v){return (v.lang||"").indexOf("ta")===0;}))tv.textContent="இந்த device-ல Tamil voice இல்ல; English voice-ல வாசிக்கும்.";}
}
function go(t){cur=t;stopSpeak();try{localStorage.setItem("cb_ga_tab",t);}catch(e){}render();window.scrollTo(0,0);var b=document.querySelector("[data-tab='"+t+"']");if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});}
document.addEventListener("click",function(e){
 var t=e.target.closest("button,input");if(!t)return;
 if(t.dataset.tab)go(t.dataset.tab);
 else if(t.dataset.sub){SUB=t.dataset.sub;stopSpeak();try{localStorage.setItem("cb_ga_sub",SUB);}catch(x){}render();}
 else if(t.id==="bEN"){lang="en";render();}else if(t.id==="bTA"){lang="ta";render();}
 else if(t.id==="readTab"){var s=document.getElementById("sec");if(speaking)stopSpeak();else speak(s.innerText.replace(/\s+/g," "));}
 else if(t.id==="voiceBub")go("assist");
 else if(t.id==="cbDot")document.getElementById("cbBadge").classList.toggle("open");
 else if(t.dataset.k){chkState[t.dataset.k]=t.checked;saveChk();render();}
 else if(t.dataset.del!=null){customChk[SUB].splice(+t.dataset.del,1);saveChk();render();}
 else if(t.id==="custAdd"){var v=document.getElementById("custIn").value.trim();if(v){customChk[SUB].push(v);saveChk();render();}}
 else if(t.dataset.q!=null){qAns[t.dataset.q]=+t.dataset.o;render();}
 else if(t.id==="qReset"){qAns={};render();}
 else if(t.id==="aSend"){var q=document.getElementById("aIn").value.trim();if(q)ask(q);}
 else if(t.dataset.sug!=null)ask(L(SUG[+t.dataset.sug]));
 else if(t.id==="aMic"){if(listening)doneMic();else startMic();}
 else if(t.dataset.sp){AS.speed=+t.dataset.sp;saveAS();render();}
 else if(t.id==="aPause"){try{if(synth.paused)synth.resume();else synth.pause();}catch(x){}}
 else if(t.id==="aStop")stopSpeak();
 else if(t.dataset.open)go(t.dataset.open);
 else if(t.id==="aRev"){AS.review=t.checked;saveAS();}
});
document.addEventListener("input",function(e){if(e.target.id==="aSpd"){AS.speed=+e.target.value;saveAS();var s=document.getElementById("spV");if(s)s.textContent=AS.speed.toFixed(1)+"×";}});
document.addEventListener("change",function(e){if(e.target.id==="aWait"){AS.wait=+e.target.value;saveAS();}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="aIn"){var q=e.target.value.trim();if(q)ask(q);}if(e.key==="Enter"&&e.target.id==="custIn"){var v=e.target.value.trim();if(v){customChk[SUB].push(v);saveChk();render();}}});
document.addEventListener("click",function(e){if(!e.target.closest("#cbBadge"))document.getElementById("cbBadge").classList.remove("open");},true);
if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=function(){};
render();
</script>
