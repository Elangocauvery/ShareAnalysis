/* ---------- SVG chart helpers ---------- */
var C={acc:'#F28C28',pow:'#C2410C',ind:'#1D4ED8',good:'#15803D',bad:'#B91C1C',ink:'#1B1206',line:'#F3C48C',soft:'#FBD7AE',muted:'#5C4426',warn:'#A16207'};
function svgOpen(w,h,label){return '<div class="svgw"><svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||'chart')+'">';}
function svgClose(){return '</svg></div>';}
function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||12)+'" text-anchor="'+(o.a||'middle')+'"'+(o.fill?' style="fill:'+o.fill+'"':'')+(o.w?' font-weight="'+o.w+'"':'')+'>'+esc(s)+'</text>';}
/* grouped bars: cats[], series[{name,color,vals[]}] */
function bars(cats,series,o){o=o||{};var W=o.w||620,H=o.h||250,pl=46,pb=40,pt=26,ph=H-pb-pt,pw=W-pl-12;
 var mx=0;series.forEach(function(s){s.vals.forEach(function(v){if(v>mx)mx=v;});});mx=(mx||1)*1.15;
 var g=svgOpen(W,H,o.label);var gw=pw/cats.length,bw=Math.min(46,(gw-14)/series.length);
 for(var k=0;k<=4;k++){var y=pt+ph-ph*k/4;g+='<line x1="'+pl+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="'+C.line+'" stroke-width="1"/>'+T(pl-6,y+4,fmt(mx*k/4,0),{a:'end',fs:10});}
 cats.forEach(function(c,i){var x0=pl+gw*i+(gw-bw*series.length)/2;
  series.forEach(function(s,j){var v=s.vals[i];if(v==null)return;var h=ph*v/mx,x=x0+j*bw,y=pt+ph-h;
   g+='<rect x="'+x+'" y="'+y+'" width="'+(bw-4)+'" height="'+h+'" rx="4" fill="'+(s.colors?s.colors[i]:s.color)+'" stroke="'+C.ink+'" stroke-width="1.2"/>';
   g+=T(x+(bw-4)/2,y-5,(o.f?o.f(v):fmt(v,0)),{fs:10.5});});
  g+=T(pl+gw*i+gw/2,H-pb+18,c,{fs:11.5});});
 if(series.length>1){var lx=pl;series.forEach(function(s){g+='<rect x="'+lx+'" y="6" width="12" height="12" fill="'+s.color+'" stroke="'+C.ink+'"/>'+T(lx+16,16,s.name,{a:'start',fs:11});lx+=16+s.name.length*7+22;});}
 return g+svgClose();}
/* line chart */
function lines(cats,series,o){o=o||{};var W=o.w||620,H=o.h||240,pl=44,pb=34,pt=28,ph=H-pb-pt,pw=W-pl-26;
 var mn=o.min!=null?o.min:0,mx=o.max||0;if(!o.max)series.forEach(function(s){s.vals.forEach(function(v){if(v>mx)mx=v;});});if(!o.max)mx*=1.15;
 var g=svgOpen(W,H,o.label);
 for(var k=0;k<=4;k++){var vv=mn+(mx-mn)*k/4,y=pt+ph-ph*k/4;g+='<line x1="'+pl+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="'+C.line+'"/>'+T(pl-6,y+4,(o.f?o.f(vv):fmt(vv,0)),{a:'end',fs:10});}
 var X=function(i){return pl+pw*i/(cats.length-1);},Y=function(v){return pt+ph-ph*(v-mn)/(mx-mn);};
 cats.forEach(function(c,i){g+=T(X(i),H-10,c,{fs:11});});
 series.forEach(function(s,j){var d='';s.vals.forEach(function(v,i){d+=(i?'L':'M')+X(i)+' '+Y(v);});
  g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="3.2"/>';

 if(series.length>1){var lx=pl;series.forEach(function(s){g+='<rect x="'+lx+'" y="6" width="12" height="12" fill="'+s.color+'" stroke="'+C.ink+'"/>'+T(lx+16,16,s.name,{a:'start',fs:11});lx+=16+s.name.length*7+22;});}
 return g+svgClose();}
/* donut */
function donut(parts,o){o=o||{};var S=o.s||200,r=S/2-14,cx=S/2,cy=S/2,tot=0;parts.forEach(function(p){tot+=p.v;});var a=-Math.PI/2,g=svgOpen(S+(o.leg?190:0),S,o.label);
 parts.forEach(function(p,i){var a2=a+2*Math.PI*p.v/tot,lg=(a2-a)>Math.PI?1:0;
  g+='<path d="M'+(cx+r*Math.cos(a))+' '+(cy+r*Math.sin(a))+' A'+r+' '+r+' 0 '+lg+' 1 '+(cx+r*Math.cos(a2))+' '+(cy+r*Math.sin(a2))+'" fill="none" stroke="'+p.c+'" stroke-width="26"/>';a=a2;
  if(o.leg){g+='<rect x="'+(S+10)+'" y="'+(20+i*24)+'" width="14" height="14" fill="'+p.c+'" stroke="'+C.ink+'"/>'+T(S+30,32+i*24,p.n+' '+(o.f?o.f(p.v):p.v.toFixed(1)+'%'),{a:'start',fs:12});}});
 g+=T(cx,cy-2,o.center||'',{fs:15,w:800})+T(cx,cy+16,o.center2||'',{fs:11});return g+svgClose();}
/* gauge 0-100 */
function gauge(v,lab,o){o=o||{};var W=260,H=160,cx=130,cy=135,r=100,g=svgOpen(W,H,lab);
 var seg=[[0,35,'#FCA5A5'],[35,55,'#FDE68A'],[55,75,'#FCD9A8'],[75,100,'#86EFAC']];
 seg.forEach(function(s){var a1=Math.PI*(1-s[0]/100),a2=Math.PI*(1-s[1]/100);g+='<path d="M'+(cx+r*Math.cos(a1))+' '+(cy-r*Math.sin(a1))+' A'+r+' '+r+' 0 0 1 '+(cx+r*Math.cos(a2))+' '+(cy-r*Math.sin(a2))+'" fill="none" stroke="'+s[2]+'" stroke-width="22"/>';});
 var a=Math.PI*(1-v/100);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+(r-8)*Math.cos(a))+'" y2="'+(cy-(r-8)*Math.sin(a))+'" stroke="'+C.ink+'" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="'+C.acc+'" stroke="'+C.ink+'"/>';

function waterfall(steps,o){o=o||{};var W=o.w||640,H=o.h||260,pl=40,pb=46,pt=24,ph=H-pb-pt,pw=W-pl-10,mx=0,run=0;
 steps.forEach(function(s){if(s.type==='start'||s.type==='end'){run=s.v;}else run+=(s.type==='add'?s.v:-s.v);if(run>mx)mx=run;if(s.v>mx&&s.type!=='sub')mx=s.v;});mx*=1.12;

/* progress ring */
function ring(done,total,lab){var S=120,r=46,c=2*Math.PI*r,f=total?done/total:0;return svgOpen(S,S,lab)+'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+C.soft+'" stroke-width="14"/><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+C.acc+'" stroke-width="14" stroke-dasharray="'+(c*f)+' '+c+'" transform="rotate(-90 60 60)"/>'+T(60,58,done+'/'+total,{fs:18,w:800})+T(60,76,lab,{fs:10})+svgClose();}

 window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(h&&R[h]&&h!==CUR){CUR=h;render();}});})();
