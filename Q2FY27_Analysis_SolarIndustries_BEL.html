 [['omnia','acquisition','south africa','deal','ஓம்னியா','டீல்','வாங்குதல்'],'Solar is buying all of South Africa\'s Omnia Holdings for 12,951 crore rupees in cash. Omnia earns about 13,300 crore revenue and 1,536 crore EBITDA. It gives ammonium nitrate supply and African scale. Debt will rise to 10,000 to 11,000 crore by FY28, and brokers expect earnings benefit only from FY29.','தென்னாப்பிரிக்காவோட ஓம்னியா ஹோல்டிங்ஸை 12,951 கோடிக்கு முழு கேஷா வாங்குறாங்க. ஓம்னியா வருமானம் சுமார் 13,300 கோடி, EBITDA 1,536 கோடி. அம்மோனியம் நைட்ரேட் சப்ளையும் ஆப்பிரிக்கா அளவும் கிடைக்கும். FY28-க்குள்ள கடன் 10,000 முதல் 11,000 கோடி வரை போகும்; FY29-ல இருந்து தான் EPS பலன்.'],

 [['risk','threat','danger','ரிஸ்க்','அபாயம்'],'Main risks: the order book shrinking without new large orders, weak cash conversion, Omnia debt and integration, plant safety in explosives manufacturing, currency swings, and a very high valuation.','முக்கிய ரிஸ்க்: புது ஆர்டர் இல்லாம ஆர்டர் புக் குறைவது, பலவீன பணப்புழக்கம், ஓம்னியா கடன், ஆலை பாதுகாப்பு, கரன்சி, அதிக மதிப்பீடு.'],
 [['cycle','trigger','சைக்கிள்','ட்ரிக்கர்'],'The sector is in the expansion phase of its cycle, with a cycle score of 66. The trigger score is 62: positives are the guided Pinaka order and Omnia; negatives are the order-book drawdown and Omnia leverage.','துறை விரிவாக்க நிலையில, சைக்கிள் மதிப்பெண் 66. ட்ரிக்கர் மதிப்பெண் 62: நல்லவை — Pinaka ஆர்டர், ஓம்னியா; கவலை — ஆர்டர் புக் குறைவு, ஓம்னியா கடன்.'],
