<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4e8; --card:#fffdfa; --ink:#2b2118; --muted:#7a6a5c; --line:#f0d9c2;
  --orange:#e8710a; --orange2:#ffb366; --green:#1f9d55; --amber:#d99a00; --red:#d64545;
  --blue:#2f6fb5; --teal:#138f8a; --purple:#7a4fb8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;font-size:15px;line-height:1.5}
body.ta{font-family:'Noto Sans Tamil',Inter,sans-serif}
body::after{content:"CB Research";position:fixed;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-28deg);font-size:110px;font-weight:800;color:rgba(232,113,10,.045);pointer-events:none;z-index:0;white-space:nowrap}
header.top{background:linear-gradient(135deg,#fff0de,#ffe2c2);border-bottom:2px solid var(--orange2);padding:14px 18px 10px;position:relative;z-index:2}
header.top h1{margin:0;font-size:22px;font-weight:800;color:#7a3a00}
header.top .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.langbtn{position:absolute;right:16px;top:14px;background:var(--orange);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
nav.tabs{position:sticky;top:0;z-index:20;background:#fff8f0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:18px;padding:7px 13px;font-size:13.5px;font-weight:600;color:#6b4a2e;cursor:pointer;font-family:inherit}
nav.tabs button.on{background:var(--orange);color:#fff}
nav.tabs button:hover:not(.on){border-color:var(--orange2)}
main{max-width:1240px;margin:0 auto;padding:16px 14px 120px;position:relative;z-index:1}
section.tab{display:none}
section.tab.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subtabs button{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;color:#6b4a2e;font-family:inherit}
.subtabs button.on{border-color:var(--orange);background:#fff1e2;color:#a14d00}
h2{font-size:19px;margin:6px 0 10px;color:#7a3a00}
h3{font-size:16px;margin:16px 0 8px;color:#5a3412}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(150,80,10,.06)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:2px}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--green)} .dn{color:var(--red)} .fl{color:var(--amber)}
.blockhead{display:flex;align-items:center;gap:8px;font-weight:800;color:#7a3a00;margin-bottom:8px}
.pill{display:inline-block;border-radius:12px;padding:2px 9px;font-size:12px;font-weight:700;background:#ffe9d2;color:#9a4a00}
.pill.g{background:#e3f5ea;color:#16703c}.pill.r{background:#fde5e5;color:#a32e2e}.pill.a{background:#fff3d1;color:#8a6200}.pill.b{background:#e4eefa;color:#1f4f88}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid #f3e3d2;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{background:#fff1e2;color:#6b3a10;font-weight:700;position:sticky;top:0}
tr.cat td{background:#fff7ee;font-weight:800;color:#a14d00;text-align:left;font-size:12.5px;letter-spacing:.3px;text-transform:uppercase}
.tl td,.tl th{text-align:left}
.tw{overflow-x:auto}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:360px}
.chartscroll{overflow-x:auto}.chartscroll .inner{min-width:900px;height:320px;position:relative}
ul.b{margin:6px 0;padding-left:20px}ul.b li{margin:4px 0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.explain{background:#fff7ee;border-left:4px solid var(--orange);border-radius:8px;padding:10px 12px;margin-top:10px;min-height:44px}
svg text{font-family:Inter,'Noto Sans Tamil',sans-serif}
.bm-box{cursor:pointer;transition:opacity .2s}.bm-box:hover{opacity:.85}
.bm-box.sel rect{stroke:#2b2118;stroke-width:2.5}
.temple-wrap{display:flex;justify-content:center}
.pillar-card{border-left:5px solid #ccc;padding:10px 12px;border-radius:8px;background:#fff;margin:8px 0;transition:box-shadow .3s}
.pillar-card.hl{box-shadow:0 0 0 3px var(--orange2)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;font-weight:800;font-size:13px;margin:3px 6px 3px 0;background:#fff;border:1.5px solid var(--line)}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot div{border-radius:12px;padding:10px 12px}
.swot .s{background:#e7f6ec}.swot .w{background:#fdeaea}.swot .o{background:#e6effb}.swot .t{background:#fff3d6}
.swot h4{margin:0 0 4px}
.sc-group{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.sc-item{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.sc-item .data{font-size:12px;color:var(--muted)}
.bar{height:10px;background:#f3e3d2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--orange);transition:width .4s}
.quiz-q{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.quiz-q button.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fffaf4;cursor:pointer;font-family:inherit;font-size:14px}
.quiz-q button.opt.ok{background:#e3f5ea;border-color:var(--green)}.quiz-q button.opt.no{background:#fde5e5;border-color:var(--red)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
.slider-row{display:grid;grid-template-columns:220px 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.big{font-size:28px;font-weight:800}
.timeline{display:flex;gap:0;overflow-x:auto;padding:16px 0 6px}
.tl-item{flex:0 0 190px;border-top:3px solid var(--orange2);position:relative;padding:12px 10px 0}
.tl-item::before{content:"";position:absolute;top:-8px;left:10px;width:13px;height:13px;border-radius:50%;background:var(--orange)}
.tl-item .dt{font-weight:800;color:#a14d00;font-size:13px}
/* CB badge */
#cbBadge{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb366,#e8710a);color:#fff;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;box-shadow:0 3px 12px rgba(232,113,10,.45);animation:blink 2.2s infinite;border:3px solid #fff}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(232,113,10,.55)}50%{box-shadow:0 0 0 12px rgba(232,113,10,0)}}

<script>
/* ===== Chart helpers ===== */
var CH=[];
Chart.register({id:'plabels',afterDatasetsDraw:function(c){if(c.config.type!=='doughnut')return;var ctx=c.ctx;ctx.save();ctx.font='700 12px Inter,sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
 var ds=c.data.datasets[0],tot=ds.data.reduce(function(a,b){return a+(b||0)},0);c.getDatasetMeta(0).data.forEach(function(a,i){var v=ds.data[i];if(!v||v/tot<0.04)return;var pct=Math.round(tot)===100?v:v/tot*100;var m=(a.startAngle+a.endAngle)/2,r=(a.innerRadius+a.outerRadius)/2;ctx.fillText(fmt(pct,pct%1?1:0)+'%',a.x+r*Math.cos(m),a.y+r*Math.sin(m));});ctx.restore();}});
Chart.register({id:'vlabels',afterDatasetsDraw:function(c){
 if(c.options.plugins&&c.options.plugins.vlabels===false)return;
 var ctx=c.ctx;ctx.save();ctx.font='600 11px Inter,sans-serif';ctx.fillStyle='#3b2a1c';ctx.textAlign='center';
 c.data.datasets.forEach(function(ds,i){var m=c.getDatasetMeta(i);if(m.hidden)return;var t=ds.type||c.config.type;if(t!=='bar')return;
  m.data.forEach(function(el,j){var v=ds.data[j];if(v==null)return;var s=(ds.vfmt?ds.vfmt(v):fmt(v,Math.abs(v)<100&&v%1?1:0));
   if(c.options.indexAxis==='y'){ctx.textAlign='left';ctx.fillText(s,el.x+4,el.y+4);}else{ctx.fillText(s,el.x,v>=0?el.y-4:el.y+13);}});});
 ctx.restore();}});
Chart.defaults.font.family='Inter, Noto Sans Tamil, sans-serif';Chart.defaults.color='#5a4636';
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;cfg.options=cfg.options||{};cfg.options.responsive=true;cfg.options.maintainAspectRatio=false;
 cfg.options.plugins=cfg.options.plugins||{};if(!cfg.options.plugins.tooltip)cfg.options.plugins.tooltip={callbacks:{label:function(x){if(typeof x.parsed==='number'){var tot=x.dataset.data.reduce(function(a,b){return a+(b||0)},0);return ' '+x.label+': '+fmt(x.parsed,1)+(Math.round(tot)===100?'%':' ('+fmt(x.parsed/tot*100,1)+'%)');}var v=x.parsed.y!=null&&cfg.options.indexAxis!=='y'?x.parsed.y:x.parsed.x;return (x.dataset.label||'')+': '+fmt(v,1);}}};
 CH.push(new Chart(el,cfg));}
function killCharts(){CH.forEach(function(c){c.destroy()});CH=[];}
function box(id,cls){return '<div class="chartbox '+(cls||'')+'"><canvas id="'+id+'"></canvas></div>';}
function grace(){return {y:{beginAtZero:true,grace:'12%'}};}

/* ===== State & tabs ===== */
var TABS=['ov','bm','rm','geo','fin','cf','val','score','trig','swot','an','sc','mg','soc'];
var SUBS={bm:KEYS,rm:['sector','school'].concat(KEYS),geo:KEYS,fin:KEYS,cf:KEYS,score:KEYS,trig:KEYS,swot:KEYS,an:KEYS,sc:KEYS,mg:KEYS};
var cur='ov',sub={};
function subName(k){return k==='sector'?L({en:`Sector view`,ta:`துறை பார்வை`}):k==='school'?L({en:`🎓 Tyre School`,ta:`🎓 டயர் பள்ளி`}):CO[k].short;}
function subbar(t){var s=sub[t]||SUBS[t][0];sub[t]=s;return '<div class="subtabs">'+SUBS[t].map(function(k){return '<button class="'+(k===s?'on':'')+'" onclick="sub[\''+t+'\']=\''+k+'\';show(\''+t+'\')">'+subName(k)+'</button>'}).join('')+'</div>';}
function buildTabs(){document.getElementById('tabbar').innerHTML=TABS.map(function(t){return '<button id="tb_'+t+'" class="'+(t===cur?'on':'')+'" onclick="show(\''+t+'\')">'+L(T.tabs[t])+'</button>'}).join('');
 document.getElementById('app').innerHTML=TABS.map(function(t){return '<section class="tab" id="s_'+t+'"></section>'}).join('');}
function show(t){cur=t;killCharts();TABS.forEach(function(x){var b=document.getElementById('tb_'+x);if(b)b.className=x===t?'on':'';var s=document.getElementById('s_'+x);s.className='tab'+(x===t?' on':'');if(x!==t)s.innerHTML='';});
 var s=document.getElementById('s_'+t);var r=R[t]();s.innerHTML=(SUBS[t]?subbar(t):'')+r.html;if(r.after)setTimeout(r.after,30);}
function toggleLang(){LANG=LANG==='en'?'ta':'en';document.body.classList.toggle('ta',LANG==='ta');document.getElementById('langBtn').textContent=LANG==='en'?'தமிழ்':'English';init(true);}
function ul(arr){return '<ul class="b">'+L(arr).map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';}
function kpi(l,v,d){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+(d||'')+'</div></div>';}
var t=function(en,ta){return LANG==='en'?en:ta;};
function CR(){return LANG==='en'?' Cr':' கோடி';}

/* ===== Renderers ===== */

R.ov=function(){var a=CO.apollo,c=a.cur;
 var h='<h2>'+t(`Apollo Tyres — Q2 FY27 at a glance`,`அப்பல்லோ டயர்ஸ் — Q2 FY27 ஒரே பார்வையில்`)+'</h2>';
 h+='<div class="card"><div class="blockhead">🧾 '+t(`Consolidated results`,`ஒருங்கிணைந்த முடிவுகள்`)+' <span class="pill">Q2 FY27</span></div><div class="grid g4">'+
  kpi(t(`Revenue from operations`,`செயல்பாட்டு வருமானம்`),'₹'+fmt(c.rev,0)+CR(),sgn(c.revY)+' YoY · '+sgn(c.revQ)+' QoQ')+
  kpi('EBITDA','₹'+fmt(c.ebitda)+CR(),sgn(c.ebitdaY)+' YoY')+
  kpi(t(`EBITDA margin`,`EBITDA மார்ஜின்`),fmt(c.margin,1)+'%',sgn(c.marginY,0,' bps')+' YoY')+
  kpi(t(`Net profit (PAT)`,`நிகர லாபம்`),'₹'+fmt(c.pat,0)+CR(),sgn(c.patY)+' YoY · '+sgn(c.patQ)+' QoQ')+
  kpi('EPS','₹'+fmt(c.eps,2),t(`vs ₹4.07 a year ago`,`முந்தைய ஆண்டு ₹4.07`))+
  kpi(t(`Exceptional (Europe restructuring)`,`தனிச்செலவு (ஐரோப்பா)`),'₹'+fmt(c.exc,0)+CR(),t(`vs ₹180 Cr in Q2 FY26`,`Q2 FY26-ல் ₹180 கோடி`))+
  kpi(t(`H1 FY27 revenue`,`H1 வருமானம்`),'₹'+fmt(a.h1.rev,0)+CR(),sgn(a.h1.revY)+' YoY')+
  kpi(t(`H1 FY27 PAT`,`H1 லாபம்`),'₹'+fmt(a.h1.pat,0)+CR(),t(`vs ₹271 Cr`,`முன்பு ₹271 கோடி`))+'</div></div>';
 h+='<div class="card"><div class="blockhead">🏭 '+t(`Standalone results (India operations)`,`ஸ்டாண்ட்அலோன் முடிவுகள் (இந்திய செயல்பாடு)`)+'</div><div class="grid g4">'+
  kpi(t(`Total income`,`மொத்த வருமானம்`),'₹'+fmt(a.sa.ti,0)+CR(),sgn(a.sa.tiY)+' YoY')+kpi('PBT','₹'+fmt(a.sa.pbt,0)+CR(),'')+kpi('PAT','₹'+fmt(a.sa.pat,0)+CR(),t(`≈ 94% of group PAT†`,`குழு லாபத்தில் ≈94%†`))+kpi(t(`H1 total income / PAT`,`H1 வருமானம் / லாபம்`),'₹'+fmt(a.sa.h1ti,0)+' / '+fmt(a.sa.h1pat,0),'')+'</div><div class="note">'+t(`Standalone EBITDA and channel split will come with the investor presentation.`,`ஸ்டாண்ட்அலோன் EBITDA, சேனல் விவரம் பிரசன்டேஷனில் வரும்.`)+'</div></div>';

 document.getElementById('tsEx').innerHTML='<b>'+x.ic+' '+L(x.n)+'</b> · '+t(`share of RM basket ≈ `,`மூலப்பொருளில் பங்கு ≈ `)+x.s+'%† · '+t(`oil link: `,`எண்ணெய் தொடர்பு: `)+'<span class="pill '+(L(x.oil)===t(`Direct`,`நேரடி`)?'r':'a')+'">'+L(x.oil)+'</span><br><b>'+t(`Role:`,`பங்கு:`)+'</b> '+L(x.r)+'<br><b>'+t(`Where it comes from:`,`எங்கிருந்து வருகிறது:`)+'</b> '+L(x.src)+'<br><b>'+t(`Oil connection:`,`எண்ணெய் இணைப்பு:`)+'</b> '+L(x.link);}
function sgnC(n){return '<span class="'+(n>0?'dn':n<0?'up':'fl')+'">'+(n>0?'+':'')+n.toFixed(1)+'%</span>';}
function oilCalc(){var x=+document.getElementById('oilS').value;document.getElementById('oilV').textContent=(x>0?'+':'')+x+'%';
 var tot=0,rows=TS.inputs.map(function(inp,i){var d=x*TS.elas[i];tot+=inp.s/100*d;return '<tr><td>'+inp.ic+' '+L(inp.n)+'</td><td>'+inp.s+'%</td><td>'+TS.elas[i]+'</td><td>'+sgnC(d)+'</td></tr>'}).join('');
 var rm=0.60,m=0.12,newRM=rm*(1+tot/100),nm=1-newRM-(1-rm-m);var need=(newRM+(1-rm-m))/(1-m)-1;
 document.getElementById('oilT').innerHTML='<table><tr><th>'+t(`Input`,`பொருள்`)+'</th><th>'+t(`Basket share`,`பங்கு`)+'</th><th>'+t(`Pass-through`,`தாக்க விகிதம்`)+'</th><th>'+t(`Price change`,`விலை மாற்றம்`)+'</th></tr>'+rows+'<tr class="cat"><td colspan="3">'+t(`Whole RM basket`,`மொத்த மூலப்பொருள்`)+'</td><td style="text-align:right">'+sgnC(tot)+'</td></tr></table>';
 document.getElementById('oilK').innerHTML=kpi(t(`RM basket change`,`மூலப்பொருள் மாற்றம்`),sgnC(tot),'')+kpi(t(`EBITDA margin (from 12%) with no price hike`,`விலை உயர்வு இல்லாமல் மார்ஜின் (12%-லிருந்து)`),(nm*100).toFixed(1)+'%',sgn((nm-m)*10000,0,' bps'))+kpi(t(`Tyre price hike needed to hold 12%`,`12% காக்க தேவையான விலை உயர்வு`),(need*100).toFixed(1)+'%','');}
function oilChain(){var W=980,H=392,s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:980px;background:#fffaf4;border-radius:12px"><defs><marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b8865a"/></marker></defs>';
 function bx(x,y,w,h,f,tx,sub,tc){var r='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+f+'"/><text x="'+(x+w/2)+'" y="'+(y+h/2-(sub?3:-4))+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="'+(tc||'#fff')+'">'+tx+'</text>';if(sub)r+='<text x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" text-anchor="middle" font-size="10.5" fill="'+(tc||'#fff')+'">'+sub+'</text>';return r;}
 function ar(x1,y1,x2,y2,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#b8865a" stroke-width="2.2" '+(d?'stroke-dasharray="6 4"':'')+' marker-end="url(#ar3)"/>';}
 s+=bx(15,150,130,80,'#2b2118',t(`CRUDE OIL ↑`,`கச்சா எண்ணெய் ↑`),t(`West Asia shock`,`மேற்கு ஆசியா`));
 var mids=[[t(`Naphtha`,`நாப்தா`),t(`→ butadiene, styrene`,`→ பியூடாடீன், ஸ்டைரீன்`)],[t(`Heavy residue / CBFS`,`கனமான எண்ணெய் / CBFS`),''],[t(`Benzene · PTA · MEG`,`பென்சீன் · PTA · MEG`),''],[t(`Refinery base oils`,`சுத்திகரிப்பு எண்ணெய்`),''],[t(`Diesel · bunker fuel`,`டீசல் · கப்பல் எரிபொருள்`),'']];
 var outs=[[t(`Synthetic rubber`,`செயற்கை ரப்பர்`),'#2f6fb5'],[t(`Carbon black`,`கார்பன் பிளாக்`),'#444'],[t(`Nylon / polyester cord`,`நைலான் / பாலியஸ்டர் கார்ட்`),'#d99a00'],[t(`Process oils & chemicals`,`எண்ணெய் & ரசாயனம்`),'#e8710a'],[t(`Freight & logistics`,`சரக்கு போக்குவரத்து`),'#7a6a5c']];
 mids.forEach(function(m,i){var y=15+i*72;s+=ar(145,190,215,y+28)+bx(215,y,190,56,'#fde3c8',m[0],m[1],'#5a3412')+ar(405,y+28,450,y+28)+bx(450,y,200,56,outs[i][1],outs[i][0],'');s+=ar(650,y+28,740,190);});
 s+=bx(740,145,225,90,'#d64545',t(`Tyre RM basket ↑`,`டயர் மூலப்பொருள் ↑`),t(`→ margin squeeze until prices catch up`,`→ விலை பிடிக்கும் வரை மார்ஜின் அழுத்தம்`));
 s+=bx(740,20,225,70,'#1f9d55',t(`Natural rubber ↑ too`,`இயற்கை ரப்பரும் ↑`),t(`makers switch from costlier SR`,`விலையுயர்ந்த SR-லிருந்து மாற்றம்`));s+=ar(650,43,740,55,true);s+=ar(852,90,852,145);
 s+=bx(740,290,225,70,'#2f6fb5',t(`Rupee weakens`,`ரூபாய் பலவீனம்`),t(`imported RM costs more in ₹`,`இறக்குமதி ₹-ல் விலையேற்றம்`));s+='<path d="M80,230 L80,378 L852,378 L852,366" fill="none" stroke="#b8865a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar3)"/>';s+=ar(852,290,852,235);
 return s+'</svg>';}
R.school=function(){var h='<h2>🎓 '+t(`Tyre School — raw materials, oil and why India exports`,`டயர் பள்ளி — மூலப்பொருள், எண்ணெய், ஏன் இந்தியா ஏற்றுமதி செய்கிறது`)+'</h2>';
 // Lesson 1
 h+='<div class="card"><h3 style="margin-top:0">'+t(`Lesson 1 · Where ₹100 of tyre sales goes`,`பாடம் 1 · ₹100 டயர் விற்பனை எங்கே போகிறது`)+'</h3><div class="grid g2"><div>'+box('ts1','tall')+'</div><div>'+ul({en:[`<b>Raw materials eat about ₹60 of every ₹100</b> of sales (CEAT reported 65.4% in Q2 FY27, 59.1% a year earlier). No other cost comes close.`,`So a 10% rise in the RM basket takes roughly <b>6 percentage points</b> off the margin if prices don't move — enough to cut a 12% EBITDA margin in half.`,`Tyres are a <b>"conversion" business</b>: buy rubber, oil-based chemicals and steel, mix, build and cure. Profit depends on the spread between tyre prices and input costs — just like a refinery or a cement plant.`,`Other costs (people, power, freight, brand) are smaller and steadier, so <b>quarterly margin swings are almost entirely an RM story</b>.`],ta:[`<b>ஒவ்வொரு ₹100 விற்பனையிலும் ~₹60 மூலப்பொருளுக்கு</b> (CEAT Q2 FY27: 65.4%, ஒரு ஆண்டு முன் 59.1%). வேறு எந்த செலவும் இதற்கு அருகில் இல்லை.`,`விலை மாறாமல் மூலப்பொருள் 10% ஏறினால் மார்ஜின் <b>~6 சதவீதப் புள்ளி</b> குறையும் — 12% மார்ஜின் பாதியாகும்.`,`டயர் ஒரு <b>"மாற்று" பிசினஸ்</b>: ரப்பர், எண்ணெய் ரசாயனம், ஸ்டீல் வாங்கி, கலந்து, உருவாக்கி, வேகவைப்பது. லாபம் = டயர் விலைக்கும் மூலப்பொருளுக்கும் இடையிலான இடைவெளி.`,`மற்ற செலவுகள் சிறியவை, நிலையானவை — <b>காலாண்டு மார்ஜின் ஏற்ற இறக்கம் கிட்டத்தட்ட முழுதும் மூலப்பொருள் கதை</b>.`]})+'<div class="note">'+t(`Cost split is an illustrative industry average†.`,`செலவு பங்கு தோராய சராசரி†.`)+'</div></div></div></div>';
 // Lesson 2
 h+='<div class="card"><h3 style="margin-top:0">'+t(`Lesson 2 · The six inputs inside a tyre (tap a card)`,`பாடம் 2 · டயருக்குள் ஆறு பொருட்கள் (அட்டையைத் தொடவும்)`)+'</h3><div class="grid g3">'+TS.inputs.map(function(x,i){return '<div class="kpi ts-in" style="cursor:pointer;border-left:5px solid '+x.c+'" onclick="tsPick('+i+')"><div class="l">'+x.ic+' '+L(x.n)+'</div><div class="v">≈'+x.s+'%†</div><div class="d">'+t(`Oil link: `,`எண்ணெய்: `)+L(x.oil)+'</div></div>'}).join('')+'</div><div class="explain" id="tsEx"></div><div class="grid g2" style="margin-top:12px"><div>'+box('ts2')+'</div><div>'+ul({en:[`<b>About half (~48%) of the basket is made directly from crude</b> (synthetic rubber, carbon black, cords, oils & chemicals)†.`,`Natural rubber (~42%) is a farm product, but it <b>competes with synthetic rubber</b> — when SR gets dearer, demand shifts to NR and its price rises too.`,`Only steel (~10%) is largely outside the oil chain.`],ta:[`<b>சுமார் பாதி (~48%) நேரடியாக கச்சா எண்ணெயிலிருந்து</b> (செயற்கை ரப்பர், கார்பன் பிளாக், கார்ட், எண்ணெய்கள்)†.`,`இயற்கை ரப்பர் (~42%) விவசாயப் பொருள்; ஆனா <b>செயற்கை ரப்பருடன் போட்டி</b> — SR விலை ஏறினால் NR டிமாண்ட், விலை ஏறும்.`,`ஸ்டீல் (~10%) மட்டும் பெரும்பாலும் எண்ணெய் சங்கிலிக்கு வெளியே.`]})+'</div></div></div>';
 // Lesson 3
 h+='<div class="card"><h3 style="margin-top:0">'+t(`Lesson 3 · How an oil shock travels into every tyre`,`பாடம் 3 · எண்ணெய் அதிர்ச்சி ஒவ்வொரு டயருக்கும் எப்படி பரவுகிறது`)+'</h3><div class="tw">'+oilChain()+'</div>'+ul({en:[`<b>Five direct routes:</b> naphtha → synthetic rubber; heavy residue → carbon black; benzene/PTA → nylon & polyester cord; base oils → process oils; diesel/bunker → freight.`,`<b>Two indirect routes (dashed):</b> costlier synthetic rubber pushes demand to natural rubber; and India imports most of its oil, so the rupee weakens and every imported input costs more.`,`<b>What happened in 2026:</b> the West Asia crisis lifted crude, RM baskets jumped 17–22% in a single quarter (Apollo, JK), and natural rubber climbed from ~₹210/kg to a record ₹300/kg.`,`<b>Why profits lag:</b> companies carry 2–3 months of RM inventory, replacement prices can be raised in weeks, but OEM prices reset only through quarterly indexation — so margins fall first and recover 2–3 quarters later.`],ta:[`<b>ஐந்து நேரடி வழிகள்:</b> நாப்தா → செயற்கை ரப்பர்; கனமான எண்ணெய் → கார்பன் பிளாக்; பென்சீன்/PTA → கார்ட்; எண்ணெய் → பிராசஸ் ஆயில்; டீசல் → சரக்கு.`,`<b>இரண்டு மறைமுக வழிகள் (கோடு):</b> SR விலை ஏற்றம் NR-க்கு டிமாண்டைத் தள்ளும்; இந்தியா எண்ணெய் இறக்குமதி செய்வதால் ரூபாய் பலவீனம் — இறக்குமதி பொருட்கள் விலையேற்றம்.`,`<b>2026-ல் நடந்தது:</b> மேற்கு ஆசிய நெருக்கடி கச்சாவை உயர்த்தியது; ஒரே காலாண்டில் மூலப்பொருள் 17–22% (Apollo, JK); இயற்கை ரப்பர் ~₹210-லிருந்து ₹300/kg சாதனை.`,`<b>லாபம் ஏன் தாமதமாக:</b> 2–3 மாத இருப்பு; ரீப்ளேஸ்மென்ட் விலை சில வாரங்களில், OEM விலை காலாண்டுக்கு ஒருமுறை தான் — மார்ஜின் முதல்ல விழுந்து, 2–3 காலாண்டில் மீளும்.`]})+'</div>';
 // Oil simulator
 h+='<div class="card"><h3 style="margin-top:0">🛢️ '+t(`Try it · If crude moves by…`,`முயற்சி செய்யுங்கள் · கச்சா விலை மாறினால்…`)+'</h3><div class="slider-row"><label>'+t(`Change in crude oil price`,`கச்சா எண்ணெய் விலை மாற்றம்`)+'</label><input type="range" id="oilS" min="-40" max="60" step="5" value="30" oninput="oilCalc()"><b id="oilV"></b></div><div class="grid g2"><div class="tw" id="oilT"></div><div class="grid" id="oilK"></div></div><div class="note">'+t(`Teaching model: pass-through factors are illustrative†, a typical maker with RM at 60% of sales and a 12% EBITDA margin, before any price hike.`,`கற்பித்தல் மாதிரி: தாக்க விகிதங்கள் தோராயம்†; மூலப்பொருள் 60%, மார்ஜின் 12% கொண்ட நிறுவனம்.`)+'</div></div>';
 // Lesson 4 exports
 h+='<div class="card"><h3 style="margin-top:0">'+t(`Lesson 4 · Why Indian tyre makers export so much — to Europe and America`,`பாடம் 4 · இந்திய டயர் நிறுவனங்கள் ஏன் ஐரோப்பா, அமெரிக்காவுக்கு அதிகம் ஏற்றுமதி செய்கின்றன`)+'</h3><div class="grid g2"><div><b>'+t(`India tyre exports (₹ Cr)`,`இந்திய டயர் ஏற்றுமதி (₹ கோடி)`)+'</b>'+box('ts3')+'</div><div><b>'+t(`Where they go — FY26 share of value (%)`,`எங்கே போகிறது — FY26 பங்கு (%)`)+'</b>'+box('ts4')+'</div></div>'+
  ul({en:[`<b>Record ₹27,312 Cr in FY26 (+9%)</b>, after ₹25,051 Cr in FY25; Q1 FY27 rose another 16% to ~₹7,700 Cr. Exports reach 170+ countries against an industry turnover of about ₹1 lakh crore.`,`<b>Europe is ~40% of exports</b> (Q1 FY27, +25%); the US is the largest single country (15–16%) even after its tariff on Indian tyres went from 25% to 50% in August 2025.`],ta:[`<b>FY26-ல் சாதனை ₹27,312 கோடி (+9%)</b>; FY25 ₹25,051 கோடி; Q1 FY27 மேலும் 16% உயர்ந்து ~₹7,700 கோடி. 170+ நாடுகள்; துறை வருமானம் ~₹1 லட்சம் கோடி.`,`<b>ஏற்றுமதியில் ~40% ஐரோப்பா</b> (Q1 FY27, +25%); தனி நாடாக அமெரிக்கா பெரியது (15–16%) — ஆகஸ்ட் 2025-ல் வரி 25%-லிருந்து 50% ஆன பின்னும்.`]})+'</div>';
 h+='<div class="grid g2"><div class="card"><h3 style="margin-top:0">'+t(`Five reasons the West buys tyres from India`,`மேற்கு நாடுகள் இந்தியாவிடம் டயர் வாங்க ஐந்து காரணங்கள்`)+'</h3>'+ul({en:[`🌍 <b>The biggest markets are there.</b> Europe and North America have huge car and truck fleets — mostly replacement demand, which is the most profitable channel. Germany, Italy, France and the US are among India's top destinations.`,`🏭 <b>Tough and costly to build.</b> A tyre plant needs thousands of crores, years of OEM approvals and skilled curing/mixing operations. Indian makers invested about ₹27,000 Cr in 3–4 years; Apollo alone is spending ₹5,810 Cr in Andhra Pradesh.`,`🌫️ <b>Environmentally hard for the West.</b> Mixing and curing are energy- and steam-hungry; carbon black is burnt from heavy oil; rubber fumes, solvents and wastewater need strict control. With high EU energy prices, carbon costs and permits, new mass-market capacity rarely gets built there.`,`💸 <b>Costs:</b> Western plants are closing because of energy prices, wages and Asian competition — and capacity shifts to Asia (see table).`,`🇮🇳 <b>India's edge:</b> its own natural rubber, lower conversion costs, scale and quality approvals — plus a "China+1" shift as the EU probes and the US taxes Chinese tyres.`],ta:[`🌍 <b>பெரிய சந்தைகள் அங்கே.</b> ஐரோப்பா, வட அமெரிக்காவில் பெரிய கார், லாரி எண்ணிக்கை — பெரும்பாலும் ரீப்ளேஸ்மென்ட் டிமாண்ட், அதிக லாபம். ஜெர்மனி, இத்தாலி, பிரான்ஸ், அமெரிக்கா முக்கிய இடங்கள்.`,`🏭 <b>அமைப்பது கடினம், செலவு அதிகம்.</b> ஒரு ஆலைக்கு ஆயிரக்கணக்கான கோடி, OEM அங்கீகாரத்திற்கு ஆண்டுகள். இந்திய நிறுவனங்கள் 3–4 ஆண்டில் ~₹27,000 கோடி முதலீடு; Apollo மட்டும் ஆந்திராவில் ₹5,810 கோடி.`,`🌫️ <b>மேற்குக்கு சுற்றுச்சூழல் சவால்.</b> கலவை, வேகவைத்தல் அதிக மின்சாரம், நீராவி தேவை; கார்பன் பிளாக் கனமான எண்ணெய் எரித்து; ரப்பர் புகை, கரைப்பான், கழிவுநீர் கட்டுப்பாடு. அதிக மின்சார விலை, கார்பன் செலவு, அனுமதிகளால் புது ஆலைகள் அங்கே அரிது.`,`💸 <b>செலவு:</b> மின்சார விலை, சம்பளம், ஆசிய போட்டியால் மேற்கு ஆலைகள் மூடுகின்றன — திறன் ஆசியாவுக்கு நகர்கிறது (அட்டவணை).`,`🇮🇳 <b>இந்தியாவின் பலம்:</b> சொந்த இயற்கை ரப்பர், குறைந்த உற்பத்தி செலவு, அளவு, தர அங்கீகாரம் — EU சீன டயர்களை விசாரிக்க, அமெரிக்கா வரி விதிக்க "சீனா+1" மாற்றம்.`]})+'</div>';
 h+='<div class="card tw"><h3 style="margin-top:0">'+t(`Western plants closing — capacity moving east`,`மேற்கு ஆலைகள் மூடல் — திறன் கிழக்கு நோக்கி`)+'</h3><table class="tl"><tr><th>'+t(`Company`,`நிறுவனம்`)+'</th><th>'+t(`Plant`,`ஆலை`)+'</th><th>'+t(`When / impact`,`எப்போது / பாதிப்பு`)+'</th><th>'+t(`Reason given`,`காரணம்`)+'</th></tr>'+TS.closures.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+L(r[1])+'</td><td>'+L(r[2])+'</td><td>'+L(r[3])+'</td></tr>'}).join('')+'</table><div class="explain">'+t(`<b>Even Michelin's CEO has said mass-market tyre production can no longer be exported from Europe</b> — the cost gap with Asia is too wide. Europe keeps the premium niches; volume goes to India, China, Thailand and Vietnam.`,`<b>ஐரோப்பாவிலிருந்து மொத்த அளவு டயர் உற்பத்தியை இனி ஏற்றுமதி செய்ய முடியாது என Michelin CEO-வே கூறியுள்ளார்</b> — ஆசியாவுடன் செலவு இடைவெளி மிக அதிகம். பிரீமியம் மட்டும் ஐரோப்பாவில்; அளவு இந்தியா, சீனா, தாய்லாந்து, வியட்நாமுக்கு.`)+'</div></div></div>';
 h+='<div class="card"><h3 style="margin-top:0">'+t(`What it means for our four companies`,`நம் நான்கு நிறுவனங்களுக்கு இதன் அர்த்தம்`)+'</h3><table class="tl"><tr><th>'+t(`Company`,`நிறுவனம்`)+'</th><th>'+t(`Global angle`,`உலக கோணம்`)+'</th><th>'+t(`Watch`,`கவனிக்க`)+'</th></tr>'+
  [[`BKT`,{en:`The purest exporter — off-highway tyres for European and American farms and mines; own carbon black.`,ta:`தூய ஏற்றுமதியாளர் — ஐரோப்பா, அமெரிக்க பண்ணை, சுரங்க டயர்கள்; சொந்த கார்பன் பிளாக்.`},{en:`US tariff, euro/dollar, freight`,ta:`அமெரிக்க வரி, €/$, சரக்கு`}],[`Apollo`,{en:`Owns European brands (Vredestein) and a Hungary plant; is shifting Dutch output to Hungary and India — riding the same east-ward shift.`,ta:`ஐரோப்பிய பிராண்ட் (Vredestein), ஹங்கேரி ஆலை; நெதர்லாந்து உற்பத்தியை ஹங்கேரி, இந்தியாவுக்கு மாற்றுகிறது.`},{en:`Europe margin after Enschede`,ta:`Enschede-க்குப் பின் ஐரோப்பா மார்ஜின்`}],[`JK Tyre`,{en:`Mexico (Tornel) for the Americas; US only ~3% of business.`,ta:`அமெரிக்காவுக்கு மெக்சிகோ (Tornel); அமெரிக்கா ~3%.`},{en:`Tornel ramp-up`,ta:`Tornel வளர்ச்சி`}],[`CEAT`,{en:`Exports plus Camso global off-highway business bought from Michelin — another example of Western assets moving to Indian owners.`,ta:`ஏற்றுமதி + Michelin-இடமிருந்து வாங்கிய Camso — மேற்கு சொத்துகள் இந்திய உரிமைக்கு.`},{en:`Camso profitability`,ta:`Camso லாபம்`}]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+L(r[1])+'</td><td>'+L(r[2])+'</td></tr>'}).join('')+'</table></div>';

  mk('ts1',{type:'bar',data:{labels:[t(`₹100 of sales`,`₹100 விற்பனை`)],datasets:L(TS.cost.lbl).map(function(l,i){return {label:l,data:[TS.cost.v[i]],backgroundColor:TS.cost.c[i],vfmt:function(v){return '₹'+v}}})},options:{indexAxis:'y',scales:{x:{stacked:true,max:100},y:{stacked:true}},plugins:{vlabels:false,legend:{position:'bottom'}}}});

/* quiz + assist additions */
QZ.push({q:{en:`Roughly what share of a tyre's raw-material basket is made directly from crude oil?`,ta:`டயர் மூலப்பொருளில் நேரடியாக கச்சா எண்ணெயிலிருந்து வருவது சுமார் எவ்வளவு?`},o:{en:[`About 10%`,`About half`,`All of it`,`None`],ta:[`~10%`,`சுமார் பாதி`,`முழுதும்`,`எதுவுமில்லை`]},a:1,x:{en:`Synthetic rubber, carbon black, cords and oils/chemicals ≈ half; natural rubber is indirectly linked through substitution.`,ta:`செயற்கை ரப்பர், கார்பன் பிளாக், கார்ட், எண்ணெய் ≈ பாதி; இயற்கை ரப்பர் மறைமுகமாக.`}},
 {q:{en:`Why are Western tyre plants closing while Indian exports rise?`,ta:`மேற்கு ஆலைகள் மூட, இந்திய ஏற்றுமதி ஏன் உயர்கிறது?`},o:{en:[`Western demand has vanished`,`High energy/labour costs and tough environmental economics push capacity to Asia`,`India bans imports`,`Tyres are no longer used in Europe`],ta:[`மேற்கு டிமாண்ட் மறைந்தது`,`அதிக மின்சாரம், சம்பளம், சுற்றுச்சூழல் செலவுகள் திறனை ஆசியாவுக்கு தள்ளுகின்றன`,`இந்தியா இறக்குமதி தடை`,`ஐரோப்பாவில் டயர் தேவையில்லை`]},a:1,x:{en:`Demand stays in Europe/US; production moves where it is cheaper and easier to run — Michelin, Goodyear and Apollo itself have shut Western plants.`,ta:`டிமாண்ட் ஐரோப்பா/அமெரிக்காவில் தான்; உற்பத்தி மலிவான இடத்திற்கு — Michelin, Goodyear, Apollo கூட மேற்கு ஆலைகளை மூடின.`}});
KB.push({k:['oil','crude','எண்ணெய்','கச்சா'],en:`About half of a tyre's raw-material basket comes straight from crude: synthetic rubber (naphtha), carbon black (heavy residue), nylon/polyester cord (benzene, PTA) and process oils. Natural rubber follows because makers switch to it when synthetic gets dearer. See Raw Materials → Tyre School.`,ta:`டயர் மூலப்பொருளில் சுமார் பாதி நேரடியாக கச்சாவிலிருந்து: செயற்கை ரப்பர், கார்பன் பிளாக், கார்ட், எண்ணெய்கள். SR விலை ஏறும்போது இயற்கை ரப்பரும் ஏறுகிறது. மூலப்பொருள் → டயர் பள்ளி பார்க்கவும்.`},
 {k:['export','ஏற்றுமதி','abroad','america','germany'],en:`India's tyre exports hit a record ₹27,312 Cr in FY26 (+9%) and rose 16% in Q1 FY27. Europe is ~40% of exports; the US is the largest single market (15–16%). Western plants are closing on energy, labour and environmental costs, so capacity is moving to Asia.`,ta:`இந்திய டயர் ஏற்றுமதி FY26-ல் ₹27,312 கோடி சாதனை (+9%); Q1 FY27 +16%. ஐரோப்பா ~40%, அமெரிக்கா 15–16%. மின்சாரம், சம்பளம், சுற்றுச்சூழல் செலவால் மேற்கு ஆலைகள் மூட, திறன் ஆசியாவுக்கு.`});
