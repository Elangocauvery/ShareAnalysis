 fraud:{n:"One-time fraud cost (IDFC)",ta:"ஒருமுறை மோசடி செலவு (IDFC)",steps:[["cti",1],["ppop",-1],["pat",-1],["roa",-1],["roe",-1]],card:"IDFC First booked ₹646 crore in Q4 FY26 operating costs. Cost-to-income jumped, operating profit and PAT fell, and ROA dropped to 0.33% for that quarter before bouncing back above 0.9%.",cardTa:"IDFC Q4 FY26-ல ₹646 கோடி செலவு. அந்த காலாண்டு ROA 0.33%; பிறகு 0.9%-க்கு மேல் திரும்பியது."}

var SLESS=[
 ["Margins move with the rate cycle","When RBI hikes, banks with floating-rate loans earn more first. When it cuts, they earn less first. HDFC (70% floating) gains most in Q3–Q4.","வட்டி உயர்ந்தால் floating கடன் வங்கிக்கு முதலில் லாபம்."],
 ["Deposit growth is not always good news","FCNR lifted deposits 27% at ICICI, but cost more. Check deposits excluding special money.","டெபாசிட் அதிகம் = எப்போதும் நல்லது இல்லை; அதன் விலையையும் பாருங்கள்."],
 ["Low base flatters growth","Axis PAT +38% came mostly from provisions halving versus a bad year-ago quarter. Core profit grew 11%.","Axis 38% வளர்ச்சி பெரும்பாலும் provision குறைவால்; core லாபம் 11% தான்."],
 ["Capital and ROE pull opposite ways","HDFC's high CET1 (17.1%) is safety but lowers ROE (13.3%). ICICI earns 16.5% with less spare capital.","அதிக மூலதனம் = பாதுகாப்பு, ஆனா ROE குறையும்."],
 ["P/BV follows ROE","Investors pay ~2.8x book for ICICI's 16.5% ROE and ~1.9x for HDFC/Axis at 13–14%. A re-rating needs ROE to rise.","அதிக ROE-க்கு அதிக P/BV கிடைக்கும்."],
 ["Capital can matter more than profit","Yes Bank earned ₹1,080 crore, but the AT1 ruling removes about six quarters of that from equity.","லாபத்தை விட மூலதனம் முக்கியம்: AT1 ≈ ஆறு காலாண்டு லாபம்."],
 ["High NIM is not high ROA","IDFC earns the best NIM (5.58%) but costs (C/I 70%) and credit cost leave ROA at 0.93%.","அதிக NIM ≠ அதிக ROA: IDFC NIM 5.58%, ROA 0.93%."],
 ["Subsidiaries can be a quarter of profit","Kotak's group profit is ₹5,645 crore against ₹4,212 crore for the bank alone: securities, AMC, life insurance and Prime add about 25%.","Kotak: group லாபத்தில் ~25% subsidiaries-ல இருந்து."],
 ["High ROA beats size","TMB is a tenth of Axis's size but earns ROA 2.18% (Axis 1.38%): cheap gold-backed loans with low losses and tight costs (C/I 38%).","சின்ன வங்கியானாலும் ROA 2.18%: தங்க கடன், குறைந்த இழப்பு, குறைந்த செலவு."],
 ["Read PAT below the tax line","IOB's PAT rose 56% but PBT only 20%: a 7.5% tax rate did the rest. Always compare profit before tax.","IOB PAT +56%, PBT +20%: வரி குறைவு. PBT-ஐயும் பாருங்க."],
 ["Check where other income came from","BoM's other income rose 34%, but fees fell 5% and treasury lost money: write-off recoveries (₹737 cr) did the work. Recoveries are lumpy.","BoM other income +34%, ஆனா fees −5%; recoveries தான் காரணம்."]

VIEWS.school=function(){
 var h='<h2>'+T("CB School: how bank numbers push each other","CB பள்ளி: வங்கி எண்கள் ஒன்றையொன்று எப்படி தள்ளுகின்றன")+'</h2>';
 h+='<p>'+T("Each box shows Kotak (K), HDFC (H), ICICI (I), Axis (A), Yes (Y), IDFC First (F), TMB (T), IOB (O) and Bank of Maharashtra (M). Solid green arrows mean both move the same way; dashed red arrows mean they move opposite ways. Tap a metric to see what it pushes and what pushes it, or play a scenario.","ஒவ்வொரு பெட்டியிலும் Kotak (K), HDFC (H), ICICI (I), Axis (A), Yes (Y), IDFC First (F), TMB (T), IOB (O), BoM (M) எண்கள். பச்சை கோடு = ஒரே திசை; சிவப்பு புள்ளிக்கோடு = எதிர் திசை. ஒரு அளவீட்டைத் தட்டுங்கள் அல்லது ஒரு சூழ்நிலையை இயக்குங்கள்.")+'</p>';
 h+='<div class="scn">'+Object.keys(SCN).map(function(k){return '<button class="pill" data-scn="'+k+'" type="button">▶ '+T(SCN[k].n,SCN[k].ta)+'</button>'}).join("")+'<button class="pill" data-scn="reset" type="button">'+T("Reset","மீட்டமை")+'</button></div>';
 h+='<div class="svgf">'+schoolSVG()+'</div><div class="ex" id="schEx">'+T("Tap a metric or a scenario.","ஒரு அளவீடு அல்லது சூழ்நிலையைத் தட்டுங்கள்.")+'</div>';
 h+='<h3>'+T("Lessons from this quarter","இந்த காலாண்டின் பாடங்கள்")+'</h3><div class="grid g3">'+SLESS.map(function(l){return '<div class="card lesson"><h4>'+l[0]+'</h4><p style="margin:0">'+T(l[1],l[2])+'</p></div>'}).join("")+'</div>';
 return h;
};

AFTER.school=function(){

  document.getElementById("schEx").innerHTML="<b>"+esc(lab[id])+"</b><br>"+T("It pushes: ","இது தள்ளுவது: ")+(push.join(", ")||"—")+"<br>"+T("It is pushed by: ","இதைத் தள்ளுவது: ")+(by.join(", ")||"—")})});
 document.querySelectorAll("[data-scn]").forEach(function(btn){btn.addEventListener("click",function(){schReset();var k=btn.dataset.scn;if(k==="reset"){document.getElementById("schEx").textContent=T("Tap a metric or a scenario.","ஒரு அளவீடு அல்லது சூழ்நிலையைத் தட்டுங்கள்.");return}
  var sc=SCN[k];var ids={};sc.steps.forEach(function(s){ids[s[0]]=1});

  sc.steps.forEach(function(s,i){scnTimers.push(setTimeout(function(){var g=document.querySelector('#schoolSvg .sbox[data-s="'+s[0]+'"]');if(!g)return;g.querySelector(".arrw").textContent=s[1]>0?"▲":"▼";g.querySelector(".arrw").setAttribute("fill",s[1]>0?"#1f8a4c":"#c23b2a");g.querySelector("rect").setAttribute("fill",s[1]>0?"#eaf6ef":"#fbecea")},i*450))});
  document.getElementById("schEx").innerHTML="<b>"+esc(T(sc.n,sc.ta))+"</b><br>"+esc(T(sc.card,sc.cardTa))})});
};

VIEWS.asset=function(){
 var h='<h2>'+T("Asset quality and readiness for ECL","கடன் தரம் & ECL தயார்நிலை")+'</h2>';
 h+='<div class="card soft"><h4>'+T("What is ECL and when does it start?","ECL என்றால் என்ன? எப்போது?")+'</h4><p>'+T("RBI issued final Expected Credit Loss directions on 27 April 2026, effective 1 April 2027. Today banks provide after a loan defaults (incurred loss). Under ECL they classify every loan into Stage 1 (12-month expected loss), Stage 2 (significant rise in risk: lifetime loss) or Stage 3 (default), using probability of default, loss given default and exposure at default, with RBI floors. The extra Day-1 provision can be phased into CET1 over FY28 to FY31. On the same day RBI also issued the new standardised approach for credit risk, which lowers risk weights on some retail and MSME loans and releases capital.","RBI 27 ஏப்ரல் 2026-ல் ECL இறுதி விதிகளை வெளியிட்டது; 1 ஏப்ரல் 2027 முதல் அமல். இப்போ கடன் வாராக்கடன் ஆன பிறகு தான் provision. ECL-ல் ஒவ்வொரு கடனையும் Stage 1, 2, 3 என பிரித்து முன்கூட்டியே provision. கூடுதல் தொகையை FY28–FY31 நான்கு ஆண்டுகளில் CET1-ல் பிரிக்கலாம். அதே நாளில் வந்த புதிய risk weight விதிகள் retail, MSME கடன்களுக்கு மூலதனத்தை விடுவிக்கும்.")+'</p><p style="margin:0">'+T("Estimated impact: CRISIL sees up to 120 bps net CET1 impact for banks in general; analysts put large private banks (HDFC, ICICI, Axis) at only 5–20 bps, since their buffers equal 2–4% of net worth. PSU and mid-tier banks with unsecured or microfinance loans face more.","மதிப்பீடு: பொதுவாக 120 bps வரை CET1 தாக்கம் (CRISIL); பெரிய தனியார் வங்கிகளுக்கு வெறும் 5–20 bps.")+'</p></div>';
 h+='<h3>'+T("How prepared is each bank?","ஒவ்வொரு வங்கியும் எவ்வளவு தயார்?")+'</h3><div class="tw"><table><thead><tr><th>Bank</th><th class="n">GNPA %</th><th class="n">NNPA %</th><th class="n">PCR %</th><th class="n">Credit cost</th><th class="n">CET1 %</th><th>Buffers beyond specific provisions</th><th>CB read</th></tr></thead><tbody>';
 bankList().forEach(function(b){var m=CO[b].m,e=ECL[b];h+='<tr><td>'+dot(b)+CO[b].short+'</td><td class="n">'+m.gnpa[1]+'</td><td class="n">'+m.nnpa[1]+'</td><td class="n">'+m.pcr[1]+'</td><td class="n">'+CC[b]+'</td><td class="n">'+e.cet+'</td><td>'+e.buf+'</td><td>'+e.read+'</td></tr>'});
 h+='</tbody></table></div>';
 h+='<div class="chartf" style="margin-top:12px"><div class="cv"><canvas id="ch_aq"></canvas></div></div>';
 h+='<h3>'+T("ECL readiness ranking","ECL தயார்நிலை வரிசை")+'</h3><p>'+T("1. TMB, IOB, Kotak, HDFC and ICICI (joint): IOB has ₹2,700 cr of its ~₹3,000 cr ECL need already provided; TMB has 79% of its ECL need already provided and CET1 31.4%; Kotak CET1 21.4%; HDFC large buffers; ICICI the best coverage and earnings power. 3. Axis Bank: ready, but thin CET1 for its size and unsecured-retail stress. 4. IDFC First: CET1 13.0% and falling, unsecured-heavy book; ₹515 crore contingency helps. 5. Yes Bank: clean book and PCR 80.5%, but CET1 ~11.3% after AT1 leaves the least room. TMB, IOB, Kotak, HDFC, ICICI and Axis should not need equity for ECL (IOB's QIP is for public float, not capital); Yes and IDFC may raise equity anyway, for AT1 and growth.","1. TMB, IOB, Kotak, HDFC, ICICI (சமம்; TMB ECL-க்கு 79% ஏற்கனவே provide): HDFC-க்கு அதிக மூலதனம்; ICICI-க்கு அதிக coverage. 3. Axis: தயார். 4. IDFC First: CET1 13.0%, குறையுது; ₹515 கோடி buffer உதவும். 5. Yes: book சுத்தம், ஆனா AT1-க்கு பிறகு CET1 ~11.3%. Yes, IDFC மூலதனம் திரட்டலாம்.")+'</p>';
 h+='<h3>'+T("Slippage detail","வாராக்கடன் விவரம்")+'</h3><div class="grid g3"><div class="card"><h4>'+dot("hdfc")+'HDFC</h4><p style="margin:0">GNPA 1.11% (from 1.17% in June); excluding agriculture 0.87%. Provisions rose 18.7% QoQ to ₹3,574 crore, still within its normal range.</p></div><div class="card"><h4>'+dot("icici")+'ICICI</h4><p style="margin:0">Gross NPA additions ₹4,833 crore; net additions ₹1,213 crore; write-offs ₹1,592 crore. Provisions fell 32.5% QoQ to ₹851 crore.</p></div><div class="card"><h4>'+dot("axis")+'Axis</h4><p style="margin:0">Gross slippages ₹4,762 crore (retail ₹4,286 crore); net slippages ₹2,383 crore; recoveries ₹2,380 crore; write-offs ₹2,729 crore. Net slippage ratio 0.75%.</p></div><div class="card"><h4>'+dot("kotak")+'Kotak</h4><p style="margin:0">Slippages ₹1,230 crore (₹1,629 crore a year ago), slippage ratio 0.85%; upgrades and recoveries ₹642 crore. Credit cost 0.35% (0.46% in Q1). Unsecured retail 8.1% of advances.</p></div><div class="card"><h4>'+dot("bom")+'BoM</h4><p style="margin:0">Fresh slippages ₹869 crore (₹888 crore in Q1); GNPA ₹4,114 crore. NPA provisions fell to ~₹120 crore; standard-asset provisions ₹603 crore; ₹250 crore COVID provision reversed (₹510 crore still held).</p></div><div class="card"><h4>'+dot("iob")+'IOB</h4><p style="margin:0">Slippage ratio 0.07%; recoveries ₹647 crore were 2.95× fresh slippages. GNPA ₹4,114 crore, NNPA ₹544 crore. Credit cost 0.17% vs FY27 guidance 0.35–0.40%.</p></div><div class="card"><h4>'+dot("tmb")+'TMB</h4><p style="margin:0">Slippages only ₹35 crore (₹43 crore in Q1). GNPA ₹372 crore (₹474 crore a year ago). 48% of loans are gold-backed at 62% LTV, which keeps losses low.</p></div><div class="card"><h4>'+dot("yes")+'Yes</h4><p style="margin:0">Gross slippages ₹1,035 crore (1.3% of advances; 1.4% in Q1). GNPA 1.2%, NNPA 0.2%, PCR 80.5%. Security-receipt recoveries ₹481 crore in H1.</p></div><div class="card"><h4>'+dot("idfc")+'IDFC First</h4><p style="margin:0">Gross additions ₹1,893 crore (Q1 ₹1,736 crore); recoveries ₹684 crore; write-offs ₹1,252 crore; net slippage ratio 1.6%. Provisions include ₹100 crore standard provision on FCNR-backed loans.</p></div></div>';
 return h;
};

function carryCalc(){
 var g=function(id){return +document.getElementById(id).value};
 var cost=g("fxCost"),loanY=g("fxLoan"),vr=g("fxVrrr"),old=g("fxOld"),pl=g("fxPl"),pr=g("fxPr");
 var pv=Math.max(0,100-pl-pr);
 document.getElementById("fxPv").textContent=pv;
 var earn=pl/100*loanY+pv/100*vr+pr/100*old;
 var spread=earn-cost;
 document.getElementById("fxOut").innerHTML='Blended return on the FCNR money: <b>'+fmt(earn,2)+'%</b> · cost: <b>'+fmt(cost,2)+'%</b> · net spread: <b class="'+(spread>=0?"up":"dn")+'">'+(spread>0?"+":"")+fmt(spread,2)+'%</b><br><span class="note">On ₹1 lakh crore of FCNR money that is about ₹'+fmt(spread*1000,0)+' crore a year. Even a positive spread is far below the bank\'s average NIM, so the NIM percentage still falls (the denominator grows faster than NII).</span>';
 var w=document.getElementById("fxBar");w.innerHTML='<i style="width:'+pl+'%;background:var(--good)"></i><i style="width:'+pr+'%;background:var(--warn)"></i><i style="width:'+pv+'%;background:var(--bad)"></i>';
}
VIEWS.fcnr=function(){
 var h='<h2>'+T("FCNR, VRRR & NIM: did the dollar windfall help or hurt?","FCNR, VRRR & NIM: டாலர் வரவு உதவியதா, பாதித்ததா?")+'</h2>';
 h+='<div class="card soft"><p style="margin:0">'+T("Short answer: FCNR money lowered NIM in Q2 at ICICI and Axis, and kept HDFC's NIM flat at a low 3.32%. It lifted deposits and loan growth, improved liquidity ratios, and gave banks long, locked-in funding. Much of the rupee liquidity it created sat idle at first, and RBI drained it through VRRR auctions at about 5.24%, below what banks pay depositors. That idle money is the 'negative carry'. The damage is temporary: it shrinks as banks lend the money out, and the 7 Oct repo hike lifts loan yields.","சுருக்கமான பதில்: FCNR பணம் Q2-ல் ICICI, Axis-ன் NIM-ஐ குறைத்தது; HDFC NIM 3.32%-ல் நின்றது. டெபாசிட், கடன் வளர்ச்சி, liquidity எல்லாம் கூடியது. ஆனா உருவான ரூபாய் liquidity-யில் பெரும்பகுதி முதலில் சும்மா இருந்தது; RBI அதை VRRR மூலம் ~5.24%-க்கு எடுத்துக்கொண்டது. இது டெபாசிட் செலவை விட குறைவு; அதுதான் 'negative carry'. பணம் கடனாக போகும்போதும், அக்டோபர் வட்டி உயர்வாலும் இந்த பாதிப்பு குறையும்.")+'</p></div>';

 // flow SVG
 h+='<h3>'+T("Where the money went","பணம் எங்கே போனது")+'</h3><div class="svgf"><svg viewBox="0 0 1060 360" width="1060" height="360" role="img" aria-label="FCNR money flow">';
 h+='<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9aa5b4"/></marker></defs>';
 function bx(x,y,w,hh,f,s,t1,t2,t3){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="8" fill="'+f+'" stroke="'+s+'" stroke-width="1.5"/><text x="'+(x+w/2)+'" y="'+(y+24)+'" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16202e">'+t1+'</text><text x="'+(x+w/2)+'" y="'+(y+44)+'" text-anchor="middle" font-size="11.5" fill="#5b6676">'+t2+'</text>'+(t3?'<text x="'+(x+w/2)+'" y="'+(y+62)+'" text-anchor="middle" font-size="11.5" fill="#5b6676">'+t3+'</text>':'')}

 h+=bx(410,20,190,80,"#fff7e8","#e2701b","RBI swap window","takes $ · gives ₹","hedge cost borne by RBI");

 h+=bx(880,250,170,80,"#fff7e8","#e2701b","RBI drains surplus","VRRR + ₹1 lakh cr OMO","surplus ₹4.7 lakh cr (30 Sep)");
 h+=bx(880,10,170,80,"#eaf6ef","#1f8a4c","Profit & growth","NII ₹ up, loans up","NIM % down");

 h+='</svg></div><div class="tl" style="margin-top:8px">'+[["8 Jun 2026","RBI swap window opens"],["31 Aug","Window closed early (planned 30 Sep)"],["4 Sep","₹7 lakh cr 30-day VRRR announced"],["7 Sep","Surplus record ₹11.6 lakh cr; ₹6 lakh cr+ absorbed in a day"],["17 Sep","₹2.4 lakh cr VRRR at 5.24%; ₹1 lakh cr OMO sales"],["30 Sep","Surplus down to ₹4.7 lakh cr"],["7 Oct","Repo 5.25% → 5.50%"]].map(function(e){return '<div class="ev"><b>'+e[0]+'</b><br>'+e[1]+'</div>'}).join("")+'</div>';

 // NIM question
 h+='<h3>'+T("1. Did FCNR hurt NIM? Yes, in two ways","1. FCNR NIM-ஐ பாதித்ததா? ஆம், இரண்டு வழிகளில்")+'</h3>';

 h+='<div class="tw" style="margin-top:10px"><table><thead><tr><th>Bank</th><th class="n">FCNR $ bn</th><th class="n">NIM Q2</th><th>NIM evidence</th><th>Funding cost</th><th>Leverage effect</th><th>Liquidity</th><th>Net read</th></tr></thead><tbody>';

 var sc={x:{ticks:{color:"#5b6676"},grid:{display:false}},y:{ticks:{color:"#5b6676",callback:function(v){return unit==="%"?v+"%":"₹"+Number(v).toLocaleString("en-IN")}},grid:{color:"#f1e2d0"}}};
 if(y2)sc.y2={position:"right",ticks:{color:"#5b6676",callback:function(v){return v+"%"}},grid:{display:false}};
 var c=new Chart(el,{type:"line",data:{labels:labels,datasets:sets.map(function(s){s.tension=.25;s.pointRadius=4;s.borderWidth=2.5;return s})},plugins:[{id:"lv",afterDatasetsDraw:function(ch){var x=ch.ctx;x.save();x.font="10px IBM Plex Mono, monospace";x.fillStyle="#16202e";x.textAlign="center";ch.data.datasets.forEach(function(ds,i){var m=ch.getDatasetMeta(i);m.data.forEach(function(p,j){var v=ds.data[j];if(v==null)return;x.fillText((ds.yAxisID==="y2"||unit==="%")?fmt(v,v<20?2:1)+"%":fmt(v),p.x,p.y-8)})});x.restore()}}],

 charts.push(c);
}

 return s+'</svg>';
}

 [["1. Book it through reserves, keep bonds as AT1","CET1 −240 bps; Tier-1 and CRAR barely move","CET1 ~11.3% is still above the 8% minimum but thin for growth","Most likely first step"],["2. Fresh equity (QIP / rights / preferential)","Restores CET1; ~₹3,500 cr lifts CET1 ~1 pt (CB calc)","Dilution at ~1.2x book†, with the share price weak","Likely within 12 months"],["3. SMBC infusion","Strategic support, signals confidence","Going above 25–26% can trigger an open offer (Nuvama); SMBC said in 2025 it would stay below 25%","Key swing factor"],["4. Call / redeem bonds later","Removes ongoing AT1 coupons","Needs RBI approval and replacement capital; ₹8,415 cr cash","Only after capital is rebuilt"],["5. Slow growth, retain profits","~₹4,300 cr a year of profit adds ~1.2 pts CET1 (CB calc)","20% loan growth eats ~2.3 pts a year; growth must slow","Partial fix only"],["6. Further legal steps (review)","Could narrow coupon liability","Narrow grounds after a dismissed appeal","Low odds (CB view)"]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join("")+'</tbody></table></div>';

 h+='<h3>'+T("CB read","CB பார்வை")+'</h3>'+bl([["The quarter was good; the ruling matters more. One AT1 hit ≈ six quarters of current profit.","காலாண்டு நல்லது; ஆனா தீர்ப்பு தான் பெரிசு. AT1 இழப்பு ≈ ஆறு காலாண்டு லாபம்."],["CET1 ~11.3% is legal but thin; growth at 20%+ needs fresh equity.","CET1 ~11.3% சட்டப்படி ok, ஆனா 20%+ வளர்ச்சிக்கு புது மூலதனம் வேணும்."],["Watch: coupon disclosure, board capital plan, SMBC's stance, Q3 CET1.","கவனிக்க: coupon விவரம், மூலதன திட்டம், SMBC நிலை, Q3 CET1."]]);

AFTER.yesat1=function(){
 function calc(){var g=function(id){return +document.getElementById(id).value};var r=g("atRaise"),gr=g("atGr"),p=g("atPat"),c=g("atCoup");
  ["atRaise","atGr","atPat","atCoup"].forEach(function(id){document.getElementById(id+"V").textContent=fmt(g(id))});
  var cap0=0.113*AT1.rwa,cap=cap0+p+r-c*0.75,rwa=AT1.rwa*(1+gr/100),ratio=cap/rwa*100;
  var col=ratio>=12?"up":(ratio>=10?"fl":"dn");
  document.getElementById("atOut").innerHTML=T("CET1 after one year: ","ஒரு வருஷம் கழிச்சு CET1: ")+'<b class="'+col+'" style="font-size:18px">'+fmt(ratio,2)+'%</b> · '+T("start ~11.3% · minimum incl. buffer 8%","ஆரம்பம் ~11.3% · குறைந்தபட்சம் 8%")+'<br><span class="note">'+T("CET1 capital ₹","CET1 மூலதனம் ₹")+fmt(cap)+' cr ÷ '+T("risk assets ₹","risk assets ₹")+fmt(rwa)+' cr</span>'}
 ["atRaise","atGr","atPat","atCoup"].forEach(function(id){document.getElementById(id).addEventListener("input",calc)});calc();
};

/* ---------- Kotak: why ROE is low ---------- */
function roeSVG(){
 var bs=BANKS.filter(function(b){return CO[b].m.roa[1]&&CO[b].m.roe[1]}),rh=44,top=46,W=760,H=top+bs.length*rh+10;
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="ROA times leverage equals ROE">';
 s+='<text x="150" y="24" font-size="12.5" font-weight="700" fill="#5b6676">ROA %</text><text x="330" y="24" font-size="12.5" font-weight="700" fill="#5b6676">× '+T("Leverage (assets ÷ equity)","Leverage (assets ÷ equity)")+'</text><text x="560" y="24" font-size="12.5" font-weight="700" fill="#5b6676">= ROE %</text>';
 bs.forEach(function(b,i){var o=CO[b],roa=o.m.roa[1],roe=o.m.roe[1],lev=roe/roa,y=top+i*rh,k=b==="kotak";
  if(k)s+='<rect x="0" y="'+(y-6)+'" width="'+W+'" height="'+(rh-4)+'" rx="6" fill="#fde2c4"/>';
  s+='<text x="8" y="'+(y+18)+'" font-size="13" font-weight="'+(k?800:600)+'" fill="#16202e">'+o.short+'</text>';
  s+='<rect x="150" y="'+(y+4)+'" width="'+(roa*60)+'" height="20" rx="3" fill="'+o.col+'"/><text x="'+(156+roa*60)+'" y="'+(y+19)+'" font-size="12" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#16202e">'+fmt(roa,2)+'</text>';
  s+='<rect x="330" y="'+(y+4)+'" width="'+(lev*16)+'" height="20" rx="3" fill="'+(k?"#c23b2a":"#c7a27a")+'"/><text x="'+(336+lev*16)+'" y="'+(y+19)+'" font-size="12" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#16202e">'+fmt(lev,1)+'x</text>';
  s+='<rect x="560" y="'+(y+4)+'" width="'+(roe*9)+'" height="20" rx="3" fill="'+o.col+'" opacity=".75"/><text x="'+(566+roe*9)+'" y="'+(y+19)+'" font-size="12" font-family="IBM Plex Mono, monospace" font-weight="600" fill="#16202e">'+fmt(roe,1)+'</text>'});
 return s+'</svg>';
}
function kRoeCalc(){var t=+document.getElementById("kCet").value,roe=CO.kotak.m.roe[1],cet=CO.kotak.m.cet1[1];
 var full=roe*cet/t,adj=roe+(full-roe)*0.6;document.getElementById("kCetV").textContent=t.toFixed(1);
 document.getElementById("kRoeOut").innerHTML=T("If Kotak ran CET1 at ","Kotak CET1 ")+t.toFixed(1)+"%"+T(": ROE ≈ ",": ROE ≈ ")+"<b>"+fmt(adj,1)+"%</b> <span class='note'>("+T("today 11.65% at CET1 21.4%; assumes surplus capital earned ~40% of normal returns, CB rough calc","இன்று CET1 21.4%-ல ROE 11.65%; CB தோராய கணக்கு")+")</span>"}
function kotakRoe(){
 var h='<h3>'+T("Why Kotak's ROE is low","Kotak-ஓட ROE ஏன் குறைவு")+'</h3><div class="card soft">'+bl([["ROE = ROA × leverage. Kotak's ROA (1.92%) is as good as HDFC's; its leverage (~6.1x) is the lowest of the nine.","ROE = ROA × leverage. Kotak ROA (1.92%) HDFC அளவு நல்லது; ஆனா leverage (~6.1x) ஒன்பது வங்கிகளிலும் குறைவு."],["The share split and bonus do not affect ROE: profit and equity stay the same; only per-share numbers change.","Split, bonus ROE-ஐ மாற்றாது: லாபம், equity அதே; per-share எண்கள் மட்டும் மாறும்."],["Cause 1: surplus capital. CET1 21.4% vs 14.6–17.1% at peers.","காரணம் 1: அதிகப்படியான மூலதனம். CET1 21.4%; மற்றவங்க 14.6–17.1%."],["Cause 2: the 2024 sale of 70% of Kotak General Insurance to Zurich gave a one-time gain (~₹3,500 cr) that now sits in equity for good.","காரணம் 2: 2024-ல Kotak General Insurance 70% Zurich-க்கு விற்றது; ஒருமுறை லாபம் (~₹3,500 கோடி) இப்போ equity-ல நிரந்தரமா."],["Cause 3: the bank's equity includes its investment in subsidiaries (Securities, AMC, Life, Prime), whose profits show only in consolidated results.","காரணம் 3: subsidiaries-ல போட்ட முதலீடு bank equity-ல; அவங்க லாபம் consolidated-ல மட்டும்."],["Cause 4: RBI curbs on digital onboarding and new cards (2024–25) slowed lending, so retained profit piled up.","காரணம் 4: 2024–25 RBI கட்டுப்பாடுகள் கடன் வளர்ச்சியை குறைத்தது; லாபம் சேர்ந்துகிட்டே போச்சு."]])+'</div>';
 h+='<h3>'+T("Picture it: ROA × leverage = ROE (Q2FY27)","Picture it: ROA × leverage = ROE")+'</h3><div class="svgf">'+roeSVG()+'</div><p class="note">'+T("Leverage = ROE ÷ ROA (CB calc). Yes Bank ROE is a CB estimate.","Leverage = ROE ÷ ROA (CB கணக்கு).")+'</p>';
 h+='<div class="card"><label style="display:block"><span class="note">'+T("Try it: CET1 Kotak keeps, %: ","நீங்களே பாருங்க: Kotak வைக்கும் CET1 %: ")+'<b id="kCetV">16.0</b></span><input type="range" id="kCet" min="13" max="21.4" step="0.2" value="16" oninput="kRoeCalc()" style="width:100%;accent-color:var(--cb)"></label><div class="ex" id="kRoeOut"></div></div>';
 h+=bl([["ROE is rising: 10.38% a year ago, 11.65% now.","ROE ஏறுது: 10.38% → 11.65%."],["25% loan growth and the FCNR deployment will use up spare capital; analysts cite a 12–14% ROE path for FY27–29.","25% கடன் வளர்ச்சி spare capital-ஐ பயன்படுத்தும்; FY27–29-க்கு 12–14% ROE."]]);
 return h;
}
