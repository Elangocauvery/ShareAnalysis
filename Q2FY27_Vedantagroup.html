<style>
/* Layout: sticky masthead + scrolling tab rail, company sub-tab chips, one content column of panels. Single light-orange look by the house brief. */
:root{
  --bg:#FFF4E8;        /* very light orange page */
  --panel:#FFFBF6;     /* panel paper */
  --soft:#FDE6CC;      /* light orange fill */
  --line:#EFCFA8;      /* hairlines */
  --acc:#F28C28;       /* house accent */
  --accInk:#9A4E00;    /* accent text on light */
  --ink:#170F07;       /* bold body text */
  --ink2:#45311D;      /* secondary text */
  --hzl:#1D5C8A;       /* Hindustan Zinc: zinc blue */
  --hzlSoft:#DCEAF5;
  --visl:#A3361F;      /* Vedanta Iron & Steel: oxide red */
  --vislSoft:#F8DED6;
  --good:#17703F; --goodSoft:#DBF1E3;
  --warn:#9C5B00; --warnSoft:#FCEBC8;
  --bad:#B0241B;  --badSoft:#F9DCD9;
  --pend:#6B5B4B; --pendSoft:#EFE6DB;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Inter","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.1;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700;font-family:var(--f-body)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:12px 6px;border-bottom:2px solid var(--line)}
.mrow{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--accInk)}
.slogan{font-weight:700;color:var(--ink2);font-size:.9rem}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.ghost{border-color:var(--line)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:800;color:var(--ink)}
.seg button.on{background:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:800;font-size:.84rem;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc)}
.subs{display:flex;gap:6px;flex-wrap:wrap;padding-block:12px 4px;align-items:center}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.83rem;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on.hzl{background:var(--hzlSoft);border-color:var(--hzl)}
.chip.on.visl{background:var(--vislSoft);border-color:var(--visl)}
.chip.on.cmp{background:var(--soft);border-color:var(--acc)}
.chip.pend{border-style:dashed;color:var(--ink2);font-weight:700}
.chip.pend.on{background:var(--pendSoft);border-color:var(--pend);color:var(--ink)}
.subs .lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink2);margin-right:4px}

/* content */
main{padding-block:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel.hzl{border-top:6px solid var(--hzl)}
.panel.visl{border-top:6px solid var(--visl)}
.panel h2{margin-bottom:8px}
.ptitle{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.note{font-size:.8rem;color:var(--ink2);font-weight:600}
ul.b{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
ul.b li{font-weight:600}
ul.b li b{font-weight:800}
.kpi{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-width:0}
.kpi .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink2)}
.kpi .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;color:var(--ink)}
.kpi .d{font-size:.8rem;font-weight:800}
.up{color:var(--good)} .dn{color:var(--bad)} .wa{color:var(--warn)}
.pill{font-family:var(--f-body);display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:800;border:1.5px solid currentColor}
.pill.good{color:var(--good);background:var(--goodSoft)} .pill.bad{color:var(--bad);background:var(--badSoft)} .pill.warn{color:var(--warn);background:var(--warnSoft)} .pill.pend{color:var(--pend);background:var(--pendSoft)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1.5px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:800;background:var(--soft)}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:150px}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
td:first-child{font-family:var(--f-body);font-weight:700}
tr.sub td{color:var(--ink2);font-size:.82rem}
svg text{font-family:var(--f-body);fill:var(--ink);font-weight:700}
svg .m{font-family:var(--f-mono)}
.chart{width:100%;height:auto;display:block}
.cwrap{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;font-weight:800;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* flow map */
.flow{display:grid;grid-template-columns:1fr auto 1.3fr auto 1fr;gap:10px;align-items:stretch}
.fcol{display:grid;gap:10px;min-width:0}
.fbox{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;text-align:left;color:var(--ink);min-width:0}
.fbox:hover,.fbox.on{border-color:var(--acc);background:var(--soft)}
.fbox .t{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.fbox .n{font-weight:800}
.fbox.hub{border-width:3px}
.arr{align-self:center;font-weight:800;font-size:1.4rem;color:var(--accInk)}
.mflow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-top:10px}
.mflow .fbox{flex:1 1 120px}
.formula{margin-top:10px;border:2px dashed var(--acc);border-radius:10px;padding:8px 12px;font-weight:800;background:var(--panel)}
.detail{margin-top:10px;border-left:5px solid var(--acc);background:var(--soft);padding:10px 12px;border-radius:0 10px 10px 0;font-weight:600}
@media (max-width:760px){.flow{grid-template-columns:1fr}.arr{transform:rotate(90deg);justify-self:center}}

/* swot */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swot>div{border-radius:12px;padding:12px;border:2px solid}
.sw-s{background:var(--goodSoft);border-color:var(--good)} .sw-w{background:var(--badSoft);border-color:var(--bad)}
.sw-o{background:var(--hzlSoft);border-color:var(--hzl)} .sw-t{background:var(--warnSoft);border-color:var(--warn)}
@media (max-width:560px){.swot{grid-template-columns:1fr}}

/* takeaways */
.steps{display:grid;gap:10px;position:relative}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.step .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;border:3px solid var(--ink);background:var(--panel)}
.step .c.good{border-color:var(--good);background:var(--goodSoft)} .step .c.bad{border-color:var(--bad);background:var(--badSoft)} .step .c.warn{border-color:var(--warn);background:var(--warnSoft)}

/* self check */
.ck{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.ck input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px}
.ck .dl{font-size:.8rem;color:var(--ink2);font-weight:600}
.ck .dl b{color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow input{flex:1 1 200px;border:2px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--panel);color:var(--ink)}
.x{border:0;background:none;color:var(--bad);font-weight:800}

/* quiz */
.qopt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;font-weight:700;color:var(--ink)}
.qopt.right{border-color:var(--good);background:var(--goodSoft)} .qopt.wrong{border-color:var(--bad);background:var(--badSoft)}

/* assist */
.as-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.as-log{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;border-radius:12px;padding:8px 11px;font-weight:600}
.msg.u{align-self:flex-end;background:var(--soft);border:2px solid var(--acc)}
.msg.a{align-self:flex-start;background:var(--panel);border:2px solid var(--line)}
.msg details{margin-top:4px;font-size:.85rem}
.msg summary{cursor:pointer;color:var(--accInk);font-weight:800}
.as-in{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.as-in input{flex:1 1 220px;border:2px solid var(--ink);border-radius:10px;padding:9px;font:inherit;background:var(--panel);color:var(--ink)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs button{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.8rem;color:var(--ink)}
.vbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.vbar i{display:block;height:100%;background:var(--acc);width:0}
.as-set{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.82rem;font-weight:700}
.as-set select,.as-set input[type=range]{accent-color:var(--acc)}
.as-set select{border:1.5px solid var(--line);border-radius:8px;padding:3px;background:var(--panel);color:var(--ink);font:inherit}

/* floating */
.cb{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
.cb .badge{width:46px;height:46px;border-radius:50%;background:var(--acc);border:3px solid var(--ink);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:grid;place-items:center;animation:blink 2.2s ease-in-out infinite}
.cb .tip{position:absolute;right:0;bottom:56px;width:min(320px,80vw);background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:.8rem;font-weight:600;display:none}
.cb:hover .tip,.cb.open .tip{display:block}
.vbub{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;border:3px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.8rem;box-shadow:0 3px 0 var(--ink)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.cb .badge{animation:none}}
main>*+*{margin-top:14px}
@media (max-width:700px){.mast{position:static}}
.pending{border:2px dashed var(--pend);background:var(--pendSoft);border-radius:14px;padding:16px}
</style>

/* ============ chart helpers ============ */
function barChart(cats,series,o){
  o=o||{};var W=o.w||560,H=o.h||230,pl=58,pr=12,pt=22,pb=34;
  var all=[];series.forEach(function(s){s.vals.forEach(function(v){if(v!=null)all.push(v);});});
  var mx=Math.max.apply(null,all.concat([0])),mn=Math.min.apply(null,all.concat([0]));
  var span=(mx-mn)||1;mx+=span*0.12;if(mn<0)mn-=span*0.12;span=mx-mn;
  var y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/span);};
  var gw=(W-pl-pr)/cats.length,bw=Math.min(46,(gw-14)/series.length);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">';
  var ticks=4;for(var i=0;i<=ticks;i++){var tv=mn+span*i/ticks;var ty=y(tv);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ty+'" y2="'+ty+'" stroke="#EFCFA8" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(ty+4)+'" text-anchor="end" font-size="10" class="m">'+f(tv)+'</text>';}
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#170F07" stroke-width="1.5"/>';
  cats.forEach(function(c,ci){var gx=pl+gw*ci+(gw-bw*series.length)/2;
    series.forEach(function(se,si){var v=se.vals[ci];if(v==null){s+='<text x="'+(gx+bw*si+bw/2)+'" y="'+(y(0)-4)+'" text-anchor="middle" font-size="10">n.a.</text>';return;}
      var y0=y(0),yv=y(v),top=Math.min(y0,yv),h=Math.max(1.5,Math.abs(y0-yv));
      s+='<rect x="'+(gx+bw*si+2)+'" y="'+top+'" width="'+(bw-4)+'" height="'+h+'" rx="3" fill="'+se.col+'"/>';
      s+='<text x="'+(gx+bw*si+bw/2)+'" y="'+(v>=0?top-4:top+h+12)+'" text-anchor="middle" font-size="10" class="m">'+f(v,o.d)+'</text>';});
    s+='<text x="'+(pl+gw*ci+gw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11">'+esc(c)+'</text>';});
  return '<div class="cwrap">'+s+'</svg></div>'+legend(series);
}

  var s='<div class="cwrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'">';

function donut(parts,cols,center){var W=220,R=80,r=48,cx=110,cy=110,tot=parts.reduce(function(a,b){return a+b;},0),a0=-Math.PI/2,s='<svg class="chart" viewBox="0 0 220 220" style="max-width:240px;margin:auto">';
  parts.forEach(function(p,i){var a1=a0+2*Math.PI*p/tot,lg=(a1-a0)>Math.PI?1:0;
    s+='<path d="M'+(cx+R*Math.cos(a0))+' '+(cy+R*Math.sin(a0))+' A'+R+' '+R+' 0 '+lg+' 1 '+(cx+R*Math.cos(a1))+' '+(cy+R*Math.sin(a1))+' L'+(cx+r*Math.cos(a1))+' '+(cy+r*Math.sin(a1))+' A'+r+' '+r+' 0 '+lg+' 0 '+(cx+r*Math.cos(a0))+' '+(cy+r*Math.sin(a0))+' Z" fill="'+cols[i]+'" stroke="#FFFBF6" stroke-width="2"/>';
    var am=(a0+a1)/2;if(p/tot>0.06)s+='<text x="'+(cx+(R+r)/2*Math.cos(am))+'" y="'+(cy+(R+r)/2*Math.sin(am)+4)+'" text-anchor="middle" font-size="11" class="m">'+Math.round(p/tot*100)+'%</text>';a0=a1;});
  return s+'<text x="110" y="106" text-anchor="middle" font-size="11">'+esc(center[0])+'</text><text x="110" y="124" text-anchor="middle" font-size="13" class="m">'+esc(center[1])+'</text></svg>';}

function g(a,b){if(a==null||b==null)return "—";if(a<0||b<=0){if(a<0&&b<0)return a>b?L("loss narrowed","loss குறைஞ்சது"):L("loss widened","loss கூடிச்சு");if(a<0&&b>0)return L("to loss","loss-க்கு போச்சு");if(a>0&&b<0)return L("to profit","profit-க்கு வந்துச்சு");return "n.m.";}
  var p=(a/b-1)*100;return (p>=0?"+":"−")+Math.abs(p).toFixed(1)+"%";}
function gp(a,b){if(a==null||b==null)return "—";var d=Math.round((a-b)*100);return (d>=0?"+":"−")+Math.abs(d)+" bps";}
function cls(txt,lower){if(txt.indexOf("+")===0||txt.indexOf("profit")>-1||txt.indexOf("narrowed")>-1||txt.indexOf("குறைஞ்சது")>-1||txt.indexOf("வந்துச்சு")>-1)return lower?"dn":"up";if(txt.indexOf("−")===0||txt.indexOf("loss")>-1)return lower?"up":"dn";return "";}

  var wave='<svg viewBox="0 0 120 30" width="96" height="24" aria-hidden="true">'+[6,14,22,10,26,16,8,20,12,24,9,18].map(function(h,i){return '<rect x="'+(i*10)+'" y="'+(15-h/2)+'" width="6" height="'+h+'" rx="3" fill="#F28C28"/>';}).join("")+'</svg>';
  return panel('Cauvery Assist '+wave,'<div class="as-head"><div class="note">'+L("Direct answers from this dashboard's numbers. No buy/sell advice.","இந்த dashboard numbers-ல இருந்து நேரடி பதில். Buy/sell advice இல்ல.")+'</div><div class="ctrls"><button class="btn ghost" id="aspause">⏯ '+L("Pause/Resume","Pause/Resume")+'</button><button class="btn ghost" id="asstop">⏹ '+L("Stop","Stop")+'</button></div></div>'+
   '<div class="as-log" id="aslog" style="margin-top:8px">'+log+'</div>'+
   '<div class="as-in"><input id="asq" placeholder="'+L("Ask: Which company has the higher margin?","கேளுங்க: எந்த company-க்கு margin அதிகம்?")+'"><button class="btn" id="asmic">🎙️ '+(AS.listening?L("Done","முடிஞ்சது"):L("Talk","பேசுங்க"))+'</button><button class="btn on" id="asgo">'+L("Ask","கேளுங்க")+'</button></div><div class="vbar"><i id="asbar"></i></div><div class="note" id="asnote" style="margin-top:4px"></div>'+
   '<div class="sugs">'+sug.map(function(s){return '<button data-sug="'+esc(L(s[0],s[1]))+'">'+esc(L(s[0],s[1]))+'</button>';}).join("")+'</div>'+
   '<div class="as-set"><span>'+L("Speed","Speed")+'</span>'+[["0.6",L("Slow","மெதுவா")],["0.8",L("Relaxed","Relaxed")],["1",L("Normal","Normal")],["1.2",L("Fast","வேகமா")]].map(function(p){return '<button class="chip'+(Math.abs(AS.rate-p[0])<0.01?" on cmp":"")+'" data-rate="'+p[0]+'">'+p[1]+'</button>';}).join("")+
   '<label for="asrate" class="mono">'+AS.rate.toFixed(2)+'×</label><input type="range" id="asrate" min="0.5" max="1.5" step="0.05" value="'+AS.rate+'">'+
   '<label for="aswait">'+L("Wait after I stop talking","பேசி முடிச்சதும் wait")+'</label><select id="aswait">'+[[2,"2s"],[3,"3s"],[5,"5s"],[0,L("Only when I tap Done","Done tap பண்ணும்போது மட்டும்")]].map(function(w){return '<option value="'+w[0]+'"'+(AS.wait===w[0]?" selected":"")+'>'+w[1]+'</option>';}).join("")+'</select>'+
   '<label for="asvoice">'+L("Voice","Voice")+'</label><select id="asvoice">'+vopts+'</select></div>'+
   (lang==="ta"&&!tav&&synth?'<p class="note">'+L("","இந்த device-ல Tamil voice இல்ல — English voice-ல படிக்கும்.")+'</p>':"")+
   '<p class="note">'+L("Common clips (greeting, no-advice, not-on-page) play in Elangovan's recorded voice when the clip files sit next to this page; otherwise the device voice reads them.","Common clips (greeting, no-advice, not-on-page) clip files இந்த page பக்கத்துல இருந்தா Elangovan குரல்ல play ஆகும்; இல்லனா device voice படிக்கும்.")+'</p>');}
function bindAS(){var go=function(){var i=document.getElementById("asq");var v=i.value;i.value="";ask(v);};
  document.getElementById("asgo").onclick=go;document.getElementById("asq").onkeydown=function(e){if(e.key==="Enter")go();};
  document.getElementById("asmic").onclick=function(){if(AS.listening){stopMic(true);renderBody();}else{startMic();var b=document.getElementById("asmic");if(b)b.textContent="🎙️ "+L("Done","முடிஞ்சது");}};
  document.querySelectorAll("[data-sug]").forEach(function(b){b.onclick=function(){ask(b.getAttribute("data-sug"));};});
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){goTab(b.getAttribute("data-open"));};});
  document.querySelectorAll("[data-rate]").forEach(function(b){b.onclick=function(){AS.rate=parseFloat(b.getAttribute("data-rate"));safeSet("cba_vg_rate",AS.rate);renderBody();};});
  document.getElementById("asrate").oninput=function(e){AS.rate=parseFloat(e.target.value);safeSet("cba_vg_rate",AS.rate);var l=document.querySelector('label[for="asrate"]');if(l)l.textContent=AS.rate.toFixed(2)+"×";};
  document.getElementById("aswait").onchange=function(e){AS.wait=parseInt(e.target.value,10);safeSet("cba_vg_wait",AS.wait);};
  document.getElementById("asvoice").onchange=function(e){AS.voice=e.target.value;safeSet("cba_vg_voice",AS.voice);};
  document.getElementById("aspause").onclick=function(){if(!synth)return;if(synth.paused)synth.resume();else synth.pause();};
  document.getElementById("asstop").onclick=function(){if(synth)synth.cancel();};
  var lg=document.getElementById("aslog");if(lg)lg.scrollTop=lg.scrollHeight;}

/* ============ render ============ */
var RENDER={dash:tabDash,bm:tabBM,seg:tabSeg,fin:tabFin,cf:tabCF,val:tabVal,kt:tabKT,why:tabWhy,tc:tabTC,pil:tabPil,bet:tabBet,vc:tabVC,swot:tabSWOT,sc:tabSC,as:tabAS,soc:tabSoc,av:tabAV};
function renderTabs(){var el=document.getElementById("tabs");el.innerHTML=TABS.map(function(t){return '<button class="tab'+(cur.tab===t.id?" on":"")+'" data-tab="'+t.id+'">'+(lang==="ta"?t.ta:t.en)+'</button>';}).join("");
  el.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){goTab(b.getAttribute("data-tab"));};});
  var on=el.querySelector(".tab.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"nearest"});}
function renderBody(){var el=document.getElementById("content");var s=subOf(cur.tab);var p=PEND.find(function(x){return x.id===s;});
  if(!NOSUB[cur.tab]&&p){el.innerHTML=pendingCard(p);return;}
  el.innerHTML=RENDER[cur.tab](s);
  el.querySelectorAll("[data-bm]").forEach(function(b){b.onclick=function(){var id=cur.tab==="bm"&&subOf("bm")!=="cmp"?subOf("bm"):(b.closest(".panel").classList.contains("visl")?"visl":"hzl");bmSel[id]=b.getAttribute("data-bm");renderBody();};});
  if(cur.tab==="sc")bindSC();if(cur.tab==="soc")bindSoc();if(cur.tab==="as")bindAS();}
function goTab(id){cur.tab=id;safeSet("cbv_tab",id);renderTabs();renderSubs();renderBody();window.scrollTo({top:0,behavior:"smooth"});}
function renderStatic(){document.getElementById("eyebrow").textContent=L("CB Research · Q2 FY27 · Vedanta Group","CB Research · Q2 FY27 · Vedanta Group");
  document.getElementById("htitle").textContent=L("Vedanta Group — Q2 FY27 results, company by company","Vedanta Group — Q2 FY27 results, ஒவ்வொரு company-யா");
  document.getElementById("slogan").textContent=L("Know before you own · prices as of 27 Oct 2026 close","புரிஞ்சு வாங்குங்க! · விலை 27 Oct 2026 close");
  document.getElementById("readB").textContent="🔊 "+L("Read this tab","இந்த tab-ஐ படிங்க");
  document.getElementById("vbub").textContent="🎙️ "+L("Voice Assist","Voice Assist");
  document.getElementById("cbtip").innerHTML="<b>CB Research</b> — "+L("Education only. Not SEBI-registered; nothing here is a buy, sell or hold recommendation. Figures from company results and exchange filings up to 27 Oct 2026; ≈ marks derived numbers. Commodity prices change daily.","Education மட்டும். SEBI-registered இல்ல; buy, sell, hold recommendation எதுவும் இல்ல. 27 Oct 2026 வரை company results, exchange filings-ல இருந்து numbers; ≈ = கணக்கு போட்டது. Commodity விலை தினமும் மாறும்.");
  document.getElementById("lenB").className=lang==="en"?"on":"";document.getElementById("ltaB").className=lang==="ta"?"on":"";document.documentElement.lang=lang==="ta"?"ta":"en";}
function setLang(l){lang=l;safeSet("cbv_lang",l);renderStatic();renderTabs();renderSubs();renderBody();}
document.getElementById("lenB").onclick=function(){setLang("en");};
document.getElementById("ltaB").onclick=function(){setLang("ta");};
document.getElementById("readB").onclick=function(){var t=document.getElementById("content").innerText||"";speak(t.slice(0,4000));};
document.getElementById("vbub").onclick=function(){goTab("as");setTimeout(function(){var i=document.getElementById("asq");if(i)i.focus();},300);};
var cbEl=document.getElementById("cb");cbEl.querySelector(".badge").onclick=function(){cbEl.classList.toggle("open");};
lang=safeGet("cbv_lang")==="ta"?"ta":"en";
renderStatic();renderTabs();renderSubs();renderBody();
</script>
